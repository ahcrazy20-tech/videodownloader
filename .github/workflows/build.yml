          import Foundation
          import SwiftUI

          class SmartTranslationManager: ObservableObject {
              @Published var currentEngine: TranslationEngine
              @Published var availableEngines: [TranslationEngine] = []
              @Published var lastTranslation: String = ""
              @Published var isTranslating = false

              init() {
                  var engines: [TranslationEngine] = [
                      DeepLXEngine(),
                      LibreTranslateEngine()
                  ]
                  if WhisperManager().isModelReady {
                      engines.insert(WhisperEngine(), at: 0)
                  }
                  availableEngines = engines
                  currentEngine = engines.first ?? DeepLXEngine()
              }

              func switchToEngine(named engineName: String) {
                  if let engine = availableEngines.first(where: { $0.name == engineName }) {
                      currentEngine = engine
                      print("🔄 تم التبديل إلى: \(engine.name)")
                  }
              }

              func switchToNextEngine() {
                  guard let currentIndex = availableEngines.firstIndex(where: { $0.name == currentEngine.name }) else { return }
                  let nextIndex = (currentIndex + 1) % availableEngines.count
                  currentEngine = availableEngines[nextIndex]
                  print("🔄 تم التبديل إلى: \(currentEngine.name)")
              }

              func translate(text: String, completion: @escaping (String?) -> Void) {
                  isTranslating = true
                  lastTranslation = ""
                  let engine = currentEngine

                  engine.translate(text: text) { [weak self] result in
                      guard let self = self else { return }
                      if let translated = result, !translated.isEmpty {
                          DispatchQueue.main.async {
                              self.lastTranslation = translated
                              self.isTranslating = false
                              completion(translated)
                          }
                      } else {
                          // فشل المحرك الحالي → الانتقال التسلسلي للاحتياطي
                          print("⚠️ فشل \(engine.name)، التحول للاحتياطي...")
                          let candidates = self.availableEngines.filter { $0.name != engine.name }
                          self.tryNextEngine(in: candidates, index: 0, text: text, completion: completion)
                      }
                  }
              }

              private func tryNextEngine(in candidates: [TranslationEngine], index: Int, text: String, completion: @escaping (String?) -> Void) {
                  guard index < candidates.count else {
                      DispatchQueue.main.async {
                          self.isTranslating = false
                          completion("⚠️ جميع محركات الترجمة غير متاحة حاليا")
                      }
                      return
                  }
                  let engine = candidates[index]
                  engine.translate(text: text) { [weak self] result in
                      guard let self = self else { return }
                      if let translated = result, !translated.isEmpty {
                          DispatchQueue.main.async {
                              self.currentEngine = engine
                              self.lastTranslation = translated
                              self.isTranslating = false
                              completion(translated)
                          }
                      } else {
                          self.tryNextEngine(in: candidates, index: index + 1, text: text, completion: completion)
                      }
                  }
              }
          }

          // MARK: - بروتوكول محركات الترجمة
          protocol TranslationEngine {
              var name: String { get }
              func translate(text: String, completion: @escaping (String?) -> Void)
          }

          // MARK: - DeepLX Engine
          class DeepLXEngine: TranslationEngine {
              var name: String { "DeepLX" }
              private let translator = DeepLTranslator()

              func translate(text: String, completion: @escaping (String?) -> Void) {
                  translator.translate(text: text, completion: completion)
              }
          }

          // MARK: - LibreTranslate Engine
          class LibreTranslateEngine: TranslationEngine {
              var name: String { "LibreTranslate" }
              private let translator = LibreTranslator()

              func translate(text: String, completion: @escaping (String?) -> Void) {
                  translator.translate(text: text, completion: completion)
              }
          }

          // MARK: - Whisper Engine (ASR فقط — الترجمة النصية عبر DeepLX)
          class WhisperEngine: TranslationEngine {
              var name: String { "Whisper (محلي)" }
              private let whisperManager = WhisperManager()

              func translate(text: String, completion: @escaping (String?) -> Void) {
                  DeepLTranslator().translate(text: text, completion: completion)
              }
          }
          EOF

          # ========== Utils/SubtitleSyncManager.swift ==========
          cat > VideoDownloader/Utils/SubtitleSyncManager.swift << 'EOF'
          import Foundation
          import SwiftUI

          class SubtitleSyncManager: ObservableObject {
              @Published var subtitleOffset: Double = 0.0
              @Published var isSyncEnabled = true

              func adjustOffset(by seconds: Double) {
                  subtitleOffset += seconds
                  subtitleOffset = max(-10.0, min(10.0, subtitleOffset))
                  print("⏱️ توقيت الترجمة: \(subtitleOffset > 0 ? "+" : "")\(subtitleOffset) ثانية")
              }

              func resetOffset() {
                  subtitleOffset = 0.0
              }

              func getAdjustedTime(for originalTime: Double) -> Double {
                  guard isSyncEnabled else { return originalTime }
                  return originalTime + subtitleOffset
              }

              func showSyncControls() -> some View {
                  SubtitleSyncControls(syncManager: self)
              }
          }

          // إصلاح: $property داخل الكلاس ترجع Published.Publisher وليس Binding
          // الحل: عرض SwiftUI منفصل بـ ObservedObject يعطينا Binding صحيحة
          struct SubtitleSyncControls: View {
              @ObservedObject var syncManager: SubtitleSyncManager

              var body: some View {
                  VStack(spacing: 12) {
                      HStack {
                          Text("تزامن الترجمة")
                              .font(.headline)
                          Spacer()
                          Toggle("", isOn: $syncManager.isSyncEnabled)
                              .labelsHidden()
                      }

                      HStack(spacing: 20) {
                          Button {
                              syncManager.adjustOffset(by: -0.5)
                          } label: {
                              Image(systemName: "backward.frame.fill")
                                  .font(.title2)
                          }

                          Text(String(format: "%.1f ث", syncManager.subtitleOffset))
                              .font(.title3)
                              .fontWeight(.semibold)
                              .frame(minWidth: 70)
                              .foregroundColor(syncManager.subtitleOffset == 0 ? .primary : .blue)

                          Button {
                              syncManager.adjustOffset(by: 0.5)
                          } label: {
                              Image(systemName: "forward.frame.fill")
                                  .font(.title2)
                          }

                          Button {
                              syncManager.resetOffset()
                          } label: {
                              Image(systemName: "arrow.counterclockwise")
                                  .font(.title2)
                          }
                      }

                      Slider(
                          value: $syncManager.subtitleOffset,
                          in: -10...10,
                          step: 0.1,
                          minimumValueLabel: Text("-10s"),
                          maximumValueLabel: Text("+10s")
                      ) {
                          Text("توقيت الترجمة")
                      }
                      .tint(.blue)
                  }
                  .padding()
                  .background(Color(.systemGray6))
                  .cornerRadius(12)
              }
          }
          EOF

          # ========== Views/TranslationSettingsView.swift ==========
          cat > VideoDownloader/Views/TranslationSettingsView.swift << 'EOF'
          import SwiftUI

          struct TranslationSettingsView: View {
              @ObservedObject var translationManager: SmartTranslationManager
              @Environment(\.dismiss) var dismiss
              @StateObject private var whisperManager = WhisperManager()
              @State private var customEndpoint: String = ""

              var body: some View {
                  NavigationView {
                      List {
                          Section("محركات الترجمة") {
                              ForEach(translationManager.availableEngines, id: \.name) { engine in
                                  HStack {
                                      Text(engine.name)
                                      Spacer()
                                      if engine.name == translationManager.currentEngine.name {
                                          Image(systemName: "checkmark.circle.fill")
                                              .foregroundColor(.green)
                                      }
                                  }
                                  .contentShape(Rectangle())
                                  .onTapGesture {
                                      translationManager.switchToEngine(named: engine.name)
                                  }
                              }
                          }

                          Section("نموذج Whisper") {
                              HStack {
                                  Text("الحالة")
                                  Spacer()
                                  Text(whisperManager.isModelReady ? "✅ جاهز" : "❌ غير موجود")
                                      .foregroundColor(whisperManager.isModelReady ? .green : .red)
                              }

                              if !whisperManager.isModelReady {
                                  Button {
                                      whisperManager.downloadModelIfNeeded()
                                  } label: {
                                      if whisperManager.isDownloading {
                                          HStack {
                                              ProgressView()
                                                  .progressViewStyle(CircularProgressViewStyle())
                                                  .scaleEffect(0.8)
                                              Text("\(Int(whisperManager.downloadProgress * 100))%")
                                          }
                                      } else {
                                          Text("تحميل نموذج Whisper")
                                      }
                                  }
                                  .disabled(whisperManager.isDownloading)
                              }
                          }

                          Section("سيرفر الاستخراج (يوتيوب، تيك توك، انستجرام...)") {
                              TextField("أضف سيرفر cobalt خاص: https://...", text: $customEndpoint)
                                  .textInputAutocapitalization(.never)
                                  .autocorrectionDisabled()
                                  .font(.caption)

                              Button("إضافة السيرفر") {
                                  VideoResolver.addCustomEndpoint(customEndpoint)
                                  customEndpoint = ""
                              }
                              .disabled(customEndpoint.trimmingCharacters(in: .whitespaces).isEmpty)

                              ForEach(VideoResolver.resolverEndpoints, id: \.self) { endpoint in
                                  Text(endpoint)
                                      .font(.caption2)
                                      .foregroundColor(.secondary)
                                      .lineLimit(1)
                              }

                              Text("💡 لضمان يوتيوب بشكل موثوق: استضف cobalt بنفسك (سطر واحد Docker) ثم أضف رابطه هنا. السيرفرات المجتمعية العامة قد تتوقف في أي وقت.")
                                  .font(.caption2)
                                  .foregroundColor(.orange)
                          }
                      }
                      .navigationTitle("إعدادات الترجمة")
                      .navigationBarTitleDisplayMode(.inline)
                      .toolbar {
                          Button("تم") { dismiss() }
                      }
                  }
              }
          }
          EOF

      # 3. إنشاء Info.plist
      - name: 📝 Write Info.plist
        run: |
          cat > VideoDownloader/Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>NSAppTransportSecurity</key>
              <dict><key>NSAllowsArbitraryLoads</key><true/></dict>
              <key>UIFileSharingEnabled</key><true/>
              <key>LSSupportsOpeningDocumentsInPlace</key><true/>
              <key>UIBackgroundModes</key>
              <array><string>audio</string><string>fetch</string></array>
          </dict>
          </plist>
          EOF

      # 4. إنشاء ExportOptions.plist (يُستخدم لاحقاً عند إضافة خطوة archive موقّعة)
      - name: 📝 Write ExportOptions.plist
        run: |
          cat > ExportOptions.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>development</string>
              <key>teamID</key>
              <string>XXXXXXXXXX</string>
              <key>signingStyle</key>
              <string>manual</string>
          </dict>
          </plist>
          EOF

      # 5. إنشاء project.yml
      - name: 📝 Write project.yml
        run: |
          cat > project.yml << 'EOF'
          name: VideoDownloader
          options:
            bundleIdPrefix: com.example
            deploymentTarget:
              iOS: "16.4"
          targets:
            VideoDownloader:
              type: application
              platform: iOS
              sources: [VideoDownloader]
              info:
                path: VideoDownloader/Info.plist
                properties:
                  CFBundleDisplayName: VideoDownloader
                  CFBundleIdentifier: com.example.VideoDownloader
                  UILaunchScreen: {}
                  NSAppTransportSecurity:
                    NSAllowsArbitraryLoads: true
                  UIFileSharingEnabled: true
                  LSSupportsOpeningDocumentsInPlace: true
                  UIBackgroundModes: [audio, fetch]
          EOF

      # 6. تثبيت XcodeGen
      - name: 🛠 Install XcodeGen
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen

      # 7. إنشاء مشروع Xcode
      - name: 🏗 Generate Xcode project
        run: xcodegen generate

      # 8. بناء التطبيق بدون توقيع (مع تحديد منصة iOS صراحةً)
      - name: 🏗 Build .app (unsigned)
        run: |
          xcodebuild -project VideoDownloader.xcodeproj \
            -scheme VideoDownloader \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ./DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      # 9. حزم التطبيق في IPA
      - name: 📦 Package IPA
        run: |
          APP_PATH=$(find ./DerivedData -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then echo "❌ .app not found"; exit 1; fi
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r VideoDownloader.ipa Payload/

      # 10. رفع الـ IPA
      - name: ⬆️ Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: VideoDownloader-MultiEngine
          path: VideoDownloader.ipa
