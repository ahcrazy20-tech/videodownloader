name: Build Video Downloader Pro

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # ============================================
    # إنشاء كل ملفات المشروع تلقائياً
    # ============================================

    - name: Create requirements.txt
      shell: pwsh
      run: |
        @"
        yt-dlp>=2024.1.0
        customtkinter>=5.2.0
        CTkMessagebox>=2.5
        pillow>=10.0.0
        python-vlc>=3.0.18122
        "@ | Out-File -FilePath requirements.txt -Encoding utf8

    # ==========================================
    # ملف downloader.py - محرك التحميل
    # ==========================================
    - name: Create downloader.py
      shell: pwsh
      run: |
        @"
        import yt_dlp
        import threading
        import os
        import json
        from datetime import datetime


        class VideoDownloader:

            def __init__(self):
                self.is_downloading = False
                self.is_cancelled = False
                self.current_process = None
                self.download_history_file = "download_history.json"

            def get_video_info(self, url):
                try:
                    ydl_opts = {
                        'quiet': True,
                        'no_warnings': True,
                        'extract_flat': False,
                    }
                    with yt_dlp.YoutubeDL(ydl_opts) as ydl:
                        info = ydl.extract_info(url, download=False)

                    formats = []
                    seen = set()

                    if info.get('formats'):
                        for f in info['formats']:
                            if f.get('vcodec') != 'none' and f.get('acodec') != 'none':
                                height = f.get('height', 0)
                                ext = f.get('ext', 'mp4')
                                filesize = f.get('filesize') or f.get('filesize_approx') or 0
                                format_id = f.get('format_id', '')
                                key = f"{height}p_{ext}"
                                if key not in seen and height > 0:
                                    seen.add(key)
                                    formats.append({
                                        'format_id': format_id,
                                        'resolution': f"{height}p",
                                        'height': height,
                                        'ext': ext,
                                        'filesize': filesize,
                                        'filesize_str': self._format_size(filesize),
                                        'fps': f.get('fps', 30),
                                    })

                        for f in info['formats']:
                            if f.get('vcodec') != 'none' and f.get('acodec') == 'none':
                                height = f.get('height', 0)
                                filesize = f.get('filesize') or f.get('filesize_approx') or 0
                                format_id = f.get('format_id', '')
                                key = f"{height}p_merge"
                                if key not in seen and height > 0:
                                    seen.add(key)
                                    formats.append({
                                        'format_id': f"{format_id}+bestaudio",
                                        'resolution': f"{height}p (HD)",
                                        'height': height,
                                        'ext': 'mp4',
                                        'filesize': filesize,
                                        'filesize_str': self._format_size(filesize),
                                        'fps': f.get('fps', 30),
                                    })

                    formats.sort(key=lambda x: x['height'], reverse=True)

                    formats.insert(0, {
                        'format_id': 'best',
                        'resolution': 'Best Quality Auto',
                        'height': 99999,
                        'ext': 'mp4',
                        'filesize': 0,
                        'filesize_str': '',
                    })

                    formats.append({
                        'format_id': 'bestaudio/best',
                        'resolution': 'Audio Only (MP3)',
                        'height': 0,
                        'ext': 'mp3',
                        'filesize': 0,
                        'filesize_str': '',
                        'audio_only': True,
                    })

                    video_info = {
                        'title': info.get('title', 'Unknown'),
                        'duration': info.get('duration', 0),
                        'duration_str': self._format_duration(info.get('duration', 0)),
                        'thumbnail': info.get('thumbnail', ''),
                        'uploader': info.get('uploader', 'Unknown'),
                        'view_count': info.get('view_count', 0),
                        'webpage_url': info.get('webpage_url', url),
                        'extractor': info.get('extractor', 'Unknown'),
                        'description': info.get('description', '')[:200],
                        'formats': formats,
                    }
                    return {'success': True, 'data': video_info}
                except Exception as e:
                    return {'success': False, 'error': str(e)}

            def download(self, url, format_id, save_path, progress_callback=None,
                         complete_callback=None, error_callback=None):
                def _download_thread():
                    self.is_downloading = True
                    self.is_cancelled = False
                    try:
                        is_audio = format_id == 'bestaudio/best'
                        ydl_opts = {
                            'outtmpl': os.path.join(save_path, '%(title)s.%(ext)s'),
                            'quiet': True,
                            'no_warnings': True,
                            'progress_hooks': [lambda d: self._progress_hook(d, progress_callback)],
                        }
                        if is_audio:
                            ydl_opts['format'] = 'bestaudio/best'
                            ydl_opts['postprocessors'] = [{
                                'key': 'FFmpegExtractAudio',
                                'preferredcodec': 'mp3',
                                'preferredquality': '320',
                            }]
                        elif format_id == 'best':
                            ydl_opts['format'] = 'bestvideo+bestaudio/best'
                            ydl_opts['merge_output_format'] = 'mp4'
                        else:
                            ydl_opts['format'] = format_id
                            if '+' in format_id:
                                ydl_opts['merge_output_format'] = 'mp4'

                        with yt_dlp.YoutubeDL(ydl_opts) as ydl:
                            self.current_process = ydl
                            info = ydl.extract_info(url, download=True)
                            if self.is_cancelled:
                                if error_callback:
                                    error_callback("Download cancelled")
                                return
                            filename = ydl.prepare_filename(info)
                            if is_audio:
                                filename = os.path.splitext(filename)[0] + '.mp3'
                            self._save_to_history({
                                'title': info.get('title', 'Unknown'),
                                'url': url,
                                'filename': filename,
                                'filesize': os.path.getsize(filename) if os.path.exists(filename) else 0,
                                'duration': info.get('duration', 0),
                                'thumbnail': info.get('thumbnail', ''),
                                'download_date': datetime.now().strftime('%Y-%m-%d %H:%M:%S'),
                                'extractor': info.get('extractor', ''),
                            })
                            if complete_callback:
                                complete_callback(filename)
                    except Exception as e:
                        if error_callback and not self.is_cancelled:
                            error_callback(str(e))
                    finally:
                        self.is_downloading = False
                        self.current_process = None

                thread = threading.Thread(target=_download_thread, daemon=True)
                thread.start()

            def cancel_download(self):
                self.is_cancelled = True

            def _progress_hook(self, d, callback):
                if self.is_cancelled:
                    raise Exception("Download cancelled")
                if callback and d['status'] == 'downloading':
                    total = d.get('total_bytes') or d.get('total_bytes_estimate') or 0
                    downloaded = d.get('downloaded_bytes', 0)
                    speed = d.get('speed', 0)
                    eta = d.get('eta', 0)
                    progress = (downloaded / total * 100) if total > 0 else 0
                    callback({
                        'progress': progress,
                        'downloaded': self._format_size(downloaded),
                        'total': self._format_size(total),
                        'speed': self._format_size(speed) + '/s' if speed else 'Calculating...',
                        'eta': self._format_duration(eta) if eta else 'Calculating...',
                    })

            def _save_to_history(self, entry):
                history = self._load_history()
                history.insert(0, entry)
                history = history[:500]
                with open(self.download_history_file, 'w', encoding='utf-8') as f:
                    json.dump(history, f, ensure_ascii=False, indent=2)

            def _load_history(self):
                try:
                    if os.path.exists(self.download_history_file):
                        with open(self.download_history_file, 'r', encoding='utf-8') as f:
                            return json.load(f)
                except:
                    pass
                return []

            def get_history(self):
                return self._load_history()

            def clear_history(self):
                with open(self.download_history_file, 'w', encoding='utf-8') as f:
                    json.dump([], f)

            def delete_history_item(self, index):
                history = self._load_history()
                if 0 <= index < len(history):
                    history.pop(index)
                    with open(self.download_history_file, 'w', encoding='utf-8') as f:
                        json.dump(history, f, ensure_ascii=False, indent=2)

            @staticmethod
            def _format_size(size_bytes):
                if not size_bytes:
                    return "Unknown"
                for unit in ['B', 'KB', 'MB', 'GB']:
                    if size_bytes < 1024:
                        return f"{size_bytes:.1f} {unit}"
                    size_bytes /= 1024
                return f"{size_bytes:.1f} TB"

            @staticmethod
            def _format_duration(seconds):
                if not seconds:
                    return "00:00"
                hours = int(seconds // 3600)
                minutes = int((seconds % 3600) // 60)
                secs = int(seconds % 60)
                if hours > 0:
                    return f"{hours:02d}:{minutes:02d}:{secs:02d}"
                return f"{minutes:02d}:{secs:02d}"
        "@ | Out-File -FilePath downloader.py -Encoding utf8

    # ==========================================
    # ملف player.py - مشغل الفيديو
    # ==========================================
    - name: Create player.py
      shell: pwsh
      run: |
        @"
        import customtkinter as ctk
        import vlc
        import time
        import threading
        import os


        class VideoPlayer(ctk.CTkToplevel):

            def __init__(self, parent, video_path=None):
                super().__init__(parent)
                self.title("Video Player")
                self.geometry("900x650")
                self.minsize(700, 500)

                self.instance = vlc.Instance('--no-xlib')
                self.media_player = self.instance.media_player_new()
                self.is_playing = False
                self.is_paused = False
                self.current_volume = 70
                self.is_fullscreen = False
                self.update_thread_running = True
                self.playlist = []
                self.current_index = -1

                self._build_ui()
                self._bind_keys()

                if video_path:
                    self.load_video(video_path)

                self.update_thread = threading.Thread(target=self._update_slider_thread, daemon=True)
                self.update_thread.start()
                self.protocol("WM_DELETE_WINDOW", self._on_close)

            def _build_ui(self):
                self.video_frame = ctk.CTkFrame(self, fg_color="black")
                self.video_frame.pack(fill="both", expand=True, padx=5, pady=(5, 0))

                self.video_canvas = ctk.CTkCanvas(self.video_frame, bg="black", highlightthickness=0)
                self.video_canvas.pack(fill="both", expand=True)
                self.video_canvas.bind("<Double-Button-1>", self._toggle_fullscreen)

                self.info_frame = ctk.CTkFrame(self, height=30)
                self.info_frame.pack(fill="x", padx=5, pady=(2, 0))

                self.title_label = ctk.CTkLabel(self.info_frame, text="No video loaded", font=("Arial", 12), anchor="w")
                self.title_label.pack(side="left", padx=10)

                self.format_label = ctk.CTkLabel(self.info_frame, text="", font=("Arial", 11), text_color="gray")
                self.format_label.pack(side="right", padx=10)

                self.progress_frame = ctk.CTkFrame(self, height=40)
                self.progress_frame.pack(fill="x", padx=5, pady=(2, 0))

                self.time_current = ctk.CTkLabel(self.progress_frame, text="00:00", font=("Arial", 11), width=60)
                self.time_current.pack(side="left", padx=5)

                self.progress_slider = ctk.CTkSlider(self.progress_frame, from_=0, to=1000, command=self._seek, height=15, button_color="#1DB954", progress_color="#1DB954")
                self.progress_slider.pack(side="left", fill="x", expand=True, padx=5)
                self.progress_slider.set(0)

                self.time_total = ctk.CTkLabel(self.progress_frame, text="00:00", font=("Arial", 11), width=60)
                self.time_total.pack(side="right", padx=5)

                self.controls_frame = ctk.CTkFrame(self, height=50)
                self.controls_frame.pack(fill="x", padx=5, pady=5)

                left_controls = ctk.CTkFrame(self.controls_frame, fg_color="transparent")
                left_controls.pack(side="left", padx=10)

                self.btn_prev = ctk.CTkButton(left_controls, text="<<", width=40, command=self._previous, font=("Arial", 14))
                self.btn_prev.pack(side="left", padx=2)

                self.btn_backward = ctk.CTkButton(left_controls, text="-10s", width=45, command=lambda: self._skip(-10), font=("Arial", 12))
                self.btn_backward.pack(side="left", padx=2)

                self.btn_play = ctk.CTkButton(left_controls, text="Play", width=60, command=self._toggle_play, font=("Arial", 14, "bold"), fg_color="#1DB954", hover_color="#1ed760")
                self.btn_play.pack(side="left", padx=5)

                self.btn_stop = ctk.CTkButton(left_controls, text="Stop", width=45, command=self._stop, font=("Arial", 12))
                self.btn_stop.pack(side="left", padx=2)

                self.btn_forward = ctk.CTkButton(left_controls, text="+10s", width=45, command=lambda: self._skip(10), font=("Arial", 12))
                self.btn_forward.pack(side="left", padx=2)

                self.btn_next = ctk.CTkButton(left_controls, text=">>", width=40, command=self._next, font=("Arial", 14))
                self.btn_next.pack(side="left", padx=2)

                mid_controls = ctk.CTkFrame(self.controls_frame, fg_color="transparent")
                mid_controls.pack(side="left", padx=20)

                ctk.CTkLabel(mid_controls, text="Speed:", font=("Arial", 11)).pack(side="left", padx=2)
                self.speed_var = ctk.StringVar(value="1.0x")
                self.speed_menu = ctk.CTkOptionMenu(mid_controls, values=["0.25x", "0.5x", "0.75x", "1.0x", "1.25x", "1.5x", "2.0x"], variable=self.speed_var, command=self._change_speed, width=80)
                self.speed_menu.pack(side="left", padx=2)

                right_controls = ctk.CTkFrame(self.controls_frame, fg_color="transparent")
                right_controls.pack(side="right", padx=10)

                self.btn_fullscreen = ctk.CTkButton(right_controls, text="[ ]", width=35, command=self._toggle_fullscreen, font=("Arial", 14))
                self.btn_fullscreen.pack(side="right", padx=5)

                self.volume_slider = ctk.CTkSlider(right_controls, from_=0, to=100, command=self._change_volume, width=120, height=15, button_color="#1DB954", progress_color="#1DB954")
                self.volume_slider.set(70)
                self.volume_slider.pack(side="right", padx=5)

                self.btn_mute = ctk.CTkButton(right_controls, text="Vol", width=35, command=self._toggle_mute, font=("Arial", 12))
                self.btn_mute.pack(side="right", padx=2)

                self.volume_label = ctk.CTkLabel(right_controls, text="70%", font=("Arial", 11), width=40)
                self.volume_label.pack(side="right", padx=2)

            def _bind_keys(self):
                self.bind("<space>", lambda e: self._toggle_play())
                self.bind("<Left>", lambda e: self._skip(-5))
                self.bind("<Right>", lambda e: self._skip(5))
                self.bind("<Up>", lambda e: self._adjust_volume(5))
                self.bind("<Down>", lambda e: self._adjust_volume(-5))
                self.bind("<f>", lambda e: self._toggle_fullscreen())
                self.bind("<F11>", lambda e: self._toggle_fullscreen())
                self.bind("<Escape>", lambda e: self._exit_fullscreen())
                self.bind("<m>", lambda e: self._toggle_mute())

            def load_video(self, path):
                if not os.path.exists(path):
                    return
                media = self.instance.media_new(path)
                self.media_player.set_media(media)
                self.after(100, self._set_window_id)
                self.title_label.configure(text=os.path.basename(path))
                ext = os.path.splitext(path)[1].upper()
                size = os.path.getsize(path)
                self.format_label.configure(text=f"{ext} | {self._format_size(size)}")
                self.after(200, self._play)

            def load_playlist(self, file_list):
                self.playlist = [f for f in file_list if os.path.exists(f)]
                if self.playlist:
                    self.current_index = 0
                    self.load_video(self.playlist[0])

            def _set_window_id(self):
                win_id = self.video_canvas.winfo_id()
                if os.name == 'nt':
                    self.media_player.set_hwnd(win_id)
                else:
                    self.media_player.set_xwindow(win_id)

            def _play(self):
                self.media_player.play()
                self.is_playing = True
                self.is_paused = False
                self.btn_play.configure(text="Pause")
                self.media_player.audio_set_volume(self.current_volume)

            def _toggle_play(self):
                if not self.is_playing:
                    self._play()
                elif self.is_paused:
                    self.media_player.pause()
                    self.is_paused = False
                    self.btn_play.configure(text="Pause")
                else:
                    self.media_player.pause()
                    self.is_paused = True
                    self.btn_play.configure(text="Play")

            def _stop(self):
                self.media_player.stop()
                self.is_playing = False
                self.is_paused = False
                self.btn_play.configure(text="Play")
                self.progress_slider.set(0)
                self.time_current.configure(text="00:00")

            def _seek(self, value):
                if self.is_playing:
                    self.media_player.set_position(float(value) / 1000)

            def _skip(self, seconds):
                if self.is_playing:
                    current = self.media_player.get_time()
                    new_time = max(0, current + (seconds * 1000))
                    self.media_player.set_time(int(new_time))

            def _previous(self):
                if self.playlist and self.current_index > 0:
                    self.current_index -= 1
                    self._stop()
                    self.load_video(self.playlist[self.current_index])

            def _next(self):
                if self.playlist and self.current_index < len(self.playlist) - 1:
                    self.current_index += 1
                    self._stop()
                    self.load_video(self.playlist[self.current_index])

            def _change_volume(self, value):
                self.current_volume = int(value)
                self.media_player.audio_set_volume(self.current_volume)
                self.volume_label.configure(text=f"{self.current_volume}%")

            def _adjust_volume(self, delta):
                new_vol = max(0, min(100, self.current_volume + delta))
                self.volume_slider.set(new_vol)
                self._change_volume(new_vol)

            def _toggle_mute(self):
                if self.current_volume > 0:
                    self._saved_volume = self.current_volume
                    self.volume_slider.set(0)
                    self._change_volume(0)
                else:
                    vol = getattr(self, '_saved_volume', 70)
                    self.volume_slider.set(vol)
                    self._change_volume(vol)

            def _change_speed(self, speed_str):
                speed = float(speed_str.replace('x', ''))
                self.media_player.set_rate(speed)

            def _toggle_fullscreen(self, event=None):
                self.is_fullscreen = not self.is_fullscreen
                self.attributes("-fullscreen", self.is_fullscreen)

            def _exit_fullscreen(self):
                self.is_fullscreen = False
                self.attributes("-fullscreen", False)

            def _update_slider_thread(self):
                while self.update_thread_running:
                    try:
                        if self.is_playing and not self.is_paused:
                            pos = self.media_player.get_position()
                            length = self.media_player.get_length()
                            current = self.media_player.get_time()
                            if pos >= 0:
                                self.progress_slider.set(pos * 1000)
                                self.time_current.configure(text=self._format_time(current))
                                self.time_total.configure(text=self._format_time(length))
                            state = self.media_player.get_state()
                            if state == vlc.State.Ended:
                                self.after(0, self._next)
                    except Exception:
                        pass
                    time.sleep(0.5)

            def _on_close(self):
                self.update_thread_running = False
                self.media_player.stop()
                self.media_player.release()
                self.instance.release()
                self.destroy()

            @staticmethod
            def _format_time(ms):
                if not ms or ms < 0:
                    return "00:00"
                seconds = ms // 1000
                hours = seconds // 3600
                minutes = (seconds % 3600) // 60
                secs = seconds % 60
                if hours > 0:
                    return f"{hours:02d}:{minutes:02d}:{secs:02d}"
                return f"{minutes:02d}:{secs:02d}"

            @staticmethod
            def _format_size(size_bytes):
                for unit in ['B', 'KB', 'MB', 'GB']:
                    if size_bytes < 1024:
                        return f"{size_bytes:.1f} {unit}"
                    size_bytes /= 1024
                return f"{size_bytes:.1f} TB"
        "@ | Out-File -FilePath player.py -Encoding utf8

    # ==========================================
    # ملف history.py - سجل التحميلات
    # ==========================================
    - name: Create history.py
      shell: pwsh
      run: |
        @"
        import customtkinter as ctk
        from CTkMessagebox import CTkMessagebox
        import os
        import json


        class HistoryWindow(ctk.CTkToplevel):

            def __init__(self, parent, history_data, play_callback=None, delete_callback=None, clear_callback=None):
                super().__init__(parent)
                self.title("Download History")
                self.geometry("800x500")
                self.minsize(600, 400)
                self.history_data = history_data
                self.play_callback = play_callback
                self.delete_callback = delete_callback
                self.clear_callback = clear_callback
                self._build_ui()

            def _build_ui(self):
                header = ctk.CTkFrame(self, height=50)
                header.pack(fill="x", padx=10, pady=5)

                ctk.CTkLabel(header, text=f"Download History ({len(self.history_data)} items)", font=("Arial", 18, "bold")).pack(side="left", padx=10)

                ctk.CTkButton(header, text="Clear All", command=self._clear_all, fg_color="red", hover_color="darkred", width=100).pack(side="right", padx=10)

                search_frame = ctk.CTkFrame(self, height=40)
                search_frame.pack(fill="x", padx=10, pady=2)

                self.search_var = ctk.StringVar()
                self.search_var.trace_add("write", self._filter_history)

                ctk.CTkEntry(search_frame, placeholder_text="Search history...", textvariable=self.search_var, font=("Arial", 13), height=35).pack(fill="x", padx=10, pady=5)

                self.list_frame = ctk.CTkScrollableFrame(self)
                self.list_frame.pack(fill="both", expand=True, padx=10, pady=5)
                self._populate_list(self.history_data)

            def _populate_list(self, data):
                for widget in self.list_frame.winfo_children():
                    widget.destroy()
                if not data:
                    ctk.CTkLabel(self.list_frame, text="No downloads in history", font=("Arial", 16), text_color="gray").pack(pady=50)
                    return
                for i, item in enumerate(data):
                    self._create_history_item(i, item)

            def _create_history_item(self, index, item):
                item_frame = ctk.CTkFrame(self.list_frame, height=70)
                item_frame.pack(fill="x", pady=2, padx=5)

                info_frame = ctk.CTkFrame(item_frame, fg_color="transparent")
                info_frame.pack(side="left", fill="both", expand=True, padx=10, pady=5)

                title = item.get('title', 'Unknown')
                ctk.CTkLabel(info_frame, text=title[:60], font=("Arial", 13, "bold"), anchor="w").pack(fill="x")

                details = f"{item.get('download_date', 'Unknown')}  |  {self._format_size(item.get('filesize', 0))}  |  {item.get('extractor', 'Unknown')}"
                ctk.CTkLabel(info_frame, text=details, font=("Arial", 11), text_color="gray", anchor="w").pack(fill="x")

                actions_frame = ctk.CTkFrame(item_frame, fg_color="transparent")
                actions_frame.pack(side="right", padx=10, pady=5)

                filename = item.get('filename', '')
                if os.path.exists(filename):
                    ctk.CTkButton(actions_frame, text="Play", width=45, command=lambda f=filename: self._play_file(f), fg_color="#1DB954", hover_color="#1ed760").pack(side="left", padx=2)
                    ctk.CTkButton(actions_frame, text="Folder", width=50, command=lambda f=filename: self._open_folder(f)).pack(side="left", padx=2)

                ctk.CTkButton(actions_frame, text="Delete", width=50, command=lambda idx=index: self._delete_item(idx), fg_color="red", hover_color="darkred").pack(side="left", padx=2)

            def _play_file(self, filename):
                if self.play_callback:
                    self.play_callback(filename)

            def _open_folder(self, filename):
                folder = os.path.dirname(filename)
                if os.path.exists(folder):
                    if os.name == 'nt':
                        os.startfile(folder)
                    else:
                        os.system(f'xdg-open "{folder}"')

            def _delete_item(self, index):
                if self.delete_callback:
                    self.delete_callback(index)
                self.history_data.pop(index)
                self._populate_list(self.history_data)

            def _clear_all(self):
                msg = CTkMessagebox(title="Confirm", message="Are you sure you want to clear all history?", option_1="Yes", option_2="No", icon="warning")
                if msg.get() == "Yes":
                    if self.clear_callback:
                        self.clear_callback()
                    self.history_data.clear()
                    self._populate_list(self.history_data)

            def _filter_history(self, *args):
                query = self.search_var.get().lower()
                if query:
                    filtered = [item for item in self.history_data if query in item.get('title', '').lower() or query in item.get('url', '').lower()]
                    self._populate_list(filtered)
                else:
                    self._populate_list(self.history_data)

            @staticmethod
            def _format_size(size_bytes):
                if not size_bytes:
                    return "Unknown"
                for unit in ['B', 'KB', 'MB', 'GB']:
                    if size_bytes < 1024:
                        return f"{size_bytes:.1f} {unit}"
                    size_bytes /= 1024
                return f"{size_bytes:.1f} TB"
        "@ | Out-File -FilePath history.py -Encoding utf8

    # ==========================================
    # ملف app.py - الواجهة الرئيسية
    # ==========================================
    - name: Create app.py
      shell: pwsh
      run: |
        @"
        import customtkinter as ctk
        from CTkMessagebox import CTkMessagebox
        from tkinter import filedialog
        import threading
        import os
        import sys
        import urllib.request
        from PIL import Image
        import io

        from downloader import VideoDownloader
        from player import VideoPlayer
        from history import HistoryWindow


        class MainApp(ctk.CTk):

            def __init__(self):
                super().__init__()
                self.title("Video Downloader Pro")
                self.geometry("850x700")
                self.minsize(750, 600)
                ctk.set_appearance_mode("dark")
                ctk.set_default_color_theme("green")

                self.downloader = VideoDownloader()
                self.video_info = None
                self.selected_format = None
                self.save_path = os.path.join(os.path.expanduser("~"), "Downloads")
                self.player_window = None
                self.formats_map = {}
                self._build_ui()

            def _build_ui(self):
                header_frame = ctk.CTkFrame(self, height=70, corner_radius=10)
                header_frame.pack(fill="x", padx=15, pady=(10, 5))
                header_frame.pack_propagate(False)

                ctk.CTkLabel(header_frame, text="Video Downloader Pro", font=("Arial", 24, "bold"), text_color="#1DB954").pack(side="left", padx=20)

                header_buttons = ctk.CTkFrame(header_frame, fg_color="transparent")
                header_buttons.pack(side="right", padx=10)

                ctk.CTkButton(header_buttons, text="History", command=self._open_history, width=80, font=("Arial", 13)).pack(side="left", padx=5)

                self.theme_btn = ctk.CTkButton(header_buttons, text="Theme", command=self._toggle_theme, width=50, font=("Arial", 12))
                self.theme_btn.pack(side="left", padx=5)

                url_frame = ctk.CTkFrame(self, corner_radius=10)
                url_frame.pack(fill="x", padx=15, pady=5)

                ctk.CTkLabel(url_frame, text="Enter video URL from any website:", font=("Arial", 14, "bold")).pack(anchor="w", padx=15, pady=(10, 5))

                input_row = ctk.CTkFrame(url_frame, fg_color="transparent")
                input_row.pack(fill="x", padx=15, pady=(0, 10))

                self.url_entry = ctk.CTkEntry(input_row, placeholder_text="Paste URL here... (YouTube, Facebook, TikTok, Instagram, Twitter...)", font=("Arial", 13), height=40)
                self.url_entry.pack(side="left", fill="x", expand=True, padx=(0, 10))

                self.btn_paste = ctk.CTkButton(input_row, text="Paste", command=self._paste_url, width=60, font=("Arial", 12))
                self.btn_paste.pack(side="left", padx=(0, 5))

                self.btn_analyze = ctk.CTkButton(input_row, text="Analyze URL", command=self._analyze_url, width=120, font=("Arial", 13, "bold"), fg_color="#1DB954", hover_color="#1ed760", height=40)
                self.btn_analyze.pack(side="right")

                self.status_label = ctk.CTkLabel(self, text="", font=("Arial", 12), text_color="gray")
                self.status_label.pack(anchor="w", padx=20)

                self.info_frame = ctk.CTkFrame(self, corner_radius=10)
                self.info_frame.pack(fill="x", padx=15, pady=5)

                self.info_content = ctk.CTkFrame(self.info_frame, fg_color="transparent")
                self.info_content.pack(fill="x", padx=15, pady=10)

                self.thumbnail_label = ctk.CTkLabel(self.info_content, text="No\nThumbnail", width=160, height=90, corner_radius=8, fg_color="gray25")
                self.thumbnail_label.pack(side="left", padx=(0, 15))

                details_frame = ctk.CTkFrame(self.info_content, fg_color="transparent")
                details_frame.pack(side="left", fill="both", expand=True)

                self.video_title_label = ctk.CTkLabel(details_frame, text="Video Title: ---", font=("Arial", 14, "bold"), anchor="w", wraplength=400)
                self.video_title_label.pack(fill="x", pady=2)

                self.video_details_label = ctk.CTkLabel(details_frame, text="Channel: --- | Duration: --- | Views: ---", font=("Arial", 11), text_color="gray", anchor="w")
                self.video_details_label.pack(fill="x", pady=2)

                self.video_site_label = ctk.CTkLabel(details_frame, text="Website: ---", font=("Arial", 11), text_color="gray", anchor="w")
                self.video_site_label.pack(fill="x", pady=2)

                quality_frame = ctk.CTkFrame(self, corner_radius=10)
                quality_frame.pack(fill="x", padx=15, pady=5)

                ctk.CTkLabel(quality_frame, text="Select Quality:", font=("Arial", 14, "bold")).pack(anchor="w", padx=15, pady=(10, 5))

                self.quality_var = ctk.StringVar(value="Analyze URL first")
                self.quality_menu = ctk.CTkOptionMenu(quality_frame, variable=self.quality_var, values=["Analyze URL first"], command=self._on_quality_selected, font=("Arial", 13), height=35, width=400)
                self.quality_menu.pack(padx=15, pady=(0, 5), anchor="w")

                save_row = ctk.CTkFrame(quality_frame, fg_color="transparent")
                save_row.pack(fill="x", padx=15, pady=(0, 10))

                ctk.CTkLabel(save_row, text="Save to:", font=("Arial", 12)).pack(side="left")
                self.path_label = ctk.CTkLabel(save_row, text=self.save_path, font=("Arial", 11), text_color="gray")
                self.path_label.pack(side="left", padx=10)
                ctk.CTkButton(save_row, text="Change", command=self._change_save_path, width=60, font=("Arial", 11)).pack(side="right")

                self.btn_download = ctk.CTkButton(self, text="Start Download", command=self._start_download, height=45, font=("Arial", 16, "bold"), fg_color="#1DB954", hover_color="#1ed760", state="disabled")
                self.btn_download.pack(fill="x", padx=15, pady=5)

                self.btn_cancel = ctk.CTkButton(self, text="Cancel Download", command=self._cancel_download, height=35, font=("Arial", 13), fg_color="red", hover_color="darkred")

                progress_frame = ctk.CTkFrame(self, corner_radius=10)
                progress_frame.pack(fill="x", padx=15, pady=5)

                self.progress_bar = ctk.CTkProgressBar(progress_frame, height=20, progress_color="#1DB954")
                self.progress_bar.pack(fill="x", padx=15, pady=(10, 5))
                self.progress_bar.set(0)

                self.progress_label = ctk.CTkLabel(progress_frame, text="Waiting to start download...", font=("Arial", 12))
                self.progress_label.pack(padx=15, pady=(0, 5))

                self.progress_details = ctk.CTkLabel(progress_frame, text="", font=("Arial", 11), text_color="gray")
                self.progress_details.pack(padx=15, pady=(0, 10))

            def _paste_url(self):
                try:
                    url = self.clipboard_get()
                    self.url_entry.delete(0, "end")
                    self.url_entry.insert(0, url)
                except:
                    pass

            def _analyze_url(self):
                url = self.url_entry.get().strip()
                if not url:
                    CTkMessagebox(title="Error", message="Please enter a video URL first!", icon="cancel")
                    return
                self.btn_analyze.configure(state="disabled", text="Analyzing...")
                self.status_label.configure(text="Analyzing URL...", text_color="yellow")
                def _analyze_thread():
                    result = self.downloader.get_video_info(url)
                    self.after(0, lambda: self._on_analysis_complete(result))
                threading.Thread(target=_analyze_thread, daemon=True).start()

            def _on_analysis_complete(self, result):
                self.btn_analyze.configure(state="normal", text="Analyze URL")
                if result['success']:
                    self.video_info = result['data']
                    info = self.video_info
                    self.video_title_label.configure(text=info['title'][:80])
                    views = f"{info['view_count']:,}" if info['view_count'] else '---'
                    self.video_details_label.configure(text=f"Channel: {info['uploader']}  |  Duration: {info['duration_str']}  |  Views: {views}")
                    self.video_site_label.configure(text=f"Website: {info['extractor']}")
                    self._load_thumbnail(info.get('thumbnail', ''))
                    quality_options = []
                    self.formats_map = {}
                    for fmt in info['formats']:
                        size_info = f" ({fmt['filesize_str']})" if fmt['filesize_str'] and fmt['filesize_str'] != 'Unknown' else ''
                        label = f"{fmt['resolution']}{size_info}"
                        quality_options.append(label)
                        self.formats_map[label] = fmt['format_id']
                    self.quality_menu.configure(values=quality_options)
                    self.quality_var.set(quality_options[0])
                    self.selected_format = self.formats_map[quality_options[0]]
                    self.btn_download.configure(state="normal")
                    self.status_label.configure(text=f"Found {len(quality_options)} quality options!", text_color="#1DB954")
                else:
                    self.status_label.configure(text=f"Analysis failed: {result['error'][:100]}", text_color="red")
                    CTkMessagebox(title="Error", message=f"Could not analyze URL:\n{result['error'][:200]}", icon="cancel")

            def _load_thumbnail(self, url):
                def _load():
                    try:
                        if url:
                            req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
                            response = urllib.request.urlopen(req, timeout=5)
                            image_data = response.read()
                            image = Image.open(io.BytesIO(image_data))
                            image = image.resize((160, 90), Image.LANCZOS)
                            photo = ctk.CTkImage(light_image=image, dark_image=image, size=(160, 90))
                            self.after(0, lambda: self.thumbnail_label.configure(image=photo, text=""))
                    except:
                        pass
                threading.Thread(target=_load, daemon=True).start()

            def _on_quality_selected(self, choice):
                if choice in self.formats_map:
                    self.selected_format = self.formats_map[choice]

            def _change_save_path(self):
                path = filedialog.askdirectory(initialdir=self.save_path)
                if path:
                    self.save_path = path
                    self.path_label.configure(text=path)

            def _start_download(self):
                url = self.url_entry.get().strip()
                if not url or not self.selected_format:
                    return
                self.btn_download.configure(state="disabled")
                self.btn_analyze.configure(state="disabled")
                self.btn_cancel.pack(fill="x", padx=15, pady=2)
                self.progress_bar.set(0)
                self.progress_label.configure(text="Starting download...")
                self.downloader.download(url=url, format_id=self.selected_format, save_path=self.save_path, progress_callback=self._on_progress, complete_callback=self._on_download_complete, error_callback=self._on_download_error)

            def _on_progress(self, data):
                def _update():
                    progress = data['progress'] / 100
                    self.progress_bar.set(progress)
                    self.progress_label.configure(text=f"Downloading... {data['progress']:.1f}%")
                    self.progress_details.configure(text=f"{data['downloaded']} / {data['total']}  |  Speed: {data['speed']}  |  ETA: {data['eta']}")
                self.after(0, _update)

            def _on_download_complete(self, filename):
                def _update():
                    self.progress_bar.set(1)
                    self.progress_label.configure(text="Download Complete!")
                    self.progress_details.configure(text=filename)
                    self.btn_download.configure(state="normal")
                    self.btn_analyze.configure(state="normal")
                    self.btn_cancel.pack_forget()
                    msg = CTkMessagebox(title="Download Complete!", message=f"Video downloaded successfully!\n\n{os.path.basename(filename)}\n\nDo you want to play it now?", option_1="Play", option_2="Open Folder", option_3="Close", icon="check")
                    response = msg.get()
                    if response == "Play":
                        self._play_video(filename)
                    elif response == "Open Folder":
                        folder = os.path.dirname(filename)
                        if os.name == 'nt':
                            os.startfile(folder)
                        else:
                            os.system(f'xdg-open "{folder}"')
                self.after(0, _update)

            def _on_download_error(self, error):
                def _update():
                    self.progress_label.configure(text="Download Failed!")
                    self.progress_details.configure(text=error[:150])
                    self.btn_download.configure(state="normal")
                    self.btn_analyze.configure(state="normal")
                    self.btn_cancel.pack_forget()
                    CTkMessagebox(title="Error", message=f"Download error:\n\n{error[:300]}", icon="cancel")
                self.after(0, _update)

            def _cancel_download(self):
                self.downloader.cancel_download()
                self.btn_cancel.pack_forget()
                self.btn_download.configure(state="normal")
                self.btn_analyze.configure(state="normal")
                self.progress_label.configure(text="Download Cancelled")

            def _play_video(self, filepath):
                try:
                    if self.player_window is not None and self.player_window.winfo_exists():
                        self.player_window.destroy()
                    self.player_window = VideoPlayer(self, filepath)
                    self.player_window.focus()
                except Exception as e:
                    CTkMessagebox(title="Player Error", message=f"Could not play video:\n{str(e)}\n\nMake sure VLC Media Player is installed.", icon="cancel")

            def _open_history(self):
                history = self.downloader.get_history()
                HistoryWindow(self, history, play_callback=self._play_video, delete_callback=self.downloader.delete_history_item, clear_callback=self.downloader.clear_history)

            def _toggle_theme(self):
                current = ctk.get_appearance_mode()
                if current == "Dark":
                    ctk.set_appearance_mode("light")
                else:
                    ctk.set_appearance_mode("dark")


        if __name__ == "__main__":
            app = MainApp()
            app.mainloop()
        "@ | Out-File -FilePath app.py -Encoding utf8

    # ==========================================
    # تثبيت المكتبات والبناء
    # ==========================================
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install yt-dlp customtkinter CTkMessagebox pillow python-vlc pyinstaller

    - name: Install VLC
      run: choco install vlc -y

    - name: Verify all files exist
      shell: pwsh
      run: |
        Write-Host "=== Files Created ==="
        Get-ChildItem -Name *.py
        Get-ChildItem -Name requirements.txt
        Write-Host "=== All files ready ==="

    - name: Build EXE with PyInstaller
      shell: pwsh
      run: |
        pyinstaller --onefile --windowed --name "VideoDownloaderPro" --add-data "downloader.py;." --add-data "player.py;." --add-data "history.py;." --hidden-import=yt_dlp --hidden-import=customtkinter --hidden-import=CTkMessagebox --hidden-import=PIL --hidden-import=vlc --collect-all customtkinter --collect-all CTkMessagebox app.py

    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: VideoDownloaderPro-Windows
        path: dist/VideoDownloaderPro.exe
        retention-days: 30
