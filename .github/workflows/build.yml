          cat > VideoDownloader/Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>NSAppTransportSecurity</key>
              <dict><key>NSAllowsArbitraryLoads</key><true/></dict>
              <key>UIFileSharingEnabled</key><true/>
              <key>LSSupportsOpeningDocumentsInPlace</key><true/>
              <key>UIBackgroundModes</key>
              <array><string>audio</string><string>fetch</string></array>
          </dict>
          </plist>
          EOF

      # 4. إنشاء ExportOptions.plist (يُستخدم لاحقاً عند إضافة خطوة archive موقّعة)
      - name: 📝 Write ExportOptions.plist
        run: |
          cat > ExportOptions.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>development</string>
              <key>teamID</key>
              <string>XXXXXXXXXX</string>
              <key>signingStyle</key>
              <string>manual</string>
          </dict>
          </plist>
          EOF

      # 5. إنشاء project.yml
      - name: 📝 Write project.yml
        run: |
          cat > project.yml << 'EOF'
          name: VideoDownloader
          options:
            bundleIdPrefix: com.example
            deploymentTarget:
              iOS: "16.4"
          targets:
            VideoDownloader:
              type: application
              platform: iOS
              sources: [VideoDownloader]
              info:
                path: VideoDownloader/Info.plist
                properties:
                  CFBundleDisplayName: VideoDownloader
                  CFBundleIdentifier: com.example.VideoDownloader
                  UILaunchScreen: {}
                  NSAppTransportSecurity:
                    NSAllowsArbitraryLoads: true
                  UIFileSharingEnabled: true
                  LSSupportsOpeningDocumentsInPlace: true
                  UIBackgroundModes: [audio, fetch]
          EOF

      # 6. تثبيت XcodeGen
      - name: 🛠 Install XcodeGen
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen

      # 7. إنشاء مشروع Xcode
      - name: 🏗 Generate Xcode project
        run: xcodegen generate

      # 8. بناء التطبيق بدون توقيع (مع تحديد منصة iOS صراحةً)
      - name: 🏗 Build .app (unsigned)
        run: |
          xcodebuild -project VideoDownloader.xcodeproj \
            -scheme VideoDownloader \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ./DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      # 9. حزم التطبيق في IPA
      - name: 📦 Package IPA
        run: |
          APP_PATH=$(find ./DerivedData -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then echo "❌ .app not found"; exit 1; fi
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r VideoDownloader.ipa Payload/

      # 10. رفع الـ IPA
      - name: ⬆️ Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: VideoDownloader-MultiEngine
          path: VideoDownloader.ipa
