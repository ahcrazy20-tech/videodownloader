                      }
                      // formatStreams = ستريمات progressive مدموجة (فيديو+صوت) بتشتغل في أي مشغل
                      if let fs = j["formatStreams"] as? [[String: Any]] {
                          let mp4s = fs.filter { (($0["type"] as? String) ?? "").contains("mp4") }
