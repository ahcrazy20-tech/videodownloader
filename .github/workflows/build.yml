          cat > VideoDownloader/Managers/VideoResolver.swift << 'EOF'
          import Foundation

          /// محرك الاستخراج الذكي — بنفس فكرة الـ Fast Race في تطبيق الموسيقى:
          /// كل السيرفرات تشتغل مع بعض في نفس اللحظة، وأول واحد يرجع رابط صالح يكسب
          class VideoResolver {
              struct ResolvedVideo {
                  let url: URL
                  let filename: String
                  let sourceLabel: String
              }

              private static let defaultsKey = "customResolverEndpoints"

              /// سيرفرات مجتمعية عامة (القائمة من instances.cobalt.best — قد تتغير)
              static let defaultEndpoints: [String] = [
                  "https://cobalt-api.meowing.de/",
                  "https://cobalt-backend.canine.tools/",
                  "https://capi.3kh0.net/",
                  "https://kityune.imput.net/"
              ]

              /// سيرفرات المستخدم الخاص أولاً ثم الافتراضية
              static var resolverEndpoints: [String] {
                  let custom = UserDefaults.standard.stringArray(forKey: defaultsKey) ?? []
                  return custom + defaultEndpoints
              }

              static func addCustomEndpoint(_ endpoint: String) {
                  var trimmed = endpoint.trimmingCharacters(in: .whitespacesAndNewlines)
                  guard !trimmed.isEmpty else { return }
                  if !trimmed.hasPrefix("http") { trimmed = "https://" + trimmed }
                  if !trimmed.hasSuffix("/") { trimmed += "/" }
                  var custom = UserDefaults.standard.stringArray(forKey: defaultsKey) ?? []
                  if !custom.contains(trimmed) {
                      custom.insert(trimmed, at: 0)
                      UserDefaults.standard.set(custom, forKey: defaultsKey)
                  }
              }

              /// هل الرابط ملف وسائط مباشر بالفعل؟
              static func isDirectMediaURL(_ urlString: String) -> Bool {
                  guard let url = URL(string: urlString),
                        let scheme = url.scheme?.lowercased(),
                        scheme.hasPrefix("http") else { return false }
                  let lower = urlString.lowercased()
                  let extensions = [".mp4", ".m4v", ".mov", ".webm", ".mkv", ".avi", ".m4a", ".mp3", ".aac", ".flv", ".ts"]
                  return extensions.contains { lower.contains($0) }
              }

              /// ⚡ السباق المتوازي: جرّب كل السيرفرات في نفس اللحظة — أول نجاح يفوز
              static func resolve(pageURL: String, completion: @escaping (Result<ResolvedVideo, Error>) -> Void) {
                  let endpoints = resolverEndpoints
                  guard !endpoints.isEmpty else {
                      completion(.failure(NSError(domain: "VideoResolver", code: -1, userInfo: [NSLocalizedDescriptionKey: "لا توجد سيرفرات استخراج"])))
                      return
                  }

                  let lock = NSLock()
                  var resolved = false
                  var failedCount = 0

                  for endpoint in endpoints {
                      requestEndpoint(endpoint, pageURL: pageURL) { result in
                          lock.lock()
                          let alreadyResolved = resolved
                          if case .success = result { resolved = true }
                          if case .failure = result { failedCount += 1 }
                          let allFailed = failedCount >= endpoints.count
                          lock.unlock()

                          if alreadyResolved { return }
                          switch result {
                          case .success:
                              completion(result)
                          case .failure:
                              if allFailed {
                                  completion(.failure(NSError(domain: "VideoResolver", code: -2, userInfo: [NSLocalizedDescriptionKey: "فشلت جميع سيرفرات الاستخراج"])))
                              }
                          }
                      }
                  }
              }

              private static func shortLabel(for endpoint: String) -> String {
                  if let host = URL(string: endpoint)?.host {
                      return host.replacingOccurrences(of: "www.", with: "")
                  }
                  return endpoint
              }

              private static func requestEndpoint(_ endpoint: String, pageURL: String, completion: @escaping (Result<ResolvedVideo, Error>) -> Void) {
                  guard let url = URL(string: endpoint) else {
                      completion(.failure(NSError(domain: "VideoResolver", code: 1)))
                      return
                  }

                  var request = URLRequest(url: url)
                  request.httpMethod = "POST"
                  request.timeoutInterval = 25
                  request.setValue("application/json", forHTTPHeaderField: "Content-Type")
                  request.setValue("application/json", forHTTPHeaderField: "Accept")

                  let body: [String: Any] = [
                      "url": pageURL,
                      "downloadMode": "auto",
                      "videoQuality": "1080",
                      "filenameStyle": "basic"
                  ]
                  request.httpBody = try? JSONSerialization.data(withJSONObject: body)

                  let label = shortLabel(for: endpoint)
                  URLSession.shared.dataTask(with: request) { data, response, _ in
                      guard let data = data,
                            let http = response as? HTTPURLResponse,
                            http.statusCode == 200,
                            let json = (try? JSONSerialization.jsonObject(with: data)) as? [String: Any] else {
                          completion(.failure(NSError(domain: "VideoResolver", code: 2)))
                          return
                      }

                      let status = json["status"] as? String ?? ""
                      let filename = json["filename"] as? String ?? ""

                      // tunnel / redirect / stream / success: الرابط المباشر في "url"
                      if ["tunnel", "redirect", "stream", "success"].contains(status),
                         let urlString = json["url"] as? String,
                         let direct = URL(string: urlString) {
                          completion(.success(ResolvedVideo(url: direct, filename: filename, sourceLabel: label)))
                          return
                      }

                      // picker: عدة ملفات (بوستات انستجرام) — خذ أول فيديو
                      if status == "picker", let picker = json["picker"] as? [[String: Any]] {
                          let videoItem = picker.first(where: { ($0["type"] as? String) == "video" }) ?? picker.first
                          if let urlString = videoItem?["url"] as? String, let direct = URL(string: urlString) {
                              completion(.success(ResolvedVideo(url: direct, filename: filename, sourceLabel: label)))
                              return
                          }
                      }

                      completion(.failure(NSError(domain: "VideoResolver", code: 3)))
                  }.resume()
              }
          }
          EOF

