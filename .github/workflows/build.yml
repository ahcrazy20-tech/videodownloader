name: Build iOS IPA

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Select Xcode
      run: sudo xcode-select -s /Applications/Xcode_15.0.app

    - name: Install dependencies
      run: brew install ldid

    - name: Download yt-dlp
      run: |
        mkdir -p Resources
        curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o Resources/yt-dlp
        chmod +x Resources/yt-dlp

    - name: Create Xcode project
      run: |
        mkdir -p MegaDownloader.xcodeproj
        echo '
