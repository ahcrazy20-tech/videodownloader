        struct WebViewRepresentable: UIViewRepresentable {
            @ObservedObject var vm: BrowserViewModel

            func makeUIView(context: Context) -> WKWebView {
                let cfg = WKWebViewConfiguration()
                cfg.allowsInlineMediaPlayback = true
                cfg.mediaTypesRequiringUserActionForPlayback = []
                let wv = WKWebView(frame: .zero, configuration: cfg)
                wv.navigationDelegate = context.coordinator
                wv.uiDelegate = context.coordinator
                wv.allowsBackForwardNavigationGestures = true
                wv.customUserAgent = "Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1"
                vm.webView = wv
                return wv
            }

            func updateUIView(_ wv: WKWebView, context: Context) {}
            func makeCoordinator() -> Coordinator { Coordinator(vm: vm) }

            class Coordinator: NSObject, WKNavigationDelegate, WKUIDelegate {
                let vm: BrowserViewModel
                init(vm: BrowserViewModel) { self.vm = vm }

                func webView(_ wv: WKWebView, didStartProvisionalNavigation _: WKNavigation!) {
                    vm.isLoading = true
                }

                func webView(_ wv: WKWebView, didFinish _: WKNavigation!) {
                    vm.isLoading = false
                    vm.canGoBack = wv.canGoBack; vm.canGoForward = wv.canGoForward
                    vm.urlText = wv.url?.absoluteString ?? ""
                    vm.isSecure = wv.url?.scheme == "https"
                }

                func webView(_ wv: WKWebView, didFail _: WKNavigation!, withError _: Error) { vm.isLoading = false }

                func webView(_ wv: WKWebView, createWebViewWith _: WKWebViewConfiguration,
                             for action: WKNavigationAction, windowFeatures: WKWindowFeatures) -> WKWebView? {
                    if action.targetFrame == nil { wv.load(action.request) }
                    return nil
                }
            }
        }

