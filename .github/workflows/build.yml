        import Foundation
        import AVFoundation

        class HLSDownloader: NSObject {
            static let shared = HLSDownloader()
            
            typealias ProgressCallback = (Double) -> Void
            typealias CompletionCallback = (Result<URL, Error>) -> Void
            
            enum HLSError: LocalizedError {
                case invalidURL, noSegments, downloadFailed(String)
                var errorDescription: String? {
                    switch self {
                    case .invalidURL: return "Invalid HLS URL"
                    case .noSegments: return "No segments found"
                    case .downloadFailed(let m): return m
                    }
                }
            }
            
            private let maxParallelSegments = 6
            
            func downloadHLS(url: String, headers: [String: String], destination: URL,
                             progress: @escaping ProgressCallback,
                             completion: @escaping CompletionCallback) {
                
                guard let manifestURL = URL(string: url) else {
                    completion(.failure(HLSError.invalidURL))
                    return
                }
                
                print("🎬 HLS Download: \(url)")
                
                fetchManifest(url: manifestURL, headers: headers) { [weak self] result in
                    switch result {
                    case .success(let (content, baseURL)):
                        if content.contains("#EXT-X-STREAM-INF") {
                            // Master playlist - select best variant
                            if let variant = self?.selectBestVariant(manifest: content, baseURL: baseURL) {
                                self?.downloadHLS(url: variant.absoluteString, headers: headers,
                                                 destination: destination, progress: progress,
                                                 completion: completion)
                            } else {
                                completion(.failure(HLSError.noSegments))
                            }
                            return
                        }
                        
                        let segments = self?.parseSegments(manifest: content, baseURL: baseURL) ?? []
                        if segments.isEmpty {
                            completion(.failure(HLSError.noSegments))
                            return
                        }
                        
                        self?.downloadSegmentsParallel(
                            segments: segments, headers: headers,
                            destination: destination,
                            progress: progress, completion: completion
                        )
                    case .failure(let e):
                        completion(.failure(e))
                    }
                }
            }
            
            private func fetchManifest(url: URL, headers: [String: String],
                                       completion: @escaping (Result<(String, URL), Error>) -> Void) {
                var req = URLRequest(url: url)
                for (k, v) in headers { req.setValue(v, forHTTPHeaderField: k) }
                req.setValue("Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15", forHTTPHeaderField: "User-Agent")
                req.timeoutInterval = 30
                
                URLSession.shared.dataTask(with: req) { data, response, error in
                    if let error = error {
                        completion(.failure(HLSError.downloadFailed(error.localizedDescription)))
                        return
                    }
                    guard let data = data, let content = String(data: data, encoding: .utf8) else {
                        completion(.failure(HLSError.downloadFailed("Empty manifest")))
                        return
                    }
                    let baseURL = (response?.url ?? url).deletingLastPathComponent()
                    completion(.success((content, baseURL)))
                }.resume()
            }
            
            private func selectBestVariant(manifest: String, baseURL: URL) -> URL? {
                let lines = manifest.components(separatedBy: .newlines)
                var variants: [(Int, URL)] = []
                
                for i in 0..<lines.count {
                    let line = lines[i].trimmingCharacters(in: .whitespaces)
                    if line.hasPrefix("#EXT-X-STREAM-INF:") {
                        var bandwidth = 0
                        if let bwRange = line.range(of: "BANDWIDTH=") {
                            let after = String(line[bwRange.upperBound...])
                            bandwidth = Int(after.prefix { $0.isNumber }) ?? 0
                        }
                        if i + 1 < lines.count {
                            let urlLine = lines[i + 1].trimmingCharacters(in: .whitespaces)
                            if !urlLine.isEmpty && !urlLine.hasPrefix("#") {
                                let variantURL = urlLine.hasPrefix("http") ? URL(string: urlLine) : baseURL.appendingPathComponent(urlLine)
                                if let u = variantURL { variants.append((bandwidth, u)) }
                            }
                        }
                    }
                }
                
                return variants.max(by: { $0.0 < $1.0 })?.1
            }
            
            private func parseSegments(manifest: String, baseURL: URL) -> [URL] {
                var segments: [URL] = []
                let lines = manifest.components(separatedBy: .newlines)
                for line in lines {
                    let trimmed = line.trimmingCharacters(in: .whitespaces)
                    if trimmed.isEmpty || trimmed.hasPrefix("#") { continue }
                    if trimmed.hasPrefix("http") {
                        if let u = URL(string: trimmed) { segments.append(u) }
                    } else {
                        segments.append(baseURL.appendingPathComponent(trimmed))
                    }
                }
                return segments
            }
            
            // Parallel segment download with proper ordering
            private func downloadSegmentsParallel(segments: [URL], headers: [String: String],
                                                  destination: URL,
                                                  progress: @escaping ProgressCallback,
                                                  completion: @escaping CompletionCallback) {
                
                print("📦 Downloading \(segments.count) segments in parallel...")
                
                try? FileManager.default.removeItem(at: destination)
                FileManager.default.createFile(atPath: destination.path, contents: nil)
                
                guard let fileHandle = try? FileHandle(forWritingTo: destination) else {
                    completion(.failure(HLSError.downloadFailed("Cannot create output")))
                    return
                }
                
                var segmentData: [Int: Data] = [:]
                let dataLock = NSLock()
                var completedCount = 0
                let countLock = NSLock()
                let group = DispatchGroup()
                let semaphore = DispatchSemaphore(value: maxParallelSegments)
                
                for (index, segURL) in segments.enumerated() {
                    group.enter()
                    DispatchQueue.global(qos: .userInitiated).async {
                        semaphore.wait()
                        defer {
                            semaphore.signal()
                            group.leave()
                        }
                        
                        self.downloadSegmentWithRetry(url: segURL, headers: headers, retries: 3) { data in
                            if let data = data {
                                dataLock.lock()
                                segmentData[index] = data
                                dataLock.unlock()
                            }
                            countLock.lock()
                            completedCount += 1
                            let p = Double(completedCount) / Double(segments.count) * 0.9
                            countLock.unlock()
                            progress(p)
                        }
                    }
                }
                
                group.notify(queue: .main) {
                    if segmentData.isEmpty {
                        try? fileHandle.close()
                        try? FileManager.default.removeItem(at: destination)
                        completion(.failure(HLSError.downloadFailed("All segments failed")))
                        return
                    }
                    
                    // Write segments in correct order
                    print("💾 Writing \(segmentData.count) segments in order...")
                    for i in 0..<segments.count {
                        if let data = segmentData[i] {
                            try? fileHandle.write(contentsOf: data)
                        }
                    }
                    try? fileHandle.close()
                    
                    // Try to remux to MP4
                    self.remuxToMP4(source: destination, progress: progress, completion: completion)
                }
            }
            
            private func downloadSegmentWithRetry(url: URL, headers: [String: String], retries: Int,
                                                  completion: @escaping (Data?) -> Void) {
                var req = URLRequest(url: url)
                for (k, v) in headers { req.setValue(v, forHTTPHeaderField: k) }
                req.setValue("Mozilla/5.0", forHTTPHeaderField: "User-Agent")
                req.timeoutInterval = 60
                
                URLSession.shared.dataTask(with: req) { data, _, error in
                    if let data = data, !data.isEmpty {
                        completion(data)
                    } else if retries > 0 {
                        DispatchQueue.global().asyncAfter(deadline: .now() + 1) {
                            self.downloadSegmentWithRetry(url: url, headers: headers, retries: retries - 1, completion: completion)
                        }
                    } else {
                        completion(nil)
                    }
                }.resume()
            }
            
            private func remuxToMP4(source: URL, progress: @escaping ProgressCallback,
                                    completion: @escaping CompletionCallback) {
                print("🔄 Remuxing to MP4...")
                
                let asset = AVURLAsset(url: source)
                asset.loadValuesAsynchronously(forKeys: ["tracks", "duration"]) {
                    var error: NSError?
                    let status = asset.statusOfValue(forKey: "tracks", error: &error)
                    
                    if status != .loaded {
                        progress(1.0)
                        completion(.success(source))
                        return
                    }
                    
                    let tempOutput = source.deletingLastPathComponent()
                        .appendingPathComponent("remuxed_\(UUID().uuidString).mp4")
                    
                    guard let export = AVAssetExportSession(asset: asset, presetName: AVAssetExportPresetPassthrough) else {
                        progress(1.0)
                        completion(.success(source))
                        return
                    }
                    
                    export.outputURL = tempOutput
                    export.outputFileType = .mp4
                    export.shouldOptimizeForNetworkUse = true
                    
                    export.exportAsynchronously {
                        switch export.status {
                        case .completed:
                            try? FileManager.default.removeItem(at: source)
                            try? FileManager.default.moveItem(at: tempOutput, to: source)
                            progress(1.0)
                            completion(.success(source))
                        default:
                            try? FileManager.default.removeItem(at: tempOutput)
                            progress(1.0)
                            completion(.success(source))
                        }
                    }
                }
            }
        }
