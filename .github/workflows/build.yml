name: Build VideoFlow v7 IDM

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 120

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Select Xcode 15
      run: sudo xcode-select -s /Applications/Xcode_15.2.app

    - name: Create Project Structure
      run: |
        mkdir -p VideoFlow/App
        mkdir -p VideoFlow/Views
        mkdir -p VideoFlow/Models
        mkdir -p VideoFlow/Services
        mkdir -p VideoFlow/Extractors
        mkdir -p VideoFlow/AdBlock
        mkdir -p VideoFlow/Resources/Assets.xcassets/AppIcon.appiconset
        mkdir -p VideoFlow/Resources/Assets.xcassets/AccentColor.colorset
        mkdir -p VideoFlow.xcodeproj

    - name: Create All Source Files
      run: |
        # ==========================================
        # 1. VideoFlowApp.swift
        # ==========================================
        cat > VideoFlow/App/VideoFlowApp.swift << 'SWIFTEOF'
        import SwiftUI

        @main
        struct VideoFlowApp: App {
            @UIApplicationDelegateAdaptor(AppDelegate.self) var appDelegate
            @StateObject private var downloadManager = DownloadManager.shared
            @StateObject private var playerManager = PlayerManager.shared

            var body: some Scene {
                WindowGroup {
                    ContentView()
                        .environmentObject(downloadManager)
                        .environmentObject(playerManager)
                        .preferredColorScheme(.dark)
                }
            }
        }
        SWIFTEOF

        # ==========================================
        # 2. AppDelegate.swift
        # ==========================================
        cat > VideoFlow/App/AppDelegate.swift << 'SWIFTEOF'
        import UIKit
        import AVFoundation
        import UserNotifications

        class AppDelegate: NSObject, UIApplicationDelegate {
            func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
                do {
                    try AVAudioSession.sharedInstance().setCategory(.playback, mode: .moviePlayback, options: [.allowAirPlay, .allowBluetooth])
                    try AVAudioSession.sharedInstance().setActive(true)
                } catch { print("Audio: \(error)") }
                UNUserNotificationCenter.current().requestAuthorization(options: [.alert, .sound, .badge]) { _, _ in }
                return true
            }
        }
        SWIFTEOF

        # ==========================================
        # 3. VideoItem.swift
        # ==========================================
        cat > VideoFlow/Models/VideoItem.swift << 'SWIFTEOF'
        import SwiftUI

        enum VideoQuality: String, CaseIterable, Hashable {
            case p2160 = "4K", p1440 = "1440p", p1080 = "1080p"
            case p720 = "720p", p480 = "480p", p360 = "360p", p240 = "240p"
            case audio = "Audio"

            var displayName: String {
                switch self {
                case .p2160: return "4K Ultra HD"
                case .p1440: return "2K QHD"
                case .p1080: return "Full HD 1080p"
                case .p720: return "HD 720p"
                case .p480: return "SD 480p"
                case .p360: return "Low 360p"
                case .p240: return "Min 240p"
                case .audio: return "Audio Only MP3"
                }
            }

            var color: Color {
                switch self {
                case .p2160: return .purple
                case .p1440: return .indigo
                case .p1080: return .red
                case .p720: return .orange
                case .p480: return .green
                case .p360: return .blue
                case .p240: return .gray
                case .audio: return .pink
                }
            }

            var cobaltValue: String {
                switch self {
                case .p2160: return "2160"
                case .p1440: return "1440"
                case .p1080: return "1080"
                case .p720: return "720"
                case .p480: return "480"
                case .p360: return "360"
                case .p240: return "240"
                case .audio: return "audio"
                }
            }
        }

        enum VideoSourceType: String {
            case direct = "Direct MP4"
            case hls = "HLS Stream"
            case youtube = "YouTube"
            case tiktok = "TikTok"
            case instagram = "Instagram"
            case facebook = "Facebook"
            case twitter = "Twitter/X"
            case reddit = "Reddit"
            case vimeo = "Vimeo"
            case other = "Web"
        }

        struct VideoItem: Identifiable, Equatable, Hashable {
            let id: String
            var title: String
            let url: String
            var thumbnailURL: String?
            var duration: String?
            var estimatedSize: String?
            var availableQualities: [VideoQuality]
            var sourceType: VideoSourceType
            var headers: [String: String] = [:]
            var isHLS: Bool { url.lowercased().contains(".m3u8") }
            func hash(into hasher: inout Hasher) { hasher.combine(id) }
            static func == (l: VideoItem, r: VideoItem) -> Bool { l.id == r.id }
        }
        SWIFTEOF

        # ==========================================
        # 4. DownloadTask.swift
        # ==========================================
        cat > VideoFlow/Models/DownloadTask.swift << 'SWIFTEOF'
        import Foundation

        enum DownloadStatus: Equatable {
            case waiting
            case downloading(progress: Double)
            case converting
            case paused
            case completed
            case failed(error: String)
            var displayText: String {
                switch self {
                case .waiting: return "Waiting..."
                case .downloading(let p): return "\(Int(p * 100))%"
                case .converting: return "Processing..."
                case .paused: return "Paused"
                case .completed: return "Completed"
                case .failed(let e): return "Failed: \(e)"
                }
            }
        }

        class DownloadTask: ObservableObject, Identifiable {
            let id: String
            let video: VideoItem
            let quality: VideoQuality
            @Published var status: DownloadStatus = .waiting
            @Published var progress: Double = 0
            @Published var downloadedBytes: Int64 = 0
            @Published var totalBytes: Int64 = 0
            @Published var speed: String = ""
            @Published var activeThreads: Int = 0
            @Published var savedURL: URL?
            var sessionTaskId: Int?
            private var lastBytes: Int64 = 0
            private var lastTime: Date?

            init(id: String = UUID().uuidString, video: VideoItem, quality: VideoQuality) {
                self.id = id; self.video = video; self.quality = quality
            }

            func updateProgress(bytesWritten: Int64, totalExpected: Int64) {
                let now = Date()
                self.downloadedBytes = bytesWritten
                self.totalBytes = totalExpected
                if totalExpected > 0 { self.progress = min(1.0, Double(bytesWritten) / Double(totalExpected)) }
                if let lt = lastTime {
                    let elapsed = now.timeIntervalSince(lt)
                    if elapsed >= 0.5 {
                        let bps = Double(bytesWritten - lastBytes) / elapsed
                        self.speed = formatSpeed(bps)
                        self.lastBytes = bytesWritten
                        self.lastTime = now
                    }
                } else {
                    self.lastTime = now
                    self.lastBytes = bytesWritten
                }
                self.status = .downloading(progress: self.progress)
            }
            
            private func formatSpeed(_ bps: Double) -> String {
                if bps < 1024 { return "\(Int(bps)) B/s" }
                if bps < 1048576 { return String(format: "%.1f KB/s", bps/1024) }
                return String(format: "%.2f MB/s", bps/1048576)
            }

            var sizeText: String {
                let fmt = ByteCountFormatter()
                fmt.allowedUnits = [.useMB, .useGB]
                fmt.countStyle = .file
                if totalBytes > 0 {
                    return "\(fmt.string(fromByteCount: downloadedBytes)) / \(fmt.string(fromByteCount: totalBytes))"
                }
                return fmt.string(fromByteCount: downloadedBytes)
            }
        }
        SWIFTEOF

        # ==========================================
        # 5. AdBlocker.swift (6-LAYER PROTECTION)
        # ==========================================
        cat > VideoFlow/AdBlock/AdBlocker.swift << 'SWIFTEOF'
        import Foundation
        import WebKit

        class AdBlocker {
            static let shared = AdBlocker()
            
            static let blockedDomains: Set<String> = [
                "doubleclick.net", "googlesyndication.com", "googleadservices.com",
                "google-analytics.com", "googletagmanager.com", "googletagservices.com",
                "adnxs.com", "adsystem.com", "amazon-adsystem.com", "adsafeprotected.com",
                "outbrain.com", "taboola.com", "criteo.com", "criteo.net",
                "connect.facebook.net", "analytics.tiktok.com",
                "scorecardresearch.com", "quantserve.com", "moatads.com",
                "adroll.com", "adsrvr.org", "rubiconproject.com", "openx.net",
                "pubmatic.com", "media.net", "adform.net", "innovid.com",
                "sizmek.com", "smartadserver.com", "yieldmo.com", "chartbeat.com",
                "hotjar.com", "mixpanel.com", "amplitude.com", "fullstory.com",
                "propellerads.com", "popads.net", "popcash.net", "adcash.com",
                "revcontent.com", "mgid.com", "zergnet.com",
                "onclickads.net", "trafficjunky.com", "juicyads.com",
                "eroadvertising.com", "exoclick.com", "exosrv.com",
                "adsterra.com", "hilltopads.net", "clickadu.com"
            ]
            
            static let blockedPatterns: [String] = [
                "/ads/", "/adx/", "/advert", "/adserver", "/adservice",
                "/adsense", "/pagead", "/adframe", "/adcall",
                "/tracking", "/tracker", "/pixel", "/beacon",
                "/telemetry", "/metrics", "/impression",
                "doubleclick", "googleadservices", "googlesyndication",
                "-ads-", "_ads_", ".ads.", "/ad-", "-ad-", "_ad_",
                "popup", "popunder", "popads"
            ]
            
            static let adBlockJS: String = {
                var js = ""
                js += "(function(){"
                js += "function removeAds(){"
                js += "var sels=['[class*=\"ad-\"]','[class*=\"ads-\"]','[id*=\"ad-\"]','[id*=\"ads-\"]','[class*=\"advertisement\"]','[class*=\"sponsored\"]','[class*=\"popup\"]','[class*=\"overlay-ad\"]','[data-ad]','[data-ads]','ins.adsbygoogle','.adsbox','.adBanner','.ad-container','.ad-wrapper','iframe[src*=\"ads\"]','iframe[src*=\"doubleclick\"]','iframe[src*=\"googlesyndication\"]'];"
                js += "sels.forEach(function(s){try{document.querySelectorAll(s).forEach(function(el){el.remove();});}catch(e){}});"
                js += "}"
                js += "var oOpen=window.open;"
                js += "window.open=function(u){if(u&&(u.indexOf('ad')>-1||u.indexOf('popup')>-1))return null;return oOpen.apply(this,arguments);};"
                js += "removeAds();"
                js += "setInterval(removeAds,2000);"
                js += "var obs=new MutationObserver(removeAds);"
                js += "if(document.body)obs.observe(document.body,{childList:true,subtree:true});"
                js += "var blocked=['doubleclick','googlesyndication','googleadservices','adnxs','popads','popcash','adcash','taboola','outbrain'];"
                js += "var oFetch=window.fetch;"
                js += "window.fetch=function(){"
                js += "var url=typeof arguments[0]==='string'?arguments[0]:(arguments[0]&&arguments[0].url?arguments[0].url:'');"
                js += "for(var i=0;i<blocked.length;i++){if(url.indexOf(blocked[i])>-1)return Promise.reject(new Error('blocked'));}"
                js += "return oFetch.apply(this,arguments);"
                js += "};"
                js += "var oXHR=XMLHttpRequest.prototype.open;"
                js += "XMLHttpRequest.prototype.open=function(m,url){"
                js += "for(var i=0;i<blocked.length;i++){if(url&&url.indexOf(blocked[i])>-1){this.abort();return;}}"
                js += "return oXHR.apply(this,arguments);"
                js += "};"
                js += "})();"
                return js
            }()
            
            static func shouldBlock(url: String) -> Bool {
                let lower = url.lowercased()
                for d in blockedDomains { if lower.contains(d) { return true } }
                for p in blockedPatterns { if lower.contains(p) { return true } }
                return false
            }
        }
        SWIFTEOF

        # ==========================================
        # 6. IDMDownloader.swift (MULTI-THREADED - IDM STYLE!)
        # ==========================================
        cat > VideoFlow/Services/IDMDownloader.swift << 'SWIFTEOF'
        import Foundation

        // IDM-Style Multi-Segment Downloader
        // Splits file into 8 parts and downloads in parallel
        class IDMDownloader: NSObject {
            static let shared = IDMDownloader()
            
            typealias ProgressCallback = (Double, String, Int) -> Void  // progress, speed, threads
            typealias CompletionCallback = (Result<URL, Error>) -> Void
            
            enum IDMError: LocalizedError {
                case invalidURL, serverError(Int), noRangeSupport
                case downloadFailed(String), writeFailed(String)
                
                var errorDescription: String? {
                    switch self {
                    case .invalidURL: return "Invalid URL"
                    case .serverError(let c): return "Server error \(c)"
                    case .noRangeSupport: return "Server doesn't support parallel download"
                    case .downloadFailed(let m): return m
                    case .writeFailed(let m): return "Write: \(m)"
                    }
                }
            }
            
            struct Segment {
                let index: Int
                let start: Int64
                let end: Int64
                var data: Data?
                var downloaded: Int64 = 0
                var isComplete: Bool = false
            }
            
            private let maxConcurrentSegments = 8
            private let minSegmentSize: Int64 = 1_048_576  // 1MB
            
            // MAIN ENTRY POINT
            func download(url: String, headers: [String: String], destination: URL,
                          progress: @escaping ProgressCallback,
                          completion: @escaping CompletionCallback) {
                
                print("🚀 IDM Downloader started: \(url)")
                
                guard let downloadURL = URL(string: url) else {
                    completion(.failure(IDMError.invalidURL))
                    return
                }
                
                // Step 1: Get file info (size + range support)
                getFileInfo(url: downloadURL, headers: headers) { result in
                    switch result {
                    case .success(let (fileSize, supportsRange)):
                        print("📊 File size: \(fileSize), Range: \(supportsRange)")
                        
                        if supportsRange && fileSize > self.minSegmentSize * 2 {
                            // Multi-threaded download
                            self.multiThreadedDownload(
                                url: downloadURL, fileSize: fileSize,
                                headers: headers, destination: destination,
                                progress: progress, completion: completion
                            )
                        } else {
                            // Single-threaded fallback
                            self.singleThreadedDownload(
                                url: downloadURL, headers: headers,
                                destination: destination,
                                progress: progress, completion: completion
                            )
                        }
                    case .failure(let error):
                        completion(.failure(error))
                    }
                }
            }
            
            // Step 1: HEAD request to get file size and check range support
            private func getFileInfo(url: URL, headers: [String: String],
                                     completion: @escaping (Result<(Int64, Bool), Error>) -> Void) {
                var req = URLRequest(url: url)
                req.httpMethod = "HEAD"
                req.timeoutInterval = 30
                req.setValue("Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1", forHTTPHeaderField: "User-Agent")
                req.setValue("*/*", forHTTPHeaderField: "Accept")
                for (k, v) in headers { req.setValue(v, forHTTPHeaderField: k) }
                if headers["Referer"] == nil, let h = url.host {
                    req.setValue("https://\(h)/", forHTTPHeaderField: "Referer")
                }
                
                URLSession.shared.dataTask(with: req) { _, response, error in
                    if let error = error {
                        // If HEAD fails, try Range request
                        self.probeWithRangeRequest(url: url, headers: headers, completion: completion)
                        return
                    }
                    
                    guard let http = response as? HTTPURLResponse else {
                        completion(.failure(IDMError.serverError(0)))
                        return
                    }
                    
                    let size = http.expectedContentLength
                    let acceptRanges = (http.value(forHTTPHeaderField: "Accept-Ranges") ?? "").lowercased()
                    let supportsRange = acceptRanges.contains("bytes")
                    
                    if size > 0 {
                        completion(.success((size, supportsRange)))
                    } else {
                        // Try Range request to determine size
                        self.probeWithRangeRequest(url: url, headers: headers, completion: completion)
                    }
                }.resume()
            }
            
            // Fallback: Probe with Range request
            private func probeWithRangeRequest(url: URL, headers: [String: String],
                                               completion: @escaping (Result<(Int64, Bool), Error>) -> Void) {
                var req = URLRequest(url: url)
                req.httpMethod = "GET"
                req.setValue("bytes=0-1", forHTTPHeaderField: "Range")
                req.timeoutInterval = 30
                req.setValue("Mozilla/5.0", forHTTPHeaderField: "User-Agent")
                for (k, v) in headers { req.setValue(v, forHTTPHeaderField: k) }
                
                URLSession.shared.dataTask(with: req) { _, response, error in
                    if let error = error {
                        completion(.failure(IDMError.downloadFailed(error.localizedDescription)))
                        return
                    }
                    
                    guard let http = response as? HTTPURLResponse else {
                        completion(.failure(IDMError.serverError(0)))
                        return
                    }
                    
                    // Check Content-Range header
                    if http.statusCode == 206, let contentRange = http.value(forHTTPHeaderField: "Content-Range") {
                        // Format: "bytes 0-1/12345"
                        let parts = contentRange.components(separatedBy: "/")
                        if parts.count == 2, let totalSize = Int64(parts[1]) {
                            completion(.success((totalSize, true)))
                            return
                        }
                    }
                    
                    // Fallback to single-thread
                    completion(.success((http.expectedContentLength, false)))
                }.resume()
            }
            
            // MULTI-THREADED DOWNLOAD (IDM Style)
            private func multiThreadedDownload(url: URL, fileSize: Int64,
                                               headers: [String: String], destination: URL,
                                               progress: @escaping ProgressCallback,
                                               completion: @escaping CompletionCallback) {
                
                // Split file into segments
                let numSegments = min(maxConcurrentSegments, max(1, Int(fileSize / minSegmentSize)))
                let segmentSize = fileSize / Int64(numSegments)
                
                print("🎯 Splitting into \(numSegments) segments of \(segmentSize) bytes each")
                
                var segments: [Segment] = []
                for i in 0..<numSegments {
                    let start = Int64(i) * segmentSize
                    let end = (i == numSegments - 1) ? fileSize - 1 : start + segmentSize - 1
                    segments.append(Segment(index: i, start: start, end: end))
                }
                
                // Create output file with correct size
                try? FileManager.default.removeItem(at: destination)
                FileManager.default.createFile(atPath: destination.path, contents: nil)
                
                guard let fileHandle = try? FileHandle(forWritingTo: destination) else {
                    completion(.failure(IDMError.writeFailed("Cannot create file")))
                    return
                }
                
                // Preallocate file size
                do {
                    try fileHandle.seek(toOffset: UInt64(fileSize - 1))
                    try fileHandle.write(contentsOf: Data([0]))
                    try fileHandle.seek(toOffset: 0)
                } catch {
                    try? fileHandle.close()
                    completion(.failure(IDMError.writeFailed(error.localizedDescription)))
                    return
                }
                
                let writeLock = NSLock()
                let progressLock = NSLock()
                var totalDownloaded: Int64 = 0
                var completedSegments = 0
                var failedSegments = 0
                let startTime = Date()
                var lastProgressUpdate = Date()
                var lastBytesForSpeed: Int64 = 0
                var currentSpeed: String = "0 KB/s"
                
                let group = DispatchGroup()
                let concurrentQueue = DispatchQueue(label: "idm.download", attributes: .concurrent)
                
                // Start download for each segment
                for segment in segments {
                    group.enter()
                    concurrentQueue.async {
                        self.downloadSegment(
                            url: url, segment: segment, headers: headers,
                            onData: { data, segmentIndex in
                                writeLock.lock()
                                defer { writeLock.unlock() }
                                do {
                                    let offset = segments[segmentIndex].start + segments[segmentIndex].downloaded
                                    try fileHandle.seek(toOffset: UInt64(offset))
                                    try fileHandle.write(contentsOf: data)
                                    segments[segmentIndex].downloaded += Int64(data.count)
                                    
                                    progressLock.lock()
                                    totalDownloaded += Int64(data.count)
                                    let now = Date()
                                    let elapsed = now.timeIntervalSince(lastProgressUpdate)
                                    if elapsed >= 0.5 {
                                        let bps = Double(totalDownloaded - lastBytesForSpeed) / elapsed
                                        currentSpeed = self.formatSpeed(bps)
                                        lastProgressUpdate = now
                                        lastBytesForSpeed = totalDownloaded
                                    }
                                    let p = Double(totalDownloaded) / Double(fileSize)
                                    let activeThreads = numSegments - completedSegments - failedSegments
                                    progressLock.unlock()
                                    
                                    progress(p, currentSpeed, max(0, activeThreads))
                                } catch {
                                    print("❌ Write error for segment \(segmentIndex): \(error)")
                                }
                            },
                            completion: { success in
                                progressLock.lock()
                                if success {
                                    completedSegments += 1
                                    segments[segment.index].isComplete = true
                                } else {
                                    failedSegments += 1
                                }
                                progressLock.unlock()
                                group.leave()
                            }
                        )
                    }
                }
                
                group.notify(queue: .main) {
                    try? fileHandle.close()
                    
                    if failedSegments == segments.count {
                        // All failed
                        try? FileManager.default.removeItem(at: destination)
                        completion(.failure(IDMError.downloadFailed("All segments failed")))
                    } else if failedSegments > 0 {
                        // Some failed - retry failed segments
                        print("⚠️ \(failedSegments) segments failed, retrying...")
                        self.retryFailedSegments(
                            url: url, segments: segments, headers: headers,
                            destination: destination, fileSize: fileSize,
                            progress: progress, completion: completion
                        )
                    } else {
                        // Success!
                        let elapsed = Date().timeIntervalSince(startTime)
                        let avgSpeed = Double(fileSize) / elapsed
                        print("✅ Download complete in \(elapsed)s (avg: \(self.formatSpeed(avgSpeed)))")
                        completion(.success(destination))
                    }
                }
            }
            
            // Download individual segment with retry
            private func downloadSegment(url: URL, segment: Segment, headers: [String: String],
                                        onData: @escaping (Data, Int) -> Void,
                                        completion: @escaping (Bool) -> Void) {
                var req = URLRequest(url: url)
                req.httpMethod = "GET"
                req.timeoutInterval = 120
                req.setValue("bytes=\(segment.start + segment.downloaded)-\(segment.end)", forHTTPHeaderField: "Range")
                req.setValue("Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15", forHTTPHeaderField: "User-Agent")
                req.setValue("*/*", forHTTPHeaderField: "Accept")
                req.setValue("identity;q=1, *;q=0", forHTTPHeaderField: "Accept-Encoding")
                for (k, v) in headers { req.setValue(v, forHTTPHeaderField: k) }
                if headers["Referer"] == nil, let h = url.host {
                    req.setValue("https://\(h)/", forHTTPHeaderField: "Referer")
                }
                
                let delegate = SegmentDelegate(segmentIndex: segment.index, onData: onData, onComplete: completion)
                let config = URLSessionConfiguration.default
                config.timeoutIntervalForRequest = 120
                config.timeoutIntervalForResource = 3600
                let session = URLSession(configuration: config, delegate: delegate, delegateQueue: nil)
                
                let task = session.dataTask(with: req)
                task.resume()
            }
            
            // Retry failed segments
            private func retryFailedSegments(url: URL, segments: [Segment], headers: [String: String],
                                            destination: URL, fileSize: Int64,
                                            progress: @escaping ProgressCallback,
                                            completion: @escaping CompletionCallback) {
                let failed = segments.filter { !$0.isComplete }
                print("🔄 Retrying \(failed.count) failed segments...")
                
                guard let fileHandle = try? FileHandle(forWritingTo: destination) else {
                    completion(.failure(IDMError.writeFailed("Cannot reopen file")))
                    return
                }
                
                let group = DispatchGroup()
                let writeLock = NSLock()
                var allSucceeded = true
                
                for segment in failed {
                    group.enter()
                    downloadSegment(
                        url: url, segment: segment, headers: headers,
                        onData: { data, _ in
                            writeLock.lock()
                            do {
                                try fileHandle.seek(toOffset: UInt64(segment.start))
                                try fileHandle.write(contentsOf: data)
                            } catch {
                                allSucceeded = false
                            }
                            writeLock.unlock()
                        },
                        completion: { success in
                            if !success { allSucceeded = false }
                            group.leave()
                        }
                    )
                }
                
                group.notify(queue: .main) {
                    try? fileHandle.close()
                    if allSucceeded {
                        completion(.success(destination))
                    } else {
                        try? FileManager.default.removeItem(at: destination)
                        completion(.failure(IDMError.downloadFailed("Retry failed")))
                    }
                }
            }
            
            // SINGLE-THREADED FALLBACK
            private func singleThreadedDownload(url: URL, headers: [String: String],
                                               destination: URL,
                                               progress: @escaping ProgressCallback,
                                               completion: @escaping CompletionCallback) {
                print("📥 Single-thread download")
                
                try? FileManager.default.removeItem(at: destination)
                FileManager.default.createFile(atPath: destination.path, contents: nil)
                
                guard let fileHandle = try? FileHandle(forWritingTo: destination) else {
                    completion(.failure(IDMError.writeFailed("Cannot create file")))
                    return
                }
                
                var req = URLRequest(url: url)
                req.timeoutInterval = 120
                req.setValue("Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15", forHTTPHeaderField: "User-Agent")
                req.setValue("*/*", forHTTPHeaderField: "Accept")
                for (k, v) in headers { req.setValue(v, forHTTPHeaderField: k) }
                if headers["Referer"] == nil, let h = url.host {
                    req.setValue("https://\(h)/", forHTTPHeaderField: "Referer")
                }
                
                var totalDownloaded: Int64 = 0
                var totalExpected: Int64 = 0
                let startTime = Date()
                var lastUpdate = Date()
                var lastBytes: Int64 = 0
                
                let delegate = SingleThreadDelegate(
                    fileHandle: fileHandle,
                    onProgress: { bytes, total in
                        totalDownloaded = bytes
                        totalExpected = total
                        let now = Date()
                        let elapsed = now.timeIntervalSince(lastUpdate)
                        if elapsed >= 0.5 {
                            let bps = Double(bytes - lastBytes) / elapsed
                            let speed = self.formatSpeed(bps)
                            let p = total > 0 ? Double(bytes) / Double(total) : 0
                            progress(p, speed, 1)
                            lastUpdate = now
                            lastBytes = bytes
                        }
                    },
                    onComplete: { success in
                        try? fileHandle.close()
                        if success {
                            completion(.success(destination))
                        } else {
                            try? FileManager.default.removeItem(at: destination)
                            completion(.failure(IDMError.downloadFailed("Single-thread failed")))
                        }
                    }
                )
                
                let config = URLSessionConfiguration.default
                config.timeoutIntervalForRequest = 120
                config.timeoutIntervalForResource = 7200
                let session = URLSession(configuration: config, delegate: delegate, delegateQueue: nil)
                session.dataTask(with: req).resume()
            }
            
            private func formatSpeed(_ bps: Double) -> String {
                if bps < 1024 { return "\(Int(bps)) B/s" }
                if bps < 1048576 { return String(format: "%.1f KB/s", bps/1024) }
                return String(format: "%.2f MB/s", bps/1048576)
            }
        }

        // Segment download delegate
        class SegmentDelegate: NSObject, URLSessionDataDelegate {
            let segmentIndex: Int
            let onData: (Data, Int) -> Void
            let onComplete: (Bool) -> Void
            var hasReceivedData = false
            
            init(segmentIndex: Int, onData: @escaping (Data, Int) -> Void, onComplete: @escaping (Bool) -> Void) {
                self.segmentIndex = segmentIndex
                self.onData = onData
                self.onComplete = onComplete
            }
            
            func urlSession(_ session: URLSession, dataTask: URLSessionDataTask, didReceive response: URLResponse, completionHandler: @escaping (URLSession.ResponseDisposition) -> Void) {
                if let http = response as? HTTPURLResponse, http.statusCode >= 400 {
                    completionHandler(.cancel)
                    return
                }
                completionHandler(.allow)
            }
            
            func urlSession(_ session: URLSession, dataTask: URLSessionDataTask, didReceive data: Data) {
                hasReceivedData = true
                onData(data, segmentIndex)
            }
            
            func urlSession(_ session: URLSession, task: URLSessionTask, didCompleteWithError error: Error?) {
                onComplete(error == nil && hasReceivedData)
                session.invalidateAndCancel()
            }
        }

        // Single-thread download delegate
        class SingleThreadDelegate: NSObject, URLSessionDataDelegate {
            let fileHandle: FileHandle
            let onProgress: (Int64, Int64) -> Void
            let onComplete: (Bool) -> Void
            var totalReceived: Int64 = 0
            var totalExpected: Int64 = 0
            
            init(fileHandle: FileHandle, onProgress: @escaping (Int64, Int64) -> Void, onComplete: @escaping (Bool) -> Void) {
                self.fileHandle = fileHandle
                self.onProgress = onProgress
                self.onComplete = onComplete
            }
            
            func urlSession(_ session: URLSession, dataTask: URLSessionDataTask, didReceive response: URLResponse, completionHandler: @escaping (URLSession.ResponseDisposition) -> Void) {
                if let http = response as? HTTPURLResponse {
                    if http.statusCode >= 400 {
                        completionHandler(.cancel)
                        return
                    }
                    let mime = http.mimeType?.lowercased() ?? ""
                    if mime.contains("text/html") {
                        completionHandler(.cancel)
                        return
                    }
                }
                totalExpected = response.expectedContentLength
                completionHandler(.allow)
            }
            
            func urlSession(_ session: URLSession, dataTask: URLSessionDataTask, didReceive data: Data) {
                try? fileHandle.write(contentsOf: data)
                totalReceived += Int64(data.count)
                onProgress(totalReceived, totalExpected)
            }
            
            func urlSession(_ session: URLSession, task: URLSessionTask, didCompleteWithError error: Error?) {
                onComplete(error == nil && totalReceived > 10000)
                session.invalidateAndCancel()
            }
        }
