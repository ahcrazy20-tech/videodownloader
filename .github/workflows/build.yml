name: Build VideoFlow IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 120

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Select Xcode 15
      run: sudo xcode-select -s /Applications/Xcode_15.2.app

    - name: Create Full Project Structure
      run: |
        # ============================================================
        # CREATE ALL DIRECTORIES
        # ============================================================
        mkdir -p VideoFlow/App
        mkdir -p VideoFlow/Views
        mkdir -p VideoFlow/Models
        mkdir -p VideoFlow/Services
        mkdir -p VideoFlow/Resources/Assets.xcassets/AppIcon.appiconset
        mkdir -p VideoFlow/Resources/Assets.xcassets/AccentColor.colorset
        mkdir -p VideoFlow.xcodeproj

        # ============================================================
        # FILE 1: VideoFlowApp.swift
        # ============================================================
        cat > VideoFlow/App/VideoFlowApp.swift << 'SWIFTEOF'
        import SwiftUI

        @main
        struct VideoFlowApp: App {
            @UIApplicationDelegateAdaptor(AppDelegate.self) var appDelegate
            @StateObject private var downloadManager = DownloadManager.shared
            @StateObject private var playerManager = PlayerManager.shared

            var body: some Scene {
                WindowGroup {
                    ContentView()
                        .environmentObject(downloadManager)
                        .environmentObject(playerManager)
                        .preferredColorScheme(.dark)
                }
            }
        }
        SWIFTEOF

        # ============================================================
        # FILE 2: AppDelegate.swift
        # ============================================================
        cat > VideoFlow/App/AppDelegate.swift << 'SWIFTEOF'
        import UIKit
        import AVFoundation
        import UserNotifications

        class AppDelegate: NSObject, UIApplicationDelegate {
            func application(
                _ application: UIApplication,
                didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?
            ) -> Bool {
                setupAudioSession()
                requestNotificationPermission()
                return true
            }

            private func setupAudioSession() {
                do {
                    try AVAudioSession.sharedInstance().setCategory(
                        .playback,
                        mode: .moviePlayback,
                        options: [.allowAirPlay, .allowBluetooth]
                    )
                    try AVAudioSession.sharedInstance().setActive(true)
                } catch {
                    print("Audio session error: \(error)")
                }
            }

            private func requestNotificationPermission() {
                UNUserNotificationCenter.current().requestAuthorization(
                    options: [.alert, .sound, .badge]
                ) { _, _ in }
            }

            func application(
                _ application: UIApplication,
                handleEventsForBackgroundURLSession identifier: String,
                completionHandler: @escaping () -> Void
            ) {
                DownloadManager.shared.backgroundCompletionHandler = completionHandler
            }
        }
        SWIFTEOF

        # ============================================================
        # FILE 3: VideoItem.swift
        # ============================================================
        cat > VideoFlow/Models/VideoItem.swift << 'SWIFTEOF'
        import SwiftUI

        enum VideoQuality: String, CaseIterable, Hashable {
            case p2160 = "4K"
            case p1080 = "1080p"
            case p720  = "720p"
            case p480  = "480p"
            case p360  = "360p"
            case p240  = "240p"
            case audio = "Audio"

            var displayName: String {
                switch self {
                case .p2160: return "4K Ultra HD"
                case .p1080: return "Full HD 1080p"
                case .p720:  return "HD 720p"
                case .p480:  return "SD 480p"
                case .p360:  return "Low 360p"
                case .p240:  return "Min 240p"
                case .audio: return "Audio Only"
                }
            }

            var description: String {
                switch self {
                case .p2160: return "2160p • Best Quality • Large File"
                case .p1080: return "1080p • High Quality"
                case .p720:  return "720p • Good Quality"
                case .p480:  return "480p • Medium Quality"
                case .p360:  return "360p • Small File"
                case .p240:  return "240p • Smallest File"
                case .audio: return "MP3 • Audio Only"
                }
            }

            var color: Color {
                switch self {
                case .p2160: return .purple
                case .p1080: return .red
                case .p720:  return .orange
                case .p480:  return .green
                case .p360:  return .blue
                case .p240:  return .gray
                case .audio: return .pink
                }
            }
        }

        enum VideoSourceType: String {
            case direct  = "Direct MP4"
            case hls     = "HLS Stream"
            case dash    = "DASH Stream"
        }

        struct VideoItem: Identifiable, Equatable, Hashable {
            let id: String
            var title: String
            let url: String
            var thumbnailURL: String?
            var duration: String?
            var estimatedSize: String?
            var availableQualities: [VideoQuality]
            var sourceType: VideoSourceType

            func hash(into hasher: inout Hasher) { hasher.combine(id) }
            static func == (lhs: VideoItem, rhs: VideoItem) -> Bool { lhs.id == rhs.id }
        }
        SWIFTEOF

        # ============================================================
        # FILE 4: DownloadTask.swift
        # ============================================================
        cat > VideoFlow/Models/DownloadTask.swift << 'SWIFTEOF'
        import Foundation

        enum DownloadStatus: Equatable {
            case waiting
            case downloading(progress: Double)
            case paused
            case completed
            case failed(error: String)

            var displayText: String {
                switch self {
                case .waiting:              return "Waiting..."
                case .downloading(let p):  return "\(Int(p * 100))%"
                case .paused:              return "Paused"
                case .completed:           return "Completed"
                case .failed(let e):       return "Failed: \(e)"
                }
            }
        }

        class DownloadTask: ObservableObject, Identifiable {
            let id: String
            let video: VideoItem
            let quality: VideoQuality

            @Published var status: DownloadStatus = .waiting
            @Published var progress: Double = 0
            @Published var downloadedBytes: Int64 = 0
            @Published var totalBytes: Int64 = 0
            @Published var speed: String = ""
            @Published var savedURL: URL?

            var urlSessionTask: URLSessionDownloadTask?
            private var lastBytes: Int64 = 0
            private var lastTime: Date?

            init(id: String = UUID().uuidString, video: VideoItem, quality: VideoQuality) {
                self.id = id
                self.video = video
                self.quality = quality
            }

            func updateProgress(bytesWritten: Int64, totalBytes: Int64) {
                let now = Date()
                self.downloadedBytes = bytesWritten
                self.totalBytes = totalBytes
                if totalBytes > 0 { self.progress = Double(bytesWritten) / Double(totalBytes) }
                if let lastTime = lastTime {
                    let elapsed = now.timeIntervalSince(lastTime)
                    if elapsed > 0.5 {
                        let bps = Double(bytesWritten - lastBytes) / elapsed
                        self.speed = formatSpeed(bps)
                        self.lastBytes = bytesWritten
                        self.lastTime = now
                    }
                } else { self.lastTime = now }
                self.status = .downloading(progress: self.progress)
            }

            private func formatSpeed(_ bps: Double) -> String {
                if bps < 1024 { return "\(Int(bps)) B/s" }
                if bps < 1024*1024 { return String(format: "%.1f KB/s", bps/1024) }
                return String(format: "%.1f MB/s", bps/(1024*1024))
            }

            var sizeText: String {
                if totalBytes > 0 { return "\(formatBytes(downloadedBytes)) / \(formatBytes(totalBytes))" }
                return formatBytes(downloadedBytes)
            }

            private func formatBytes(_ bytes: Int64) -> String {
                let f = ByteCountFormatter()
                f.allowedUnits = [.useMB, .useGB]
                f.countStyle = .file
                return f.string(fromByteCount: bytes)
            }
        }
        SWIFTEOF

        # ============================================================
        # FILE 5: DownloadManager.swift
        # ============================================================
        cat > VideoFlow/Services/DownloadManager.swift << 'SWIFTEOF'
        import Foundation
        import UserNotifications

        class DownloadManager: NSObject, ObservableObject {
            static let shared = DownloadManager()

            @Published var activeDownloads: [DownloadTask] = []
            @Published var completedVideos: [DownloadTask] = []

            var backgroundCompletionHandler: (() -> Void)?
            private var urlSession: URLSession!
            private var taskMap: [URLSessionTask: DownloadTask] = [:]

            override init() {
                super.init()
                let config = URLSessionConfiguration.background(withIdentifier: "com.videoflow.download")
                config.isDiscretionary = false
                config.sessionSendsLaunchEvents = true
                config.allowsCellularAccess = true
                urlSession = URLSession(configuration: config, delegate: self, delegateQueue: nil)
                loadSavedVideos()
            }

            func startDownload(video: VideoItem, quality: VideoQuality) {
                guard let url = URL(string: video.url) else { return }
                let task = DownloadTask(video: video, quality: quality)
                DispatchQueue.main.async { self.activeDownloads.append(task) }
                var request = URLRequest(url: url)
                request.setValue(
                    "Mozilla/5.0 (iPhone; CPU iPhone OS 16_4 like Mac OS X) AppleWebKit/605.1.15",
                    forHTTPHeaderField: "User-Agent"
                )
                let dlTask = urlSession.downloadTask(with: request)
                task.urlSessionTask = dlTask
                taskMap[dlTask] = task
                dlTask.resume()
                task.status = .downloading(progress: 0)
            }

            func pauseDownload(_ task: DownloadTask) {
                task.urlSessionTask?.cancel(byProducingResumeData: { _ in
                    DispatchQueue.main.async { task.status = .paused }
                })
            }

            func resumeDownload(_ task: DownloadTask) {
                task.status = .downloading(progress: task.progress)
                task.urlSessionTask?.resume()
            }

            func cancelDownload(_ task: DownloadTask) {
                task.urlSessionTask?.cancel()
                DispatchQueue.main.async { self.activeDownloads.removeAll { $0.id == task.id } }
            }

            func deleteVideo(_ task: DownloadTask) {
                if let url = task.savedURL { try? FileManager.default.removeItem(at: url) }
                DispatchQueue.main.async { self.completedVideos.removeAll { $0.id == task.id } }
            }

            private func getDownloadsDirectory() -> URL {
                let paths = FileManager.default.urls(for: .documentDirectory, in: .userDomainMask)
                let dir = paths[0].appendingPathComponent("VideoFlow", isDirectory: true)
                try? FileManager.default.createDirectory(at: dir, withIntermediateDirectories: true)
                return dir
            }

            private func loadSavedVideos() {
                let dir = getDownloadsDirectory()
                guard let files = try? FileManager.default.contentsOfDirectory(
                    at: dir, includingPropertiesForKeys: [.fileSizeKey]
                ) else { return }
                let ext = ["mp4","m4v","mov","mkv","avi"]
                let videoFiles = files.filter { ext.contains($0.pathExtension.lowercased()) }
                DispatchQueue.main.async {
                    self.completedVideos = videoFiles.map { url in
                        let video = VideoItem(
                            id: url.lastPathComponent,
                            title: url.deletingPathExtension().lastPathComponent,
                            url: url.absoluteString,
                            thumbnailURL: nil, duration: nil, estimatedSize: nil,
                            availableQualities: [.p720], sourceType: .direct
                        )
                        let task = DownloadTask(video: video, quality: .p720)
                        task.savedURL = url
                        task.status = .completed
                        return task
                    }
                }
            }
        }

        extension DownloadManager: URLSessionDownloadDelegate {
            func urlSession(_ session: URLSession, downloadTask: URLSessionDownloadTask,
                            didFinishDownloadingTo location: URL) {
                guard let task = taskMap[downloadTask] else { return }
                let rawName = "\(task.video.title.prefix(40))_\(task.quality.rawValue).mp4"
                let fileName = rawName
                    .replacingOccurrences(of: "/", with: "_")
                    .replacingOccurrences(of: ":", with: "_")
                    .replacingOccurrences(of: " ", with: "_")
                let destURL = getDownloadsDirectory().appendingPathComponent(fileName)
                do {
                    if FileManager.default.fileExists(atPath: destURL.path) {
                        try FileManager.default.removeItem(at: destURL)
                    }
                    try FileManager.default.moveItem(at: location, to: destURL)
                    DispatchQueue.main.async {
                        task.savedURL = destURL
                        task.status = .completed
                        task.progress = 1.0
                        self.activeDownloads.removeAll { $0.id == task.id }
                        self.completedVideos.insert(task, at: 0)
                        self.taskMap.removeValue(forKey: downloadTask)
                        self.sendNotification(for: task)
                    }
                } catch {
                    DispatchQueue.main.async {
                        task.status = .failed(error: error.localizedDescription)
                        self.taskMap.removeValue(forKey: downloadTask)
                    }
                }
            }

            func urlSession(_ session: URLSession, downloadTask: URLSessionDownloadTask,
                            didWriteData bytesWritten: Int64, totalBytesWritten: Int64,
                            totalBytesExpectedToWrite: Int64) {
                guard let task = taskMap[downloadTask] else { return }
                DispatchQueue.main.async {
                    task.updateProgress(bytesWritten: totalBytesWritten, totalBytes: totalBytesExpectedToWrite)
                }
            }

            func urlSession(_ session: URLSession, task: URLSessionTask, didCompleteWithError error: Error?) {
                guard let dlTask = task as? URLSessionDownloadTask,
                      let t = taskMap[dlTask], let error = error else { return }
                if (error as NSError).code != NSURLErrorCancelled {
                    DispatchQueue.main.async { t.status = .failed(error: error.localizedDescription) }
                }
            }

            func urlSessionDidFinishEvents(forBackgroundURLSession session: URLSession) {
                DispatchQueue.main.async {
                    self.backgroundCompletionHandler?()
                    self.backgroundCompletionHandler = nil
                }
            }

            private func sendNotification(for task: DownloadTask) {
                let content = UNMutableNotificationContent()
                content.title = "✅ Download Complete"
                content.body = "\(task.video.title) - \(task.quality.rawValue)"
                content.sound = .default
                let req = UNNotificationRequest(identifier: task.id, content: content, trigger: nil)
                UNUserNotificationCenter.current().add(req, withCompletionHandler: nil)
            }
        }
        SWIFTEOF

        # ============================================================
        # FILE 6: PlayerManager.swift
        # ============================================================
        cat > VideoFlow/Services/PlayerManager.swift << 'SWIFTEOF'
        import Foundation
        import AVFoundation
        import Combine

        class PlayerManager: ObservableObject {
            static let shared = PlayerManager()

            @Published var currentVideo: DownloadTask?
            @Published var isPlaying = false
            @Published var isFullScreen = false
            @Published var isMinimized = false
            @Published var currentTime: Double = 0
            @Published var duration: Double = 0
            @Published var volume: Float = 1.0
            @Published var playbackSpeed: Float = 1.0
            @Published var isMuted = false
            @Published var isLoading = false

            var player: AVPlayer?
            private var timeObserver: Any?
            private var cancellables = Set<AnyCancellable>()

            func playVideo(_ task: DownloadTask) {
                currentVideo = task
                let url: URL?
                if let saved = task.savedURL { url = saved }
                else { url = URL(string: task.video.url) }
                guard let videoURL = url else { return }

                isLoading = true
                player?.pause()
                player = AVPlayer(url: videoURL)
                player?.volume = volume

                player?.currentItem?.publisher(for: \.duration)
                    .receive(on: DispatchQueue.main)
                    .sink { [weak self] dur in
                        let secs = dur.seconds
                        self?.duration = secs.isNaN || secs.isInfinite ? 0 : secs
                        self?.isLoading = false
                    }.store(in: &cancellables)

                let interval = CMTime(seconds: 0.5, preferredTimescale: 600)
                timeObserver = player?.addPeriodicTimeObserver(forInterval: interval, queue: .main) {
                    [weak self] time in
                    self?.currentTime = time.seconds
                }

                player?.play()
                isPlaying = true
                isFullScreen = true
                isMinimized = false
            }

            func togglePlayPause() {
                isPlaying ? player?.pause() : player?.play()
                isPlaying.toggle()
            }

            func seek(to time: Double) {
                let t = CMTime(seconds: time, preferredTimescale: 600)
                player?.seek(to: t, toleranceBefore: .zero, toleranceAfter: .zero)
            }

            func skipForward(_ s: Double = 10) { seek(to: min(currentTime + s, duration)) }
            func skipBackward(_ s: Double = 10) { seek(to: max(currentTime - s, 0)) }

            func setSpeed(_ speed: Float) {
                playbackSpeed = speed
                if isPlaying { player?.rate = speed }
            }

            func setVolume(_ vol: Float) { volume = vol; player?.volume = vol }

            func minimize() { isFullScreen = false; isMinimized = true }

            func close() {
                if let obs = timeObserver { player?.removeTimeObserver(obs); timeObserver = nil }
                player?.pause(); player = nil
                isPlaying = false; isFullScreen = false; isMinimized = false
                currentVideo = nil; currentTime = 0; duration = 0
            }

            var progress: Double { duration > 0 ? currentTime / duration : 0 }

            func formattedTime(_ t: Double) -> String {
                guard !t.isNaN && !t.isInfinite else { return "0:00" }
                let s = Int(t); let h = s/3600; let m = (s%3600)/60; let sec = s%60
                return h > 0 ? String(format: "%d:%02d:%02d", h,m,sec) : String(format: "%d:%02d", m,sec)
            }
        }
        SWIFTEOF

        # ============================================================
        # FILE 7: ContentView.swift
        # ============================================================
        cat > VideoFlow/Views/ContentView.swift << 'SWIFTEOF'
        import SwiftUI

        struct ContentView: View {
            @State private var selectedTab = 0
            @EnvironmentObject var downloadManager: DownloadManager
            @EnvironmentObject var playerManager: PlayerManager

            var body: some View {
                ZStack {
                    TabView(selection: $selectedTab) {
                        BrowserView()
                            .tabItem { Label("Browser", systemImage: "globe") }
                            .tag(0)

                        DownloadsView()
                            .tabItem { Label("Downloads", systemImage: "arrow.down.circle.fill") }
                            .tag(1)
                            .badge(downloadManager.activeDownloads.count)

                        LibraryView()
                            .tabItem { Label("Library", systemImage: "play.rectangle.fill") }
                            .tag(2)
                            .badge(downloadManager.completedVideos.count)
                    }
                    .accentColor(.blue)

                    if playerManager.isMinimized && playerManager.currentVideo != nil {
                        VStack {
                            Spacer()
                            MiniPlayerView().padding(.bottom, 55)
                        }
                    }
                }
                .sheet(isPresented: $playerManager.isFullScreen) {
                    if let video = playerManager.currentVideo {
                        PlayerView(video: video).environmentObject(playerManager)
                    }
                }
            }
        }
        SWIFTEOF

        # ============================================================
        # FILE 8: BrowserView.swift
        # ============================================================
        cat > VideoFlow/Views/BrowserView.swift << 'SWIFTEOF'
        import SwiftUI
        import WebKit

        // MARK: - BrowserViewModel
        class BrowserViewModel: ObservableObject {
            @Published var urlText = ""
            @Published var isLoading = false
            @Published var loadingProgress: Double = 0
            @Published var canGoBack = false
            @Published var canGoForward = false
            @Published var isSecure = true
            @Published var detectedVideos: [VideoItem] = []
            var networkVideos: Set<String> = []
            weak var webView: WKWebView?

            init() { navigate(to: "https://www.google.com") }

            func navigate(to raw: String) {
                var s = raw.trimmingCharacters(in: .whitespaces)
                if !s.hasPrefix("http://") && !s.hasPrefix("https://") {
                    if s.contains(".") && !s.contains(" ") { s = "https://" + s }
                    else {
                        let encoded = s.addingPercentEncoding(withAllowedCharacters: .urlQueryAllowed) ?? s
                        s = "https://www.google.com/search?q=" + encoded
                    }
                }
                guard let url = URL(string: s) else { return }
                webView?.load(URLRequest(url: url))
                urlText = s
            }

            func goBack()       { webView?.goBack() }
            func goForward()    { webView?.goForward() }
            func reload()       { webView?.reload() }
            func stopLoading()  { webView?.stopLoading() }

            func detectVideos() {
                webView?.evaluateJavaScript("window.scanForVideos ? window.scanForVideos() : 0", completionHandler: nil)
            }

            func addNetworkVideo(_ url: String) {
                guard !networkVideos.contains(url) else { return }
                networkVideos.insert(url)
                let video = VideoItem(
                    id: UUID().uuidString, title: "Video (\(URL(string: url)?.host ?? "unknown"))",
                    url: url, thumbnailURL: nil, duration: nil, estimatedSize: nil,
                    availableQualities: url.contains(".m3u8") ? [.p1080,.p720,.p480,.p360] : [.p720,.p480,.p360],
                    sourceType: url.contains(".m3u8") ? .hls : .direct
                )
                DispatchQueue.main.async {
                    if !self.detectedVideos.contains(where: { $0.url == url }) {
                        self.detectedVideos.append(video)
                    }
                }
            }

            func processVideoSources(_ sources: [[String: Any]]) {
                for source in sources {
                    guard let url = source["src"] as? String, !url.isEmpty else { continue }
                    let title = source["title"] as? String ?? "Video"
                    let duration = source["duration"] as? Double
                    let height = source["height"] as? Int ?? 0
                    let qualities = qualitiesFromHeight(height)
                    if !detectedVideos.contains(where: { $0.url == url }) {
                        let video = VideoItem(
                            id: UUID().uuidString, title: title, url: url,
                            thumbnailURL: nil,
                            duration: duration != nil ? formatDur(duration!) : nil,
                            estimatedSize: nil, availableQualities: qualities,
                            sourceType: url.contains(".m3u8") ? .hls : .direct
                        )
                        DispatchQueue.main.async { self.detectedVideos.append(video) }
                    }
                }
            }

            private func qualitiesFromHeight(_ h: Int) -> [VideoQuality] {
                if h >= 2160 { return [.p2160,.p1080,.p720,.p480] }
                if h >= 1080 { return [.p1080,.p720,.p480] }
                if h >= 720  { return [.p720,.p480,.p360] }
                if h >= 480  { return [.p480,.p360] }
                return [.p360,.p240]
            }

            private func formatDur(_ s: Double) -> String {
                guard !s.isNaN && !s.isInfinite else { return "?" }
                let t = Int(s); let h = t/3600; let m = (t%3600)/60; let sec = t%60
                return h > 0 ? String(format:"%d:%02d:%02d",h,m,sec) : String(format:"%d:%02d",m,sec)
            }

            func shareCurrentPage() {
                guard let url = webView?.url else { return }
                let vc = UIActivityViewController(activityItems: [url], applicationActivities: nil)
                if let scene = UIApplication.shared.connectedScenes.first as? UIWindowScene,
                   let root = scene.windows.first?.rootViewController {
                    root.present(vc, animated: true)
                }
            }
        }

        // MARK: - WebViewRepresentable
        struct WebViewRepresentable: UIViewRepresentable {
            @ObservedObject var vm: BrowserViewModel

            func makeUIView(context: Context) -> WKWebView {
                let cfg = WKWebViewConfiguration()
                cfg.allowsInlineMediaPlayback = true
                cfg.mediaTypesRequiringUserActionForPlayback = []
                let js = WKUserScript(source: detectionJS, injectionTime: .atDocumentEnd, forMainFrameOnly: false)
                cfg.userContentController.addUserScript(js)
                cfg.userContentController.add(context.coordinator, name: "videoDetected")
                cfg.userContentController.add(context.coordinator, name: "videoSources")
                let wv = WKWebView(frame: .zero, configuration: cfg)
                wv.navigationDelegate = context.coordinator
                wv.uiDelegate = context.coordinator
                wv.allowsBackForwardNavigationGestures = true
                wv.customUserAgent = "Mozilla/5.0 (iPhone; CPU iPhone OS 16_4 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/16.4 Mobile/15E148 Safari/604.1"
                vm.webView = wv
                return wv
            }

            func updateUIView(_ wv: WKWebView, context: Context) {}

            func makeCoordinator() -> Coordinator { Coordinator(vm: vm) }

            var detectionJS: String { """
        (function(){
          var detected=new Set();
          function scan(){
            var vs=document.querySelectorAll('video');
            var arr=[];
            vs.forEach(function(v,i){
              var src=v.src||v.currentSrc||'';
              var srcs=[];
              v.querySelectorAll('source').forEach(function(s){if(s.src)srcs.push({src:s.src,type:s.type||''});});
              if(src||srcs.length>0){
                arr.push({id:'v'+i,src:src,title:document.title||'Video '+(i+1),
                  duration:v.duration||0,width:v.videoWidth||0,height:v.videoHeight||0,sources:srcs});
              }
            });
            if(arr.length>0) window.webkit.messageHandlers.videoSources.postMessage(arr);
            return arr.length;
          }
          var oFetch=window.fetch;
          window.fetch=function(){
            var url=arguments[0];
            if(typeof url==='string'&&(url.includes('.m3u8')||url.includes('.mp4')||url.includes('manifest'))&&!detected.has(url)){
              detected.add(url);
              window.webkit.messageHandlers.videoDetected.postMessage({url:url,type:'fetch'});
            }
            return oFetch.apply(this,arguments);
          };
          var OXHR=window.XMLHttpRequest;
          window.XMLHttpRequest=function(){
            var x=new OXHR();
            var oOpen=x.open;
            x.open=function(m,url){
              if(url&&(url.includes('.m3u8')||url.includes('.mp4'))&&!detected.has(url)){
                detected.add(url);
                window.webkit.messageHandlers.videoDetected.postMessage({url:url,type:'xhr'});
              }
              return oOpen.apply(this,arguments);
            };
            return x;
          };
          window.scanForVideos=scan;
          var obs=new MutationObserver(function(){scan();});
          if(document.body) obs.observe(document.body,{childList:true,subtree:true});
          setTimeout(scan,2000);
          setTimeout(scan,5000);
        })();
        """ }

            class Coordinator: NSObject, WKNavigationDelegate, WKUIDelegate, WKScriptMessageHandler {
                let vm: BrowserViewModel
                init(vm: BrowserViewModel) { self.vm = vm }

                func userContentController(_ ucc: WKUserContentController, didReceive msg: WKScriptMessage) {
                    if msg.name == "videoDetected",
                       let body = msg.body as? [String:Any],
                       let url = body["url"] as? String { vm.addNetworkVideo(url) }
                    if msg.name == "videoSources",
                       let sources = msg.body as? [[String:Any]] { vm.processVideoSources(sources) }
                }

                func webView(_ wv: WKWebView, didStartProvisionalNavigation _: WKNavigation!) {
                    vm.isLoading = true; vm.detectedVideos = []
                }

                func webView(_ wv: WKWebView, didFinish _: WKNavigation!) {
                    vm.isLoading = false
                    vm.canGoBack = wv.canGoBack; vm.canGoForward = wv.canGoForward
                    vm.urlText = wv.url?.absoluteString ?? ""
                    vm.isSecure = wv.url?.scheme == "https"
                    DispatchQueue.main.asyncAfter(deadline: .now()+1.5) {
                        wv.evaluateJavaScript("window.scanForVideos?window.scanForVideos():0", completionHandler: nil)
                    }
                }

                func webView(_ wv: WKWebView, didFail _: WKNavigation!, withError _: Error) { vm.isLoading = false }

                func webView(_ wv: WKWebView, createWebViewWith _: WKWebViewConfiguration,
                             for action: WKNavigationAction, windowFeatures: WKWindowFeatures) -> WKWebView? {
                    if action.targetFrame == nil { wv.load(action.request) }
                    return nil
                }

                func webView(_ wv: WKWebView, decidePolicyFor action: WKNavigationAction,
                             decisionHandler: @escaping (WKNavigationActionPolicy) -> Void) {
                    decisionHandler(.allow)
                }
            }
        }

