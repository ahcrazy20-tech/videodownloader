name: Build VideoDownloader with Multi-Engine Translation

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      # 0) checkout and setup xcode
      - name: 🧰 Checkout
        uses: actions/checkout@v4

      - name: 🧰 Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # 1. Create directories
      - name: 📁 Create directories
        run: |
          mkdir -p VideoDownloader/App
          mkdir -p VideoDownloader/Views
          mkdir -p VideoDownloader/Managers
          mkdir -p VideoDownloader/Utils
          mkdir -p VideoDownloader/Models

