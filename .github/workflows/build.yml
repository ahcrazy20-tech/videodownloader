        import SwiftUI
        import AVKit
        import AVFoundation

        struct PlayerView: View {
            let video: DownloadTask
            @EnvironmentObject var pm: PlayerManager
            @State private var showCtrl = true
            @State private var timer: Timer?
            @State private var showSpd = false
            @State private var brightness = UIScreen.main.brightness

            var body: some View {
                ZStack {
                    Color.black.ignoresSafeArea()
                    if let p = pm.player { VPLayer(player: p).ignoresSafeArea().onTapGesture { toggle() } }
                    if pm.isLoading { ProgressView().tint(.white).scaleEffect(2) }
                    HStack(spacing: 0) {
                        Color.clear.contentShape(Rectangle()).onTapGesture(count: 2) { pm.skipBackward(10) }
                        Color.clear.contentShape(Rectangle()).onTapGesture { toggle() }
                        Color.clear.contentShape(Rectangle()).onTapGesture(count: 2) { pm.skipForward(10) }
                    }
                    if showCtrl { ctrlOverlay }
                }
                .onAppear { pm.playVideo(video); startT() }
                .gesture(DragGesture().onChanged { v in
                    let d = v.translation.height / 500
                    if v.startLocation.x < UIScreen.main.bounds.width / 2 {
                        brightness = max(0, min(1, brightness - d)); UIScreen.main.brightness = brightness
                    } else {
                        pm.setVolume(max(0, min(1, pm.volume - Float(d))))
                    }
                })
                .sheet(isPresented: $showSpd) { SpdPicker().environmentObject(pm).presentationDetents([.height(300)]) }
            }

            var ctrlOverlay: some View {
                VStack {
                    HStack {
                        Button { pm.close() } label: { Image(systemName: "xmark").font(.system(size: 16, weight: .bold)).foregroundColor(.white).padding(10).background(Color.black.opacity(0.5)).clipShape(Circle()) }
                        Spacer()
                        Text(pm.currentVideo?.video.title ?? "").foregroundColor(.white).font(.system(size: 13, weight: .medium)).lineLimit(1).frame(maxWidth: 200)
                        Spacer()
                        HStack(spacing: 8) {
                            Button { showSpd = true } label: { Text(String(format: "%.1fx", pm.playbackSpeed)).foregroundColor(.white).font(.system(size: 12, weight: .bold)).padding(.horizontal, 7).padding(.vertical, 3).background(Color.black.opacity(0.5)).cornerRadius(5) }
                            Button { pm.minimize() } label: { Image(systemName: "pip.enter").font(.system(size: 16)).foregroundColor(.white).padding(10).background(Color.black.opacity(0.5)).clipShape(Circle()) }
                        }
                    }.padding(.horizontal, 18).padding(.top, 18)
                    Spacer()
                    HStack(spacing: 30) {
                        Button { pm.skipBackward(30) } label: { Image(systemName: "gobackward.30").font(.system(size: 26)).foregroundColor(.white) }
                        Button { pm.skipBackward(10) } label: { Image(systemName: "gobackward.10").font(.system(size: 32)).foregroundColor(.white) }
                        Button { pm.togglePlayPause() } label: { Image(systemName: pm.isPlaying ? "pause.circle.fill" : "play.circle.fill").font(.system(size: 60)).foregroundColor(.white) }
                        Button { pm.skipForward(10) } label: { Image(systemName: "goforward.10").font(.system(size: 32)).foregroundColor(.white) }
                        Button { pm.skipForward(30) } label: { Image(systemName: "goforward.30").font(.system(size: 26)).foregroundColor(.white) }
                    }
                    Spacer()
                    VStack(spacing: 8) {
                        Slider(value: Binding(get: { pm.currentTime }, set: { pm.seek(to: $0) }), in: 0...max(pm.duration, 1)).accentColor(.white)
                        HStack {
                            Text(pm.fmt(pm.currentTime)).font(.caption).foregroundColor(.white.opacity(0.8))
                            Spacer()
                            Text(pm.fmt(pm.duration)).font(.caption).foregroundColor(.white.opacity(0.8))
                        }
                        HStack(spacing: 8) {
                            Button { pm.isMuted.toggle(); pm.player?.isMuted = pm.isMuted } label: { Image(systemName: pm.isMuted ? "speaker.slash.fill" : "speaker.fill").foregroundColor(.white) }
                            Slider(value: Binding(get: { Double(pm.volume) }, set: { pm.setVolume(Float($0)) }), in: 0...1).accentColor(.white)
                            Image(systemName: "speaker.wave.3.fill").foregroundColor(.white)
                        }
                    }.padding(.horizontal, 18).padding(.bottom, 28)
                }
                .background(LinearGradient(colors: [.black.opacity(0.7), .clear, .clear, .black.opacity(0.7)], startPoint: .top, endPoint: .bottom))
                .transition(.opacity)
                .animation(.easeInOut(duration: 0.2), value: showCtrl)
            }

            func toggle() { withAnimation { showCtrl.toggle() }; if showCtrl { startT() } else { timer?.invalidate() } }
            func startT() { timer?.invalidate(); timer = Timer.scheduledTimer(withTimeInterval: 4, repeats: false) { _ in withAnimation { showCtrl = false } } }
        }

        struct VPLayer: UIViewRepresentable {
