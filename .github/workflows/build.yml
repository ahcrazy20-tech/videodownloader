name: Build VideoDownloader with Multi-Engine Translation

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      # 0) سحب الكود + تثبيت Xcode
      - name: 🧰 Checkout
        uses: actions/checkout@v4

      - name: 🧰 Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # 1. إنشاء المجلدات
      - name: 📁 Create directories
        run: |
          mkdir -p VideoDownloader/App
          mkdir -p VideoDownloader/Views
          mkdir -p VideoDownloader/Managers
          mkdir -p VideoDownloader/Utils
          mkdir -p VideoDownloader/Models

      # 2. كتابة جميع ملفات Swift
      - name: 📝 Write all Swift files
        run: |
          # ========== App/VideoDownloaderApp.swift ==========
          cat > VideoDownloader/App/VideoDownloaderApp.swift << 'EOF'
          import SwiftUI
          import AVFoundation

          @main
          struct VideoDownloaderApp: App {
              init() {
                  try? AVAudioSession.sharedInstance().setCategory(.playback, mode: .moviePlayback)
                  try? AVAudioSession.sharedInstance().setActive(true)
              }
              var body: some Scene {
                  WindowGroup { ContentView() }
              }
          }
          EOF

          # ========== Views/ContentView.swift (تبويبات سفلية زي تطبيق الموسيقى) ==========
          cat > VideoDownloader/Views/ContentView.swift << 'EOF'
          import SwiftUI
          import WebKit

          enum TabID: Hashable { case browser, library, settings }

          struct ContentView: View {
              @StateObject private var downloadManager = DownloadManager()
              @StateObject private var translationManager = SmartTranslationManager()
              @StateObject private var webViewModel = WebViewModel()
              @State private var urlString = "https://m.youtube.com"
              @State private var selected: TabID = .browser

              var body: some View {
                  VStack(spacing: 0) {
                      Group {
                          switch selected {
                          case .browser:
                              BrowserView(viewModel: webViewModel, urlString: $urlString, downloadManager: downloadManager)
                          case .library:
                              DownloadsListView(downloadManager: downloadManager)
                          case .settings:
                              TranslationSettingsView(translationManager: translationManager)
                          }
                      }
                      .frame(maxWidth: .infinity, maxHeight: .infinity)

                      Divider()

                      // شريط التبويبات السفلي (نفس فكرة MainTabView في تطبيق الموسيقى)
                      HStack(spacing: 0) {
                          mainTabButton("المتصفح", "safari.fill", .browser)
                          mainTabButton("المكتبة", "square.stack.fill", .library)
                          mainTabButton("الترجمة", "translate", .settings)
                      }
                      .padding(.top, 6)
                      .padding(.bottom, 4)
                      .background(.bar)
                  }
                  .onReceive(NotificationCenter.default.publisher(for: .videoURLFound)) { notification in
                      if let url = notification.object as? String {
                          downloadManager.startDownload(url: url)
                      }
                  }
              }

              private func mainTabButton(_ label: String, _ icon: String, _ id: TabID) -> some View {
                  Button {
                      selected = id
                      UIImpactFeedbackGenerator(style: .light).impactOccurred()
                  } label: {
                      VStack(spacing: 3) {
                          Image(systemName: icon).font(.system(size: 20))
                          Text(label).font(.caption2)
                      }
                      .foregroundColor(selected == id ? .blue : .secondary)
                      .frame(maxWidth: .infinity)
                  }
                  .buttonStyle(.plain)
              }
          }

          extension Notification.Name {
              static let loadURL = Notification.Name("loadURL")
              static let extractVideos = Notification.Name("extractVideos")
              static let videoURLFound = Notification.Name("videoURLFound")
          }
          EOF

          # ========== Views/DownloadsListView.swift (تبويب المكتبة + حالة + إلغاء + إعادة) ==========
          cat > VideoDownloader/Views/DownloadsListView.swift << 'EOF'
          import SwiftUI

          struct DownloadsListView: View {
              @ObservedObject var downloadManager: DownloadManager
              @State private var selectedVideo: DownloadItem?
              @State private var showPlayer = false
              @State private var showCorruptAlert = false
              @State private var showUnsupportedAlert = false

              var body: some View {
                  NavigationView {
                      List {
                          if downloadManager.downloads.isEmpty {
                              VStack(spacing: 12) {
                                  Image(systemName: "square.and.arrow.down")
                                      .font(.system(size: 48))
                                      .foregroundColor(.secondary)
                                  Text("مكتبتك فاضية")
                                      .font(.title2).bold()
                                  Text("حمّل فيديوهات من تبويب المتصفح أو الصق رابط بالزر ⬇")
                                      .font(.subheadline)
                                      .foregroundColor(.secondary)
                                      .multilineTextAlignment(.center)
                              }
                              .padding(.vertical, 60)
                              .frame(maxWidth: .infinity)
                          }

                          ForEach(Array(downloadManager.downloads.enumerated()), id: \.element.id) { index, item in
                              DownloadRow(
                                  item: item,
                                  onCancel: { downloadManager.cancelDownload(item) },
                                  onRetry: { downloadManager.retryDownload(item) }
                              )
                              .contentShape(Rectangle())
                              .onTapGesture {
                                  if !item.isDownloading, let url = item.localURL {
                                      let ext = url.pathExtension.lowercased()
                                      if ext == "webm" || ext == "mkv" {
                                          // مشغل iOS لا يدعم WebM/MKV — رسالة واضحة بدل نافذة سوداء
                                          showUnsupportedAlert = true
                                      } else if case .valid = MediaValidator.validateFile(at: url) {
                                          selectedVideo = item
                                          showPlayer = true
                                      } else {
                                          showCorruptAlert = true
                                      }
                                  }
                              }
                              .swipeActions {
                                  Button(role: .destructive) {
                                      downloadManager.deleteVideo(at: index)
                                  } label: {
                                      Label("حذف", systemImage: "trash")
                                  }
                              }
                          }
                      }
                      .navigationTitle("المكتبة (\(downloadManager.downloads.count))")
                      .sheet(isPresented: $showPlayer) {
                          if let video = selectedVideo, let localURL = video.localURL {
                              VideoPlayerView(videoURL: localURL, videoTitle: video.proposedName.isEmpty ? video.url.lastPathComponent : video.proposedName)
                          }
                      }
                      .alert("ملف تالف", isPresented: $showCorruptAlert) {
                          Button("حسناً", role: .cancel) {}
                      } message: {
                          Text("الملف ده مش وسائط صالحة — احذفه من المكتبة وأعد تحميله.")
                      }
                      .alert("صيغة غير مدعومة", isPresented: $showUnsupportedAlert) {
                          Button("حسناً", role: .cancel) {}
                      } message: {
                          Text("الملف بصيغة WebM/MKV ومشغل iOS لا يدعمها. دوس إعادة المحاولة على التحميل — السباق هيجرب سيرفرات بترجع MP4 أو M4A اللي بتشتغل في المشغل.")
                      }
                  }
                  .navigationViewStyle(StackNavigationViewStyle())
              }
          }

          /// صف التحميل: حالة + تقدم + إلغاء + إعادة محاولة + badge السيرفر الكسبان
          struct DownloadRow: View {
              @ObservedObject var item: DownloadItem
              let onCancel: () -> Void
              let onRetry: () -> Void

              private var displayName: String {
                  if !item.proposedName.isEmpty { return item.proposedName }
                  return item.url.lastPathComponent
              }

              private var icon: (name: String, color: Color) {
                  if item.isDownloading { return ("arrow.down.circle", .blue) }
                  if item.localURL != nil { return ("checkmark.circle", .green) }
                  if item.failedMessage != nil { return ("exclamationmark.circle", .red) }
                  return ("clock", .secondary)
              }

              var body: some View {
                  VStack(alignment: .leading, spacing: 6) {
                      HStack(spacing: 8) {
                          Image(systemName: icon.name)
                              .foregroundColor(icon.color)
                          Text(displayName)
                              .lineLimit(1)
                          Spacer()
                          if !item.backendLabel.isEmpty {
                              Text(item.backendLabel)
                                  .font(.system(size: 9, weight: .black))
                                  .padding(.horizontal, 5)
                                  .padding(.vertical, 2)
                                  .background(Color.blue.opacity(0.15))
                                  .foregroundColor(.blue)
                                  .cornerRadius(4)
                          }
                      }

                      if item.isDownloading {
                          HStack(spacing: 8) {
                              ProgressView(value: item.progress)
                              Text(String(format: "%.0f%%", item.progress * 100))
                                  .font(.caption2)
                                  .foregroundColor(.secondary)
                              Button(action: onCancel) {
                                  Image(systemName: "xmark.circle.fill")
                                      .foregroundColor(.red)
                              }
                              .buttonStyle(.plain)
                          }
                      } else if item.failedMessage != nil {
                          HStack(spacing: 8) {
                              Text(item.statusText)
                                  .font(.caption2)
                                  .foregroundColor(.red)
                                  .lineLimit(1)
                              Spacer()
                              Button("إعادة المحاولة", action: onRetry)
                                  .font(.caption2)
                                  .padding(.horizontal, 8)
                                  .padding(.vertical, 3)
                                  .background(Color.blue)
                                  .foregroundColor(.white)
                                  .cornerRadius(5)
                          }
                      } else {
                          Text(item.statusText)
                              .font(.caption2)
                              .foregroundColor(.secondary)
                              .lineLimit(1)
                      }
                  }
                  .padding(.vertical, 2)
              }
          }
          EOF

          # ========== Views/VideoPlayerView.swift (مشغل ذكي: تخطي ±10 + حفظ تلقائي + أوقات) ==========
          cat > VideoDownloader/Views/VideoPlayerView.swift << 'EOF'
          import SwiftUI
          import AVKit
          import AVFoundation

          struct VideoPlayerView: View {
              let videoURL: URL
              let videoTitle: String

              @State private var player: AVPlayer?
              @State private var isPlaying = false
              @State private var currentSpeed: Float = 1.0
              @State private var savedProgress: TimeInterval = 0.0
              @State private var currentTimeDisplay: TimeInterval = 0
              @State private var durationDisplay: TimeInterval = 0
              @StateObject private var syncManager = SubtitleSyncManager()
              @StateObject private var translator = VideoTranslator()
              @State private var showSyncControls = false
              @State private var showTranslation = false
              @State private var showPlayError = false

              // حفظ تلقائي لموضع التشغيل كل 5 ثواني (مش بس عند الخروج)
              private let saveTimer = Timer.publish(every: 5, on: .main, in: .common).autoconnect()
              private var progressKey: String { "progress_\(videoURL.lastPathComponent)" }

              var body: some View {
                  VStack {
                      // عنوان + عدّاد الوقت
                      HStack {
                          Text(videoTitle).font(.headline).lineLimit(1)
                          Spacer()
                          Text("\(formatTime(currentTimeDisplay)) / \(formatTime(durationDisplay))")
                              .font(.caption2)
                              .foregroundColor(.secondary)
                      }
                      .padding(.horizontal)
                      .padding(.top, 8)

                      // المشغل
                      if let player = player {
                          VideoPlayerController(player: player, isPlaying: $isPlaying)
                              .frame(height: UIScreen.main.bounds.height * 0.40)
                              .onAppear {
                                  player.play()
                                  isPlaying = true
                              }
                              .onDisappear {
                                  let currentTime = player.currentTime().seconds
                                  UserDefaults.standard.set(currentTime, forKey: progressKey)
                                  player.pause()
                                  isPlaying = false
                              }
                      } else {
                          ProgressView("جاري التحميل...")
                              .frame(height: UIScreen.main.bounds.height * 0.40)
                      }

                      // الترجمة الناتجة
                      if !translator.translatedText.isEmpty {
                          Text(translator.translatedText)
                              .font(.body)
                              .padding()
                              .background(Color(.systemGray6))
                              .cornerRadius(8)
                              .padding(.horizontal)
                      }

                      if translator.isTranslating {
                          ProgressView("جاري الترجمة...")
                              .padding()
                      }

                      // شريط التحكم الذكي
                      HStack(spacing: 12) {
                          Button { skipBy(-10) } label: {
                              Image(systemName: "gobackward.10").font(.title2)
                          }

                          Button {
                              isPlaying ? player?.pause() : player?.play()
                              isPlaying.toggle()
                          } label: {
                              Image(systemName: isPlaying ? "pause.circle.fill" : "play.circle.fill")
                                  .font(.largeTitle).foregroundColor(.blue)
                          }

                          Button { skipBy(10) } label: {
                              Image(systemName: "goforward.10").font(.title2)
                          }

                          Divider().frame(height: 30)

                          ForEach([0.5, 1.0, 1.5, 2.0], id: \.self) { speed in
                              Button {
                                  currentSpeed = Float(speed)
                                  player?.rate = currentSpeed
                              } label: {
                                  Text("\(speed == 1.0 ? "1x" : "\(speed)x")")
                                      .font(.subheadline)
                                      .fontWeight(currentSpeed == Float(speed) ? .bold : .regular)
                                      .padding(.horizontal, 6)
                                      .padding(.vertical, 4)
                                      .background(currentSpeed == Float(speed) ? Color.blue : Color.gray.opacity(0.3))
                                      .foregroundColor(currentSpeed == Float(speed) ? .white : .primary)
                                      .cornerRadius(6)
                              }
                          }

                          Spacer()

                          Button { showTranslation.toggle() } label: {
                              Image(systemName: "text.bubble").font(.title2)
                          }
                          .sheet(isPresented: $showTranslation) {
                              TranslationView(translator: translator, videoURL: videoURL)
                          }

                          Button { showSyncControls.toggle() } label: {
                              Image(systemName: "text.alignleft").font(.title2)
                          }
                          .sheet(isPresented: $showSyncControls) {
                              NavigationView {
                                  syncManager.showSyncControls()
                                      .navigationTitle("ضبط التوقيت")
                                      .navigationBarTitleDisplayMode(.inline)
                                      .toolbar { Button("تم") { showSyncControls = false } }
                              }
                          }

                          Button {
                              guard let player = player else { return }
                              let fullScreenController = AVPlayerViewController()
                              fullScreenController.player = player
                              fullScreenController.showsPlaybackControls = true
                              if let windowScene = UIApplication.shared.connectedScenes.first as? UIWindowScene,
                                 let rootVC = windowScene.windows.first?.rootViewController {
                                  rootVC.present(fullScreenController, animated: true)
                              }
                          } label: {
                              Image(systemName: "arrow.up.left.and.arrow.down.right").font(.title2)
                          }
                      }
                      .padding()
                      .background(.thinMaterial)

                      Spacer()
                  }
                  .onReceive(saveTimer) { _ in
                      if let player = player {
                          let t = player.currentTime().seconds
                          currentTimeDisplay = t
                          if t > 1 { UserDefaults.standard.set(t, forKey: progressKey) }
                      }
                  }
                  .alert("مشكلة في التشغيل", isPresented: $showPlayError) {
                      Button("حسناً", role: .cancel) {}
                  } message: {
                      Text("الملف قد يكون تالفاً أو الصيغة غير مدعومة — احذفه من المكتبة وأعد تحميله.")
                  }
                  .onAppear {
                      let asset = AVAsset(url: videoURL)
                      let playerItem = AVPlayerItem(asset: asset)
                      let newPlayer = AVPlayer(playerItem: playerItem)
                      player = newPlayer

                      // كشف فشل التشغيل (ملف تالف أو صيغة غير مدعومة) بعد 3 ثواني
                      Task { @MainActor in
                          try? await Task.sleep(nanoseconds: 3_000_000_000)
                          if newPlayer.currentItem?.status == .failed {
                              showPlayError = true
                          }
                      }

                      // استئناف ذكي: ارجع لآخر موضع توقف بعد ما المدة تتحمل
                      savedProgress = UserDefaults.standard.double(forKey: progressKey)
                      if savedProgress > 1.0 {
                          let resumeTime = savedProgress
                          Task { @MainActor in
                              guard let duration = try? await asset.load(.duration),
                                    duration.seconds.isFinite, duration.seconds > 0 else { return }
                              durationDisplay = duration.seconds
                              let target = CMTime(seconds: min(resumeTime, max(duration.seconds - 1, 0)), preferredTimescale: 600)
                              await newPlayer.seek(to: target)
                          }
                      }
                  }
              }

              /// تخطي ذكي ±10 ثواني
              private func skipBy(_ seconds: Double) {
                  guard let player = player else { return }
                  let target = max(0, player.currentTime().seconds + seconds)
                  currentTimeDisplay = target
                  Task { @MainActor in
                      await player.seek(to: CMTime(seconds: target, preferredTimescale: 600))
                  }
              }

              private func formatTime(_ t: TimeInterval) -> String {
                  guard t.isFinite, t > 0 else { return "0:00" }
                  let m = Int(t) / 60, s = Int(t) % 60
                  return String(format: "%d:%02d", m, s)
              }
          }

          struct VideoPlayerController: UIViewControllerRepresentable {
              let player: AVPlayer
              @Binding var isPlaying: Bool

              func makeUIViewController(context: Context) -> AVPlayerViewController {
                  let controller = AVPlayerViewController()
                  controller.player = player
                  controller.showsPlaybackControls = true
                  controller.videoGravity = .resizeAspect
                  controller.allowsPictureInPicturePlayback = true
                  return controller
              }

              func updateUIViewController(_ uiViewController: AVPlayerViewController, context: Context) {}
          }
          EOF

          # ========== Views/TranslationView.swift ==========
          cat > VideoDownloader/Views/TranslationView.swift << 'EOF'
          import SwiftUI

          struct TranslationView: View {
              @ObservedObject var translator: VideoTranslator
              let videoURL: URL
              @Environment(\.dismiss) var dismiss
              @State private var selectedEngine: String = "DeepLX"

              var body: some View {
                  NavigationView {
                      VStack(spacing: 20) {
                          // اختيار محرك الترجمة
                          VStack(alignment: .leading) {
                              Text("محرك الترجمة")
                                  .font(.headline)
                              Picker("محرك الترجمة", selection: $selectedEngine) {
                                  ForEach(translator.availableEngines, id: \.self) { engine in
                                      Text(engine).tag(engine)
                                  }
                              }
                              .pickerStyle(.segmented)
                              .onChange(of: selectedEngine) { newEngine in
                                  translator.switchToEngine(named: newEngine)
                              }
                          }
                          .padding(.horizontal)

                          // زر بدء الترجمة
                          Button {
                              translator.translateVideo(videoURL: videoURL)
                          } label: {
                              if translator.isTranslating {
                                  ProgressView()
                                      .progressViewStyle(CircularProgressViewStyle())
                                      .padding()
                              } else {
                                  Label("ترجمة الفيديو", systemImage: "play.circle")
                                      .font(.title3)
                                      .padding()
                                      .frame(maxWidth: .infinity)
                                      .background(Color.blue)
                                      .foregroundColor(.white)
                                      .cornerRadius(10)
                              }
                          }
                          .disabled(translator.isTranslating)
                          .padding(.horizontal)

                          // عرض نتيجة الترجمة
                          if !translator.translatedText.isEmpty {
                              ScrollView {
                                  Text(translator.translatedText)
                                      .padding()
                                      .frame(maxWidth: .infinity, alignment: .leading)
                                      .background(Color(.systemGray6))
                                      .cornerRadius(8)
                              }
                              .frame(maxHeight: 200)
                              .padding(.horizontal)

                              // زر نسخ
                              Button {
                                  UIPasteboard.general.string = translator.translatedText
                              } label: {
                                  Label("نسخ النص", systemImage: "doc.on.doc")
                              }
                          }

                          Spacer()
                      }
                      .padding(.top)
                      .navigationTitle("ترجمة الفيديو")
                      .navigationBarTitleDisplayMode(.inline)
                      .toolbar {
                          Button("إغلاق") { dismiss() }
                      }
                  }
              }
          }
          EOF

          # ========== Views/WebView.swift (Web Hub: تبويبات + زر تحميل عائم + التقاط وسائط) ==========
          cat > VideoDownloader/Views/WebView.swift << 'EOF'
          import SwiftUI
          import WebKit

          struct BrowserTab: Identifiable {
              let id = UUID()
              var webView: WKWebView
              var urlString: String
              var title: String
          }

          /// نموذج المتصفح — نفس فكرة WebViewModel في تطبيق الموسيقى:
          /// تبويبات متعددة + التقاط استجابات الوسائط + زر تحميل عائم + مخطط vdown-dl://
          class WebViewModel: NSObject, ObservableObject, WKNavigationDelegate, WKUIDelegate {
              @Published var tabs: [BrowserTab] = []
              @Published var currentTabIndex: Int = 0 { didSet { refreshNavState() } }
              @Published var showTabs = false
              @Published var canGoBack = false
              @Published var canGoForward = false
              @Published var isLoading = false
              @Published var progress: Double = 0
              @Published var showNamePrompt = false
              @Published var customSongName = ""
              var pendingDownloadURL: URL?
              var pendingIsDirect = false
              private var observations: [NSKeyValueObservation] = []

              override init() {
                  super.init()
                  addNewTab()
              }

              var currentWebView: WKWebView { tabs[currentTabIndex].webView }

              private func makeWebView() -> WKWebView {
                  let config = WKWebViewConfiguration()
                  config.allowsInlineMediaPlayback = true
                  config.mediaTypesRequiringUserActionForPlayback = []
                  let cc = WKUserContentController()
                  cc.addUserScript(AdBlocker.injectScript())
                  config.userContentController = cc

                  let wv = WKWebView(frame: .zero, configuration: config)
                  wv.navigationDelegate = self
                  wv.uiDelegate = self
                  wv.allowsBackForwardNavigationGestures = true

                  observations = [
                      wv.observe(\.estimatedProgress, options: [.new]) { [weak self] v, _ in
                          let p = v.estimatedProgress
                          DispatchQueue.main.async { self?.progress = p }
                      },
                      wv.observe(\.isLoading, options: [.new]) { [weak self] v, _ in
                          let l = v.isLoading
                          DispatchQueue.main.async { self?.isLoading = l }
                      }
                  ]
                  return wv
              }

              func addNewTab() {
                  let wv = makeWebView()
                  tabs.append(BrowserTab(webView: wv, urlString: "https://m.youtube.com", title: "تبويب جديد"))
                  currentTabIndex = tabs.count - 1
                  loadUrl("https://m.youtube.com")
              }

              func closeTab(at index: Int) {
                  tabs[index].webView.stopLoading()
                  tabs.remove(at: index)
                  if tabs.isEmpty {
                      addNewTab()
                  } else if currentTabIndex >= tabs.count {
                      currentTabIndex = tabs.count - 1
                  } else {
                      refreshNavState()
                  }
              }

              func goBack() { currentWebView.goBack() }
              func goForward() { currentWebView.goForward() }
              func refresh() { currentWebView.reload() }
              func stop() { currentWebView.stopLoading() }

              /// عنوان ذكي: بحث جوجل أو https:// تلقائياً
              func loadUrl(_ raw: String) {
                  var s = raw.trimmingCharacters(in: .whitespacesAndNewlines)
                  if s.isEmpty { return }
                  if !s.contains(".") || s.contains(" ") {
                      if let enc = s.addingPercentEncoding(withAllowedCharacters: .urlQueryAllowed) {
                          s = "https://www.google.com/search?q=" + enc
                      }
                  } else if !s.hasPrefix("http") {
                      s = "https://" + s
                  }
                  if let u = URL(string: s) {
                      currentWebView.load(URLRequest(url: u))
                  }
              }

              /// حقن زر تحميل عائم في الصفحة (نفس فكرة تطبيق الموسيقى)
              func injectFloatingDL() {
                  let js = """
                  (function(){
                      if (document.getElementById('__vd_dl_btn__')) { document.getElementById('__vd_dl_btn__').style.display='block'; return; }
                      var b = document.createElement('a');
                      b.id = '__vd_dl_btn__';
                      b.innerText = '⬇ تحميل';
                      b.style.cssText = 'position:fixed;right:14px;bottom:90px;z-index:999999;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;padding:10px 16px;border-radius:24px;font:bold 14px sans-serif;box-shadow:0 4px 16px rgba(0,0,0,0.5);text-decoration:none;';
                      b.onclick = function(e){
                          e.preventDefault();
                          var src = null;
                          document.querySelectorAll('video,audio').forEach(function(el){
                              if(!src && el.currentSrc) src = el.currentSrc;
                              if(!src && el.src) src = el.src;
                          });
                          var pick = src || location.href;
                          var enc = btoa(unescape(encodeURIComponent(pick)));
                          location.href = 'vdown-dl://?u=' + encodeURIComponent(enc);
                      };
                      document.body.appendChild(b);
                  })();
                  """
                  currentWebView.evaluateJavaScript(js, completionHandler: nil)
              }

              /// استخراج الفيديو الرئيسي (مش الإعلان):
              /// نظام نقاط — الأكبر مساحةً + الأطول مدةً + الشغال فعلاً، مع تجاهل دومينات الإعلانات
              func grabMedia() {
                  let js = """
                  (function(){
                      var adHosts = ['doubleclick','googleads','googlesyndication','adsystem','scorecardresearch','adnxs','outbrain','taboola','facebook.com/tr','ads.','sponsor'];
                      function isAd(u){
                          try {
                              var h = new URL(u).hostname;
                              for (var i=0;i<adHosts.length;i++){ if (h.indexOf(adHosts[i]) !== -1) return true; }
                          } catch(e){}
                          return false;
                      }
                      var vids = document.querySelectorAll('video');
                      var best = null, bestScore = -1;
                      for (var i=0;i<vids.length;i++){
                          var v = vids[i];
                          var src = v.currentSrc || v.src;
                          if (!src || src.indexOf('http') !== 0) continue;
                          if (isAd(src)) continue;
                          var area = (v.offsetWidth||320) * (v.offsetHeight||180);
                          var dur = (isFinite(v.duration) && v.duration > 0) ? v.duration : 0;
                          var score = area + dur * 5000;
                          if (v.paused === false) score += 1000000;
                          if (score > bestScore) { bestScore = score; best = src; }
                      }
                      if (!best) {
                          var m = document.querySelectorAll('audio,source');
                          for (var j=0;j<m.length;j++){
                              var s2 = m[j].src || m[j].currentSrc;
                              if (s2 && s2.indexOf('http') === 0 && !isAd(s2)) { best = s2; break; }
                          }
                      }
                      return best;
                  })();
                  """
                  currentWebView.evaluateJavaScript(js) { [weak self] result, _ in
                      guard let self = self else { return }
                      if let s = result as? String, let u = URL(string: s) {
                          DispatchQueue.main.async { self.promptDownload(url: u, suggested: u.lastPathComponent, isDirect: true) }
                      } else if let page = self.currentWebView.url {
                          DispatchQueue.main.async { self.promptDownload(url: page, suggested: page.lastPathComponent, isDirect: false) }
                      }
                  }
              }

              func promptDownload(url: URL, suggested: String, isDirect: Bool = false) {
                  pendingDownloadURL = url
                  pendingIsDirect = isDirect
                  customSongName = suggested.isEmpty ? "video" : suggested
                  showNamePrompt = true
              }

              /// تأكيد التحميل: ملف مباشر → تحميل فوري، صفحة منصة → تحميل ذكي عبر السيرفرات
              func confirmDownload(downloadManager: DownloadManager) {
                  guard let u = pendingDownloadURL else { return }
                  // ملف مباشر (ستريم/وسائط ملتقطة) → تحميل فوري؛ صفحة منصة → استخراج ذكي
                  if pendingIsDirect || VideoResolver.isDirectMediaURL(u.absoluteString) {
                      downloadManager.startDownload(url: u.absoluteString, suggestedName: customSongName)
                  } else {
                      downloadManager.startSmartDownload(pageURL: u.absoluteString)
                  }
                  pendingDownloadURL = nil
                  pendingIsDirect = false
              }

              func cancelPendingDownload() {
                  pendingDownloadURL = nil
                  pendingIsDirect = false
              }

              private func refreshNavState() {
                  guard tabs.indices.contains(currentTabIndex) else { return }
                  let wv = tabs[currentTabIndex].webView
                  canGoBack = wv.canGoBack
                  canGoForward = wv.canGoForward
                  tabs[currentTabIndex].urlString = wv.url?.absoluteString ?? tabs[currentTabIndex].urlString
              }

              // MARK: - WKUIDelegate (نوافذ جديدة تفتح في نفس التبويب)

              func webView(_ webView: WKWebView, createWebViewWith configuration: WKWebViewConfiguration, for navigationAction: WKNavigationAction, windowFeatures: WKWindowFeatures) -> WKWebView? {
                  if navigationAction.targetFrame == nil {
                      webView.load(navigationAction.request)
                  }
                  return nil
              }

              // MARK: - WKNavigationDelegate

              func webView(_ webView: WKWebView, didFinish navigation: WKNavigation!) {
                  webView.evaluateJavaScript("document.querySelectorAll('.ad,.ads,.popup').forEach(e=>e.remove());", completionHandler: nil)
                  if webView === currentWebView { refreshNavState() }
              }

              func webView(_ webView: WKWebView, didCommit navigation: WKNavigation!) {
                  if webView === currentWebView { refreshNavState() }
              }

              func webView(_ webView: WKWebView, decidePolicyFor navigationAction: WKNavigationAction, decisionHandler: @escaping (WKNavigationActionPolicy) -> Void) {
                  // مخطط الزر العائم: فك الترميز وحوّله لتحميل
                  if let u = navigationAction.request.url, u.scheme == "vdown-dl" {
                      decisionHandler(.cancel)
                      handleMagicDLURL(u)
                      return
                  }
                  // لينك ملف وسائط مباشر مضغوط عليه → حمّله بدل فتحه
                  if navigationAction.navigationType == .linkActivated,
                     let url = navigationAction.request.url,
                     VideoResolver.isDirectMediaURL(url.absoluteString) {
                      decisionHandler(.cancel)
                      DispatchQueue.main.async { self.promptDownload(url: url, suggested: url.lastPathComponent, isDirect: true) }
                      return
                  }
                  decisionHandler(.allow)
              }

              /// الاستجابة نفسها ملف وسائط؟ (زي تطبيق الموسيقى بالظبط) → حمّلها
              func webView(_ webView: WKWebView, decidePolicyFor navigationResponse: WKNavigationResponse, decisionHandler: @escaping (WKNavigationResponsePolicy) -> Void) {
                  if !navigationResponse.canShowMIMEType {
                      decisionHandler(.cancel)
                      let suggested = (navigationResponse.response as? HTTPURLResponse)?.suggestedFilename ?? navigationResponse.response.url?.lastPathComponent
                      if let u = navigationResponse.response.url {
                          DispatchQueue.main.async { self.promptDownload(url: u, suggested: suggested ?? "video", isDirect: true) }
                      }
                      return
                  }
                  if let mime = navigationResponse.response.mimeType?.lowercased(),
                     mime.contains("video") || mime.contains("audio") {
                      decisionHandler(.cancel)
                      let suggested = (navigationResponse.response as? HTTPURLResponse)?.suggestedFilename ?? navigationResponse.response.url?.lastPathComponent
                      if let u = navigationResponse.response.url {
                          DispatchQueue.main.async { self.promptDownload(url: u, suggested: suggested ?? "video", isDirect: true) }
                      }
                      return
                  }
                  decisionHandler(.allow)
              }

              private func handleMagicDLURL(_ u: URL) {
                  guard let comps = URLComponents(url: u, resolvingAgainstBaseURL: false),
                        let ub64 = comps.queryItems?.first(where: { $0.name == "u" })?.value else { return }
                  let pad = ub64 + String(repeating: "=", count: (4 - ub64.count % 4) % 4)
                  guard let data = Data(base64Encoded: pad),
                        let decoded = String(data: data, encoding: .utf8),
                        let realURL = URL(string: decoded) else { return }
                  let direct = VideoResolver.isDirectMediaURL(decoded)
                  DispatchQueue.main.async {
                      self.promptDownload(url: realURL, suggested: realURL.lastPathComponent, isDirect: direct)
                  }
              }
          }

