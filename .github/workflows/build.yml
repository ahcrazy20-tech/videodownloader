                              self.isTranslating = false
                          }
                          return
                      }

                      self.performASR(audioURL: audioURL) { transcribedText in
                          guard let text = transcribedText, !text.isEmpty else {
                              DispatchQueue.main.async {
                                  self.translatedText = "❌ فشل التعرف على الصوت"
                                  self.isTranslating = false
                              }
                              return
                          }

                          self.performTranslation(text: text) { translation in
                              DispatchQueue.main.async {
                                  self.translatedText = translation ?? "❌ فشلت الترجمة"
                                  self.isTranslating = false
                              }
                          }
