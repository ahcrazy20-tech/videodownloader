                                    ActiveRow(task: t, onP: { dm.pauseDownload(t) }, onR: { dm.resumeDownload(t) }, onC: { dm.cancelDownload(t) }, onRetry: { dm.retryDownload(t) })
                                }.listStyle(.plain)
                            }
                        } else {
                            if dm.completedVideos.isEmpty { EmptyV(icon: "checkmark.circle", t: "No Videos", s: "Downloads appear here") }
                            else { List(dm.completedVideos) { t in DoneRow(task: t, onPlay: { pm.playVideo(t) }, onDel: { dm.deleteVideo(t) }) }.listStyle(.plain) }
                        }
                    }.navigationTitle("Downloads")
                }
            }
        }

        struct ActiveRow: View {
            @ObservedObject var task: DownloadTask
            let onP: () -> Void
            let onR: () -> Void
            let onC: () -> Void
            let onRetry: () -> Void

            var isFailed: Bool { if case .failed = task.status { return true }; return false }
            var isConverting: Bool { if case .converting = task.status { return true }; return false }

            var body: some View {
                VStack(alignment: .leading, spacing: 8) {
                    HStack {
                        VStack(alignment: .leading, spacing: 4) {
                            Text(task.video.title).font(.system(size: 14, weight: .medium)).lineLimit(2)
                            HStack(spacing: 6) {
                                Text(task.quality.rawValue).font(.caption).foregroundColor(.white)
                                    .padding(.horizontal, 6).padding(.vertical, 2).background(task.quality.color).cornerRadius(4)
                                if task.video.isHLS {
                                    Text("HLS").font(.caption).foregroundColor(.white)
                                        .padding(.horizontal, 6).padding(.vertical, 2).background(Color.purple).cornerRadius(4)
                                }
                                Text(task.status.displayText).font(.caption)
                                    .foregroundColor(isFailed ? .red : isConverting ? .purple : .secondary).lineLimit(2)
                                if !task.speed.isEmpty && !isFailed && !isConverting { Text(task.speed).font(.caption).foregroundColor(.blue) }
                            }
                            if !isFailed { Text(task.sizeText).font(.caption2).foregroundColor(.secondary) }
                        }
                        Spacer()
                        HStack(spacing: 8) {
                            if isFailed {
                                Button(action: onRetry) { Image(systemName: "arrow.clockwise.circle.fill").font(.system(size: 28)).foregroundColor(.blue) }
                            } else if case .paused = task.status {
                                Button(action: onR) { Image(systemName: "play.circle.fill").font(.system(size: 28)).foregroundColor(.green) }
                            } else if !isConverting {
                                Button(action: onP) { Image(systemName: "pause.circle.fill").font(.system(size: 28)).foregroundColor(.orange) }
                            }
                            Button(action: onC) { Image(systemName: "xmark.circle.fill").font(.system(size: 28)).foregroundColor(.red) }
                        }
                    }
                    if !isFailed {
                        GeometryReader { g in
                            ZStack(alignment: .leading) {
                                RoundedRectangle(cornerRadius: 3).fill(Color(.systemGray5)).frame(height: 5)
                                RoundedRectangle(cornerRadius: 3).fill(isConverting ? Color.purple : Color.blue)
                                    .frame(width: g.size.width * task.progress, height: 5)
                                    .animation(.linear(duration: 0.3), value: task.progress)
                            }
                        }.frame(height: 5)
                    }
                }.padding(.vertical, 6)
            }
        }

        struct DoneRow: View {
            let task: DownloadTask
            let onPlay: () -> Void
            let onDel: () -> Void
            var body: some View {
                HStack(spacing: 12) {
                    Button(action: onPlay) {
                        ZStack {
                            RoundedRectangle(cornerRadius: 8).fill(Color.blue.opacity(0.2)).frame(width: 75, height: 48)
                            Image(systemName: "play.circle.fill").foregroundColor(.blue).font(.system(size: 26))
                        }
                    }
                    VStack(alignment: .leading, spacing: 4) {
                        Text(task.video.title).font(.system(size: 14, weight: .medium)).lineLimit(2)
                        Text(task.quality.rawValue).font(.caption).foregroundColor(.white)
                            .padding(.horizontal, 6).padding(.vertical, 2).background(task.quality.color).cornerRadius(4)
                    }
                    Spacer()
                    VStack(spacing: 8) {
                        if let u = task.savedURL { ShareLink(item: u) { Image(systemName: "square.and.arrow.up").foregroundColor(.blue) } }
                        Button(action: onDel) { Image(systemName: "trash.fill").foregroundColor(.red) }
                    }
                }.padding(.vertical, 4)
            }
        }

        struct EmptyV: View {
            let icon: String
            let t: String
            let s: String
            var body: some View {
                VStack(spacing: 14) {
                    Image(systemName: icon).font(.system(size: 50)).foregroundColor(.gray.opacity(0.5))
                    Text(t).font(.title3).fontWeight(.semibold)
                    Text(s).font(.subheadline).foregroundColor(.secondary)
                }.frame(maxWidth: .infinity, maxHeight: .infinity)
            }
        }
        SWIFTEOF

        # PlayerView.swift
        cat > VideoFlow/Views/PlayerView.swift << 'SWIFTEOF'
        import SwiftUI
        import AVKit
        import AVFoundation

        struct PlayerView: View {
            let video: DownloadTask
            @EnvironmentObject var pm: PlayerManager
            @State private var showCtrl = true
            @State private var timer: Timer?
            @State private var showSpd = false
            @State private var brightness = UIScreen.main.brightness

            var body: some View {
                ZStack {
                    Color.black.ignoresSafeArea()
                    if let p = pm.player { VPLayer(player: p).ignoresSafeArea().onTapGesture { toggle() } }
                    if pm.isLoading { ProgressView().tint(.white).scaleEffect(2) }
                    HStack(spacing: 0) {
                        Color.clear.contentShape(Rectangle()).onTapGesture(count: 2) { pm.skipBackward(10) }
                        Color.clear.contentShape(Rectangle()).onTapGesture { toggle() }
                        Color.clear.contentShape(Rectangle()).onTapGesture(count: 2) { pm.skipForward(10) }
                    }
                    if showCtrl { ctrlOverlay }
                }
                .onAppear { pm.playVideo(video); startT() }
                .gesture(DragGesture().onChanged { v in
                    let d = v.translation.height / 500
                    if v.startLocation.x < UIScreen.main.bounds.width / 2 {
                        brightness = max(0, min(1, brightness - d)); UIScreen.main.brightness = brightness
                    } else {
                        pm.setVolume(max(0, min(1, pm.volume - Float(d))))
                    }
                })
                .sheet(isPresented: $showSpd) { SpdPicker().environmentObject(pm).presentationDetents([.height(300)]) }
            }

            var ctrlOverlay: some View {
                VStack {
                    HStack {
                        Button { pm.close() } label: { Image(systemName: "xmark").font(.system(size: 16, weight: .bold)).foregroundColor(.white).padding(10).background(Color.black.opacity(0.5)).clipShape(Circle()) }
                        Spacer()
                        Text(pm.currentVideo?.video.title ?? "").foregroundColor(.white).font(.system(size: 13, weight: .medium)).lineLimit(1).frame(maxWidth: 200)
                        Spacer()
                        HStack(spacing: 8) {
                            Button { showSpd = true } label: { Text(String(format: "%.1fx", pm.playbackSpeed)).foregroundColor(.white).font(.system(size: 12, weight: .bold)).padding(.horizontal, 7).padding(.vertical, 3).background(Color.black.opacity(0.5)).cornerRadius(5) }
                            Button { pm.minimize() } label: { Image(systemName: "pip.enter").font(.system(size: 16)).foregroundColor(.white).padding(10).background(Color.black.opacity(0.5)).clipShape(Circle()) }
                        }
                    }.padding(.horizontal, 18).padding(.top, 18)
                    Spacer()
                    HStack(spacing: 30) {
                        Button { pm.skipBackward(30) } label: { Image(systemName: "gobackward.30").font(.system(size: 26)).foregroundColor(.white) }
                        Button { pm.skipBackward(10) } label: { Image(systemName: "gobackward.10").font(.system(size: 32)).foregroundColor(.white) }
                        Button { pm.togglePlayPause() } label: { Image(systemName: pm.isPlaying ? "pause.circle.fill" : "play.circle.fill").font(.system(size: 60)).foregroundColor(.white) }
                        Button { pm.skipForward(10) } label: { Image(systemName: "goforward.10").font(.system(size: 32)).foregroundColor(.white) }
                        Button { pm.skipForward(30) } label: { Image(systemName: "goforward.30").font(.system(size: 26)).foregroundColor(.white) }
                    }
                    Spacer()
                    VStack(spacing: 8) {
                        Slider(value: Binding(get: { pm.currentTime }, set: { pm.seek(to: $0) }), in: 0...max(pm.duration, 1)).accentColor(.white)
                        HStack {
                            Text(pm.fmt(pm.currentTime)).font(.caption).foregroundColor(.white.opacity(0.8))
                            Spacer()
                            Text(pm.fmt(pm.duration)).font(.caption).foregroundColor(.white.opacity(0.8))
                        }
                        HStack(spacing: 8) {
                            Button { pm.isMuted.toggle(); pm.player?.isMuted = pm.isMuted } label: { Image(systemName: pm.isMuted ? "speaker.slash.fill" : "speaker.fill").foregroundColor(.white) }
                            Slider(value: Binding(get: { Double(pm.volume) }, set: { pm.setVolume(Float($0)) }), in: 0...1).accentColor(.white)
                            Image(systemName: "speaker.wave.3.fill").foregroundColor(.white)
                        }
                    }.padding(.horizontal, 18).padding(.bottom, 28)
                }.background(LinearGradient(colors: [.black.opacity(0.7), .clear, .clear, .black.opacity(0.7)], startPoint: .top, endPoint: .bottom))
                .transition(.opacity).animation(.easeInOut(duration: 0.2), value: showCtrl)
            }

            func toggle() { withAnimation { showCtrl.toggle() }; if showCtrl { startT() } else { timer?.invalidate() } }
            func startT() { timer?.invalidate(); timer = Timer.scheduledTimer(withTimeInterval: 4, repeats: false) { _ in withAnimation { showCtrl = false } } }
        }

        struct VPLayer: UIViewRepresentable {
            let player: AVPlayer
            func makeUIView(context: Context) -> VPView { VPView(player: player) }
            func updateUIView(_ v: VPView, context: Context) {}
            class VPView: UIView {
                override class var layerClass: AnyClass { AVPlayerLayer.self }
                var pl: AVPlayerLayer { layer as! AVPlayerLayer }
                init(player: AVPlayer) { super.init(frame: .zero); pl.player = player; pl.videoGravity = .resizeAspect }
                required init?(coder: NSCoder) { fatalError() }
            }
        }

        struct SpdPicker: View {
            @EnvironmentObject var pm: PlayerManager
            @Environment(\.dismiss) var dismiss
            let speeds: [Float] = [0.25, 0.5, 0.75, 1.0, 1.25, 1.5, 1.75, 2.0, 2.5, 3.0]
            var body: some View {
                NavigationView {
                    List(speeds, id: \.self) { s in
                        Button { pm.setSpeed(s); dismiss() } label: {
                            HStack { Text(String(format: "%.2fx", s)); Spacer(); if pm.playbackSpeed == s { Image(systemName: "checkmark").foregroundColor(.blue) } }
                        }
                    }.navigationTitle("Speed").navigationBarTitleDisplayMode(.inline)
                    .toolbar { ToolbarItem(placement: .navigationBarTrailing) { Button("Done") { dismiss() } } }
                }
            }
        }

        struct MiniPlayerView: View {
            @EnvironmentObject var pm: PlayerManager
            var body: some View {
                HStack(spacing: 10) {
                    ZStack {
                        RoundedRectangle(cornerRadius: 6).fill(Color.blue.opacity(0.3)).frame(width: 50, height: 34)
                        Image(systemName: "play.fill").foregroundColor(.blue).font(.system(size: 13))
                    }
                    VStack(alignment: .leading, spacing: 3) {
                        Text(pm.currentVideo?.video.title ?? "").font(.system(size: 12, weight: .medium)).foregroundColor(.white).lineLimit(1)
                        GeometryReader { g in
                            ZStack(alignment: .leading) {
                                Capsule().fill(Color.white.opacity(0.2)).frame(height: 2)
                                Capsule().fill(Color.blue).frame(width: g.size.width * pm.progress, height: 2)
                            }
                        }.frame(height: 2)
                    }
                    Spacer()
                    Button { pm.togglePlayPause() } label: { Image(systemName: pm.isPlaying ? "pause.fill" : "play.fill").foregroundColor(.white).font(.system(size: 16)) }
                    Button { pm.close() } label: { Image(systemName: "xmark").foregroundColor(.white).font(.system(size: 14)) }
                }
                .padding(.horizontal, 14).padding(.vertical, 8)
                .background(RoundedRectangle(cornerRadius: 14).fill(Color(.systemGray6).opacity(0.95)).shadow(color: .black.opacity(0.3), radius: 8))
                .padding(.horizontal, 10)
                .onTapGesture { pm.isFullScreen = true; pm.isMinimized = false }
            }
        }
        SWIFTEOF

        # LibraryView.swift
        cat > VideoFlow/Views/LibraryView.swift << 'SWIFTEOF'
        import SwiftUI

        struct LibraryView: View {
            @EnvironmentObject var dm: DownloadManager
            @EnvironmentObject var pm: PlayerManager
            @State private var search = ""
            var filtered: [DownloadTask] { search.isEmpty ? dm.completedVideos : dm.completedVideos.filter { $0.video.title.localizedCaseInsensitiveContains(search) } }
            var body: some View {
                NavigationView {
                    Group {
                        if filtered.isEmpty { EmptyV(icon: "play.rectangle.fill", t: "Library Empty", s: "Downloaded videos appear here") }
                        else {
                            ScrollView {
                                LazyVGrid(columns: [GridItem(.flexible()), GridItem(.flexible())], spacing: 12) {
                                    ForEach(filtered) { t in
                                        Button { pm.playVideo(t) } label: {
                                            VStack(alignment: .leading, spacing: 5) {
                                                ZStack {
                                                    RoundedRectangle(cornerRadius: 10).fill(Color.blue.opacity(0.2)).aspectRatio(16/9, contentMode: .fit)
                                                    Image(systemName: "play.circle.fill").font(.system(size: 36)).foregroundColor(.blue)
                                                }
                                                Text(t.video.title).font(.system(size: 12, weight: .medium)).foregroundColor(.primary).lineLimit(2).multilineTextAlignment(.leading)
                                                Text(t.quality.rawValue).font(.system(size: 10, weight: .bold)).foregroundColor(.white)
                                                    .padding(.horizontal, 5).padding(.vertical, 2).background(t.quality.color).cornerRadius(4)
                                            }
                                        }.buttonStyle(.plain)
                                    }
                                }.padding()
                            }
                        }
                    }
                    .searchable(text: $search, prompt: "Search").navigationTitle("Library")
                }
            }
        }
        SWIFTEOF

