        import Foundation
        import AVFoundation
        import Combine

        class PlayerManager: NSObject, ObservableObject {
            static let shared = PlayerManager()
            @Published var currentVideo: DownloadTask?
            @Published var isPlaying = false
            @Published var isFullScreen = false
            @Published var isMinimized = false
            @Published var currentTime: Double = 0
            @Published var duration: Double = 0
            @Published var volume: Float = 1.0
            @Published var playbackSpeed: Float = 1.0
            @Published var isMuted = false
            @Published var isLoading = false
            @Published var errorMessage: String?
            
            var player: AVPlayer?
            var playerItem: AVPlayerItem?
            private var timeObs: Any?
            private var itemObserver: NSKeyValueObservation?

            func playVideo(_ task: DownloadTask) {
                currentVideo = task
                errorMessage = nil
                
                let videoURL: URL
                if let saved = task.savedURL {
                    if !FileManager.default.fileExists(atPath: saved.path) {
                        errorMessage = "File not found"
                        return
                    }
                    videoURL = saved
                } else if let url = URL(string: task.video.url) {
                    videoURL = url
                } else {
                    errorMessage = "Invalid URL"
                    return
                }
                
                print("🎥 Playing: \(videoURL.path)")
                
                isLoading = true
                cleanupPlayer()
                
                let asset = AVURLAsset(url: videoURL)
                asset.loadValuesAsynchronously(forKeys: ["playable", "duration", "tracks"]) { [weak self] in
                    DispatchQueue.main.async {
                        guard let self = self else { return }
                        
                        var error: NSError?
                        let status = asset.statusOfValue(forKey: "playable", error: &error)
                        
                        if status == .failed || !asset.isPlayable {
                            self.isLoading = false
                            self.errorMessage = "Cannot play: \(error?.localizedDescription ?? "invalid format")"
                            return
                        }
                        
                        let item = AVPlayerItem(asset: asset)
                        self.playerItem = item
                        
                        self.itemObserver = item.observe(\.status, options: [.new, .initial]) { [weak self] item, _ in
                            DispatchQueue.main.async {
                                guard let self = self else { return }
                                switch item.status {
                                case .readyToPlay:
                                    self.isLoading = false
                                    let dur = item.duration.seconds
                                    self.duration = dur.isNaN || dur.isInfinite ? 0 : dur
                                    self.player?.play()
                                    self.isPlaying = true
                                case .failed:
                                    self.isLoading = false
                                    self.errorMessage = "Playback failed: \(item.error?.localizedDescription ?? "unknown")"
                                default: break
                                }
                            }
                        }
                        
                        self.player = AVPlayer(playerItem: item)
                        self.player?.volume = self.volume
                        
                        self.timeObs = self.player?.addPeriodicTimeObserver(
                            forInterval: CMTime(seconds: 0.5, preferredTimescale: 600),
                            queue: .main
                        ) { [weak self] t in
                            let s = t.seconds
                            if !s.isNaN && !s.isInfinite { self?.currentTime = s }
                        }
                        
                        self.isFullScreen = true
                        self.isMinimized = false
                    }
                }
            }

            func togglePlayPause() {
                if isPlaying { player?.pause() }
                else {
                    player?.play()
                    if playbackSpeed != 1.0 { player?.rate = playbackSpeed }
                }
                isPlaying.toggle()
            }
            
            func seek(to t: Double) {
                player?.seek(to: CMTime(seconds: t, preferredTimescale: 600), toleranceBefore: .zero, toleranceAfter: .zero)
            }
            
            func skipForward(_ s: Double = 10) { seek(to: min(currentTime + s, duration)) }
            func skipBackward(_ s: Double = 10) { seek(to: max(currentTime - s, 0)) }
            func setSpeed(_ s: Float) { playbackSpeed = s; if isPlaying { player?.rate = s } }
            func setVolume(_ v: Float) { volume = v; player?.volume = v }
            func minimize() { isFullScreen = false; isMinimized = true }
            
            func close() {
                cleanupPlayer()
                isPlaying = false; isFullScreen = false; isMinimized = false
                currentVideo = nil; currentTime = 0; duration = 0; errorMessage = nil
            }
            
            private func cleanupPlayer() {
                if let obs = timeObs { player?.removeTimeObserver(obs); timeObs = nil }
                itemObserver?.invalidate(); itemObserver = nil
                player?.pause(); player = nil; playerItem = nil
            }
            
            var progress: Double { duration > 0 ? currentTime / duration : 0 }
            
            func fmt(_ t: Double) -> String {
                guard !t.isNaN && !t.isInfinite && t >= 0 else { return "0:00" }
                let s = Int(t)
                return s >= 3600 ? String(format: "%d:%02d:%02d", s/3600, (s%3600)/60, s%60) : String(format: "%d:%02d", s/60, s%60)
            }
        }
