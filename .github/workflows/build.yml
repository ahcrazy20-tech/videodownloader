name: Build iOS IPA

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Select Xcode
      run: sudo xcode-select -s /Applications/Xcode_15.0.app
      
    - name: Install dependencies
      run: |
        brew install ldid
        brew install ffmpeg
        
    - name: Download yt-dlp
      run: |
        mkdir -p Resources
        curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o Resources/yt-dlp
        chmod +x Resources/yt-dlp
        
    - name: Download FFmpeg for iOS
      run: |
        # استخدام FFmpeg prebuilt لـ iOS
        curl -L https://github.com/kewlbear/FFmpeg-iOS/releases/latest/download/ffmpeg-ios.tar.gz -o ffmpeg.tar.gz
        tar -xzf ffmpeg.tar.gz -C Resources/
        
    - name: Build Project
      run: |
        xcodebuild -project MegaDownloader.xcodeproj \
          -scheme MegaDownloader \
          -sdk iphoneos \
          -configuration Release \
          -derivedDataPath build \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          PRODUCT_BUNDLE_IDENTIFIER="com.megadownloader.app"
          
    - name: Create IPA
      run: |
        mkdir -p Payload
        cp -r build/Build/Products/Release-iphoneos/MegaDownloader.app Payload/
        
        # نسخ yt-dlp و ffmpeg إلى التطبيق
        cp Resources/yt-dlp Payload/MegaDownloader.app/
        cp Resources/ffmpeg Payload/MegaDownloader.app/
        chmod +x Payload/MegaDownloader.app/yt-dlp
        chmod +x Payload/MegaDownloader.app/ffmpeg
        
        # توقيع مع entitlements لـ TrollStore
        ldid -STrollStore.entitlements Payload/MegaDownloader.app/MegaDownloader
        
        # إنشاء IPA
        zip -r MegaDownloader.ipa Payload
        
    - name: Upload IPA
      uses: actions/upload-artifact@v3
      with:
        name: MegaDownloader-iOS
        path: MegaDownloader.ipa
        
    - name: Create Release
      if: github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v1
      with:
        files: MegaDownloader.ipa
        tag_name: v${{ github.run_number }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
