          # 15. Utils/ChunkedDownloader.swift
          files["VideoDownloader/Utils/ChunkedDownloader.swift"] = """import Foundation

          class ChunkedDownloader {
              private let url: URL
              private let referer: String
              private let userAgent: String
              private let totalBytes: Int64
              private let chunkSize: Int
              private let maxConnections: Int
              private let tempFileURL: URL
              private let fileHandle: FileHandle
              private let syncQueue = DispatchQueue(label: "videodownloader.chunked")
              private let session: URLSession
              private let totalChunks: Int
              private let onProgress: (Double, String) -> Void
              private let onComplete: (Result<URL, Error>) -> Void

              private var nextChunkIndex = 0
              private var bytesWritten: Int64 = 0
              private var activeCount = 0
              private var failed = false
              private var didFinish = false
              private var isCancelled = false
              private var completedChunks = Set<Int>()
              private var retriesPerChunk: [Int: Int] = [:]

              private var lastSpeedCheck = Date()
              private var lastBytesCount: Int64 = 0

              init(url: URL, referer: String, userAgent: String, totalBytes: Int64,
                   chunkSize: Int = 1_500_000, connections: Int = 10,
                   onProgress: @escaping (Double, String) -> Void,
                   onComplete: @escaping (Result<URL, Error>) -> Void) throws {
                  self.url = url
                  self.referer = referer
                  self.userAgent = userAgent
                  self.totalBytes = totalBytes
                  self.chunkSize = chunkSize
                  self.maxConnections = connections
                  self.onProgress = onProgress
                  self.onComplete = onComplete

                  let tmpName = "vd_chunked_\\(UUID().uuidString).dat"
                  self.tempFileURL = FileManager.default.temporaryDirectory.appendingPathComponent(tmpName)
                  FileManager.default.createFile(atPath: tempFileURL.path, contents: nil)
                  let fh = try FileHandle(forWritingTo: tempFileURL)
                  try fh.truncate(atOffset: UInt64(totalBytes))
                  self.fileHandle = fh
                  self.totalChunks = Int((totalBytes + Int64(chunkSize) - 1) / Int64(chunkSize))

                  let cfg = URLSessionConfiguration.ephemeral
                  cfg.timeoutIntervalForRequest = 60
                  cfg.timeoutIntervalForResource = 1800
                  cfg.httpMaximumConnectionsPerHost = connections
                  cfg.httpShouldUsePipelining = true
                  cfg.requestCachePolicy = .reloadIgnoringLocalCacheData
                  cfg.urlCache = nil
                  self.session = URLSession(configuration: cfg)
              }

              func start() {
                  syncQueue.async { [weak self] in
                      guard let self = self else { return }
                      let n = min(self.maxConnections, self.totalChunks)
                      for _ in 0..<n { self.scheduleNext() }
                  }
              }

              func cancel() {
                  syncQueue.async { [weak self] in
                      guard let self = self else { return }
                      self.isCancelled = true
                      self.failed = true
                      self.session.invalidateAndCancel()
                      try? self.fileHandle.close()
                      try? FileManager.default.removeItem(at: self.tempFileURL)
                  }
              }

              private func scheduleNext() {
                  if failed || isCancelled { return }
                  let idx = nextChunkIndex
                  if idx >= totalChunks {
                      if activeCount == 0 { finalizeFile() }
                      return
                  }
                  nextChunkIndex += 1
                  activeCount += 1
                  fetchChunk(idx: idx)
              }

              private func fetchChunk(idx: Int) {
                  let start = Int64(idx) * Int64(chunkSize)
                  var end = start + Int64(chunkSize) - 1
                  if end >= totalBytes { end = totalBytes - 1 }
                  let expected = Int(end - start + 1)

                  var req = URLRequest(url: url, timeoutInterval: 60)
                  req.httpMethod = "GET"
                  req.setValue(userAgent, forHTTPHeaderField: "User-Agent")
                  if !referer.isEmpty { req.setValue(referer, forHTTPHeaderField: "Referer") }
                  req.setValue("bytes=\\(start)-\\(end)", forHTTPHeaderField: "Range")
                  req.setValue("*/*", forHTTPHeaderField: "Accept")
                  req.cachePolicy = .reloadIgnoringLocalCacheData

                  let task = session.dataTask(with: req) { [weak self] data, _, error in
                      guard let self = self else { return }
                      self.syncQueue.async {
                          self.handleChunkResult(idx: idx, start: start, expected: expected, data: data, error: error)
                      }
                  }
                  task.resume()
              }

              private func handleChunkResult(idx: Int, start: Int64, expected: Int, data: Data?, error: Error?) {
                  if isCancelled || failed { return }

                  if let error = error {
                      if (error as NSError).code == -999 { return }
                      if retryChunk(idx) { return }
                      fail(NSError(domain: "ChunkedDownloader", code: -3,
                                   userInfo: [NSLocalizedDescriptionKey: "فشل تحميل الجزء \\(idx + 1)"]))
                      return
                  }

                  guard let d = data, d.count == expected else {
                      if retryChunk(idx) { return }
                      fail(NSError(domain: "ChunkedDownloader", code: -4,
                                   userInfo: [NSLocalizedDescriptionKey: "حجم الجزء \\(idx + 1) غير مطابق"]))
                      return
                  }

                  do {
                      try fileHandle.seek(toOffset: UInt64(start))
                      try fileHandle.write(contentsOf: d)
                  } catch {
                      fail(NSError(domain: "ChunkedDownloader", code: -7,
                                   userInfo: [NSLocalizedDescriptionKey: "فشل الكتابة على القرص"]))
                      return
                  }

                  completedChunks.insert(idx)
                  bytesWritten += Int64(d.count)
                  let p = Double(bytesWritten) / Double(totalBytes)

                  let now = Date()
                  let elapsed = now.timeIntervalSince(lastSpeedCheck)
                  var speedStr = ""
                  if elapsed >= 0.8 {
                      let delta = bytesWritten - lastBytesCount
                      let bytesPerSec = Double(delta) / elapsed
                      if bytesPerSec > 1_000_000 {
                          speedStr = String(format: "%.1f MB/s", bytesPerSec / 1_000_000)
                      } else {
                          speedStr = String(format: "%.0f KB/s", bytesPerSec / 1_000)
                      }
                      lastSpeedCheck = now
                      lastBytesCount = bytesWritten
                  }

                  DispatchQueue.main.async { [weak self] in
                      self?.onProgress(min(0.999, p), speedStr)
                  }

                  activeCount -= 1
                  if nextChunkIndex < totalChunks {
                      scheduleNext()
                  } else if activeCount == 0 {
                      finalizeFile()
                  }
              }

              private func retryChunk(_ idx: Int) -> Bool {
                  let r = retriesPerChunk[idx, default: 0]
                  guard r < 3 else { return false }
                  retriesPerChunk[idx] = r + 1
                  fetchChunk(idx: idx)
                  return true
              }

              private func finalizeFile() {
                  if didFinish || failed || isCancelled { return }
                  didFinish = true
                  syncQueue.async { [weak self] in
                      guard let self = self else { return }
                      try? self.fileHandle.synchronize()
                      try? self.fileHandle.close()
                      self.session.invalidateAndCancel()

                      let attrs = try? FileManager.default.attributesOfItem(atPath: self.tempFileURL.path)
                      let actualSize = (attrs?[.size] as? Int64) ?? 0
                      if actualSize != self.totalBytes {
                          try? FileManager.default.removeItem(at: self.tempFileURL)
                          DispatchQueue.main.async {
                              self.onComplete(.failure(NSError(domain: "ChunkedDownloader", code: -6,
                                                               userInfo: [NSLocalizedDescriptionKey: "حجم الملف النهائي غير مطابق"])))
                          }
                          return
                      }
                      DispatchQueue.main.async {
                          self.onProgress(1.0, "مكتمل")
                          self.onComplete(.success(self.tempFileURL))
                      }
                  }
              }

              private func fail(_ error: Error) {
                  if failed { return }
                  failed = true
                  session.invalidateAndCancel()
                  try? fileHandle.close()
                  try? FileManager.default.removeItem(at: tempFileURL)
                  DispatchQueue.main.async { [weak self] in
                      self?.onComplete(.failure(error))
                  }
              }
          }
          """

          # 16. Utils/HLSDownloader.swift
          files["VideoDownloader/Utils/HLSDownloader.swift"] = """import Foundation

          class HLSDownloader {
              private let url: URL
              private let userAgent: String
              private let onProgress: (Double) -> Void
              private let onComplete: (Result<URL, Error>) -> Void
              private let queue = DispatchQueue(label: "videodownloader.hls")
              private let tempFileURL: URL
              private let fileHandle: FileHandle
              private var isCancelled = false
              private var segmentURLs: [URL] = []
              private var doneCount = 0

              init(url: URL, userAgent: String,
                   onProgress: @escaping (Double) -> Void,
                   onComplete: @escaping (Result<URL, Error>) -> Void) throws {
                  self.url = url
                  self.userAgent = userAgent
                  self.onProgress = onProgress
                  self.onComplete = onComplete
                  let tmp = FileManager.default.temporaryDirectory
                      .appendingPathComponent("vd_hls_\\(UUID().uuidString).ts")
                  FileManager.default.createFile(atPath: tmp.path, contents: nil)
                  self.tempFileURL = tmp
                  self.fileHandle = try FileHandle(forWritingTo: tmp)
              }

              func start() {
                  loadPlaylist(url, depth: 0)
              }

              func cancel() {
                  queue.async { [weak self] in
                      guard let self = self else { return }
                      self.isCancelled = true
                      try? self.fileHandle.close()
                      try? FileManager.default.removeItem(at: self.tempFileURL)
                  }
              }

              private func finish(_ result: Result<URL, Error>) {
                  DispatchQueue.main.async { [weak self] in
                      guard let self = self else { return }
                      if !self.isCancelled { self.onComplete(result) }
                  }
              }

              private func fetchText(_ u: URL, _ done: @escaping (String?) -> Void) {
                  var req = URLRequest(url: u, timeoutInterval: 30)
                  req.setValue(userAgent, forHTTPHeaderField: "User-Agent")
                  URLSession.shared.dataTask(with: req) { data, _, err in
                      guard let data = data, err == nil, let s = String(data: data, encoding: .utf8) else {
                          done(nil)
                          return
                      }
                      done(s)
                  }.resume()
              }

              private func resolve(_ base: URL, _ ref: String) -> URL? {
                  let trimmed = ref.trimmingCharacters(in: .whitespaces)
                  if let u = URL(string: trimmed), u.scheme != nil { return u }
                  return URL(string: trimmed, relativeTo: base)?.absoluteURL
              }

              private func loadPlaylist(_ u: URL, depth: Int) {
                  if isCancelled { return }
                  guard depth < 3 else {
                      finish(.failure(NSError(domain: "HLSDownloader", code: -1, userInfo: [NSLocalizedDescriptionKey: "قائمة HLS معقدة جداً"])))
                      return
                  }
                  fetchText(u) { [weak self] text in
                      guard let self = self, let text = text, !self.isCancelled else {
                          self?.finish(.failure(NSError(domain: "HLSDownloader", code: -2, userInfo: [NSLocalizedDescriptionKey: "تعذر جلب قائمة HLS"])))
                          return
                      }
                      if text.contains("#EXT-X-STREAM-INF") {
                          let lines = text.components(separatedBy: "\\n")
                          var bestBW = -1
                          var bestURL: URL? = nil
                          for i in 0..<lines.count {
                              let l = lines[i].trimmingCharacters(in: .whitespaces)
                              guard l.hasPrefix("#EXT-X-STREAM-INF") else { continue }
                              var bw = 0
                              if let r = l.range(of: "BANDWIDTH=\\\\d+", options: .regularExpression) {
                                  bw = Int(l[r].replacingOccurrences(of: "BANDWIDTH=", with: "")) ?? 0
                              }
                              var j = i + 1
                              while j < lines.count {
                                  let nl = lines[j].trimmingCharacters(in: .whitespaces)
                                  if !nl.isEmpty && !nl.hasPrefix("#") { break }
                                  j += 1
                              }
                              if j < lines.count, let vu = self.resolve(u, lines[j]) {
                                  if bw > bestBW { bestBW = bw; bestURL = vu }
                              }
                          }
                          guard let target = bestURL else {
                              self.finish(.failure(NSError(domain: "HLSDownloader", code: -3, userInfo: [NSLocalizedDescriptionKey: "لا يوجد variant في القائمة"])))
                              return
                          }
                          self.loadPlaylist(target, depth: depth + 1)
                      } else {
                          var segs: [URL] = []
                          for line in text.components(separatedBy: "\\n") {
                              let l = line.trimmingCharacters(in: .whitespaces)
                              if l.isEmpty || l.hasPrefix("#") { continue }
                              if let su = self.resolve(u, l) { segs.append(su) }
                          }
                          guard !segs.isEmpty else {
                              self.finish(.failure(NSError(domain: "HLSDownloader", code: -4, userInfo: [NSLocalizedDescriptionKey: "قائمة HLS فاضية"])))
                              return
