        import Foundation
        import AVFoundation
        import Combine

        class PlayerManager: ObservableObject {
            static let shared = PlayerManager()
            @Published var currentVideo: DownloadTask?
            @Published var isPlaying = false
            @Published var isFullScreen = false
            @Published var isMinimized = false
            @Published var currentTime: Double = 0
            @Published var duration: Double = 0
            @Published var volume: Float = 1.0
            @Published var playbackSpeed: Float = 1.0
            @Published var isMuted = false
            @Published var isLoading = false
            var player: AVPlayer?
            private var obs: Any?
            private var subs = Set<AnyCancellable>()

            func playVideo(_ task: DownloadTask) {
                currentVideo = task
                guard let url = task.savedURL ?? URL(string: task.video.url) else { return }
                isLoading = true; player?.pause()
                player = AVPlayer(url: url); player?.volume = volume
                player?.currentItem?.publisher(for: \.duration).receive(on: DispatchQueue.main)
                    .sink { [weak self] d in
                        let s = d.seconds; self?.duration = s.isNaN || s.isInfinite ? 0 : s; self?.isLoading = false
                    }.store(in: &subs)
                obs = player?.addPeriodicTimeObserver(forInterval: CMTime(seconds: 0.5, preferredTimescale: 600), queue: .main) { [weak self] t in self?.currentTime = t.seconds }
                player?.play(); isPlaying = true; isFullScreen = true; isMinimized = false
            }

            func togglePlayPause() { isPlaying ? player?.pause() : player?.play(); isPlaying.toggle() }
            func seek(to t: Double) { player?.seek(to: CMTime(seconds: t, preferredTimescale: 600), toleranceBefore: .zero, toleranceAfter: .zero) }
            func skipForward(_ s: Double = 10) { seek(to: min(currentTime + s, duration)) }
            func skipBackward(_ s: Double = 10) { seek(to: max(currentTime - s, 0)) }
            func setSpeed(_ s: Float) { playbackSpeed = s; if isPlaying { player?.rate = s } }
            func setVolume(_ v: Float) { volume = v; player?.volume = v }
            func minimize() { isFullScreen = false; isMinimized = true }
            func close() {
                if let o = obs { player?.removeTimeObserver(o); obs = nil }
                player?.pause(); player = nil; isPlaying = false; isFullScreen = false; isMinimized = false
                currentVideo = nil; currentTime = 0; duration = 0
            }
            var progress: Double { duration > 0 ? currentTime / duration : 0 }
            func fmt(_ t: Double) -> String {
                guard !t.isNaN && !t.isInfinite else { return "0:00" }
                let s = Int(t); return s >= 3600 ? String(format: "%d:%02d:%02d", s/3600, (s%3600)/60, s%60) : String(format: "%d:%02d", s/60, s%60)
            }
        }
