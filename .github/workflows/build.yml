        struct ActiveRow: View {
            @ObservedObject var task: DownloadTask
            let onP: () -> Void
            let onR: () -> Void
            let onC: () -> Void
            let onRetry: () -> Void

            var isFailed: Bool { if case .failed = task.status { return true }; return false }
            var isConverting: Bool { if case .converting = task.status { return true }; return false }

            var body: some View {
                VStack(alignment: .leading, spacing: 8) {
                    HStack {
                        VStack(alignment: .leading, spacing: 4) {
                            Text(task.video.title).font(.system(size: 14, weight: .medium)).lineLimit(2)
                            HStack(spacing: 6) {
                                Text(task.quality.rawValue).font(.caption).foregroundColor(.white).padding(.horizontal, 6).padding(.vertical, 2).background(task.quality.color).cornerRadius(4)
                                if task.video.isHLS {
                                    Text("HLS").font(.caption).foregroundColor(.white).padding(.horizontal, 6).padding(.vertical, 2).background(Color.purple).cornerRadius(4)
                                }
                                if task.activeThreads > 0 {
                                    HStack(spacing: 2) {
                                        Image(systemName: "bolt.fill").font(.system(size: 9))
                                        Text("\(task.activeThreads)x").font(.system(size: 10, weight: .bold))
                                    }
                                    .foregroundColor(.white).padding(.horizontal, 5).padding(.vertical, 2).background(Color.orange).cornerRadius(4)
                                }
                                Text(task.status.displayText).font(.caption).foregroundColor(isFailed ? .red : isConverting ? .purple : .secondary).lineLimit(2)
                                if !task.speed.isEmpty && !isFailed && !isConverting { Text(task.speed).font(.caption).foregroundColor(.blue).fontWeight(.semibold) }
                            }
                            if !isFailed { Text(task.sizeText).font(.caption2).foregroundColor(.secondary) }
                        }
                        Spacer()
                        HStack(spacing: 8) {
                            if isFailed {
                                Button(action: onRetry) { Image(systemName: "arrow.clockwise.circle.fill").font(.system(size: 28)).foregroundColor(.blue) }
                            }
                            Button(action: onC) { Image(systemName: "xmark.circle.fill").font(.system(size: 28)).foregroundColor(.red) }
                        }
                    }
                    if !isFailed {
                        GeometryReader { g in
                            ZStack(alignment: .leading) {
                                RoundedRectangle(cornerRadius: 3).fill(Color(.systemGray5)).frame(height: 6)
                                RoundedRectangle(cornerRadius: 3).fill(LinearGradient(colors: [.blue, .cyan], startPoint: .leading, endPoint: .trailing)).frame(width: g.size.width * task.progress, height: 6).animation(.linear(duration: 0.3), value: task.progress)
                            }
                        }.frame(height: 6)
                    }
                }.padding(.vertical, 6)
            }
        }

