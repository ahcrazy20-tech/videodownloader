name: Build VideoFlow ULTIMATE v4

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 120

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Select Xcode 15
      run: sudo xcode-select -s /Applications/Xcode_15.2.app

    - name: Create Project Structure
      run: |
        mkdir -p VideoFlow/App
        mkdir -p VideoFlow/Views
        mkdir -p VideoFlow/Models
        mkdir -p VideoFlow/Services
        mkdir -p VideoFlow/Extractors
        mkdir -p VideoFlow/Resources/Assets.xcassets/AppIcon.appiconset
        mkdir -p VideoFlow/Resources/Assets.xcassets/AccentColor.colorset
        mkdir -p VideoFlow.xcodeproj

    - name: Create Source Files
      run: |
        # ============================================================
        # FILE 1: VideoFlowApp.swift
        # ============================================================
        cat > VideoFlow/App/VideoFlowApp.swift << 'SWIFTEOF'
        import SwiftUI

        @main
        struct VideoFlowApp: App {
            @UIApplicationDelegateAdaptor(AppDelegate.self) var appDelegate
            @StateObject private var downloadManager = DownloadManager.shared
            @StateObject private var playerManager = PlayerManager.shared

            var body: some Scene {
                WindowGroup {
                    ContentView()
                        .environmentObject(downloadManager)
                        .environmentObject(playerManager)
                        .preferredColorScheme(.dark)
                }
            }
        }
        SWIFTEOF

        # ============================================================
        # FILE 2: AppDelegate.swift
        # ============================================================
        cat > VideoFlow/App/AppDelegate.swift << 'SWIFTEOF'
        import UIKit
        import AVFoundation
        import UserNotifications

        class AppDelegate: NSObject, UIApplicationDelegate {
            func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
                do {
                    try AVAudioSession.sharedInstance().setCategory(.playback, mode: .moviePlayback, options: [.allowAirPlay, .allowBluetooth])
                    try AVAudioSession.sharedInstance().setActive(true)
                } catch { print("Audio: \(error)") }
                UNUserNotificationCenter.current().requestAuthorization(options: [.alert, .sound, .badge]) { _, _ in }
                return true
            }
        }
        SWIFTEOF

        # ============================================================
        # FILE 3: VideoItem.swift
        # ============================================================
        cat > VideoFlow/Models/VideoItem.swift << 'SWIFTEOF'
        import SwiftUI

        enum VideoQuality: String, CaseIterable, Hashable {
            case p2160 = "4K"
            case p1440 = "1440p"
            case p1080 = "1080p"
            case p720  = "720p"
            case p480  = "480p"
            case p360  = "360p"
            case p240  = "240p"
            case audio = "Audio"

            var displayName: String {
                switch self {
                case .p2160: return "4K Ultra HD"
                case .p1440: return "2K QHD"
                case .p1080: return "Full HD 1080p"
                case .p720:  return "HD 720p"
                case .p480:  return "SD 480p"
                case .p360:  return "Low 360p"
                case .p240:  return "Min 240p"
                case .audio: return "Audio Only MP3"
                }
            }

            var color: Color {
                switch self {
                case .p2160: return .purple
                case .p1440: return .indigo
                case .p1080: return .red
                case .p720:  return .orange
                case .p480:  return .green
                case .p360:  return .blue
                case .p240:  return .gray
                case .audio: return .pink
                }
            }

            var cobaltValue: String {
                switch self {
                case .p2160: return "2160"
                case .p1440: return "1440"
                case .p1080: return "1080"
                case .p720:  return "720"
                case .p480:  return "480"
                case .p360:  return "360"
                case .p240:  return "240"
                case .audio: return "audio"
                }
            }
        }

        enum VideoSourceType: String {
            case direct = "Direct"
            case hls = "HLS"
            case youtube = "YouTube"
            case tiktok = "TikTok"
            case instagram = "Instagram"
            case facebook = "Facebook"
            case twitter = "Twitter/X"
            case reddit = "Reddit"
            case vimeo = "Vimeo"
            case other = "Web"
        }

        struct VideoItem: Identifiable, Equatable, Hashable {
            let id: String
            var title: String
            let url: String
            var thumbnailURL: String?
            var duration: String?
            var estimatedSize: String?
            var availableQualities: [VideoQuality]
            var sourceType: VideoSourceType
            var headers: [String: String] = [:]
            func hash(into hasher: inout Hasher) { hasher.combine(id) }
            static func == (lhs: VideoItem, rhs: VideoItem) -> Bool { lhs.id == rhs.id }
        }
        SWIFTEOF

        # ============================================================
        # FILE 4: DownloadTask.swift
        # ============================================================
        cat > VideoFlow/Models/DownloadTask.swift << 'SWIFTEOF'
        import Foundation

        enum DownloadStatus: Equatable {
            case waiting
            case downloading(progress: Double)
            case paused
            case completed
            case failed(error: String)
            var displayText: String {
                switch self {
                case .waiting: return "Waiting..."
                case .downloading(let p): return "\(Int(p * 100))%"
                case .paused: return "Paused"
                case .completed: return "Completed"
                case .failed(let e): return "Failed: \(e)"
                }
            }
        }

        class DownloadTask: ObservableObject, Identifiable {
            let id: String
            let video: VideoItem
            let quality: VideoQuality
            @Published var status: DownloadStatus = .waiting
            @Published var progress: Double = 0
            @Published var downloadedBytes: Int64 = 0
            @Published var totalBytes: Int64 = 0
            @Published var speed: String = ""
            @Published var savedURL: URL?
            var sessionTaskId: Int?
            private var lastBytes: Int64 = 0
            private var lastTime: Date?

            init(id: String = UUID().uuidString, video: VideoItem, quality: VideoQuality) {
                self.id = id; self.video = video; self.quality = quality
            }

            func updateProgress(bytesWritten: Int64, totalExpected: Int64) {
                let now = Date()
                self.downloadedBytes = bytesWritten
                self.totalBytes = totalExpected
                if totalExpected > 0 { self.progress = Double(bytesWritten) / Double(totalExpected) }
                if let lt = lastTime {
                    let elapsed = now.timeIntervalSince(lt)
                    if elapsed >= 0.5 {
                        let bps = Double(bytesWritten - lastBytes) / elapsed
                        self.speed = bps < 1024 ? "\(Int(bps)) B/s" : bps < 1048576 ? String(format: "%.1f KB/s", bps/1024) : String(format: "%.1f MB/s", bps/1048576)
                        self.lastBytes = bytesWritten; self.lastTime = now
                    }
                } else { self.lastTime = now; self.lastBytes = bytesWritten }
                self.status = .downloading(progress: self.progress)
            }

            var sizeText: String {
                let fmt = ByteCountFormatter(); fmt.allowedUnits = [.useMB, .useGB]; fmt.countStyle = .file
                if totalBytes > 0 { return "\(fmt.string(fromByteCount: downloadedBytes)) / \(fmt.string(fromByteCount: totalBytes))" }
                return fmt.string(fromByteCount: downloadedBytes)
            }
        }
        SWIFTEOF

        # ============================================================
        # FILE 5: DownloadManager.swift (STREAM-TO-FILE - NO PERMISSION BUGS)
        # ============================================================
        cat > VideoFlow/Services/DownloadManager.swift << 'SWIFTEOF'
        import Foundation
        import UserNotifications

        class DownloadManager: NSObject, ObservableObject {
            static let shared = DownloadManager()
            @Published var activeDownloads: [DownloadTask] = []
            @Published var completedVideos: [DownloadTask] = []
            var backgroundCompletionHandler: (() -> Void)?

            private var session: URLSession!
            private var tasks: [Int: DownloadTask] = [:]
            private var handles: [Int: FileHandle] = [:]
            private var destURLs: [Int: URL] = [:]

            override init() {
                super.init()
                let c = URLSessionConfiguration.default
                c.allowsCellularAccess = true
                c.timeoutIntervalForRequest = 60
                c.timeoutIntervalForResource = 7200
                c.httpMaximumConnectionsPerHost = 6
                c.waitsForConnectivity = true
                session = URLSession(configuration: c, delegate: self, delegateQueue: nil)
                setupDir()
                loadSaved()
            }

            private func setupDir() {
                let d = downloadsDir()
                if !FileManager.default.fileExists(atPath: d.path) {
                    try? FileManager.default.createDirectory(at: d, withIntermediateDirectories: true)
                }
            }

            func downloadsDir() -> URL {
                FileManager.default.urls(for: .documentDirectory, in: .userDomainMask)[0]
                    .appendingPathComponent("Downloads", isDirectory: true)
            }

            func startDownload(video: VideoItem, quality: VideoQuality) {
                guard let url = URL(string: video.url) else { return }
                let task = DownloadTask(video: video, quality: quality)
                DispatchQueue.main.async { self.activeDownloads.append(task) }

                let safe = sanitize(video.title)
                let ext = quality == .audio ? "mp3" : "mp4"
                let name = "\(safe)_\(quality.rawValue)_\(Int(Date().timeIntervalSince1970)).\(ext)"
                let dest = downloadsDir().appendingPathComponent(name)

                FileManager.default.createFile(atPath: dest.path, contents: nil)
                guard let fh = try? FileHandle(forWritingTo: dest) else {
                    DispatchQueue.main.async {
                        task.status = .failed(error: "Cannot create file")
                        self.activeDownloads.removeAll { $0.id == task.id }
                    }
                    return
                }

                var req = URLRequest(url: url)
                req.setValue("Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1", forHTTPHeaderField: "User-Agent")
                req.setValue("*/*", forHTTPHeaderField: "Accept")
                req.setValue("identity;q=1, *;q=0", forHTTPHeaderField: "Accept-Encoding")
                for (k, v) in video.headers { req.setValue(v, forHTTPHeaderField: k) }
                if video.headers["Referer"] == nil, let h = url.host {
                    req.setValue("https://\(h)/", forHTTPHeaderField: "Referer")
                }

                let dt = session.dataTask(with: req)
                let tid = dt.taskIdentifier
                task.sessionTaskId = tid
                handles[tid] = fh
                destURLs[tid] = dest
                tasks[tid] = task
                dt.resume()
                DispatchQueue.main.async { task.status = .downloading(progress: 0) }
            }

            func pauseDownload(_ t: DownloadTask) {
                guard let tid = t.sessionTaskId else { return }
                session.getAllTasks { all in
                    all.first { $0.taskIdentifier == tid }?.suspend()
                    DispatchQueue.main.async { t.status = .paused }
                }
            }

            func resumeDownload(_ t: DownloadTask) {
                guard let tid = t.sessionTaskId else { return }
                session.getAllTasks { all in
                    all.first { $0.taskIdentifier == tid }?.resume()
                    DispatchQueue.main.async { t.status = .downloading(progress: t.progress) }
                }
            }

            func cancelDownload(_ t: DownloadTask) {
                if let tid = t.sessionTaskId {
                    session.getAllTasks { all in all.first { $0.taskIdentifier == tid }?.cancel() }
                    cleanup(tid)
                }
                DispatchQueue.main.async { self.activeDownloads.removeAll { $0.id == t.id } }
            }

            func deleteVideo(_ t: DownloadTask) {
                if let u = t.savedURL { try? FileManager.default.removeItem(at: u) }
                DispatchQueue.main.async { self.completedVideos.removeAll { $0.id == t.id } }
            }

            private func cleanup(_ tid: Int) {
                try? handles[tid]?.close()
                handles.removeValue(forKey: tid)
                if let u = destURLs[tid] { try? FileManager.default.removeItem(at: u) }
                destURLs.removeValue(forKey: tid)
                tasks.removeValue(forKey: tid)
            }

            private func sanitize(_ name: String) -> String {
                var s = name.components(separatedBy: CharacterSet(charactersIn: "/\\:*?\"<>|\n\r")).joined(separator: "_")
                s = s.replacingOccurrences(of: " ", with: "_")
                if s.count > 50 { s = String(s.prefix(50)) }
                return s.isEmpty ? "video" : s
            }

            private func loadSaved() {
                let d = downloadsDir()
                guard let files = try? FileManager.default.contentsOfDirectory(at: d, includingPropertiesForKeys: nil) else { return }
                let exts = Set(["mp4","m4v","mov","mkv","avi","mp3","m4a","webm"])
                DispatchQueue.main.async {
                    self.completedVideos = files.filter { exts.contains($0.pathExtension.lowercased()) }.map { u in
                        let v = VideoItem(id: u.lastPathComponent, title: u.deletingPathExtension().lastPathComponent, url: u.absoluteString, availableQualities: [.p720], sourceType: .direct)
                        let t = DownloadTask(video: v, quality: .p720); t.savedURL = u; t.status = .completed; return t
                    }
                }
            }

            private func notify(_ t: DownloadTask) {
                let c = UNMutableNotificationContent()
                c.title = "Download Complete"; c.body = t.video.title; c.sound = .default
                UNUserNotificationCenter.current().add(UNNotificationRequest(identifier: t.id, content: c, trigger: nil))
            }
        }

        extension DownloadManager: URLSessionDataDelegate {
            func urlSession(_ s: URLSession, dataTask: URLSessionDataTask, didReceive response: URLResponse, completionHandler: @escaping (URLSession.ResponseDisposition) -> Void) {
                let tid = dataTask.taskIdentifier
                if let t = tasks[tid] {
                    let total = response.expectedContentLength
                    DispatchQueue.main.async { t.totalBytes = total > 0 ? total : 0 }
                }
                completionHandler(.allow)
            }

            func urlSession(_ s: URLSession, dataTask: URLSessionDataTask, didReceive data: Data) {
                let tid = dataTask.taskIdentifier
                guard let t = tasks[tid], let fh = handles[tid] else { return }
                do {
                    try fh.write(contentsOf: data)
                    let cur = t.downloadedBytes + Int64(data.count)
                    DispatchQueue.main.async { t.updateProgress(bytesWritten: cur, totalExpected: t.totalBytes) }
                } catch {
                    DispatchQueue.main.async { t.status = .failed(error: "Write: \(error.localizedDescription)") }
                }
            }

            func urlSession(_ s: URLSession, task st: URLSessionTask, didCompleteWithError error: Error?) {
                let tid = st.taskIdentifier
                guard let t = tasks[tid] else { return }
                try? handles[tid]?.close()
                handles.removeValue(forKey: tid)
                let dest = destURLs.removeValue(forKey: tid)
                tasks.removeValue(forKey: tid)

                if let error = error {
                    if let d = dest { try? FileManager.default.removeItem(at: d) }
                    if (error as NSError).code != NSURLErrorCancelled {
                        DispatchQueue.main.async { t.status = .failed(error: error.localizedDescription) }
                    }
                } else {
                    DispatchQueue.main.async {
                        t.savedURL = dest; t.status = .completed; t.progress = 1.0
                        self.activeDownloads.removeAll { $0.id == t.id }
                        self.completedVideos.insert(t, at: 0)
                        self.notify(t)
                    }
                }
            }
        }
        SWIFTEOF

        # ============================================================
        # FILE 6: PlayerManager.swift
        # ============================================================
        cat > VideoFlow/Services/PlayerManager.swift << 'SWIFTEOF'
        import Foundation
        import AVFoundation
        import Combine

        class PlayerManager: ObservableObject {
            static let shared = PlayerManager()
            @Published var currentVideo: DownloadTask?
            @Published var isPlaying = false
            @Published var isFullScreen = false
            @Published var isMinimized = false
            @Published var currentTime: Double = 0
            @Published var duration: Double = 0
            @Published var volume: Float = 1.0
            @Published var playbackSpeed: Float = 1.0
            @Published var isMuted = false
            @Published var isLoading = false
            var player: AVPlayer?
            private var obs: Any?
            private var subs = Set<AnyCancellable>()

            func playVideo(_ task: DownloadTask) {
                currentVideo = task
                guard let url = task.savedURL ?? URL(string: task.video.url) else { return }
                isLoading = true; player?.pause()
                player = AVPlayer(url: url); player?.volume = volume
                player?.currentItem?.publisher(for: \.duration).receive(on: DispatchQueue.main)
                    .sink { [weak self] d in
                        let s = d.seconds; self?.duration = s.isNaN || s.isInfinite ? 0 : s; self?.isLoading = false
                    }.store(in: &subs)
                obs = player?.addPeriodicTimeObserver(forInterval: CMTime(seconds: 0.5, preferredTimescale: 600), queue: .main) { [weak self] t in self?.currentTime = t.seconds }
                player?.play(); isPlaying = true; isFullScreen = true; isMinimized = false
            }

            func togglePlayPause() { isPlaying ? player?.pause() : player?.play(); isPlaying.toggle() }
            func seek(to t: Double) { player?.seek(to: CMTime(seconds: t, preferredTimescale: 600), toleranceBefore: .zero, toleranceAfter: .zero) }
            func skipForward(_ s: Double = 10) { seek(to: min(currentTime + s, duration)) }
            func skipBackward(_ s: Double = 10) { seek(to: max(currentTime - s, 0)) }
            func setSpeed(_ s: Float) { playbackSpeed = s; if isPlaying { player?.rate = s } }
            func setVolume(_ v: Float) { volume = v; player?.volume = v }
            func minimize() { isFullScreen = false; isMinimized = true }
            func close() {
                if let o = obs { player?.removeTimeObserver(o); obs = nil }
                player?.pause(); player = nil; isPlaying = false; isFullScreen = false; isMinimized = false
                currentVideo = nil; currentTime = 0; duration = 0
            }
            var progress: Double { duration > 0 ? currentTime / duration : 0 }
            func fmt(_ t: Double) -> String {
                guard !t.isNaN && !t.isInfinite else { return "0:00" }
                let s = Int(t); return s >= 3600 ? String(format: "%d:%02d:%02d", s/3600, (s%3600)/60, s%60) : String(format: "%d:%02d", s/60, s%60)
            }
        }
        SWIFTEOF

        # ============================================================
        # FILE 7: UltimateExtractor.swift (MEGA ENGINE)
        # ============================================================
        cat > VideoFlow/Extractors/UltimateExtractor.swift << 'SWIFTEOF'
        import Foundation

        struct ExtractedStream {
            let url: String; let quality: VideoQuality; let headers: [String: String]; let filename: String?; let hasAudio: Bool
        }

        struct ExtractedVideo {
            let title: String; let streams: [ExtractedStream]; let thumbnail: String?; let sourceType: VideoSourceType
        }

        enum ExError: LocalizedError {
            case allFailed(String); case invalidURL; case noStreams; case network(String)
            var errorDescription: String? {
                switch self {
                case .allFailed(let m): return "All servers failed: \(m)"
                case .invalidURL: return "Invalid URL"
                case .noStreams: return "No video found on this page"
                case .network(let m): return "Network: \(m)"
                }
            }
        }

        class UltimateExtractor {
            static let shared = UltimateExtractor()

            private let cobaltMirrors = [
                "https://api.cobalt.tools",
                "https://co.wuk.sh",
                "https://cobalt-api.kwiatekmiki.com",
                "https://cobalt-backend.canine.tools",
                "https://cobalt.synzr.space",
                "https://capi.oak.li",
                "https://cobalt-api.ayo.tf",
                "https://api.dl.sauw.ca"
            ]

            func detectSite(_ url: String) -> VideoSourceType {
                let l = url.lowercased()
                if l.contains("youtube.com") || l.contains("youtu.be") { return .youtube }
                if l.contains("tiktok.com") { return .tiktok }
                if l.contains("instagram.com") { return .instagram }
                if l.contains("facebook.com") || l.contains("fb.watch") || l.contains("fb.com") { return .facebook }
                if l.contains("twitter.com") || l.contains("x.com") { return .twitter }
                if l.contains("reddit.com") { return .reddit }
                if l.contains("vimeo.com") { return .vimeo }
                if l.contains(".m3u8") { return .hls }
                if l.contains(".mp4") || l.contains(".webm") { return .direct }
                return .other
            }

            func extract(from url: String, quality: VideoQuality = .p1080, audioOnly: Bool = false, completion: @escaping (Result<ExtractedVideo, Error>) -> Void) {
                let site = detectSite(url)

                // Direct links - no extraction needed
                if site == .direct || site == .hls {
                    let s = ExtractedStream(url: url, quality: quality, headers: [:], filename: nil, hasAudio: true)
                    completion(.success(ExtractedVideo(title: URL(string: url)?.lastPathComponent ?? "Video", streams: [s], thumbnail: nil, sourceType: site)))
                    return
                }

                // Try site-specific first, then Cobalt chain, then HTML scrape
                trySiteSpecific(url: url, site: site, quality: quality) { [weak self] r in
                    switch r {
                    case .success(let v): completion(.success(v))
                    case .failure:
                        self?.tryCobaltChain(url: url, quality: quality, audioOnly: audioOnly, idx: 0) { r2 in
                            switch r2 {
                            case .success(let v): completion(.success(v))
                            case .failure: self?.htmlScrape(url: url, completion: completion) ?? completion(.failure(ExError.allFailed("No extractor")))
                            }
                        }
                    }
                }
            }

            // MARK: - Site Specific
            private func trySiteSpecific(url: String, site: VideoSourceType, quality: VideoQuality, completion: @escaping (Result<ExtractedVideo, Error>) -> Void) {
                switch site {
                case .tiktok: tikTokExtract(url, completion: completion)
                case .twitter: twitterExtract(url, completion: completion)
                case .reddit: redditExtract(url, completion: completion)
                case .instagram: instagramExtract(url, completion: completion)
                case .facebook: facebookExtract(url, completion: completion)
                default: completion(.failure(ExError.noStreams))
                }
            }

            // MARK: - TikTok via TikWM
            private func tikTokExtract(_ url: String, completion: @escaping (Result<ExtractedVideo, Error>) -> Void) {
                guard let api = URL(string: "https://tikwm.com/api/") else { completion(.failure(ExError.invalidURL)); return }
                var req = URLRequest(url: api); req.httpMethod = "POST"
                req.setValue("application/x-www-form-urlencoded", forHTTPHeaderField: "Content-Type")
                req.setValue("Mozilla/5.0", forHTTPHeaderField: "User-Agent")
                req.httpBody = "url=\(url.addingPercentEncoding(withAllowedCharacters: .urlQueryAllowed) ?? url)&hd=1".data(using: .utf8)

                URLSession.shared.dataTask(with: req) { data, _, _ in
                    guard let data = data, let j = try? JSONSerialization.jsonObject(with: data) as? [String: Any],
                          let d = j["data"] as? [String: Any] else { completion(.failure(ExError.noStreams)); return }
                    var streams: [ExtractedStream] = []
                    let title = d["title"] as? String ?? "TikTok Video"
                    if let u = d["hdplay"] as? String { streams.append(ExtractedStream(url: u, quality: .p1080, headers: [:], filename: nil, hasAudio: true)) }
                    if let u = d["play"] as? String { streams.append(ExtractedStream(url: u, quality: .p720, headers: [:], filename: nil, hasAudio: true)) }
                    if let u = d["music"] as? String { streams.append(ExtractedStream(url: u, quality: .audio, headers: [:], filename: "audio", hasAudio: true)) }
                    streams.isEmpty ? completion(.failure(ExError.noStreams)) : completion(.success(ExtractedVideo(title: title, streams: streams, thumbnail: d["cover"] as? String, sourceType: .tiktok)))
                }.resume()
            }

            // MARK: - Twitter via fxtwitter
            private func twitterExtract(_ url: String, completion: @escaping (Result<ExtractedVideo, Error>) -> Void) {
                let api = url.replacingOccurrences(of: "x.com", with: "api.fxtwitter.com").replacingOccurrences(of: "twitter.com", with: "api.fxtwitter.com")
                guard let u = URL(string: api) else { completion(.failure(ExError.invalidURL)); return }
                URLSession.shared.dataTask(with: u) { data, _, _ in
                    guard let data = data, let j = try? JSONSerialization.jsonObject(with: data) as? [String: Any],
                          let tw = j["tweet"] as? [String: Any] else { completion(.failure(ExError.noStreams)); return }
                    var streams: [ExtractedStream] = []
                    if let m = tw["media"] as? [String: Any], let vs = m["videos"] as? [[String: Any]] {
                        for v in vs { if let vu = v["url"] as? String { streams.append(ExtractedStream(url: vu, quality: .p720, headers: [:], filename: nil, hasAudio: true)) } }
                    }
                    let title = String((tw["text"] as? String ?? "Twitter Video").prefix(60))
                    streams.isEmpty ? completion(.failure(ExError.noStreams)) : completion(.success(ExtractedVideo(title: title, streams: streams, thumbnail: nil, sourceType: .twitter)))
                }.resume()
            }

            // MARK: - Reddit
            private func redditExtract(_ url: String, completion: @escaping (Result<ExtractedVideo, Error>) -> Void) {
                var jurl = url; if !jurl.hasSuffix(".json") { jurl += (jurl.hasSuffix("/") ? ".json" : "/.json") }
                guard let u = URL(string: jurl) else { completion(.failure(ExError.invalidURL)); return }
                var req = URLRequest(url: u); req.setValue("VideoFlow/4.0", forHTTPHeaderField: "User-Agent")
                URLSession.shared.dataTask(with: req) { data, _, _ in
                    guard let data = data, let arr = try? JSONSerialization.jsonObject(with: data) as? [Any],
                          let first = arr.first as? [String: Any], let pd = first["data"] as? [String: Any],
                          let ch = pd["children"] as? [[String: Any]], let post = ch.first?["data"] as? [String: Any] else { completion(.failure(ExError.noStreams)); return }
                    let title = post["title"] as? String ?? "Reddit Video"
                    if let m = post["media"] as? [String: Any], let rv = m["reddit_video"] as? [String: Any], let fu = rv["fallback_url"] as? String {
                        completion(.success(ExtractedVideo(title: title, streams: [ExtractedStream(url: fu, quality: .p720, headers: [:], filename: nil, hasAudio: true)], thumbnail: nil, sourceType: .reddit)))
                    } else { completion(.failure(ExError.noStreams)) }
                }.resume()
            }

            // MARK: - Instagram
            private func instagramExtract(_ url: String, completion: @escaping (Result<ExtractedVideo, Error>) -> Void) {
                guard let u = URL(string: url) else { completion(.failure(ExError.invalidURL)); return }
                var req = URLRequest(url: u)
                req.setValue("Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15", forHTTPHeaderField: "User-Agent")
                URLSession.shared.dataTask(with: req) { data, _, _ in
                    guard let data = data, let html = String(data: data, encoding: .utf8) else { completion(.failure(ExError.noStreams)); return }
                    for p in ["\"video_url\":\"([^\"]+)\"", "\"contentUrl\":\"([^\"]+\\.mp4[^\"]*)\"", "property=\"og:video\" content=\"([^\"]+)\""] {
                        if let rx = try? NSRegularExpression(pattern: p), let m = rx.firstMatch(in: html, range: NSRange(html.startIndex..., in: html)), let r = Range(m.range(at: 1), in: html) {
                            var vu = String(html[r]).replacingOccurrences(of: "\\u0026", with: "&").replacingOccurrences(of: "\\/", with: "/")
                            if vu.hasPrefix("http") {
                                completion(.success(ExtractedVideo(title: "Instagram Video", streams: [ExtractedStream(url: vu, quality: .p720, headers: ["Referer": "https://www.instagram.com/"], filename: nil, hasAudio: true)], thumbnail: nil, sourceType: .instagram)))
                                return
                            }
                        }
                    }
                    completion(.failure(ExError.noStreams))
                }.resume()
            }

            // MARK: - Facebook
            private func facebookExtract(_ url: String, completion: @escaping (Result<ExtractedVideo, Error>) -> Void) {
                let mu = url.replacingOccurrences(of: "www.facebook.com", with: "m.facebook.com").replacingOccurrences(of: "web.facebook.com", with: "m.facebook.com")
                guard let u = URL(string: mu) else { completion(.failure(ExError.invalidURL)); return }
                var req = URLRequest(url: u); req.setValue("Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15", forHTTPHeaderField: "User-Agent")
                URLSession.shared.dataTask(with: req) { data, _, _ in
                    guard let data = data, let html = String(data: data, encoding: .utf8) else { completion(.failure(ExError.noStreams)); return }
                    var streams: [ExtractedStream] = []; let hdrs = ["Referer": "https://www.facebook.com/"]
                    for (p, q) in [("hd_src\":\"([^\"]+)\"", VideoQuality.p1080), ("sd_src\":\"([^\"]+)\"", VideoQuality.p480), ("browser_native_hd_url\":\"([^\"]+)\"", VideoQuality.p720), ("browser_native_sd_url\":\"([^\"]+)\"", VideoQuality.p480)] {
                        if let rx = try? NSRegularExpression(pattern: p), let m = rx.firstMatch(in: html, range: NSRange(html.startIndex..., in: html)), let r = Range(m.range(at: 1), in: html) {
                            let vu = String(html[r]).replacingOccurrences(of: "\\/", with: "/").replacingOccurrences(of: "\\u0025", with: "%").replacingOccurrences(of: "\\u0026", with: "&")
                            if !streams.contains(where: { $0.quality == q }) { streams.append(ExtractedStream(url: vu, quality: q, headers: hdrs, filename: nil, hasAudio: true)) }
                        }
                    }
                    streams.isEmpty ? completion(.failure(ExError.noStreams)) : completion(.success(ExtractedVideo(title: "Facebook Video", streams: streams, thumbnail: nil, sourceType: .facebook)))
                }.resume()
            }

            // MARK: - Cobalt Chain
            private func tryCobaltChain(url: String, quality: VideoQuality, audioOnly: Bool, idx: Int, completion: @escaping (Result<ExtractedVideo, Error>) -> Void) {
                guard idx < cobaltMirrors.count else { completion(.failure(ExError.allFailed("Cobalt"))); return }
                cobaltRequest(mirror: cobaltMirrors[idx], videoURL: url, quality: quality.cobaltValue, audioOnly: audioOnly) { [weak self] r in
                    switch r {
                    case .success(let v): completion(.success(v))
                    case .failure: self?.tryCobaltChain(url: url, quality: quality, audioOnly: audioOnly, idx: idx + 1, completion: completion)
                    }
                }
            }

            private func cobaltRequest(mirror: String, videoURL: String, quality: String, audioOnly: Bool, completion: @escaping (Result<ExtractedVideo, Error>) -> Void) {
                guard let api = URL(string: mirror) else { completion(.failure(ExError.invalidURL)); return }
                var req = URLRequest(url: api); req.httpMethod = "POST"; req.timeoutInterval = 20
                req.setValue("application/json", forHTTPHeaderField: "Content-Type")
                req.setValue("application/json", forHTTPHeaderField: "Accept")
                req.setValue("VideoFlow/4.0", forHTTPHeaderField: "User-Agent")
                let body: [String: Any] = ["url": videoURL, "videoQuality": quality, "audioFormat": "mp3", "audioBitrate": "320", "filenameStyle": "pretty", "downloadMode": audioOnly ? "audio" : "auto", "youtubeVideoCodec": "h264", "tiktokFullAudio": true, "tiktokH265": false, "twitterGif": true]
                req.httpBody = try? JSONSerialization.data(withJSONObject: body)

                URLSession.shared.dataTask(with: req) { [weak self] data, _, error in
                    if let error = error { completion(.failure(ExError.network(error.localizedDescription))); return }
                    guard let data = data, let j = try? JSONSerialization.jsonObject(with: data) as? [String: Any] else { completion(.failure(ExError.noStreams)); return }
                    let site = self?.detectSite(videoURL) ?? .other

                    if let st = j["status"] as? String {
                        if ["tunnel", "redirect", "stream"].contains(st), let u = j["url"] as? String {
                            let fn = j["filename"] as? String ?? "Video"
                            let title = fn.replacingOccurrences(of: ".mp4", with: "").replacingOccurrences(of: ".mp3", with: "")
                            completion(.success(ExtractedVideo(title: title, streams: [ExtractedStream(url: u, quality: .p1080, headers: [:], filename: fn, hasAudio: true)], thumbnail: nil, sourceType: site)))
                        } else if st == "picker", let pk = j["picker"] as? [[String: Any]] {
                            let ss = pk.compactMap { $0["url"] as? String }.map { ExtractedStream(url: $0, quality: .p720, headers: [:], filename: nil, hasAudio: true) }
                            ss.isEmpty ? completion(.failure(ExError.noStreams)) : completion(.success(ExtractedVideo(title: "Media (\(ss.count))", streams: ss, thumbnail: nil, sourceType: site)))
                        } else { completion(.failure(ExError.noStreams)) }
                    } else if let u = j["url"] as? String {
                        completion(.success(ExtractedVideo(title: j["filename"] as? String ?? "Video", streams: [ExtractedStream(url: u, quality: .p1080, headers: [:], filename: nil, hasAudio: true)], thumbnail: nil, sourceType: site)))
                    } else { completion(.failure(ExError.noStreams)) }
                }.resume()
            }

            // MARK: - HTML Scrape Fallback
            private func htmlScrape(url: String, completion: @escaping (Result<ExtractedVideo, Error>) -> Void) {
                guard let u = URL(string: url) else { completion(.failure(ExError.invalidURL)); return }
                var req = URLRequest(url: u); req.setValue("Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15", forHTTPHeaderField: "User-Agent")
                URLSession.shared.dataTask(with: req) { data, _, _ in
                    guard let data = data, let html = String(data: data, encoding: .utf8) else { completion(.failure(ExError.allFailed("fetch"))); return }
                    var streams: [ExtractedStream] = []; var seen = Set<String>()
                    for p in ["https?://[^\\s\"'<>\\\\]+\\.mp4[^\\s\"'<>\\\\]*", "https?://[^\\s\"'<>\\\\]+\\.m3u8[^\\s\"'<>\\\\]*", "\"contentUrl\"\\s*:\\s*\"([^\"]+)\"", "property=\"og:video\"\\s+content=\"([^\"]+)\"", "property=\"og:video:url\"\\s+content=\"([^\"]+)\""] {
                        if let rx = try? NSRegularExpression(pattern: p) {
                            for m in rx.matches(in: html, range: NSRange(html.startIndex..., in: html)).prefix(5) {
                                let mr = m.numberOfRanges > 1 ? m.range(at: 1) : m.range
                                if let r = Range(mr, in: html) {
                                    var vu = String(html[r]).replacingOccurrences(of: "\\/", with: "/").replacingOccurrences(of: "\\u0026", with: "&")
                                    if vu.hasPrefix("http") && !seen.contains(vu) { seen.insert(vu); streams.append(ExtractedStream(url: vu, quality: .p720, headers: [:], filename: nil, hasAudio: true)) }
                                }
                            }
                        }
                    }
                    var title = "Video"
                    if let rx = try? NSRegularExpression(pattern: "<title>([^<]+)</title>"), let m = rx.firstMatch(in: html, range: NSRange(html.startIndex..., in: html)), let r = Range(m.range(at: 1), in: html) { title = String(html[r]) }
                    streams.isEmpty ? completion(.failure(ExError.allFailed("No videos"))) : completion(.success(ExtractedVideo(title: title, streams: streams, thumbnail: nil, sourceType: .other)))
                }.resume()
            }
        }
