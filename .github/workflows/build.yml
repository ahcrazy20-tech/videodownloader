                                      .frame(maxWidth: .infinity, alignment: .leading)
                                      .background(Color(.systemGray6))
                                      .cornerRadius(8)
                              }
                              .frame(maxHeight: 200)
                              .padding(.horizontal)

                              // زر نسخ
                              Button {
                                  UIPasteboard.general.string = translator.translatedText
                              } label: {
                                  Label("نسخ النص", systemImage: "doc.on.doc")
                              }
                          }

                          Spacer()
                      }
                      .padding(.top)
                      .navigationTitle("ترجمة الفيديو")
                      .navigationBarTitleDisplayMode(.inline)
                      .toolbar {
                          Button("إغلاق") { dismiss() }
                      }
                  }
              }
          }
          EOF

          # ========== Views/WebView.swift (إصلاح: مرجع webView + منع حلقة إعادة التحميل) ==========
          cat > VideoDownloader/Views/WebView.swift << 'EOF'
          import SwiftUI
          import WebKit

          struct WebView: UIViewRepresentable {
              @Binding var urlString: String
              @Binding var loadTrigger: Int
              var downloadManager: DownloadManager?

              func makeUIView(context: Context) -> WKWebView {
                  let config = WKWebViewConfiguration()
                  config.allowsInlineMediaPlayback = true
                  config.mediaTypesRequiringUserActionForPlayback = []

                  let contentController = WKUserContentController()
                  contentController.addUserScript(AdBlocker.injectScript())
                  config.userContentController = contentController

                  let webView = WKWebView(frame: .zero, configuration: config)
                  webView.navigationDelegate = context.coordinator
                  webView.allowsBackForwardNavigationGestures = true
                  context.coordinator.webView = webView

                  if let url = URL(string: urlString) {
                      webView.load(URLRequest(url: url))
                  }
                  return webView
              }

              func updateUIView(_ webView: WKWebView, context: Context) {
                  context.coordinator.parent = self
                  // التحميل يحدث فقط عند تغيّر loadTrigger (زر "ذهاب") — يمنع حلقة إعادة التحميل
                  if context.coordinator.lastLoadTrigger != loadTrigger {
                      context.coordinator.lastLoadTrigger = loadTrigger
                      if let url = URL(string: urlString) {
                          webView.load(URLRequest(url: url))
                      }
                  }
              }

              func makeCoordinator() -> Coordinator {
                  Coordinator(self)
              }

              class Coordinator: NSObject, WKNavigationDelegate {
                  var parent: WebView
                  weak var webView: WKWebView?
                  var lastLoadTrigger = 0

                  init(_ parent: WebView) {
                      self.parent = parent
                      super.init()
                      NotificationCenter.default.addObserver(
                          self,
                          selector: #selector(extractVideos),
                          name: .extractVideos,
                          object: nil
                      )
                  }

                  deinit {
                      NotificationCenter.default.removeObserver(self)
                  }

                  @objc func extractVideos() {
                      guard let webView = webView else { return }
                      let jsCode = """
                      (function() {
                          var urls = [];
                          var videos = document.getElementsByTagName('video');
                          for (var i = 0; i < videos.length; i++) {
                              var src = videos[i].src;
                              if (src && src.startsWith('http')) urls.push(src);
                              var sources = videos[i].getElementsByTagName('source');
                              for (var j = 0; j < sources.length; j++) {
                                  if (sources[j].src && sources[j].src.startsWith('http')) urls.push(sources[j].src);
                              }
                          }
                          return urls;
                      })();
                      """
                      webView.evaluateJavaScript(jsCode) { result, _ in
                          if let urls = result as? [String], !urls.isEmpty {
                              for url in urls {
                                  DispatchQueue.main.async {
                                      NotificationCenter.default.post(name: .videoURLFound, object: url)
                                  }
                              }
                          }
                      }
                  }

                  func webView(_ webView: WKWebView, didFinish navigation: WKNavigation!) {
                      if let url = webView.url?.absoluteString {
                          DispatchQueue.main.async {
                              if self.parent.urlString != url {
                                  self.parent.urlString = url
                              }
                          }
                      }
                  }
              }
          }
          EOF

          # ========== Managers/DownloadManager.swift ==========
          cat > VideoDownloader/Managers/DownloadManager.swift << 'EOF'
          import SwiftUI

          class DownloadManager: NSObject, ObservableObject {
              @Published var downloads: [DownloadItem] = []
              private var session: URLSession!

              override init() {
                  super.init()
                  let config = URLSessionConfiguration.background(withIdentifier: "com.yourapp.download")
                  config.isDiscretionary = false
                  session = URLSession(configuration: config, delegate: self, delegateQueue: .main)
              }

              func startDownload(url: String) {
                  guard let url = URL(string: url) else { return }
                  if downloads.contains(where: { $0.url == url && $0.isDownloading }) { return }

                  let item = DownloadItem(url: url)
                  item.isDownloading = true
                  DispatchQueue.main.async { self.downloads.append(item) }

                  let task = session.downloadTask(with: url)
                  task.resume()
                  item.task = task
              }

              func deleteVideo(at index: Int) {
                  let item = downloads[index]
                  if let localURL = item.localURL {
                      try? FileManager.default.removeItem(at: localURL)
                  }
                  downloads.remove(at: index)
              }
          }

          extension DownloadManager: URLSessionDownloadDelegate {
              func urlSession(_ session: URLSession, downloadTask: URLSessionDownloadTask, didFinishDownloadingTo location: URL) {
                  let fileManager = FileManager.default
                  let documentsURL = fileManager.urls(for: .documentDirectory, in: .userDomainMask).first!
                  let fileName = downloadTask.originalRequest?.url?.lastPathComponent ?? "video_\(Date().timeIntervalSince1970).mp4"
                  let destinationURL = documentsURL.appendingPathComponent(fileName)

                  do {
                      if fileManager.fileExists(atPath: destinationURL.path) { try fileManager.removeItem(at: destinationURL) }
                      try fileManager.moveItem(at: location, to: destinationURL)
                      DispatchQueue.main.async {
                          if let index = self.downloads.firstIndex(where: { $0.task == downloadTask }) {
                              self.downloads[index].isDownloading = false
                              self.downloads[index].progress = 1.0
                              self.downloads[index].localURL = destinationURL
                          }
                      }
                  } catch { print("فشل حفظ الملف: \(error)") }
              }

              func urlSession(_ session: URLSession, downloadTask: URLSessionDownloadTask, didWriteData bytesWritten: Int64, totalBytesWritten: Int64, totalBytesExpectedToWrite: Int64) {
                  guard totalBytesExpectedToWrite > 0 else { return }
                  let progress = Float(totalBytesWritten) / Float(totalBytesExpectedToWrite)
                  DispatchQueue.main.async {
                      if let index = self.downloads.firstIndex(where: { $0.task == downloadTask }) {
                          self.downloads[index].progress = progress
                          self.downloads[index].isDownloading = true
                      }
                  }
              }
          }

          class DownloadItem: Identifiable, ObservableObject {
              let id = UUID()
              let url: URL
              var task: URLSessionDownloadTask?
              @Published var progress: Float = 0.0
              @Published var isDownloading: Bool = false
              @Published var localURL: URL?

              init(url: URL) { self.url = url }
          }
          EOF

          # ========== Managers/AdBlocker.swift ==========
          cat > VideoDownloader/Managers/AdBlocker.swift << 'EOF'
          import WebKit

          class AdBlocker {
              static func injectScript() -> WKUserScript {
                  let source = """
                  (function() {
                      const adDomains = ['doubleclick.net','googleadservices.com','googlesyndication.com','facebook.com/tr','amazon-adsystem.com','scorecardresearch.com'];
                      const originalFetch = window.fetch;
                      window.fetch = function(url, options) {
                          if (typeof url === 'string' && adDomains.some(d => url.includes(d))) {
                              return Promise.reject(new Error('Ad blocked'));
                          }
                          return originalFetch.call(this, url, options);
                      };
                      const selectors = ['.ad','.ads','.ad-container','.ad-banner','iframe[src*="doubleclick"]','iframe[src*="googlead"]'];
                      function hideAds() {
                          selectors.forEach(s => document.querySelectorAll(s).forEach(el => el.style.display = 'none'));
                      }
                      hideAds();
                      new MutationObserver(hideAds).observe(document.body, { childList: true, subtree: true });
                  })();
                  """
                  return WKUserScript(source: source, injectionTime: .atDocumentStart, forMainFrameOnly: false)
              }
          }
          EOF

          # ========== Managers/VideoTranslator.swift ==========
          cat > VideoDownloader/Managers/VideoTranslator.swift << 'EOF'
          import SwiftUI
          import AVFoundation

          class VideoTranslator: ObservableObject {
              @Published var translatedText: String = ""
              @Published var isTranslating = false
              @Published var availableEngines: [String] = ["DeepLX", "LibreTranslate", "Whisper (محلي)"]

              private var currentEngineName: String = "DeepLX"
              private let whisperManager = WhisperManager()
              private let deepLX = DeepLTranslator()
              private let libre = LibreTranslator()

              func switchToEngine(named engineName: String) {
                  currentEngineName = engineName
                  print("🔄 تم التبديل إلى: \(engineName)")
              }

              func translateVideo(videoURL: URL) {
                  if currentEngineName == "Whisper (محلي)" && !whisperManager.isModelReady {
                      DispatchQueue.main.async {
                          self.translatedText = "⚠️ يرجى تحميل نموذج Whisper أولاً من إعدادات التطبيق"
                      }
                      return
                  }

                  isTranslating = true
                  translatedText = ""

                  extractAudio(from: videoURL) { audioURL in
                      guard let audioURL = audioURL else {
                          DispatchQueue.main.async {
                              self.translatedText = "❌ فشل استخراج الصوت"
                              self.isTranslating = false
                          }
                          return
                      }

                      // 1. التعرف على الصوت (ASR)
                      self.performASR(audioURL: audioURL) { transcribedText in
                          guard let text = transcribedText, !text.isEmpty else {
                              DispatchQueue.main.async {
                                  self.translatedText = "❌ فشل التعرف على الصوت"
                                  self.isTranslating = false
                              }
                              return
                          }

                          // 2. ترجمة النص
                          self.performTranslation(text: text) { translation in
                              DispatchQueue.main.async {
                                  self.translatedText = translation ?? "❌ فشلت الترجمة"
                                  self.isTranslating = false
                              }
                          }
                      }
                  }
              }

              private func performASR(audioURL: URL, completion: @escaping (String?) -> Void) {
                  // للمحركات السحابية نستخدم Whisper كـ ASR أساسي (يمكن استبداله بـ SFSpeechRecognizer)
                  whisperManager.transcribe(audioURL: audioURL, completion: completion)
              }

              private func performTranslation(text: String, completion: @escaping (String?) -> Void) {
                  switch currentEngineName {
                  case "LibreTranslate":
                      libre.translate(text: text, completion: completion)
                  default:
                      // DeepLX + Whisper (الترجمة النصية عبر DeepLX)
                      deepLX.translate(text: text, completion: completion)
                  }
              }

              private func extractAudio(from videoURL: URL, completion: @escaping (URL?) -> Void) {
                  let asset = AVAsset(url: videoURL)
                  Task {
                      let tracks = (try? await asset.loadTracks(withMediaType: .audio)) ?? []
                      guard let audioTrack = tracks.first, audioTrack.trackID != kCMPersistentTrackID_Invalid else {
                          completion(nil)
                          return
                      }

                      let outputURL = FileManager.default.temporaryDirectory
                          .appendingPathComponent(UUID().uuidString)
                          .appendingPathExtension("m4a")
                      try? FileManager.default.removeItem(at: outputURL)

                      let exportSession = AVAssetExportSession(asset: asset, presetName: AVAssetExportPresetAppleM4A)
                      exportSession?.outputFileType = .m4a
                      exportSession?.outputURL = outputURL
                      exportSession?.exportAsynchronously {
                          completion(exportSession?.status == .completed ? outputURL : nil)
                      }
                  }
              }
          }
          EOF

          # ========== Utils/WhisperManager.swift (إصلاح: حفظ KVO + قراءة PCM سليمة) ==========
          cat > VideoDownloader/Utils/WhisperManager.swift << 'EOF'
          import Foundation
          import SwiftUI
          import AVFoundation

          class WhisperManager: ObservableObject {
              @Published var isModelReady = false
              @Published var isDownloading = false
              @Published var downloadProgress: Float = 0.0

              private var modelURL: URL?
              private let modelFileName = "ggml-base.bin"
              private let modelRemoteURL = "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.bin"
              private var downloadTask: URLSessionDownloadTask?
              // مهم: لو ما حفظناش الـ observation في property هيلغى فوراً ولن يصلك التقدم
              private var progressObservation: NSKeyValueObservation?

              init() {
                  let documentsURL = FileManager.default.urls(for: .documentDirectory, in: .userDomainMask).first!
                  modelURL = documentsURL.appendingPathComponent(modelFileName)
                  checkModelAvailability()
              }

              func checkModelAvailability() {
                  if let modelURL = modelURL, FileManager.default.fileExists(atPath: modelURL.path) {
                      isModelReady = true
                  } else {
                      isModelReady = false
                  }
              }

              func downloadModelIfNeeded() {
                  guard !isDownloading else { return }
                  guard let modelURL = modelURL else { return }

                  if FileManager.default.fileExists(atPath: modelURL.path) {
                      isModelReady = true
                      return
                  }

                  isDownloading = true
                  downloadProgress = 0.0

                  guard let url = URL(string: modelRemoteURL) else {
                      isDownloading = false
                      return
                  }

                  let session = URLSession(configuration: .default, delegate: nil, delegateQueue: .main)
                  downloadTask = session.downloadTask(with: url) { [weak self] location, response, error in
                      guard let self = self else { return }
                      self.isDownloading = false

                      if let location = location {
                          do {
                              try FileManager.default.moveItem(at: location, to: modelURL)
                              self.checkModelAvailability()
                              print("✅ تم تحميل نموذج Whisper بنجاح")
                          } catch {
                              print("❌ فشل حفظ النموذج: \(error)")
                          }
                      } else {
                          print("❌ فشل التحميل: \(error?.localizedDescription ?? "خطأ غير معروف")")
                      }
                  }

                  progressObservation = downloadTask?.progress.observe(\.fractionCompleted) { [weak self] progress, _ in
                      DispatchQueue.main.async {
                          self?.downloadProgress = Float(progress.fractionCompleted)
                      }
                  }
                  downloadTask?.resume()
              }

              // MARK: - الترجمة الصوتية الفعلية باستخدام Whisper
              func transcribe(audioURL: URL, completion: @escaping (String?) -> Void) {
                  guard isModelReady, let modelPath = modelURL?.path else {
                      completion(nil)
                      return
                  }

                  convertAudioToPCM(audioURL: audioURL) { pcmData in
                      guard let pcmData = pcmData else {
                          completion(nil)
                          return
                      }
                      self.transcribeWithWhisper(pcmData: pcmData, modelPath: modelPath, completion: completion)
                  }
              }

              private func convertAudioToPCM(audioURL: URL, completion: @escaping (Data?) -> Void) {
                  let asset = AVAsset(url: audioURL)
                  Task {
                      let tracks = (try? await asset.loadTracks(withMediaType: .audio)) ?? []
                      guard let audioTrack = tracks.first else {
                          completion(nil)
                          return
                      }

                      let outputSettings: [String: Any] = [
                          AVFormatIDKey: kAudioFormatLinearPCM,
                          AVSampleRateKey: 16000.0,
                          AVNumberOfChannelsKey: 1,
                          AVLinearPCMBitDepthKey: 16,
                          AVLinearPCMIsFloatKey: false,
                          AVLinearPCMIsBigEndianKey: false
                      ]

                      guard let reader = try? AVAssetReader(asset: asset) else {
                          completion(nil)
                          return
                      }
                      let output = AVAssetReaderTrackOutput(track: audioTrack, outputSettings: outputSettings)
                      reader.add(output)

                      var pcmData = Data()
                      reader.startReading()
                      while let sampleBuffer = output.copyNextSampleBuffer() {
                          if let blockBuffer = CMSampleBufferGetDataBuffer(sampleBuffer) {
                              // قراءة كل الأجزاء المتجاورة في البلوك (قد يكون مقسماً لأكثر من جزء)
                              let totalLength = CMBlockBufferGetDataLength(blockBuffer)
                              var offset = 0
                              while offset < totalLength {
                                  var chunkLength = 0
                                  var dataPointer: UnsafeMutablePointer<Int8>?
                                  let status = CMBlockBufferGetDataPointer(
                                      blockBuffer,
                                      atOffset: offset,
                                      lengthAtOffsetOut: &chunkLength,
                                      totalLengthOut: nil,
                                      dataPointerOut: &dataPointer
                                  )
                                  guard status == kCMBlockBufferNoErr, let pointer = dataPointer, chunkLength > 0 else { break }
                                  pcmData.append(UnsafeRawPointer(pointer), count: chunkLength)
                                  offset += chunkLength
                              }
                          }
                      }
                      completion(pcmData.isEmpty ? nil : pcmData)
                  }
              }

              private func transcribeWithWhisper(pcmData: Data, modelPath: String, completion: @escaping (String?) -> Void) {
                  // هنا يتم دمج SwiftWhisper (https://github.com/exPHAT/SwiftWhisper) أو whisper.cpp
                  // لاحظ: whisper.cpp يتوقع Float32 بمدى [-1, 1] عند 16kHz — حوّل Int16 بالقسمة على 32768
                  print("🔊 جاري الترجمة الصوتية باستخدام Whisper...")
                  print("📁 مسار النموذج: \(modelPath)")
                  print("📊 حجم بيانات PCM: \(pcmData.count) بايت")

                  // محاكاة (استبدلها بالكود الحقيقي من SwiftWhisper — انظر REVIEW.md)
                  DispatchQueue.global().asyncAfter(deadline: .now() + 2) {
                      completion("هذا نص تجريبي من Whisper. قم بدمج مكتبة SwiftWhisper للحصول على ترجمة صوتية حقيقية.")
                  }
              }
          }
          EOF

          # ========== Utils/DeepLTranslator.swift ==========
          cat > VideoDownloader/Utils/DeepLTranslator.swift << 'EOF'
          import Foundation

          class DeepLTranslator {
              private let apiURL = "https://deeplx.vercel.app/translate"

              func translate(text: String, completion: @escaping (String?) -> Void) {
                  guard let url = URL(string: apiURL) else { completion(nil); return }

                  var request = URLRequest(url: url)
                  request.httpMethod = "POST"
                  request.setValue("application/json", forHTTPHeaderField: "Content-Type")

                  let body: [String: Any] = ["text": text, "source_lang": "EN", "target_lang": "AR"]
                  request.httpBody = try? JSONSerialization.data(withJSONObject: body)

                  URLSession.shared.dataTask(with: request) { data, _, _ in
                      guard let data = data,
                            let json = try? JSONSerialization.jsonObject(with: data) as? [String: Any],
                            let translated = json["data"] as? String else {
                          completion(nil)
                          return
                      }
                      completion(translated)
                  }.resume()
              }
          }
          EOF

