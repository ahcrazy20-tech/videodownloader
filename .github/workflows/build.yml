              /// يتبع الـ redirects ويرجع الرابط النهائي المباشر
              private static func probeRedirect(_ urlString: String, completion: @escaping (URL?) -> Void) {
                  guard let u = URL(string: urlString) else { completion(nil); return }
                  var req = URLRequest(url: u, timeoutInterval: 12)
                  req.setValue(mobileUA, forHTTPHeaderField: "User-Agent")
                  req.setValue("bytes=0-1023", forHTTPHeaderField: "Range")
                  URLSession.shared.dataTask(with: req) { _, resp, err in
                      guard err == nil,
                            let http = resp as? HTTPURLResponse,
                            (http.statusCode == 200 || http.statusCode == 206),
                            let final = resp?.url,
                            final.absoluteString != urlString else {
                          completion(nil)
                          return
                      }
                      completion(final)
                  }.resume()
              }

              /// قائمة سيرفرات Invidious الحية من api.invidious.io
