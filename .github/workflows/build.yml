    - name: Fix Swift File Indentation
      run: |
        for f in $(find VideoFlow -name "*.swift"); do
          sed -i '' 's/^        //' "$f" 2>/dev/null || sed -i 's/^        //' "$f"
        done
        echo "✅ Indentation fixed"

    - name: Show Project Structure
      run: find . -not -path './.git/*' -not -path './build/*' | head -60

    - name: Build App
      run: |
        xcodebuild \
          -project VideoFlow.xcodeproj \
          -scheme VideoFlow \
          -configuration Release \
          -sdk iphoneos \
          -arch arm64 \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          ONLY_ACTIVE_ARCH=NO \
          BUILD_DIR=$PWD/build \
          clean build \
          2>&1 | tee build.log | grep -E "(error:|warning:|Build succeeded|FAILED|Compiling)" || true

    - name: Check Build Result
      run: |
        if grep -q "BUILD SUCCEEDED" build.log; then
          echo "✅ BUILD SUCCEEDED"
        else
          echo "❌ BUILD FAILED - Last 50 lines:"
          tail -50 build.log
          exit 1
        fi

    - name: Package IPA
      run: |
        APP_PATH=$(find build -name "VideoFlow.app" -type d | head -1)
        echo "App found at: $APP_PATH"
        mkdir -p Payload
        cp -r "$APP_PATH" Payload/VideoFlow.app
        zip -r VideoFlow.ipa Payload/
        rm -rf Payload/
        ls -lh VideoFlow.ipa
        echo "✅ IPA packaged successfully!"

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: VideoFlow-IPA
        path: VideoFlow.ipa
        retention-days: 30

    - name: Upload Build Log (on failure)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log
        retention-days: 7
