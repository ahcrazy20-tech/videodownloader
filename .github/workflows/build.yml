          import SwiftUI
          import AVFoundation
          import Photos

          class DownloadManager: NSObject, ObservableObject {
              @Published var downloads: [DownloadItem] = []
              private var session: URLSession!

              private let chunkedThreshold: Int64 = 1_000_000
              private let chunkedChunkSize: Int = 1_500_000
              private let chunkedConnections = 10

              var activeDownloads: [DownloadItem] {
                  downloads.filter { $0.isDownloading || $0.localURL == nil }
              }

              var completedDownloads: [DownloadItem] {
                  downloads.filter { !$0.isDownloading && $0.localURL != nil }
              }

              override init() {
                  super.init()
                  let config = URLSessionConfiguration.background(withIdentifier: "com.yourapp.download")
                  config.isDiscretionary = false
                  config.timeoutIntervalForRequest = 300
                  config.timeoutIntervalForResource = 7200
                  config.httpMaximumConnectionsPerHost = 16
                  config.shouldUseExtendedBackgroundIdleMode = true
                  config.requestCachePolicy = .reloadIgnoringLocalCacheData
                  session = URLSession(configuration: config, delegate: self, delegateQueue: .main)
              }

              func startDownload(url urlString: String, suggestedName: String? = nil) {
                  guard let url = URL(string: urlString) else { return }
                  if downloads.contains(where: { ($0.mediaURL == url || $0.url == url) && ($0.isDownloading || $0.localURL != nil) }) { return }

                  let item = DownloadItem(url: url)
                  item.mediaURL = url

                  var name = suggestedName ?? ""
                  if name.isEmpty || name == "videoplayback" {
                      name = url.lastPathComponent.isEmpty ? "video" : url.lastPathComponent
                  }
                  item.proposedName = sanitize(name)

                  DispatchQueue.main.async { self.downloads.insert(item, at: 0) }
                  beginMediaDownload(item: item, mediaURL: url)
              }

              func startSmartDownload(pageURL: String, completion: ((Bool, String?) -> Void)? = nil) {
                  let lower = pageURL.lowercased()
                  if VideoResolver.isDirectMediaURL(pageURL) ||
                     lower.contains("videoplayback") ||
                     lower.contains("googlevideo.com") ||
                     lower.contains(".m3u8") {
                      startDownload(url: pageURL)
                      completion?(true, nil)
                      return
                  }

                  guard let pageUrl = URL(string: pageURL) else {
                      completion?(false, "الرابط غير صالح")
                      return
                  }

                  let item = DownloadItem(url: pageUrl)
                  item.statusText = "جاري الاستخراج السريع…"
                  DispatchQueue.main.async { self.downloads.insert(item, at: 0) }
                  resolveItem(item, completion: completion)
              }

              func cancelDownload(_ item: DownloadItem) {
                  item.isCancelled = true
                  item.task?.cancel()
                  item.chunked?.cancel()
                  item.chunked = nil
                  item.hlsDownloader?.cancel()
                  item.hlsDownloader = nil
                  DispatchQueue.main.async {
                      item.isDownloading = false
                      item.failedMessage = "تم الإلغاء"
                      item.statusText = "تم الإلغاء"
                  }
              }

              func retryDownload(_ item: DownloadItem) {
                  item.isCancelled = false
                  item.failedMessage = nil
                  item.retryCount = 0
                  item.progress = 0
                  if let media = item.mediaURL {
                      beginMediaDownload(item: item, mediaURL: media)
                  } else {
                      resolveItem(item, completion: nil)
                  }
              }

              func deleteVideo(at index: Int) {
                  guard index < downloads.count else { return }
                  let item = downloads[index]
                  cancelDownload(item)
                  if let localURL = item.localURL {
                      try? FileManager.default.removeItem(at: localURL)
                  }
                  downloads.remove(at: index)
              }

              func saveToPhotos(item: DownloadItem, completion: @escaping (Bool, String) -> Void) {
                  guard let localURL = item.localURL else {
                      completion(false, "الملف غير موجود")
                      return
                  }
                  PHPhotoLibrary.requestAuthorization { status in
                      guard status == .authorized || status == .limited else {
                          completion(false, "يرجى منح الإذن للوصول للصور من إعدادات الآيفون")
                          return
                      }
                      PHPhotoLibrary.shared().performChanges({
                          PHAssetChangeRequest.creationRequestForAssetFromVideo(atFileURL: localURL)
                      }) { success, error in
                          if success {
                              completion(true, "تم حفظ الفيديو بنجاح في استوديو الصور ✅")
                          } else {
                              completion(false, "تعذر الحفظ: \(error?.localizedDescription ?? "خطأ غير معروف")")
                          }
                      }
                  }
              }

              func convertVideoToAudio(item: DownloadItem) {
                  guard let videoURL = item.localURL else { return }
                  let asset = AVAsset(url: videoURL)
                  let outputURL = FileManager.default.urls(for: .documentDirectory, in: .userDomainMask)[0]
                      .appendingPathComponent(item.displayTitle + ".m4a")

                  try? FileManager.default.removeItem(at: outputURL)

                  guard let exportSession = AVAssetExportSession(asset: asset, presetName: AVAssetExportPresetAppleM4A) else { return }
                  exportSession.outputFileType = .m4a
                  exportSession.outputURL = outputURL
                  exportSession.exportAsynchronously {
                      if exportSession.status == .completed {
                          DispatchQueue.main.async {
                              let newItem = DownloadItem(url: outputURL)
                              newItem.localURL = outputURL
                              newItem.proposedName = item.displayTitle + ".m4a"
                              newItem.isDownloading = false
                              newItem.statusText = "تم التحويل إلى صوت M4A ✅"
                              self.downloads.insert(newItem, at: 0)
                          }
                      }
                  }
              }

              private func resolveItem(_ item: DownloadItem, completion: ((Bool, String?) -> Void)?) {
                  item.statusText = "جاري استخراج الرابط بأقصى سرعة…"
                  VideoResolver.resolve(pageURL: item.url.absoluteString) { result in
                      DispatchQueue.main.async {
                          if item.isCancelled { return }
                          switch result {
                          case .success(let resolved):
                              item.mediaURL = resolved.url
                              item.backendLabel = resolved.sourceLabel
                              item.referer = resolved.referer
                              item.fromResolve = true
                              item.sourceVid = VideoResolver.extractYouTubeID(item.url.absoluteString)
                              if !resolved.filename.isEmpty { item.proposedName = self.sanitize(resolved.filename) }
                              item.statusText = "جاري بدء التحميل السريع…"
                              completion?(true, resolved.sourceLabel)
                              self.beginMediaDownload(item: item, mediaURL: resolved.url)
                          case .failure:
                              completion?(false, "تعذر استخراج الفيديو تلقائياً. جرب ضغط زر ⬇ بالمتصفح.")
                              self.failOrRetry(item: item, message: "فشل الاستخراج")
                          }
                      }
                  }
              }

              private func beginMediaDownload(item: DownloadItem, mediaURL: URL) {
                  if item.isCancelled { return }
                  item.isDownloading = true
                  item.failedMessage = nil
                  item.progress = 0
                  item.statusText = "جاري قياس السرعة…"

                  var probe = URLRequest(url: mediaURL, timeoutInterval: 15)
                  probe.setValue(MediaValidator.mobileUA, forHTTPHeaderField: "User-Agent")
                  if let r = item.referer, !r.isEmpty { probe.setValue(r, forHTTPHeaderField: "Referer") }
                  probe.setValue("bytes=0-1023", forHTTPHeaderField: "Range")

                  URLSession.shared.dataTask(with: probe) { data, resp, err in
                      var total: Int64 = 0
                      let mime = ((resp as? HTTPURLResponse)?.mimeType ?? "").lowercased()
                      if let hr = resp as? HTTPURLResponse {
                          if let cr = (hr.allHeaderFields["Content-Range"] as? String) ?? (hr.allHeaderFields["content-range"] as? String),
                             let slash = cr.lastIndex(of: "/") {
                              total = Int64(String(cr[cr.index(after: slash)...])) ?? 0
                          }
                          if total == 0, let cl = hr.allHeaderFields["Content-Length"] as? String {
                              total = Int64(cl) ?? 0
                          }
                      }
                      DispatchQueue.main.async {
                          if item.isCancelled { return }
                          if mime.contains("mpegurl") || mime.contains("x-mpegurl") ||
                             mediaURL.absoluteString.lowercased().contains(".m3u8") {
                              item.statusText = "تحميل بث HLS…"
                              self.startHLSDownload(item: item, mediaURL: mediaURL)
                          } else {
                              item.statusText = "تحميل ⚡ Turbo متوازي…"
                              self.startChunkedDownload(item: item, mediaURL: mediaURL, totalBytes: max(total, 10_000_000))
                          }
                      }
                  }.resume()
              }

              private func startPlainDownload(item: DownloadItem, mediaURL: URL) {
                  var req = URLRequest(url: mediaURL, timeoutInterval: 1800)
                  req.setValue(MediaValidator.mobileUA, forHTTPHeaderField: "User-Agent")
                  if let r = item.referer, !r.isEmpty { req.setValue(r, forHTTPHeaderField: "Referer") }
                  req.setValue("*/*", forHTTPHeaderField: "Accept")

                  let task = session.downloadTask(with: req)
                  item.task = task
                  task.resume()
              }

              private func startChunkedDownload(item: DownloadItem, mediaURL: URL, totalBytes: Int64) {
                  do {
                      let cd = try ChunkedDownloader(
                          url: mediaURL,
                          referer: item.referer ?? "",
                          userAgent: MediaValidator.mobileUA,
                          totalBytes: totalBytes,
                          chunkSize: chunkedChunkSize,
                          connections: chunkedConnections,
                          onProgress: { [weak item] p, speed in
                              guard let item = item, !item.isCancelled else { return }
                              DispatchQueue.main.async {
                                  item.progress = Float(p)
                                  item.speedText = speed
                                  item.statusText = String(format: "تحميل ⚡ %.0f%%", p * 100)
                              }
                          },
                          onComplete: { [weak self, weak item] result in
                              guard let self = self, let item = item else { return }
                              if item.isCancelled { return }
                              item.chunked = nil
                              switch result {
                              case .success(let tmpURL):
                                  self.finalizeDownload(item: item, tmpLocation: tmpURL, mime: nil)
                              case .failure:
                                  self.startPlainDownload(item: item, mediaURL: mediaURL)
                              }
                          })
                      item.chunked = cd
                      cd.start()
                  } catch {
                      startPlainDownload(item: item, mediaURL: mediaURL)
                  }
              }

              private func startHLSDownload(item: DownloadItem, mediaURL: URL) {
                  item.isDownloading = true
                  item.failedMessage = nil
                  do {
                      let hls = try HLSDownloader(
                          url: mediaURL,
                          userAgent: MediaValidator.mobileUA,
                          onProgress: { [weak item] p in
                              guard let item = item, !item.isCancelled else { return }
                              DispatchQueue.main.async {
                                  item.progress = Float(p)
                                  item.statusText = String(format: "تحميل HLS… %.0f%%", p * 100)
                              }
                          },
                          onComplete: { [weak self, weak item] result in
                              guard let self = self, let item = item, !item.isCancelled else { return }
                              item.hlsDownloader = nil
                              switch result {
                              case .success(let tmpURL):
                                  self.finalizeDownload(item: item, tmpLocation: tmpURL, mime: "video/mp2t")
                              case .failure:
                                  self.failOrRetry(item: item, message: "فشل تحميل بث HLS")
                              }
                          })
                      item.hlsDownloader = hls
                      hls.start()
                  } catch {
                      failOrRetry(item: item, message: "تعذر بدء تحميل HLS")
                  }
              }

              func audioFallback(for item: DownloadItem) {
                  guard let vid = item.sourceVid ?? VideoResolver.extractYouTubeID(item.url.absoluteString) else {
                      item.statusText = "لا يمكن جلب نسخة صوتية"
                      return
                  }
                  item.statusText = "جاري جلب نسخة MP4 / M4A جديدة…"
                  VideoResolver.y2jarContender(vid: vid) { result in
                      DispatchQueue.main.async {
                          switch result {
                          case .success(let resolved):
                              let base = item.proposedName.isEmpty ? "audio" : item.proposedName
                              self.startDownload(url: resolved.url.absoluteString, suggestedName: base + ".m4a")
                          case .failure:
                              item.statusText = "تعذر الجلب — جرب إعادة المحاولة"
                          }
                      }
                  }
              }

              private func finalizeDownload(item: DownloadItem, tmpLocation: URL, mime: String?) {
                  let fm = FileManager.default
                  if case .failed(let message) = MediaValidator.validateFile(at: tmpLocation) {
                      try? fm.removeItem(at: tmpLocation)
                      failOrRetry(item: item, message: message)
                      return
                  }

                  var name = item.proposedName.isEmpty ? "video" : item.proposedName
                  if !hasKnownMediaExtension(name) {
                      if let ext = MediaValidator.containerExtension(at: tmpLocation) {
                          name += "." + ext
                      } else {
                          let m = (mime ?? "").lowercased()
                          if m.contains("webm") { name += ".webm" }
                          else if m.contains("quicktime") { name += ".mov" }
                          else if m.contains("mpeg") || m.contains("mp3") { name += ".mp3" }
                          else { name += ".mp4" }
                      }
                  }
                  name = sanitize(name)

                  let destDir = fm.urls(for: .documentDirectory, in: .userDomainMask)[0]
                  var destPath = destDir.appendingPathComponent(name)
                  if fm.fileExists(atPath: destPath.path) {
                      let stem = (name as NSString).deletingPathExtension
                      let ext = (name as NSString).pathExtension
                      var i = 2
                      while fm.fileExists(atPath: destPath.path) {
                          destPath = destDir.appendingPathComponent(ext.isEmpty ? "\(stem) \(i)" : "\(stem) \(i).\(ext)")
                          i += 1
                      }
                  }
                  try? fm.removeItem(at: destPath)
                  do {
                      try fm.moveItem(at: tmpLocation, to: destPath)
                      try? fm.setAttributes([.protectionKey: FileProtectionType.none], ofItemAtPath: destPath.path)
                  } catch {
                      failOrRetry(item: item, message: "تعذر حفظ الملف")
                      return
                  }

                  item.localURL = destPath
                  item.progress = 1.0
                  item.isDownloading = false
                  item.failedMessage = nil
                  let ext = destPath.pathExtension.lowercased()
                  if ext == "webm" || ext == "mkv" {
                      item.statusText = "تم التحميل ⚠️ WebM — اضغط للتحويل لـ MP4"
                  } else {
                      item.statusText = "تم التحميل ✅ جاهز للتشغيل"
                  }
                  if item.proposedName.isEmpty { item.proposedName = destPath.lastPathComponent }
              }

              private func failOrRetry(item: DownloadItem, message: String) {
                  if item.isCancelled { return }
                  item.task = nil
                  if item.retryCount < 3 {
                      item.retryCount += 1
                      item.isDownloading = false
                      item.statusText = "إعادة المحاولة \(item.retryCount)/3…"
                      DispatchQueue.main.asyncAfter(deadline: .now() + 1.5) { [weak self, weak item] in
                          guard let self = self, let item = item, !item.isCancelled else { return }
                          if item.fromResolve {
                              self.resolveItem(item, completion: nil)
                          } else if let media = item.mediaURL {
                              self.beginMediaDownload(item: item, mediaURL: media)
                          } else {
                              self.resolveItem(item, completion: nil)
                          }
                      }
                  } else {
                      item.isDownloading = false
                      item.failedMessage = message
                      item.statusText = "فشل: \(message)"
                  }
              }

              private func hasKnownMediaExtension(_ name: String) -> Bool {
                  let exts = ["mp4", "m4v", "mov", "webm", "mkv", "avi", "m4a", "mp3", "aac", "ts", "flv"]
                  let low = name.lowercased()
                  return exts.contains { low.hasSuffix("." + $0) }
              }

              private func sanitize(_ s: String) -> String {
                  var out = s.replacingOccurrences(of: "/", with: "-")
                  let invalid = CharacterSet(charactersIn: "\\:*?\"<>|")
                  out = out.components(separatedBy: invalid).joined(separator: "-")
                  out = out.trimmingCharacters(in: .whitespacesAndNewlines)
                  return out.isEmpty ? "video" : out
              }
          }

          extension DownloadManager: URLSessionDownloadDelegate {
              func urlSession(_ session: URLSession, downloadTask: URLSessionDownloadTask, didFinishDownloadingTo location: URL) {
                  guard let item = downloads.first(where: { $0.task == downloadTask }) else { return }
                  if item.isCancelled { return }
                  let mime = (downloadTask.response as? HTTPURLResponse)?.mimeType
                  finalizeDownload(item: item, tmpLocation: location, mime: mime)
              }

              func urlSession(_ session: URLSession, downloadTask: URLSessionDownloadTask, didWriteData bytesWritten: Int64, totalBytesWritten: Int64, totalBytesExpectedToWrite: Int64) {
                  guard totalBytesExpectedToWrite > 0 else { return }
                  guard let item = downloads.first(where: { $0.task == downloadTask }) else { return }
                  if item.isCancelled { return }
                  let p = Float(totalBytesWritten) / Float(totalBytesExpectedToWrite)
                  item.progress = p
                  item.isDownloading = true
                  item.statusText = String(format: "جاري التحميل… %.0f%%", p * 100)
              }

              func urlSession(_ session: URLSession, task: URLSessionTask, didCompleteWithError error: Error?) {
                  guard let error = error else { return }
                  guard let downloadTask = task as? URLSessionDownloadTask else { return }
                  guard let item = downloads.first(where: { $0.task == downloadTask }) else { return }
                  if item.isCancelled { return }
                  if (error as NSError).code == -999 { return }
                  failOrRetry(item: item, message: error.localizedDescription)
              }
          }

          class DownloadItem: Identifiable, ObservableObject {
              let id = UUID()
              let url: URL
              var task: URLSessionDownloadTask?
              var chunked: ChunkedDownloader?
              var hlsDownloader: HLSDownloader?
              var mediaURL: URL?
              var proposedName: String = ""
              var referer: String?
              var fromResolve = false
              var sourceVid: String?
              var retryCount = 0
              var isCancelled = false

              @Published var progress: Float = 0.0
              @Published var speedText: String = ""
              @Published var isDownloading: Bool = false
              @Published var localURL: URL?
              @Published var statusText: String = "في الانتظار"
              @Published var backendLabel: String = ""
              @Published var failedMessage: String?

              var displayTitle: String {
                  if !proposedName.isEmpty && proposedName != "videoplayback" && proposedName != "video" {
                      return proposedName
                  }
                  if let vid = sourceVid ?? VideoResolver.extractYouTubeID(url.absoluteString) {
                      return "فيديو يوتيوب (\(vid))"
                  }
                  let last = url.lastPathComponent
                  return (last.isEmpty || last == "videoplayback") ? "فيديو محمل" : last
              }

              init(url: URL) { self.url = url }
          }
