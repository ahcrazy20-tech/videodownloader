              private static func ytDownloadAPIContender(vid: String, completion: @escaping (Result<ResolvedVideo, Error>) -> Void) {
                  let enc = "https://www.youtube.com/watch?v=\(vid)".addingPercentEncoding(withAllowedCharacters: .urlQueryAllowed) ?? ""
                  guard let u = URL(string: ytDLAPI + "/mp4/?url=" + enc) else {
