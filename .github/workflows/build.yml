name: Build VidBox iOS App for TrollStore

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-ios:
    runs-on: macos-14
    
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Create Project Structure
        run: |
          mkdir -p vidbox-app
          cd vidbox-app
          
          # Create package.json
          cat > package.json << 'PACKAGE_EOF'
          {
            "name": "vidbox",
            "private": true,
            "version": "2.0.0",
            "type": "module",
            "scripts": {
              "dev": "vite",
              "build": "vite build",
              "preview": "vite preview"
            },
            "dependencies": {
              "react": "^18.2.0",
              "react-dom": "^18.2.0",
              "zustand": "^4.5.0",
              "uuid": "^9.0.0",
              "lucide-react": "^0.300.0",
              "@capacitor/core": "^5.6.0",
              "@capacitor/ios": "^5.6.0"
            },
            "devDependencies": {
              "@types/react": "^18.2.0",
              "@types/react-dom": "^18.2.0",
              "@types/uuid": "^9.0.0",
              "@vitejs/plugin-react": "^4.2.0",
              "autoprefixer": "^10.4.16",
              "postcss": "^8.4.32",
              "tailwindcss": "^3.4.0",
              "typescript": "^5.3.0",
              "vite": "^5.0.0",
              "@capacitor/cli": "^5.6.0"
            }
          }
          PACKAGE_EOF

          # Create vite.config.ts
          cat > vite.config.ts << 'VITE_EOF'
          import { defineConfig } from 'vite'
          import react from '@vitejs/plugin-react'

          export default defineConfig({
            plugins: [react()],
            build: {
              outDir: 'dist',
              assetsDir: 'assets'
            }
          })
          VITE_EOF

          # Create tailwind.config.js
          cat > tailwind.config.js << 'TAILWIND_EOF'
          /** @type {import('tailwindcss').Config} */
          export default {
            content: ["./index.html", "./src/**/*.{js,ts,jsx,tsx}"],
            theme: { extend: {} },
            plugins: [],
          }
          TAILWIND_EOF

          # Create postcss.config.js
          cat > postcss.config.js << 'POSTCSS_EOF'
          export default {
            plugins: {
              tailwindcss: {},
              autoprefixer: {},
            },
          }
          POSTCSS_EOF

          # Create tsconfig.json
          cat > tsconfig.json << 'TSCONFIG_EOF'
          {
            "compilerOptions": {
              "target": "ES2020",
              "useDefineForClassFields": true,
              "lib": ["ES2020", "DOM", "DOM.Iterable"],
              "module": "ESNext",
              "skipLibCheck": true,
              "moduleResolution": "bundler",
              "allowImportingTsExtensions": true,
              "resolveJsonModule": true,
              "isolatedModules": true,
              "noEmit": true,
              "jsx": "react-jsx",
              "strict": true,
              "noUnusedLocals": false,
              "noUnusedParameters": false,
              "noFallthroughCasesInSwitch": true
            },
            "include": ["src"],
            "references": [{ "path": "./tsconfig.node.json" }]
          }
          TSCONFIG_EOF

          # Create tsconfig.node.json
          cat > tsconfig.node.json << 'TSNODE_EOF'
          {
            "compilerOptions": {
              "composite": true,
              "skipLibCheck": true,
              "module": "ESNext",
              "moduleResolution": "bundler",
              "allowSyntheticDefaultImports": true
            },
            "include": ["vite.config.ts"]
          }
          TSNODE_EOF

          # Create capacitor.config.ts
          cat > capacitor.config.ts << 'CAP_EOF'
          import { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.vidbox.app',
            appName: 'VidBox',
            webDir: 'dist',
            server: {
              androidScheme: 'https'
            },
            ios: {
              contentInset: 'automatic',
              preferredContentMode: 'mobile',
              scheme: 'VidBox'
            }
          };

          export default config;
          CAP_EOF

          # Create index.html
          cat > index.html << 'HTML_EOF'
          <!doctype html>
          <html lang="ar" dir="rtl">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
              <meta name="apple-mobile-web-app-capable" content="yes" />
              <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
              <meta name="apple-mobile-web-app-title" content="VidBox" />
              <meta name="theme-color" content="#0f172a" />
              <title>VidBox - متصفح ومحمّل فيديوهات</title>
            </head>
            <body class="overscroll-none">
              <div id="root"></div>
              <script type="module" src="/src/main.tsx"></script>
            </body>
          </html>
          HTML_EOF

          # Create src directory
          mkdir -p src/store src/components

      - name: Create Source Files
        run: |
          cd vidbox-app

          # Create src/index.css
          cat > src/index.css << 'CSS_EOF'
          @tailwind base;
          @tailwind components;
          @tailwind utilities;

          .safe-area-top { padding-top: env(safe-area-inset-top, 0px); }
          .safe-area-bottom { padding-bottom: env(safe-area-inset-bottom, 0px); }

          ::-webkit-scrollbar { width: 3px; }
          ::-webkit-scrollbar-track { background: transparent; }
          ::-webkit-scrollbar-thumb { background: rgba(100, 116, 139, 0.3); border-radius: 10px; }

          @keyframes slide-up {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
          }
          @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
          @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 5px rgba(6, 182, 212, 0.3); }
            50% { box-shadow: 0 0 20px rgba(6, 182, 212, 0.6); }
          }
          @keyframes splash-loading {
            0% { width: 0%; } 30% { width: 40%; } 60% { width: 70%; } 80% { width: 85%; } 100% { width: 100%; }
          }

          .animate-slide-up { animation: slide-up 0.3s ease-out; }
          .animate-fade-in { animation: fade-in 0.2s ease-out; }
          .animate-pulse-glow { animation: pulse-glow 2s ease-in-out infinite; }
          .splash-loading-bar { animation: splash-loading 2s ease-out forwards; }
          .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

          input[type="range"] { -webkit-appearance: none; height: 4px; background: rgba(100, 116, 139, 0.3); border-radius: 10px; outline: none; }
          input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: #06b6d4; cursor: pointer; }

          button, .no-select { -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
          html { -webkit-text-size-adjust: 100%; height: -webkit-fill-available; }
          body { min-height: 100vh; min-height: -webkit-fill-available; overscroll-behavior: none; -webkit-overflow-scrolling: touch; }
          video::-webkit-media-controls { display: none !important; }
          video::-webkit-media-controls-enclosure { display: none !important; }
          CSS_EOF

          # Create src/main.tsx
          cat > src/main.tsx << 'MAIN_EOF'
          import React from 'react'
          import ReactDOM from 'react-dom/client'
          import App from './App'
          import './index.css'

          ReactDOM.createRoot(document.getElementById('root')!).render(
            <React.StrictMode>
              <App />
            </React.StrictMode>,
          )
          MAIN_EOF

          # Create src/vite-env.d.ts
          cat > src/vite-env.d.ts << 'VITEENV_EOF'
          /// <reference types="vite/client" />
          VITEENV_EOF

      - name: Create Store
        run: |
          cd vidbox-app

          cat > src/store/useStore.ts << 'STORE_EOF'
          import { create } from 'zustand';
          import { v4 as uuidv4 } from 'uuid';

          export interface VideoItem {
            id: string;
            title: string;
            url: string;
            thumbnail: string;
            size: string;
            quality: string;
            duration: string;
            downloadedAt: string;
            sourceUrl: string;
            mimeType: string;
          }

          export interface DownloadTask {
            id: string;
            title: string;
            url: string;
            quality: string;
            progress: number;
            status: 'downloading' | 'completed' | 'failed' | 'paused';
            sourceUrl: string;
          }

          export interface DetectedVideo {
            url: string;
            title: string;
            thumbnail: string;
            qualities: { label: string; url: string; size?: string }[];
            mimeType: string;
            duration?: string;
          }

          export interface Bookmark {
            id: string;
            title: string;
            url: string;
            favicon: string;
            addedAt: string;
          }

          export interface HistoryEntry {
            id: string;
            title: string;
            url: string;
            visitedAt: string;
          }

          export type ActiveTab = 'browser' | 'downloads' | 'library' | 'player';

          interface AppState {
            activeTab: ActiveTab;
            setActiveTab: (tab: ActiveTab) => void;
            currentUrl: string;
            setCurrentUrl: (url: string) => void;
            isLoading: boolean;
            setIsLoading: (loading: boolean) => void;
            detectedVideos: DetectedVideo[];
            setDetectedVideos: (videos: DetectedVideo[]) => void;
            addDetectedVideo: (video: DetectedVideo) => void;
            clearDetectedVideos: () => void;
            showVideoPanel: boolean;
            setShowVideoPanel: (show: boolean) => void;
            downloads: DownloadTask[];
            addDownload: (task: Omit<DownloadTask, 'id' | 'progress' | 'status'>) => string;
            updateDownloadProgress: (id: string, progress: number) => void;
            completeDownload: (id: string) => void;
            failDownload: (id: string) => void;
            removeDownload: (id: string) => void;
            library: VideoItem[];
            addToLibrary: (video: Omit<VideoItem, 'id' | 'downloadedAt'>) => void;
            removeFromLibrary: (id: string) => void;
            clearLibrary: () => void;
            currentlyPlaying: VideoItem | null;
            setCurrentlyPlaying: (video: VideoItem | null) => void;
            playbackSpeed: number;
            setPlaybackSpeed: (speed: number) => void;
            bookmarks: Bookmark[];
            addBookmark: (bookmark: Omit<Bookmark, 'id' | 'addedAt'>) => void;
            removeBookmark: (id: string) => void;
            history: HistoryEntry[];
            addToHistory: (entry: Omit<HistoryEntry, 'id' | 'visitedAt'>) => void;
            clearHistory: () => void;
          }

          const useStore = create<AppState>((set) => ({
            activeTab: 'browser',
            setActiveTab: (tab) => set({ activeTab: tab }),
            currentUrl: '',
            setCurrentUrl: (url) => set({ currentUrl: url }),
            isLoading: false,
            setIsLoading: (loading) => set({ isLoading: loading }),
            detectedVideos: [],
            setDetectedVideos: (videos) => set({ detectedVideos: videos }),
            addDetectedVideo: (video) => set((s) => {
              const exists = s.detectedVideos.some(v => v.url === video.url);
              if (exists) return s;
              return { detectedVideos: [...s.detectedVideos, video] };
            }),
            clearDetectedVideos: () => set({ detectedVideos: [] }),
            showVideoPanel: false,
            setShowVideoPanel: (show) => set({ showVideoPanel: show }),
            downloads: [],
            addDownload: (task) => {
              const id = uuidv4();
              set((s) => ({ downloads: [...s.downloads, { ...task, id, progress: 0, status: 'downloading' }] }));
              return id;
            },
            updateDownloadProgress: (id, progress) => set((s) => ({
              downloads: s.downloads.map(d => d.id === id ? { ...d, progress } : d)
            })),
            completeDownload: (id) => set((s) => ({
              downloads: s.downloads.map(d => d.id === id ? { ...d, status: 'completed', progress: 100 } : d)
            })),
            failDownload: (id) => set((s) => ({
              downloads: s.downloads.map(d => d.id === id ? { ...d, status: 'failed' } : d)
            })),
            removeDownload: (id) => set((s) => ({ downloads: s.downloads.filter(d => d.id !== id) })),
            library: [],
            addToLibrary: (video) => set((s) => ({
              library: [{ ...video, id: uuidv4(), downloadedAt: new Date().toISOString() }, ...s.library]
            })),
            removeFromLibrary: (id) => set((s) => ({ library: s.library.filter(v => v.id !== id) })),
            clearLibrary: () => set({ library: [] }),
            currentlyPlaying: null,
            setCurrentlyPlaying: (video) => set({ currentlyPlaying: video }),
            playbackSpeed: 1,
            setPlaybackSpeed: (speed) => set({ playbackSpeed: speed }),
            bookmarks: [],
            addBookmark: (bookmark) => set((s) => ({
              bookmarks: [...s.bookmarks, { ...bookmark, id: uuidv4(), addedAt: new Date().toISOString() }]
            })),
            removeBookmark: (id) => set((s) => ({ bookmarks: s.bookmarks.filter(b => b.id !== id) })),
            history: [],
            addToHistory: (entry) => set((s) => ({
              history: [{ ...entry, id: uuidv4(), visitedAt: new Date().toISOString() }, ...s.history].slice(0, 100)
            })),
            clearHistory: () => set({ history: [] }),
          }));

          export default useStore;
          STORE_EOF

      - name: Create App Component
        run: |
          cd vidbox-app

          cat > src/App.tsx << 'APP_EOF'
          import { useState, useEffect } from 'react';
          import useStore from './store/useStore';
          import BottomNav from './components/BottomNav';
          import BrowserPage from './components/BrowserPage';
          import DownloadsPage from './components/DownloadsPage';
          import LibraryPage from './components/LibraryPage';
          import VideoPlayer from './components/VideoPlayer';

          function SplashScreen({ onDone }: { onDone: () => void }) {
            useEffect(() => {
              const timer = setTimeout(onDone, 2200);
              return () => clearTimeout(timer);
            }, [onDone]);

            return (
              <div className="fixed inset-0 z-[100] bg-slate-950 flex flex-col items-center justify-center animate-fade-in">
                <div className="relative mb-6">
                  <div className="w-28 h-28 rounded-[2rem] bg-gradient-to-br from-cyan-500 via-blue-500 to-purple-600 flex items-center justify-center shadow-2xl shadow-cyan-500/40 animate-pulse-glow">
                    <span className="text-6xl">📥</span>
                  </div>
                  <div className="absolute -bottom-1 -right-1 w-8 h-8 rounded-full bg-green-500 flex items-center justify-center border-4 border-slate-950">
                    <span className="text-sm">▶</span>
                  </div>
                </div>
                <h1 className="text-3xl font-black text-white mb-1 tracking-tight">VidBox</h1>
                <p className="text-cyan-400/80 text-sm font-medium mb-8">تصفح • اكتشف • حمّل • شاهد</p>
                <div className="w-48 h-1 bg-slate-800 rounded-full overflow-hidden">
                  <div className="h-full bg-gradient-to-r from-cyan-500 to-blue-500 rounded-full splash-loading-bar" />
                </div>
                <p className="text-slate-600 text-xs mt-3">v2.0 Pro</p>
              </div>
            );
          }

          export default function App() {
            const { activeTab } = useStore();
            const [showSplash, setShowSplash] = useState(true);

            if (showSplash) {
              return <SplashScreen onDone={() => setShowSplash(false)} />;
            }

            return (
              <div className="h-screen w-screen bg-slate-950 text-white overflow-hidden flex flex-col">
                <div className="flex-1 overflow-y-auto pb-16">
                  {activeTab === 'browser' && <BrowserPage />}
                  {activeTab === 'downloads' && <DownloadsPage />}
                  {activeTab === 'library' && <LibraryPage />}
                  {activeTab === 'player' && <VideoPlayer />}
                </div>
                <BottomNav />
              </div>
            );
          }
          APP_EOF

      - name: Create BottomNav Component
        run: |
          cd vidbox-app

          cat > src/components/BottomNav.tsx << 'BOTTOMNAV_EOF'
          import { Globe, Download, FolderOpen, Play } from 'lucide-react';
          import useStore, { ActiveTab } from '../store/useStore';

          const tabs: { id: ActiveTab; label: string; icon: React.ReactNode }[] = [
            { id: 'browser', label: 'المتصفح', icon: <Globe size={22} /> },
            { id: 'downloads', label: 'التحميلات', icon: <Download size={22} /> },
            { id: 'library', label: 'المكتبة', icon: <FolderOpen size={22} /> },
            { id: 'player', label: 'المشغّل', icon: <Play size={22} /> },
          ];

          export default function BottomNav() {
            const { activeTab, setActiveTab, downloads } = useStore();
            const activeDownloads = downloads.filter(d => d.status === 'downloading').length;

            return (
              <nav className="fixed bottom-0 left-0 right-0 z-50 bg-slate-900/95 backdrop-blur-xl border-t border-slate-700/50 safe-area-bottom">
                <div className="flex items-center justify-around h-16 max-w-lg mx-auto px-2">
                  {tabs.map(tab => {
                    const isActive = activeTab === tab.id;
                    return (
                      <button
                        key={tab.id}
                        onClick={() => setActiveTab(tab.id)}
                        className={`relative flex flex-col items-center justify-center gap-0.5 w-16 h-14 rounded-xl transition-all duration-200 ${isActive ? 'text-cyan-400 bg-cyan-400/10 scale-105' : 'text-slate-400 hover:text-slate-200 active:scale-95'}`}
                      >
                        <div className="relative">
                          {tab.icon}
                          {tab.id === 'downloads' && activeDownloads > 0 && (
                            <span className="absolute -top-1.5 -right-2.5 bg-red-500 text-white text-[9px] font-bold w-4 h-4 rounded-full flex items-center justify-center animate-pulse">
                              {activeDownloads}
                            </span>
                          )}
                        </div>
                        <span className="text-[10px] font-medium">{tab.label}</span>
                        {isActive && <div className="absolute -bottom-1 w-6 h-0.5 bg-cyan-400 rounded-full" />}
                      </button>
                    );
                  })}
                </div>
              </nav>
            );
          }
          BOTTOMNAV_EOF

      - name: Create VideoDetectorPanel Component
        run: |
          cd vidbox-app

          cat > src/components/VideoDetectorPanel.tsx << 'VIDPANEL_EOF'
          import { useState } from 'react';
          import { X, Download, Check, ChevronDown, ChevronUp, Video, Sparkles } from 'lucide-react';
          import useStore from '../store/useStore';

          export default function VideoDetectorPanel() {
            const { detectedVideos, setShowVideoPanel, addDownload, completeDownload, addToLibrary, setActiveTab } = useStore();
            const [expandedIdx, setExpandedIdx] = useState<number | null>(null);
            const [downloadingUrls, setDownloadingUrls] = useState<Set<string>>(new Set());
            const [downloadedUrls, setDownloadedUrls] = useState<Set<string>>(new Set());

            const handleDownload = (video: typeof detectedVideos[0], qualityIdx: number) => {
              const quality = video.qualities[qualityIdx];
              const downloadKey = `${video.url}-${quality.label}`;
              if (downloadingUrls.has(downloadKey) || downloadedUrls.has(downloadKey)) return;

              setDownloadingUrls(prev => new Set(prev).add(downloadKey));
              const taskId = addDownload({ title: video.title, url: quality.url, quality: quality.label, sourceUrl: video.url });

              let progress = 0;
              const interval = setInterval(() => {
                progress += Math.random() * 15 + 5;
                if (progress >= 100) {
                  progress = 100;
                  clearInterval(interval);
                  completeDownload(taskId);
                  addToLibrary({
                    title: video.title, url: quality.url, thumbnail: video.thumbnail,
                    size: quality.size || 'Unknown', quality: quality.label,
                    duration: video.duration || 'Unknown', sourceUrl: video.url, mimeType: video.mimeType,
                  });
                  setDownloadingUrls(prev => { const next = new Set(prev); next.delete(downloadKey); return next; });
                  setDownloadedUrls(prev => new Set(prev).add(downloadKey));
                }
                useStore.getState().updateDownloadProgress(taskId, Math.min(progress, 100));
              }, 300);
            };

            return (
              <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-end">
                <div className="w-full max-h-[85vh] bg-slate-900 rounded-t-3xl border-t border-slate-700/50 overflow-hidden animate-slide-up">
                  <div className="sticky top-0 z-10 bg-slate-900/95 backdrop-blur-xl px-4 py-3 border-b border-slate-700/50">
                    <div className="w-10 h-1 bg-slate-600 rounded-full mx-auto mb-3" />
                    <div className="flex items-center justify-between">
                      <div className="flex items-center gap-2">
                        <div className="w-8 h-8 rounded-lg bg-gradient-to-br from-cyan-500 to-blue-500 flex items-center justify-center">
                          <Video size={16} className="text-white" />
                        </div>
                        <div>
                          <h2 className="text-white font-bold text-sm">فيديوهات مكتشفة</h2>
                          <p className="text-slate-500 text-xs">{detectedVideos.length} فيديو قابل للتحميل</p>
                        </div>
                      </div>
                      <button onClick={() => setShowVideoPanel(false)} className="text-slate-400 hover:text-white p-2 bg-slate-800 rounded-xl">
                        <X size={18} />
                      </button>
                    </div>
                  </div>
                  <div className="overflow-y-auto max-h-[70vh] px-4 py-3 space-y-3">
                    {detectedVideos.map((video, idx) => {
                      const isExpanded = expandedIdx === idx;
                      return (
                        <div key={idx} className="bg-slate-800/50 rounded-2xl border border-slate-700/30 overflow-hidden">
                          <button onClick={() => setExpandedIdx(isExpanded ? null : idx)} className="w-full flex items-center gap-3 p-3">
                            <div className="w-24 h-16 rounded-xl bg-slate-700 flex-shrink-0 overflow-hidden relative">
                              {video.thumbnail ? <img src={video.thumbnail} alt="" className="w-full h-full object-cover" /> : <div className="w-full h-full flex items-center justify-center text-3xl">🎬</div>}
                              {video.duration && <span className="absolute bottom-1 right-1 bg-black/80 text-white text-[9px] px-1.5 py-0.5 rounded">{video.duration}</span>}
                            </div>
                            <div className="flex-1 min-w-0 text-right">
                              <p className="text-white text-sm font-medium line-clamp-2">{video.title}</p>
                              <p className="text-cyan-400 text-xs mt-1">{video.qualities.length} جودة متاحة</p>
                            </div>
                            {isExpanded ? <ChevronUp size={18} className="text-slate-400" /> : <ChevronDown size={18} className="text-slate-400" />}
                          </button>
                          {isExpanded && (
                            <div className="px-3 pb-3 space-y-2 border-t border-slate-700/30 pt-3">
                              <div className="flex items-center gap-1.5 mb-2"><Sparkles size={12} className="text-yellow-400" /><span className="text-xs text-slate-400 font-medium">اختر الجودة:</span></div>
                              {video.qualities.map((quality, qIdx) => {
                                const downloadKey = `${video.url}-${quality.label}`;
                                const isDownloading = downloadingUrls.has(downloadKey);
                                const isDownloaded = downloadedUrls.has(downloadKey);
                                return (
                                  <button key={qIdx} onClick={() => handleDownload(video, qIdx)} disabled={isDownloading || isDownloaded}
                                    className={`w-full flex items-center justify-between p-3 rounded-xl transition-all ${isDownloaded ? 'bg-green-500/10 border border-green-500/30' : isDownloading ? 'bg-cyan-500/10 border border-cyan-500/30' : 'bg-slate-700/30 border border-slate-600/30 hover:border-cyan-500/30 active:scale-[0.98]'}`}>
                                    <div className="flex items-center gap-3">
                                      <div className={`w-8 h-8 rounded-lg flex items-center justify-center ${quality.label.includes('4K') || quality.label.includes('2160') ? 'bg-gradient-to-br from-purple-500 to-pink-500' : quality.label.includes('1080') ? 'bg-gradient-to-br from-cyan-500 to-blue-500' : quality.label.includes('720') ? 'bg-gradient-to-br from-green-500 to-emerald-500' : 'bg-gradient-to-br from-orange-500 to-yellow-500'}`}>
