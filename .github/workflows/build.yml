        # ==========================================
        cat > VideoFlow/Extractors/UltimateExtractor.swift << 'SWIFTEOF'
        import Foundation

        struct ExtractedStream {
            let url: String
            let quality: VideoQuality
            let headers: [String: String]
            let filename: String?
            let hasAudio: Bool
            let container: String
        }

        struct ExtractedVideo {
            let title: String
            let streams: [ExtractedStream]
            let thumbnail: String?
            let sourceType: VideoSourceType
        }

        enum ExError: LocalizedError {
            case allFailed(String), invalidURL, noStreams, network(String), needSpecificVideo
            var errorDescription: String? {
                switch self {
                case .allFailed(let m): return m
                case .invalidURL: return "Invalid URL"
                case .noStreams: return "No videos found"
                case .network(let m): return m
                case .needSpecificVideo: return "Please open a specific video page"
                }
            }
        }

        class UltimateExtractor {
            static let shared = UltimateExtractor()

            private let cobaltMirrors = [
                "https://api.cobalt.tools",
                "https://co.wuk.sh",
                "https://cobalt-api.kwiatekmiki.com",
                "https://cobalt-backend.canine.tools",
                "https://cobalt.synzr.space",
                "https://capi.oak.li",
                "https://cobalt-api.ayo.tf",
                "https://api.dl.sauw.ca"
            ]

            func detectSite(_ url: String) -> VideoSourceType {
                let l = url.lowercased()
                if l.contains("youtube.com") || l.contains("youtu.be") { return .youtube }
                if l.contains("tiktok.com") { return .tiktok }
                if l.contains("instagram.com") { return .instagram }
                if l.contains("facebook.com") || l.contains("fb.watch") { return .facebook }
                if l.contains("twitter.com") || l.contains("x.com") { return .twitter }
                if l.contains("reddit.com") { return .reddit }
                if l.contains("vimeo.com") { return .vimeo }
                if l.contains(".m3u8") { return .hls }
                if l.contains(".mp4") || l.contains(".webm") { return .direct }
                return .other
            }
            
            func isValidVideoURL(_ url: String, site: VideoSourceType) -> Bool {
                let l = url.lowercased()
                switch site {
                case .tiktok: return l.contains("/video/") || l.contains("/@")
                case .youtube: return l.contains("watch?v=") || l.contains("youtu.be/") || l.contains("/shorts/")
                case .instagram: return l.contains("/p/") || l.contains("/reel/") || l.contains("/tv/")
                case .facebook: return l.contains("/videos/") || l.contains("/watch") || l.contains("fb.watch")
                case .twitter: return l.contains("/status/")
                default: return true
                }
            }

            func extract(from url: String, quality: VideoQuality = .p1080, audioOnly: Bool = false, capturedURLs: [String] = [], completion: @escaping (Result<ExtractedVideo, Error>) -> Void) {
                let site = detectSite(url)
                
                if site == .direct || site == .hls {
                    let s = ExtractedStream(url: url, quality: quality, headers: [:], filename: nil, hasAudio: true, container: site == .hls ? "m3u8" : "mp4")
                    completion(.success(ExtractedVideo(title: URL(string: url)?.lastPathComponent ?? "Video", streams: [s], thumbnail: nil, sourceType: site)))
                    return
                }

                if !isValidVideoURL(url, site: site) {
                    if let best = findBestCapturedURL(capturedURLs, site: site) {
                        let container = best.lowercased().contains(".m3u8") ? "m3u8" : "mp4"
                        let s = ExtractedStream(url: best, quality: quality, headers: getHeaders(refUrl: url), filename: nil, hasAudio: true, container: container)
                        completion(.success(ExtractedVideo(title: "Captured", streams: [s], thumbnail: nil, sourceType: site)))
                        return
                    }
                    completion(.failure(ExError.needSpecificVideo))
                    return
                }

                trySiteSpecific(url: url, site: site, quality: quality) { [weak self] r in
                    switch r {
                    case .success(let v): completion(.success(v))
                    case .failure:
                        self?.tryCobaltChain(url: url, quality: quality, audioOnly: audioOnly, idx: 0) { r2 in
                            switch r2 {
                            case .success(let v): completion(.success(v))
                            case .failure:
                                if let best = self?.findBestCapturedURL(capturedURLs, site: site) {
                                    let container = best.lowercased().contains(".m3u8") ? "m3u8" : "mp4"
                                    let s = ExtractedStream(url: best, quality: quality, headers: self?.getHeaders(refUrl: url) ?? [:], filename: nil, hasAudio: true, container: container)
                                    completion(.success(ExtractedVideo(title: "Captured", streams: [s], thumbnail: nil, sourceType: site)))
                                } else {
                                    completion(.failure(ExError.allFailed("All methods failed")))
                                }
                            }
                        }
                    }
                }
            }
            
            func findBestCapturedURL(_ urls: [String], site: VideoSourceType) -> String? {
                return urls.sorted { scoreURL($0) > scoreURL($1) }.first
            }
            
            private func scoreURL(_ url: String) -> Int {
                let l = url.lowercased()
                var s = 0
                if l.contains(".mp4") { s += 100 }
                if l.contains(".webm") { s += 80 }
                if l.contains(".m3u8") { s += 50 }
                if l.contains("1080") { s += 30 }
                if l.contains("720") { s += 20 }
                if l.contains("blank.mp4") { s -= 200 }
                if l.contains("thumbnail") { s -= 100 }
                return s
            }
            
            func getHeaders(refUrl: String) -> [String: String] {
                var h = ["User-Agent": "Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1"]
                if let host = URL(string: refUrl)?.host {
                    h["Referer"] = "https://\(host)/"
                    h["Origin"] = "https://\(host)"
                }
                return h
            }

            private func trySiteSpecific(url: String, site: VideoSourceType, quality: VideoQuality, completion: @escaping (Result<ExtractedVideo, Error>) -> Void) {
                switch site {
                case .tiktok: tikTokExtract(url, completion: completion)
                case .twitter: twitterExtract(url, completion: completion)
                case .reddit: redditExtract(url, completion: completion)
                case .instagram: instagramExtract(url, completion: completion)
                case .facebook: facebookExtract(url, completion: completion)
                default: completion(.failure(ExError.noStreams))
                }
            }

            private func tikTokExtract(_ url: String, completion: @escaping (Result<ExtractedVideo, Error>) -> Void) {
                guard let api = URL(string: "https://tikwm.com/api/") else { completion(.failure(ExError.invalidURL)); return }
                var req = URLRequest(url: api); req.httpMethod = "POST"
                req.setValue("application/x-www-form-urlencoded", forHTTPHeaderField: "Content-Type")
                req.setValue("Mozilla/5.0", forHTTPHeaderField: "User-Agent")
                req.httpBody = "url=\(url.addingPercentEncoding(withAllowedCharacters: .urlQueryAllowed) ?? url)&hd=1".data(using: .utf8)

                URLSession.shared.dataTask(with: req) { data, _, _ in
                    guard let data = data, let j = try? JSONSerialization.jsonObject(with: data) as? [String: Any],
                          let d = j["data"] as? [String: Any] else { completion(.failure(ExError.noStreams)); return }
                    var streams: [ExtractedStream] = []
                    let title = d["title"] as? String ?? "TikTok Video"
                    if let u = d["hdplay"] as? String { streams.append(ExtractedStream(url: u, quality: .p1080, headers: [:], filename: nil, hasAudio: true, container: "mp4")) }
                    if let u = d["play"] as? String { streams.append(ExtractedStream(url: u, quality: .p720, headers: [:], filename: nil, hasAudio: true, container: "mp4")) }
                    if let u = d["music"] as? String { streams.append(ExtractedStream(url: u, quality: .audio, headers: [:], filename: "audio", hasAudio: true, container: "mp3")) }
                    streams.isEmpty ? completion(.failure(ExError.noStreams)) : completion(.success(ExtractedVideo(title: title, streams: streams, thumbnail: d["cover"] as? String, sourceType: .tiktok)))
                }.resume()
            }

            private func twitterExtract(_ url: String, completion: @escaping (Result<ExtractedVideo, Error>) -> Void) {
                let api = url.replacingOccurrences(of: "x.com", with: "api.fxtwitter.com").replacingOccurrences(of: "twitter.com", with: "api.fxtwitter.com")
                guard let u = URL(string: api) else { completion(.failure(ExError.invalidURL)); return }
                URLSession.shared.dataTask(with: u) { data, _, _ in
                    guard let data = data, let j = try? JSONSerialization.jsonObject(with: data) as? [String: Any],
                          let tw = j["tweet"] as? [String: Any] else { completion(.failure(ExError.noStreams)); return }
                    var streams: [ExtractedStream] = []
                    if let m = tw["media"] as? [String: Any], let vs = m["videos"] as? [[String: Any]] {
                        for v in vs { if let vu = v["url"] as? String { streams.append(ExtractedStream(url: vu, quality: .p720, headers: [:], filename: nil, hasAudio: true, container: "mp4")) } }
                    }
                    let title = String((tw["text"] as? String ?? "Twitter Video").prefix(60))
                    streams.isEmpty ? completion(.failure(ExError.noStreams)) : completion(.success(ExtractedVideo(title: title, streams: streams, thumbnail: nil, sourceType: .twitter)))
                }.resume()
            }

            private func redditExtract(_ url: String, completion: @escaping (Result<ExtractedVideo, Error>) -> Void) {
                var jurl = url; if !jurl.hasSuffix(".json") { jurl += (jurl.hasSuffix("/") ? ".json" : "/.json") }
                guard let u = URL(string: jurl) else { completion(.failure(ExError.invalidURL)); return }
                var req = URLRequest(url: u); req.setValue("VideoFlow/7.0", forHTTPHeaderField: "User-Agent")
                URLSession.shared.dataTask(with: req) { data, _, _ in
                    guard let data = data, let arr = try? JSONSerialization.jsonObject(with: data) as? [Any],
                          let first = arr.first as? [String: Any], let pd = first["data"] as? [String: Any],
                          let ch = pd["children"] as? [[String: Any]], let post = ch.first?["data"] as? [String: Any] else { completion(.failure(ExError.noStreams)); return }
                    let title = post["title"] as? String ?? "Reddit Video"
                    if let m = post["media"] as? [String: Any], let rv = m["reddit_video"] as? [String: Any], let fu = rv["fallback_url"] as? String {
                        completion(.success(ExtractedVideo(title: title, streams: [ExtractedStream(url: fu, quality: .p720, headers: [:], filename: nil, hasAudio: true, container: "mp4")], thumbnail: nil, sourceType: .reddit)))
                    } else { completion(.failure(ExError.noStreams)) }
                }.resume()
            }

            private func instagramExtract(_ url: String, completion: @escaping (Result<ExtractedVideo, Error>) -> Void) {
                guard let u = URL(string: url) else { completion(.failure(ExError.invalidURL)); return }
                var req = URLRequest(url: u)
                req.setValue("Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15", forHTTPHeaderField: "User-Agent")
                URLSession.shared.dataTask(with: req) { data, _, _ in
                    guard let data = data, let html = String(data: data, encoding: .utf8) else { completion(.failure(ExError.noStreams)); return }
                    for p in ["\"video_url\":\"([^\"]+)\"", "\"contentUrl\":\"([^\"]+\\.mp4[^\"]*)\""] {
                        if let rx = try? NSRegularExpression(pattern: p), let m = rx.firstMatch(in: html, range: NSRange(html.startIndex..., in: html)), let r = Range(m.range(at: 1), in: html) {
                            let vu = String(html[r]).replacingOccurrences(of: "\\u0026", with: "&").replacingOccurrences(of: "\\/", with: "/")
                            if vu.hasPrefix("http") {
                                completion(.success(ExtractedVideo(title: "Instagram Video", streams: [ExtractedStream(url: vu, quality: .p720, headers: ["Referer": "https://www.instagram.com/"], filename: nil, hasAudio: true, container: "mp4")], thumbnail: nil, sourceType: .instagram)))
                                return
                            }
                        }
                    }
                    completion(.failure(ExError.noStreams))
                }.resume()
            }

            private func facebookExtract(_ url: String, completion: @escaping (Result<ExtractedVideo, Error>) -> Void) {
                let mu = url.replacingOccurrences(of: "www.facebook.com", with: "m.facebook.com")
                guard let u = URL(string: mu) else { completion(.failure(ExError.invalidURL)); return }
                var req = URLRequest(url: u); req.setValue("Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15", forHTTPHeaderField: "User-Agent")
                URLSession.shared.dataTask(with: req) { data, _, _ in
                    guard let data = data, let html = String(data: data, encoding: .utf8) else { completion(.failure(ExError.noStreams)); return }
                    var streams: [ExtractedStream] = []
                    let hdrs = ["Referer": "https://www.facebook.com/"]
                    for (p, q) in [("hd_src\":\"([^\"]+)\"", VideoQuality.p1080), ("sd_src\":\"([^\"]+)\"", VideoQuality.p480)] {
                        if let rx = try? NSRegularExpression(pattern: p), let m = rx.firstMatch(in: html, range: NSRange(html.startIndex..., in: html)), let r = Range(m.range(at: 1), in: html) {
                            let vu = String(html[r]).replacingOccurrences(of: "\\/", with: "/").replacingOccurrences(of: "\\u0026", with: "&")
                            if !streams.contains(where: { $0.quality == q }) { streams.append(ExtractedStream(url: vu, quality: q, headers: hdrs, filename: nil, hasAudio: true, container: "mp4")) }
                        }
                    }
                    streams.isEmpty ? completion(.failure(ExError.noStreams)) : completion(.success(ExtractedVideo(title: "Facebook Video", streams: streams, thumbnail: nil, sourceType: .facebook)))
                }.resume()
            }

            private func tryCobaltChain(url: String, quality: VideoQuality, audioOnly: Bool, idx: Int, completion: @escaping (Result<ExtractedVideo, Error>) -> Void) {
                guard idx < cobaltMirrors.count else { completion(.failure(ExError.allFailed("Cobalt"))); return }
                cobaltRequest(mirror: cobaltMirrors[idx], videoURL: url, quality: quality.cobaltValue, audioOnly: audioOnly) { [weak self] r in
                    switch r {
                    case .success(let v): completion(.success(v))
                    case .failure: self?.tryCobaltChain(url: url, quality: quality, audioOnly: audioOnly, idx: idx + 1, completion: completion)
                    }
                }
            }

            private func cobaltRequest(mirror: String, videoURL: String, quality: String, audioOnly: Bool, completion: @escaping (Result<ExtractedVideo, Error>) -> Void) {
                guard let api = URL(string: mirror) else { completion(.failure(ExError.invalidURL)); return }
                var req = URLRequest(url: api); req.httpMethod = "POST"; req.timeoutInterval = 20
                req.setValue("application/json", forHTTPHeaderField: "Content-Type")
                req.setValue("application/json", forHTTPHeaderField: "Accept")
                req.setValue("VideoFlow/7.0", forHTTPHeaderField: "User-Agent")
                let body: [String: Any] = ["url": videoURL, "videoQuality": quality, "audioFormat": "mp3", "audioBitrate": "320", "filenameStyle": "pretty", "downloadMode": audioOnly ? "audio" : "auto", "youtubeVideoCodec": "h264", "tiktokFullAudio": true, "tiktokH265": false]
                req.httpBody = try? JSONSerialization.data(withJSONObject: body)

                URLSession.shared.dataTask(with: req) { [weak self] data, _, error in
                    if error != nil { completion(.failure(ExError.noStreams)); return }
                    guard let data = data, let j = try? JSONSerialization.jsonObject(with: data) as? [String: Any] else { completion(.failure(ExError.noStreams)); return }
                    let site = self?.detectSite(videoURL) ?? .other

                    if let st = j["status"] as? String {
                        if ["tunnel", "redirect", "stream"].contains(st), let u = j["url"] as? String {
                            let fn = j["filename"] as? String ?? "Video"
                            let title = fn.replacingOccurrences(of: ".mp4", with: "").replacingOccurrences(of: ".mp3", with: "")
                            let container = fn.hasSuffix(".mp3") ? "mp3" : "mp4"
                            completion(.success(ExtractedVideo(title: title, streams: [ExtractedStream(url: u, quality: .p1080, headers: [:], filename: fn, hasAudio: true, container: container)], thumbnail: nil, sourceType: site)))
                        } else if st == "picker", let pk = j["picker"] as? [[String: Any]] {
                            let ss = pk.compactMap { $0["url"] as? String }.map { ExtractedStream(url: $0, quality: .p720, headers: [:], filename: nil, hasAudio: true, container: "mp4") }
                            ss.isEmpty ? completion(.failure(ExError.noStreams)) : completion(.success(ExtractedVideo(title: "Media", streams: ss, thumbnail: nil, sourceType: site)))
                        } else { completion(.failure(ExError.noStreams)) }
                    } else if let u = j["url"] as? String {
                        completion(.success(ExtractedVideo(title: j["filename"] as? String ?? "Video", streams: [ExtractedStream(url: u, quality: .p1080, headers: [:], filename: nil, hasAudio: true, container: "mp4")], thumbnail: nil, sourceType: site)))
                    } else { completion(.failure(ExError.noStreams)) }
                }.resume()
            }
        }
