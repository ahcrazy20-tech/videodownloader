        cat > VideoFlow/Views/LibraryView.swift << 'SWIFTEOF'
        import SwiftUI

        struct LibraryView: View {
            @EnvironmentObject var downloadManager: DownloadManager
            @EnvironmentObject var playerManager: PlayerManager
            @State private var search = ""

            var filtered: [DownloadTask] {
                search.isEmpty ? downloadManager.completedVideos :
                downloadManager.completedVideos.filter {
                    $0.video.title.localizedCaseInsensitiveContains(search)
                }
            }

            var body: some View {
                NavigationView {
                    Group {
                        if filtered.isEmpty {
                            EmptyState(icon:"play.rectangle.fill", title:"Library Empty",
                                       sub:"Downloaded videos appear here")
                        } else {
                            ScrollView {
                                LazyVGrid(columns:[GridItem(.flexible()),GridItem(.flexible())],spacing:12) {
                                    ForEach(filtered) { task in
                                        GridCard(task:task) { playerManager.playVideo(task) }
                                    }
                                }.padding()
                            }
                        }
                    }
                    .searchable(text:$search, prompt:"Search videos")
                    .navigationTitle("My Library")
                }
            }
        }

        struct GridCard: View {
            let task: DownloadTask; let onPlay: ()->Void
            var body: some View {
                Button(action:onPlay) {
                    VStack(alignment:.leading,spacing:6) {
                        ZStack {
                            RoundedRectangle(cornerRadius:10).fill(Color.blue.opacity(0.2))
                                .aspectRatio(16/9,contentMode:.fit)
                            Image(systemName:"play.circle.fill").font(.system(size:38)).foregroundColor(.blue)
                        }
                        Text(task.video.title).font(.system(size:12,weight:.medium))
                            .foregroundColor(.primary).lineLimit(2).multilineTextAlignment(.leading)
                        HStack {
                            Text(task.quality.rawValue).font(.system(size:10,weight:.bold))
                                .foregroundColor(.white).padding(.horizontal,6).padding(.vertical,2)
                                .background(task.quality.color).cornerRadius(4)
                            Spacer()
                            if let d = task.video.duration {
                                Text(d).font(.system(size:10)).foregroundColor(.secondary)
                            }
                        }
                    }
                }.buttonStyle(.plain)
            }
        }
