          import Foundation
          import SwiftUI

          class SubtitleSyncManager: ObservableObject {
              @Published var subtitleOffset: Double = 0.0
              @Published var isSyncEnabled = true

              func adjustOffset(by seconds: Double) {
                  subtitleOffset += seconds
                  subtitleOffset = max(-10.0, min(10.0, subtitleOffset))
                  print("⏱️ توقيت الترجمة: \(subtitleOffset > 0 ? "+" : "")\(subtitleOffset) ثانية")
              }

              func resetOffset() {
                  subtitleOffset = 0.0
              }

              func getAdjustedTime(for originalTime: Double) -> Double {
                  guard isSyncEnabled else { return originalTime }
                  return originalTime + subtitleOffset
              }
          }

          struct SubtitleSyncControls: View {
              @ObservedObject var syncManager: SubtitleSyncManager

              var body: some View {
                  VStack(spacing: 12) {
                      HStack {
                          Text("تزامن الترجمة")
                              .font(.headline)
                          Spacer()
                          Toggle("", isOn: $syncManager.isSyncEnabled)
                              .labelsHidden()
                      }

                      HStack(spacing: 20) {
                          Button {
                              syncManager.adjustOffset(by: -0.5)
                          } label: {
                              Image(systemName: "minus.circle.fill")
                                  .font(.title2)
                          }

                          Text(String(format: "%.1f ث", syncManager.subtitleOffset))
                              .font(.title3)
                              .fontWeight(.semibold)
                              .frame(minWidth: 70)
                              .foregroundColor(syncManager.subtitleOffset == 0 ? .primary : .blue)

                          Button {
                              syncManager.adjustOffset(by: 0.5)
                          } label: {
                              Image(systemName: "plus.circle.fill")
                                  .font(.title2)
                          }

                          Button {
                              syncManager.resetOffset()
                          } label: {
                              Image(systemName: "arrow.counterclockwise")
                                  .font(.title2)
                          }
                      }

                      Slider(
                          value: $syncManager.subtitleOffset,
                          in: -10...10,
                          step: 0.1,
                          minimumValueLabel: Text("-10s"),
                          maximumValueLabel: Text("+10s")
                      ) {
                          Text("توقيت الترجمة")
                      }
                      .tint(.blue)
                  }
                  .padding()
                  .background(Color(.systemGray6))
                  .cornerRadius(12)
              }
          }
          EOF

          # ========== Views/TranslationSettingsView.swift ==========
          cat > VideoDownloader/Views/TranslationSettingsView.swift << 'EOF'
          import SwiftUI

          struct TranslationSettingsView: View {
              @ObservedObject var translationManager: SmartTranslationManager
              @Environment(\.dismiss) var dismiss
              @StateObject private var whisperManager = WhisperManager()
              @State private var customEndpoint: String = ""

              var body: some View {
                  NavigationView {
                      List {
                          Section("محركات الترجمة") {
                              ForEach(translationManager.availableEngines, id: \.name) { engine in
                                  HStack {
                                      Text(engine.name)
                                      Spacer()
                                      if engine.name == translationManager.currentEngine.name {
                                          Image(systemName: "checkmark.circle.fill")
                                              .foregroundColor(.green)
                                      }
                                  }
                                  .contentShape(Rectangle())
                                  .onTapGesture {
                                      translationManager.switchToEngine(named: engine.name)
                                  }
                              }
                          }

                          Section("نموذج Whisper") {
                              HStack {
                                  Text("الحالة")
                                  Spacer()
                                  Text(whisperManager.isModelReady ? "✅ جاهز" : "❌ غير موجود")
                                      .foregroundColor(whisperManager.isModelReady ? .green : .red)
                              }

                              if !whisperManager.isModelReady {
                                  Button {
                                      whisperManager.downloadModelIfNeeded()
                                  } label: {
                                      if whisperManager.isDownloading {
                                          HStack {
                                              ProgressView()
                                                  .progressViewStyle(CircularProgressViewStyle())
                                                  .scaleEffect(0.8)
                                              Text("\(Int(whisperManager.downloadProgress * 100))%")
                                          }
                                      } else {
                                          Text("تحميل نموذج Whisper")
                                      }
                                  }
                                  .disabled(whisperManager.isDownloading)
                              }
                          }

                          Section("سيرفر الاستخراج (يوتيوب، تيك توك، انستجرام...)") {
                              TextField("أضف سيرفر cobalt خاص: https://...", text: $customEndpoint)
                                  .textInputAutocapitalization(.never)
                                  .autocorrectionDisabled()
                                  .font(.caption)

                              Button("إضافة السيرفر") {
                                  VideoResolver.addCustomEndpoint(customEndpoint)
                                  customEndpoint = ""
                              }
                              .disabled(customEndpoint.trimmingCharacters(in: .whitespaces).isEmpty)

                              ForEach(VideoResolver.resolverEndpoints, id: \.self) { endpoint in
                                  Text(endpoint)
                                      .font(.caption2)
                                      .foregroundColor(.secondary)
                                      .lineLimit(1)
                              }

                              Text("💡 لضمان يوتيوب والسوشيال ميديا بشكل موثوق: استضف cobalt بنفسك (سطر واحد Docker) ثم أضف رابطه هنا.")
                                  .font(.caption2)
                                  .foregroundColor(.orange)
                          }

                          Section {
                              Text("إصدار محرك التحميل: V16 Final — تم إصلاح كافة أخطاء البناء والرفع")
                                  .font(.caption2)
                                  .foregroundColor(.secondary)
                          }

                          Section("سجل آخر محاولة استخراج") {
                              if VideoResolver.lastTrials.isEmpty {
                                  Text("لسه مفيش محاولات — جرّب تحميل فيديو من المتصفح وارجع هنا تاني")
                                      .font(.caption2)
                                      .foregroundColor(.secondary)
                              } else {
                                  ForEach(VideoResolver.lastTrials, id: \.self) { t in
                                      Text(t)
                                          .font(.caption2)
                                          .foregroundColor(t.hasPrefix("✅") ? .green : .red)
                                  }
                              }
                          }
                      }
                      .navigationTitle("إعدادات الترجمة")
                      .navigationBarTitleDisplayMode(.inline)
                      .toolbar {
                          Button("تم") { dismiss() }
                      }
                  }
              }
          }
          EOF

      # 3. إنشاء Info.plist
      - name: 📝 Write Info.plist
        run: |
          cat > VideoDownloader/Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>NSAppTransportSecurity</key>
              <dict><key>NSAllowsArbitraryLoads</key><true/></dict>
              <key>UIFileSharingEnabled</key><true/>
              <key>LSSupportsOpeningDocumentsInPlace</key><true/>
              <key>NSPhotoLibraryAddUsageDescription</key>
              <string>يحتاج التطبيق لإذن حفظ الفيديوهات المكتملة في استوديو الصور الخاص بك.</string>
              <key>NSPhotoLibraryUsageDescription</key>
              <string>يحتاج التطبيق للوصول للصور لحفظ الفيديوهات المحملة.</string>
              <key>UIBackgroundModes</key>
              <array><string>audio</string><string>fetch</string></array>
          </dict>
          </plist>
          EOF

      # 4. إنشاء ExportOptions.plist
      - name: 📝 Write ExportOptions.plist
        run: |
          cat > ExportOptions.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>development</string>
              <key>teamID</key>
              <string>XXXXXXXXXX</string>
              <key>signingStyle</key>
              <string>manual</string>
          </dict>
          </plist>
          EOF

      # 5. إنشاء project.yml
      - name: 📝 Write project.yml
        run: |
          cat > project.yml << 'EOF'
          name: VideoDownloader
          options:
            bundleIdPrefix: com.example
            deploymentTarget:
              iOS: "16.4"
          targets:
            VideoDownloader:
              type: application
              platform: iOS
              sources: [VideoDownloader]
              info:
                path: VideoDownloader/Info.plist
                properties:
                  CFBundleDisplayName: VideoDownloader
                  CFBundleIdentifier: com.example.VideoDownloader
                  UILaunchScreen: {}
                  NSAppTransportSecurity:
                    NSAllowsArbitraryLoads: true
                  UIFileSharingEnabled: true
                  LSSupportsOpeningDocumentsInPlace: true
                  NSPhotoLibraryAddUsageDescription: يحتاج التطبيق لإذن حفظ الفيديوهات في استوديو الصور.
                  NSPhotoLibraryUsageDescription: يحتاج التطبيق للوصول للصور لحفظ الفيديوهات المحملة.
                  UIBackgroundModes: [audio, fetch]
          EOF

      # 6. تثبيت XcodeGen
      - name: 🛠 Install XcodeGen
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen

      # 7. إنشاء مشروع Xcode
      - name: 🏗 Generate Xcode project
        run: xcodegen generate

      # 8. بناء التطبيق بدون توقيع
      - name: 🏗 Build .app (unsigned)
        run: |
          xcodebuild -project VideoDownloader.xcodeproj \
            -scheme VideoDownloader \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ./DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      # 9. حزم التطبيق في IPA
      - name: 📦 Package IPA
        run: |
          APP_PATH=$(find ./DerivedData -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then echo "❌ .app not found"; exit 1; fi
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r VideoDownloader.ipa Payload/

      # 10. رفع الـ IPA
      - name: ⬆️ Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: VideoDownloader-MultiEngine
          path: VideoDownloader.ipa
