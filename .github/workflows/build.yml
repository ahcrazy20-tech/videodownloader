    - name: Fix Swift Indentation
      run: |
        for f in $(find VideoFlow -name "*.swift"); do
          sed -i '' 's/^        //' "$f" 2>/dev/null || true
        done

    - name: Verify Files
      run: find VideoFlow -type f | sort

    - name: Build App
      run: |
        xcodebuild \
          -project VideoFlow.xcodeproj \
          -scheme VideoFlow \
          -configuration Release \
          -sdk iphoneos \
          -arch arm64 \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          ONLY_ACTIVE_ARCH=NO \
          BUILD_DIR=$PWD/build \
          clean build \
          2>&1 | tee build.log | grep -E "(error:|warning:|Build succeeded|FAILED|Compiling)" || true

    - name: Check Build
      run: |
        if grep -q "BUILD SUCCEEDED" build.log; then
          echo "BUILD SUCCEEDED"
        else
          echo "BUILD FAILED"
          tail -100 build.log
          exit 1
        fi

    - name: Package IPA
      run: |
        APP=$(find build -name "VideoFlow.app" -type d | head -1)
        mkdir -p Payload
        cp -r "$APP" Payload/VideoFlow.app
        zip -r VideoFlow-v6.ipa Payload/
        rm -rf Payload/
        ls -lh VideoFlow-v6.ipa

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: VideoFlow-v6-ULTIMATE
        path: VideoFlow-v6.ipa
        retention-days: 30

    - name: Upload Log on Failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log
        retention-days: 7
