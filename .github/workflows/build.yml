        cat > VideoFlow/Views/BrowserView.swift << 'SWIFTEOF'
        import SwiftUI
        import WebKit

        struct CapturedVideo: Identifiable, Hashable {
            let id = UUID()
            let url: String
            let source: String
            let mimeType: String?
            var quality: String {
                let u = url.lowercased()
                if u.contains("2160") { return "4K" }
                if u.contains("1080") { return "1080p" }
                if u.contains("720") { return "720p" }
                if u.contains("480") { return "480p" }
                if u.contains(".m3u8") { return "HLS" }
                return "Auto"
            }
            var type: String {
                let u = url.lowercased()
                if u.contains(".mp4") { return "MP4" }
                if u.contains(".m3u8") { return "HLS" }
                if u.contains(".webm") { return "WebM" }
                if u.contains(".mp3") { return "Audio" }
                return "Video"
            }
            var isDirect: Bool { url.lowercased().contains(".mp4") || url.lowercased().contains(".webm") }
            var canDownload: Bool { isDirect || url.lowercased().contains(".m3u8") }
        }

        class BrowserVM: ObservableObject {
            @Published var urlText = ""
            @Published var isLoading = false
            @Published var canGoBack = false
            @Published var canGoForward = false
            @Published var isSecure = true
            @Published var captured: [CapturedVideo] = []
            @Published var adsBlocked: Int = 0
            var seenURLs = Set<String>()
            weak var webView: WKWebView?

            init() { navigate(to: "https://www.google.com") }

            func navigate(to raw: String) {
                var s = raw.trimmingCharacters(in: .whitespaces)
                if !s.hasPrefix("http://") && !s.hasPrefix("https://") {
                    if s.contains(".") && !s.contains(" ") { s = "https://" + s }
                    else { s = "https://www.google.com/search?q=\(s.addingPercentEncoding(withAllowedCharacters: .urlQueryAllowed) ?? s)" }
                }
                guard let url = URL(string: s) else { return }
                webView?.load(URLRequest(url: url)); urlText = s
            }

            func goBack() { webView?.goBack() }
            func goForward() { webView?.goForward() }
            func reload() { webView?.reload() }
            func stop() { webView?.stopLoading() }

            func addCapture(url: String, source: String, mime: String? = nil) {
                let u = url.lowercased()
                guard !seenURLs.contains(url) else { return }
                if u.contains("blank.mp4") { return }
                if u.contains(".ts") && !u.contains(".mp4") && !u.contains(".m3u8") { return }
                if u.contains("chunk") || u.contains("segment") { return }
                if url.count < 20 { return }
                if u.contains("thumbnail") { return }
                
                let isVideo = u.contains(".mp4") || u.contains(".m3u8") || u.contains(".webm") || u.contains(".mov") || u.contains(".mp3") || u.contains("googlevideo") || u.contains("fbcdn.net") || u.contains("cdninstagram") || u.contains("tiktokcdn") || (mime?.contains("video") ?? false)
                guard isVideo else { return }
                
                seenURLs.insert(url)
                let cap = CapturedVideo(url: url, source: source, mimeType: mime)
                DispatchQueue.main.async {
                    if cap.isDirect { self.captured.insert(cap, at: 0) }
                    else { self.captured.append(cap) }
                }
            }

            func clearCaptures() {
                captured = []
                seenURLs = []
                adsBlocked = 0
            }
        }

        struct DetectionJS {
            static let source: String = {
                var js = ""
                js += "(function(){"
                js += "var found=new Set();"
                js += "function report(url,src){"
                js += "if(!url||found.has(url))return;"
                js += "if(url.includes('.mp4')||url.includes('.m3u8')||url.includes('.webm')||url.includes('.mov')||url.includes('.mp3')||url.includes('googlevideo')||url.includes('fbcdn.net')||url.includes('cdninstagram')||url.includes('tiktokcdn')||url.includes('videoplayback')){"
                js += "found.add(url);"
                js += "try{window.webkit.messageHandlers.videoCapture.postMessage({url:url,source:src});}catch(e){}"
                js += "}"
                js += "}"
                js += "function scanVideos(){"
                js += "document.querySelectorAll('video').forEach(function(v){"
                js += "if(v.src)report(v.src,'video-tag');"
                js += "if(v.currentSrc)report(v.currentSrc,'video-currentSrc');"
                js += "v.querySelectorAll('source').forEach(function(s){if(s.src)report(s.src,'source-tag');});"
                js += "});"
                js += "}"
                js += "var oFetch=window.fetch;"
                js += "window.fetch=function(){"
                js += "var url=typeof arguments[0]==='string'?arguments[0]:(arguments[0]&&arguments[0].url?arguments[0].url:'');"
                js += "report(url,'fetch');"
                js += "return oFetch.apply(this,arguments);"
                js += "};"
                js += "var oXHR=XMLHttpRequest.prototype.open;"
                js += "XMLHttpRequest.prototype.open=function(m,url){"
                js += "report(url,'xhr');"
                js += "return oXHR.apply(this,arguments);"
                js += "};"
                js += "var obs=new MutationObserver(function(){scanVideos();});"
                js += "if(document.body)obs.observe(document.body,{childList:true,subtree:true});"
                js += "setInterval(scanVideos,3000);"
                js += "setTimeout(scanVideos,1500);"
                js += "setTimeout(scanVideos,5000);"
                js += "})();"
                return js
            }()
        }

        struct SmartWebView: UIViewRepresentable {
            @ObservedObject var vm: BrowserVM

            func makeUIView(context: Context) -> WKWebView {
                let cfg = WKWebViewConfiguration()
                cfg.allowsInlineMediaPlayback = true
                cfg.mediaTypesRequiringUserActionForPlayback = []
                
                // Inject detection JS
                let detectionScript = WKUserScript(source: DetectionJS.source, injectionTime: .atDocumentEnd, forMainFrameOnly: false)
                cfg.userContentController.addUserScript(detectionScript)
                
                // Inject ad blocker JS
                let adBlockScript = WKUserScript(source: AdBlocker.adBlockJS, injectionTime: .atDocumentStart, forMainFrameOnly: false)
                cfg.userContentController.addUserScript(adBlockScript)
                
                cfg.userContentController.add(context.coordinator, name: "videoCapture")
                
                let wv = WKWebView(frame: .zero, configuration: cfg)
                wv.navigationDelegate = context.coordinator
                wv.uiDelegate = context.coordinator
                wv.allowsBackForwardNavigationGestures = true
                wv.customUserAgent = "Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1"
                vm.webView = wv
                return wv
            }

            func updateUIView(_ wv: WKWebView, context: Context) {}
            func makeCoordinator() -> Coordinator { Coordinator(vm: vm) }

            class Coordinator: NSObject, WKNavigationDelegate, WKUIDelegate, WKScriptMessageHandler {
                let vm: BrowserVM
                init(vm: BrowserVM) { self.vm = vm }

                func userContentController(_ c: WKUserContentController, didReceive msg: WKScriptMessage) {
                    if let body = msg.body as? [String: Any], let url = body["url"] as? String {
                        vm.addCapture(url: url, source: body["source"] as? String ?? "js")
                    }
                }

                func webView(_ wv: WKWebView, didStartProvisionalNavigation _: WKNavigation!) {
                    vm.isLoading = true
                    vm.clearCaptures()
                }

                func webView(_ wv: WKWebView, didFinish _: WKNavigation!) {
                    vm.isLoading = false
                    vm.canGoBack = wv.canGoBack
                    vm.canGoForward = wv.canGoForward
                    vm.urlText = wv.url?.absoluteString ?? ""
                    vm.isSecure = wv.url?.scheme == "https"
                }

                func webView(_ wv: WKWebView, didFail _: WKNavigation!, withError _: Error) { vm.isLoading = false }

                func webView(_ wv: WKWebView, decidePolicyFor action: WKNavigationAction, decisionHandler: @escaping (WKNavigationActionPolicy) -> Void) {
                    if let url = action.request.url?.absoluteString {
                        // Ad blocker: block navigation to ad domains
                        if AdBlocker.shouldBlock(url: url) {
                            DispatchQueue.main.async { self.vm.adsBlocked += 1 }
                            decisionHandler(.cancel)
                            return
                        }
                        vm.addCapture(url: url, source: "navigation")
                    }
                    decisionHandler(.allow)
                }

                func webView(_ wv: WKWebView, decidePolicyFor response: WKNavigationResponse, decisionHandler: @escaping (WKNavigationResponsePolicy) -> Void) {
                    if let url = response.response.url?.absoluteString {
                        if AdBlocker.shouldBlock(url: url) {
                            DispatchQueue.main.async { self.vm.adsBlocked += 1 }
                            decisionHandler(.cancel)
                            return
                        }
                    }
                    if let http = response.response as? HTTPURLResponse {
                        let mime = http.mimeType?.lowercased() ?? ""
                        if mime.contains("video") || mime.contains("audio") || mime.contains("mpegurl") {
                            if let url = http.url?.absoluteString { vm.addCapture(url: url, source: "response", mime: mime) }
                        }
                    }
                    decisionHandler(.allow)
                }

                func webView(_ wv: WKWebView, createWebViewWith _: WKWebViewConfiguration, for action: WKNavigationAction, windowFeatures: WKWindowFeatures) -> WKWebView? {
                    if action.targetFrame == nil { wv.load(action.request) }
                    return nil
                }
            }
        }

        struct BrowserView: View {
            @StateObject private var vm = BrowserVM()
            @EnvironmentObject var dm: DownloadManager
            @State private var isExtracting = false
            @State private var showQuality = false
            @State private var msg: String?
            @State private var showMsg = false
            @State private var showCaptured = false
            @State private var extractResult: ExtractedVideo?
            @State private var showStreams = false

            var body: some View {
                NavigationView {
                    ZStack {
                        Color.black.ignoresSafeArea()
                        VStack(spacing: 0) {
                            addressBar
                            if vm.isLoading { ProgressView().progressViewStyle(.linear).tint(.blue).frame(height: 2) }
                            SmartWebView(vm: vm).ignoresSafeArea(edges: .bottom)
                            bottomBar
                        }
                        if isExtracting { extractingOverlay }
                    }
                    .navigationBarHidden(true)
                }
                .confirmationDialog("Download Quality", isPresented: $showQuality, titleVisibility: .visible) {
                    Button("⚡ Best Quality") { doExtract(.p1080) }
                    Button("4K 2160p") { doExtract(.p2160) }
                    Button("1080p Full HD") { doExtract(.p1080) }
                    Button("720p HD") { doExtract(.p720) }
                    Button("480p SD") { doExtract(.p480) }
                    Button("360p Low") { doExtract(.p360) }
                    Button("🎵 Audio MP3") { doExtract(.audio, audio: true) }
                    Button("Cancel", role: .cancel) {}
                }
                .alert("VideoFlow", isPresented: $showMsg) { Button("OK") {} } message: { Text(msg ?? "") }
                .sheet(isPresented: $showCaptured) { CapturedSheet(captured: vm.captured, dm: dm) }
                .sheet(isPresented: $showStreams) {
                    if let r = extractResult { StreamsSheet(video: r) { s, q in downloadStream(s, q, r) } }
                }
            }

            var addressBar: some View {
                HStack(spacing: 8) {
                    HStack(spacing: 6) {
                        Image(systemName: vm.isSecure ? "lock.fill" : "lock.open.fill").foregroundColor(vm.isSecure ? .green : .orange).font(.system(size: 12))
                        TextField("Search or URL...", text: $vm.urlText).foregroundColor(.white).font(.system(size: 14)).keyboardType(.URL).autocapitalization(.none).disableAutocorrection(true).onSubmit { vm.navigate(to: vm.urlText) }
                        if !vm.urlText.isEmpty { Button { vm.urlText = "" } label: { Image(systemName: "xmark.circle.fill").foregroundColor(.gray).font(.system(size: 14)) } }
                        // Ad blocker indicator
                        if vm.adsBlocked > 0 {
                            HStack(spacing: 2) {
                                Image(systemName: "shield.fill").font(.system(size: 10)).foregroundColor(.green)
                                Text("\(vm.adsBlocked)").font(.system(size: 10, weight: .bold)).foregroundColor(.green)
                            }
                        }
                    }
                    .padding(.horizontal, 10).padding(.vertical, 8).background(Color.white.opacity(0.1)).cornerRadius(10)
                    Button { vm.navigate(to: vm.urlText) } label: {
                        Text("Go").foregroundColor(.blue).font(.system(size: 14, weight: .semibold))
                    }
                }
                .padding(.horizontal, 12).padding(.vertical, 8)
            }

            var bottomBar: some View {
                HStack(spacing: 4) {
                    bBtn("chevron.left", on: vm.canGoBack) { vm.goBack() }
                    bBtn("chevron.right", on: vm.canGoForward) { vm.goForward() }
                    bBtn(vm.isLoading ? "xmark" : "arrow.clockwise", on: true) { vm.isLoading ? vm.stop() : vm.reload() }
                    Spacer()
                    if !vm.captured.isEmpty {
                        Button { showCaptured = true } label: {
                            HStack(spacing: 3) {
                                Image(systemName: "antenna.radiowaves.left.and.right").font(.system(size: 12))
                                Text("\(vm.captured.count)").font(.system(size: 11, weight: .bold))
                            }
                            .foregroundColor(.white).padding(.horizontal, 8).padding(.vertical, 6).background(Color.green).cornerRadius(14)
                        }
                    }
                    Button { showQuality = true } label: {
                        HStack(spacing: 4) {
                            Image(systemName: "arrow.down.circle.fill").font(.system(size: 15))
                            Text("Download").font(.system(size: 12, weight: .bold))
                        }
                        .foregroundColor(.white).padding(.horizontal, 12).padding(.vertical, 8)
                        .background(LinearGradient(colors: [.red, .orange], startPoint: .leading, endPoint: .trailing)).cornerRadius(18)
                    }.disabled(isExtracting)
                    Spacer()
                    bBtn("house.fill", on: true) { vm.navigate(to: "https://www.google.com") }
                    bBtn("square.and.arrow.up", on: true) { shareURL() }
                }
                .padding(.horizontal, 12).padding(.vertical, 8).background(Color.white.opacity(0.05))
            }

            var extractingOverlay: some View {
                Color.black.opacity(0.7).ignoresSafeArea().overlay(
                    VStack(spacing: 14) {
                        ProgressView().tint(.white).scaleEffect(1.8)
                        Text("Extracting Video...").foregroundColor(.white).font(.headline)
                        Text("Multi-threaded IDM engine").foregroundColor(.gray).font(.caption)
                    }
                    .padding(30).background(RoundedRectangle(cornerRadius: 18).fill(Color(.systemGray6).opacity(0.95)))
                )
            }

            func bBtn(_ icon: String, on: Bool, action: @escaping () -> Void) -> some View {
                Button(action: action) { Image(systemName: icon).font(.system(size: 18)).foregroundColor(on ? .white : .gray.opacity(0.3)).frame(width: 38, height: 38) }.disabled(!on)
            }

            func doExtract(_ q: VideoQuality, audio: Bool = false) {
                guard let url = vm.webView?.url?.absoluteString else { msg = "No URL"; showMsg = true; return }
                isExtracting = true
                let capturedURLs = vm.captured.map { $0.url }
                UltimateExtractor.shared.extract(from: url, quality: q, audioOnly: audio, capturedURLs: capturedURLs) { r in
                    DispatchQueue.main.async {
                        isExtracting = false
                        switch r {
                        case .success(let v):
                            if v.streams.count == 1 {
                                downloadStream(v.streams[0], q, v)
                                msg = "✅ Download started!\n\n\(v.title)"
                                showMsg = true
                            } else {
                                extractResult = v
                                showStreams = true
                            }
                        case .failure(let e):
                            let downloadable = vm.captured.filter { $0.canDownload }
                            if !downloadable.isEmpty {
                                msg = "❌ Auto extraction failed.\n\n💡 \(downloadable.count) video(s) captured - tap GREEN badge"
                            } else {
                                msg = "❌ \(e.localizedDescription)"
                            }
                            showMsg = true
                        }
                    }
                }
            }

            func downloadStream(_ s: ExtractedStream, _ q: VideoQuality, _ v: ExtractedVideo) {
                let video = VideoItem(id: UUID().uuidString, title: v.title, url: s.url, thumbnailURL: v.thumbnail, availableQualities: [q], sourceType: v.sourceType, headers: s.headers)
                dm.startDownload(video: video, quality: q)
            }

            func shareURL() {
                guard let url = vm.webView?.url else { return }
                let vc = UIActivityViewController(activityItems: [url], applicationActivities: nil)
                if let sc = UIApplication.shared.connectedScenes.first as? UIWindowScene,
                   let root = sc.windows.first?.rootViewController {
                    root.present(vc, animated: true)
                }
            }
        }

