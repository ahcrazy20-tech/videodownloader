          import Foundation

          class DeepLTranslator {
              private let apiURL = "https://deeplx.vercel.app/translate"

              func translate(text: String, completion: @escaping (String?) -> Void) {
                  guard let url = URL(string: apiURL) else { completion(nil); return }

                  var request = URLRequest(url: url)
                  request.httpMethod = "POST"
                  request.setValue("application/json", forHTTPHeaderField: "Content-Type")

                  let body: [String: Any] = ["text": text, "source_lang": "EN", "target_lang": "AR"]
                  request.httpBody = try? JSONSerialization.data(withJSONObject: body)

                  URLSession.shared.dataTask(with: request) { data, _, _ in
                      guard let data = data,
                            let json = try? JSONSerialization.jsonObject(with: data) as? [String: Any],
                            let translated = json["data"] as? String else {
                          completion(nil)
                          return
                      }
                      completion(translated)
                  }.resume()
              }
          }
