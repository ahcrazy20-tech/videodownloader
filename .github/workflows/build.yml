              private static func pipedContender(vid: String, completion: @escaping (Result<ResolvedVideo, Error>) -> Void) {
                  fetchPipedList { mirrors in
                      let list = mirrors.isEmpty ? pipedMirrors : mirrors
                      pipedTry(Array(list.prefix(6)), index: 0, vid: vid, completion: completion)
                  }
              }

              private static var cachedPiped: [String] = []
              private static var pipedCacheTime = Date.distantPast

              /// قائمة سيرفرات Piped الحية من piped-instances.kavin.rocks
              private static func fetchPipedList(completion: @escaping ([String]) -> Void) {
                  if !cachedPiped.isEmpty, Date().timeIntervalSince(pipedCacheTime) < 600 {
                      completion(cachedPiped)
                      return
                  }
                  guard let url = URL(string: "https://piped-instances.kavin.rocks/") else {
                      completion(cachedPiped)
                      return
                  }
                  var req = URLRequest(url: url, timeoutInterval: 10)
                  req.setValue(mobileUA, forHTTPHeaderField: "User-Agent")
                  URLSession.shared.dataTask(with: req) { data, _, err in
                      guard let data = data, err == nil,
                            let arr = (try? JSONSerialization.jsonObject(with: data)) as? [[String: Any]] else {
                          completion(cachedPiped)
                          return
                      }
                      var out: [String] = []
                      for entry in arr {
                          for key in ["api_url", "apiUrl", "url"] {
                              if let s = entry[key] as? String, s.hasPrefix("https://") {
                                  out.append(s)
                                  break
                              }
                          }
                      }
                      if !out.isEmpty {
                          cachedPiped = out
                          pipedCacheTime = Date()
                      }
                      completion(out.isEmpty ? cachedPiped : out)
                  }.resume()
              }

              private static func pipedTry(_ mirrors: [String], index: Int, vid: String, completion: @escaping (Result<ResolvedVideo, Error>) -> Void) {
                  guard index < mirrors.count else {
                      completion(.failure(NSError(domain: "VideoResolver", code: 40)))
                      return
                  }
                  guard let url = URL(string: mirrors[index] + "/streams/" + vid) else {
                      pipedTry(mirrors, index: index + 1, vid: vid, completion: completion)
                      return
                  }
                  var req = URLRequest(url: url, timeoutInterval: 12)
                  req.setValue(mobileUA, forHTTPHeaderField: "User-Agent")

                  URLSession.shared.dataTask(with: req) { data, _, err in
                      guard let data = data, err == nil,
                            let j = (try? JSONSerialization.jsonObject(with: data)) as? [String: Any] else {
                          pipedTry(mirrors, index: index + 1, vid: vid, completion: completion)
                          return
                      }
                      let title = cleanTitle(j["title"] as? String ?? "YouTube \(vid)")

                      var bestURL: URL? = nil
                      var isVideo = false
                      if let vs = j["videoStreams"] as? [[String: Any]] {
                          let mp4s = vs.filter { (($0["mimeType"] as? String) ?? "").contains("mp4") }
                          // الأفضلية: MP4 مدموج بالصوت (videoOnly=false) عشان الفيديو يشتغل بصوت
                          let combined = mp4s.filter { (($0["videoOnly"] as? Bool) ?? false) == false }
                          let pool = combined.isEmpty ? mp4s : combined
                          let chosen = pool.max { (($0["bitrate"] as? Int) ?? 0) < (($1["bitrate"] as? Int) ?? 0) }
                          if let u = chosen?["url"] as? String, let uu = URL(string: u) {
                              bestURL = uu
                              isVideo = true
                          }
                      }
                      if bestURL == nil, let aus = j["audioStreams"] as? [[String: Any]] {
                          let m4as = aus.filter { (($0["mimeType"] as? String) ?? "").contains("mp4") }
                          if let u = (m4as.first ?? aus.first)?["url"] as? String, let uu = URL(string: u) {
                              bestURL = uu
                          }
                      }
                      guard let final = bestURL else {
                          pipedTry(mirrors, index: index + 1, vid: vid, completion: completion)
                          return
                      }
                      completion(.success(ResolvedVideo(url: final, filename: title + (isVideo ? ".mp4" : ".m4a"), sourceLabel: "Piped", referer: "")))
                  }.resume()
              }

              // MARK: - اكتشاف سيرفرات cobalt الشغّالة تلقائياً (cobalt.directory API)

              private static var cachedInstances: [String] = []
              private static var cacheTime = Date.distantPast
              private static let directoryAPI = "https://cobalt.directory/api/working?type=api"

              private static func discoverAndRaceCobalt(pageURL: String, completion: @escaping (Result<ResolvedVideo, Error>) -> Void) {
                  fetchInstanceList { endpoints in
                      let chosen = Array(endpoints.prefix(6))
                      guard !chosen.isEmpty else {
                          completion(.failure(NSError(domain: "VideoResolver", code: 50)))
                          return
                      }
                      let lock = NSLock()
                      var resolved = false
                      var fails = 0
                      for ep in chosen {
                          requestCobalt(ep, pageURL: pageURL) { result in
                              lock.lock()
                              let already = resolved
                              if case .success = result { resolved = true }
                              if case .failure = result { fails += 1 }
                              let all = fails >= chosen.count
                              lock.unlock()
                              if already { return }
                              switch result {
                              case .success: completion(result)
                              case .failure:
                                  if all { completion(.failure(NSError(domain: "VideoResolver", code: 51))) }
                              }
                          }
                      }
                  }
              }

              private static func fetchInstanceList(completion: @escaping ([String]) -> Void) {
                  if !cachedInstances.isEmpty, Date().timeIntervalSince(cacheTime) < 600 {
                      completion(cachedInstances)
                      return
                  }
                  guard let url = URL(string: directoryAPI) else {
                      completion(cachedInstances)
                      return
                  }
                  var req = URLRequest(url: url, timeoutInterval: 10)
                  req.setValue(mobileUA, forHTTPHeaderField: "User-Agent")
                  URLSession.shared.dataTask(with: req) { data, _, err in
                      guard let data = data, err == nil,
                            let j = (try? JSONSerialization.jsonObject(with: data)) as? [String: Any] else {
                          completion(cachedInstances)
                          return
                      }
                      let root = j["data"] ?? j
                      let list = parseInstanceList(root)
                      if !list.isEmpty {
                          cachedInstances = list
                          cacheTime = Date()
                      }
                      completion(list.isEmpty ? cachedInstances : list)
                  }.resume()
              }

              /// استخراج روابط السيرفرات من استجابة الـ directory بأي شكل JSON جاءت
              private static func parseInstanceList(_ json: Any) -> [String] {
                  var out: [String] = []
                  func scan(_ value: Any, depth: Int) {
                      guard depth < 6 else { return }
                      if let dict = value as? [String: Any] {
                          for key in ["apiUrl", "api_url", "apiURL", "api", "url", "instance", "host"] {
                              if let s = dict[key] as? String, s.hasPrefix("https://") {
                                  out.append(s.hasSuffix("/") ? s : s + "/")
                                  return
                              }
                          }
                          for v in dict.values { scan(v, depth: depth + 1) }
                      } else if let arr = value as? [Any] {
                          for v in arr { scan(v, depth: depth + 1) }
                      }
                  }
                  scan(json, depth: 0)
                  var seen = Set<String>()
                  return out.filter { seen.insert($0).inserted }
              }

