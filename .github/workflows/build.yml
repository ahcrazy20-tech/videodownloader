        import Foundation

        class UniversalExtractor {
            static let shared = UniversalExtractor()

            enum SiteType {
                case youtube, tiktok, instagram, facebook, twitter, vimeo, dailymotion, direct, hls, generic
            }

            struct ExtractedStream {
                let url: String
                let quality: VideoQuality
                let headers: [String: String]
            }

            struct ExtractedVideo {
                let title: String
                let streams: [ExtractedStream]
                let thumbnail: String?
                let sourceType: VideoSourceType
            }

            func detectSite(url: String) -> SiteType {
                let lower = url.lowercased()
                if lower.contains("youtube.com") || lower.contains("youtu.be") { return .youtube }
                if lower.contains("tiktok.com") { return .tiktok }
                if lower.contains("instagram.com") { return .instagram }
                if lower.contains("facebook.com") || lower.contains("fb.watch") { return .facebook }
                if lower.contains("twitter.com") || lower.contains("x.com") { return .twitter }
                if lower.contains("vimeo.com") { return .vimeo }
                if lower.contains("dailymotion.com") { return .dailymotion }
                if lower.contains(".m3u8") { return .hls }
                if lower.contains(".mp4") || lower.contains(".mkv") || lower.contains(".webm") { return .direct }
                return .generic
            }

            func extract(from pageURL: String, completion: @escaping (Result<ExtractedVideo, Error>) -> Void) {
                let site = detectSite(url: pageURL)
                switch site {
                case .youtube:   extractYouTube(url: pageURL, completion: completion)
                case .tiktok:    extractTikTok(url: pageURL, completion: completion)
                case .instagram: extractInstagram(url: pageURL, completion: completion)
                case .facebook:  extractFacebook(url: pageURL, completion: completion)
                default:         extractGeneric(url: pageURL, completion: completion)
                }
            }

            private func extractYouTube(url: String, completion: @escaping (Result<ExtractedVideo, Error>) -> Void) {
                guard let videoID = YouTubeExtractor.shared.extractVideoID(from: url) else {
                    completion(.failure(NSError(domain: "Extractor", code: -1, userInfo: [NSLocalizedDescriptionKey: "Invalid YouTube URL"])))
                    return
                }
                YouTubeExtractor.shared.extractStreams(videoID: videoID) { result in
                    switch result {
                    case .success(let streams):
                        YouTubeExtractor.shared.extractVideoInfo(videoID: videoID) { title in
                            let mapped = streams.map { ExtractedStream(url: $0.url, quality: $0.quality, headers: $0.headers) }
                            completion(.success(ExtractedVideo(
                                title: title,
                                streams: mapped,
                                thumbnail: "https://i.ytimg.com/vi/\(videoID)/maxresdefault.jpg",
                                sourceType: .youtube
                            )))
                        }
                    case .failure(let error):
                        completion(.failure(error))
                    }
                }
            }

            private func extractTikTok(url: String, completion: @escaping (Result<ExtractedVideo, Error>) -> Void) {
                guard let pageURL = URL(string: url) else {
                    completion(.failure(NSError(domain: "TikTok", code: -1)))
                    return
                }
                var request = URLRequest(url: pageURL)
                request.setValue("Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1", forHTTPHeaderField: "User-Agent")

                URLSession.shared.dataTask(with: request) { data, _, error in
                    guard let data = data, let html = String(data: data, encoding: .utf8) else {
                        completion(.failure(error ?? NSError(domain: "TikTok", code: -1)))
                        return
                    }
                    let patterns = ["\"playAddr\":\"([^\"]+)\"", "\"downloadAddr\":\"([^\"]+)\""]
                    for pattern in patterns {
                        if let regex = try? NSRegularExpression(pattern: pattern),
                           let match = regex.firstMatch(in: html, range: NSRange(html.startIndex..., in: html)),
                           let range = Range(match.range(at: 1), in: html) {
                            var videoURL = String(html[range])
                            videoURL = videoURL.replacingOccurrences(of: "\\u002F", with: "/")
                            videoURL = videoURL.replacingOccurrences(of: "\\u0026", with: "&")
                            let headers = [
                                "Referer": "https://www.tiktok.com/",
                                "User-Agent": "Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15"
                            ]
                            completion(.success(ExtractedVideo(
                                title: "TikTok Video",
                                streams: [ExtractedStream(url: videoURL, quality: .p720, headers: headers)],
                                thumbnail: nil,
                                sourceType: .tiktok
                            )))
                            return
                        }
                    }
                    completion(.failure(NSError(domain: "TikTok", code: -2, userInfo: [NSLocalizedDescriptionKey: "No video found"])))
                }.resume()
            }

            private func extractInstagram(url: String, completion: @escaping (Result<ExtractedVideo, Error>) -> Void) {
                guard let pageURL = URL(string: url) else {
                    completion(.failure(NSError(domain: "Instagram", code: -1)))
                    return
                }
                var request = URLRequest(url: pageURL)
                request.setValue("Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15", forHTTPHeaderField: "User-Agent")
                request.setValue("application/json", forHTTPHeaderField: "Accept")

                URLSession.shared.dataTask(with: request) { data, _, _ in
                    guard let data = data, let html = String(data: data, encoding: .utf8) else {
                        completion(.failure(NSError(domain: "Instagram", code: -1)))
                        return
                    }
                    let patterns = ["\"video_url\":\"([^\"]+)\"", "\"contentUrl\":\"([^\"]+\\.mp4[^\"]*)\""]
                    for pattern in patterns {
                        if let regex = try? NSRegularExpression(pattern: pattern),
                           let match = regex.firstMatch(in: html, range: NSRange(html.startIndex..., in: html)),
                           let range = Range(match.range(at: 1), in: html) {
                            var videoURL = String(html[range])
                            videoURL = videoURL.replacingOccurrences(of: "\\u0026", with: "&")
                            videoURL = videoURL.replacingOccurrences(of: "\\/", with: "/")
                            let headers = ["Referer": "https://www.instagram.com/"]
                            completion(.success(ExtractedVideo(
                                title: "Instagram Video",
                                streams: [ExtractedStream(url: videoURL, quality: .p720, headers: headers)],
                                thumbnail: nil,
                                sourceType: .instagram
                            )))
                            return
                        }
                    }
                    completion(.failure(NSError(domain: "Instagram", code: -2)))
                }.resume()
            }

            private func extractFacebook(url: String, completion: @escaping (Result<ExtractedVideo, Error>) -> Void) {
                let mobileURL = url.replacingOccurrences(of: "www.facebook.com", with: "m.facebook.com")
                guard let pageURL = URL(string: mobileURL) else {
                    completion(.failure(NSError(domain: "Facebook", code: -1)))
                    return
                }
                var request = URLRequest(url: pageURL)
                request.setValue("Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15", forHTTPHeaderField: "User-Agent")

                URLSession.shared.dataTask(with: request) { data, _, _ in
                    guard let data = data, let html = String(data: data, encoding: .utf8) else {
                        completion(.failure(NSError(domain: "Facebook", code: -1)))
                        return
                    }
                    var streams: [ExtractedStream] = []
                    let headers = ["Referer": "https://www.facebook.com/"]

                    let hdPattern = "\"browser_native_hd_url\":\"([^\"]+)\""
                    let sdPattern = "\"browser_native_sd_url\":\"([^\"]+)\""

                    if let regex = try? NSRegularExpression(pattern: hdPattern),
                       let match = regex.firstMatch(in: html, range: NSRange(html.startIndex..., in: html)),
                       let range = Range(match.range(at: 1), in: html) {
                        var vURL = String(html[range])
                        vURL = vURL.replacingOccurrences(of: "\\/", with: "/")
                        vURL = vURL.replacingOccurrences(of: "\\u0025", with: "%")
                        streams.append(ExtractedStream(url: vURL, quality: .p720, headers: headers))
                    }
                    if let regex = try? NSRegularExpression(pattern: sdPattern),
                       let match = regex.firstMatch(in: html, range: NSRange(html.startIndex..., in: html)),
                       let range = Range(match.range(at: 1), in: html) {
                        var vURL = String(html[range])
                        vURL = vURL.replacingOccurrences(of: "\\/", with: "/")
                        streams.append(ExtractedStream(url: vURL, quality: .p480, headers: headers))
                    }

                    if streams.isEmpty {
                        completion(.failure(NSError(domain: "Facebook", code: -2)))
                    } else {
                        completion(.success(ExtractedVideo(
                            title: "Facebook Video",
                            streams: streams,
                            thumbnail: nil,
                            sourceType: .facebook
                        )))
                    }
                }.resume()
            }

            private func extractGeneric(url: String, completion: @escaping (Result<ExtractedVideo, Error>) -> Void) {
                guard let pageURL = URL(string: url) else {
                    completion(.failure(NSError(domain: "Generic", code: -1)))
                    return
                }
                var request = URLRequest(url: pageURL)
                request.setValue("Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15", forHTTPHeaderField: "User-Agent")

                URLSession.shared.dataTask(with: request) { data, _, _ in
                    guard let data = data, let html = String(data: data, encoding: .utf8) else {
                        completion(.failure(NSError(domain: "Generic", code: -1)))
                        return
                    }
                    var streams: [ExtractedStream] = []
                    var seen = Set<String>()
                    let patterns = [
                        "https?://[^\\s\"'<>]+\\.mp4[^\\s\"'<>]*",
                        "https?://[^\\s\"'<>]+\\.m3u8[^\\s\"'<>]*",
                        "https?://[^\\s\"'<>]+\\.webm[^\\s\"'<>]*"
                    ]
                    for pattern in patterns {
                        if let regex = try? NSRegularExpression(pattern: pattern) {
                            let matches = regex.matches(in: html, range: NSRange(html.startIndex..., in: html))
                            for match in matches.prefix(5) {
                                if let range = Range(match.range, in: html) {
                                    let vURL = String(html[range])
                                    if !seen.contains(vURL) {
                                        seen.insert(vURL)
                                        streams.append(ExtractedStream(url: vURL, quality: .p720, headers: [:]))
                                    }
                                }
                            }
                        }
                    }
                    if streams.isEmpty {
                        completion(.failure(NSError(domain: "Generic", code: -2)))
                    } else {
                        completion(.success(ExtractedVideo(
                            title: "Video",
                            streams: streams,
                            thumbnail: nil,
                            sourceType: streams.first?.url.contains(".m3u8") == true ? .hls : .direct
                        )))
                    }
                }.resume()
            }
        }
