                                .background(task.quality.color).cornerRadius(4)
                            Spacer()
                            if let d = task.video.duration {
                                Text(d).font(.system(size:10)).foregroundColor(.secondary)
                            }
                        }
                    }
                }.buttonStyle(.plain)
            }
        }
        SWIFTEOF

