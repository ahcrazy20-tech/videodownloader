        # ============================================================
        # FILE 5: DownloadManager.swift (FIXED FILE PERMISSIONS)
        # ============================================================
       cat > VideoFlow/Services/DownloadManager.swift << 'SWIFTEOF'
        import Foundation
        import UserNotifications

        class DownloadManager: NSObject, ObservableObject {
            static let shared = DownloadManager()

            @Published var activeDownloads: [DownloadTask] = []
            @Published var completedVideos: [DownloadTask] = []

            var backgroundCompletionHandler: (() -> Void)?
            private var urlSession: URLSession!
            private var taskMap: [Int: DownloadTask] = [:]  // Use taskIdentifier instead
            private var fileHandles: [Int: FileHandle] = [:]
            private var destinationURLs: [Int: URL] = [:]

            override init() {
                super.init()
                // ✅ Use default session (foreground) - more reliable for file handling
                let config = URLSessionConfiguration.default
                config.allowsCellularAccess = true
                config.timeoutIntervalForRequest = 60
                config.timeoutIntervalForResource = 3600
                config.httpMaximumConnectionsPerHost = 6
                config.waitsForConnectivity = true
                urlSession = URLSession(configuration: config, delegate: self, delegateQueue: nil)
                ensureDownloadsDirectoryExists()
                loadSavedVideos()
            }

            private func ensureDownloadsDirectoryExists() {
                let dir = getDownloadsDirectory()
                if !FileManager.default.fileExists(atPath: dir.path) {
                    do {
                        try FileManager.default.createDirectory(
                            at: dir, withIntermediateDirectories: true, attributes: nil
                        )
                        print("✅ Downloads directory created: \(dir.path)")
                    } catch {
                        print("❌ Failed to create directory: \(error)")
                    }
                }
            }

            func startDownload(video: VideoItem, quality: VideoQuality, customURL: String? = nil, customHeaders: [String: String] = [:]) {
                let downloadURL = customURL ?? video.url
                guard let url = URL(string: downloadURL) else {
                    print("❌ Invalid URL: \(downloadURL)")
                    return
                }

                let task = DownloadTask(video: video, quality: quality)
                DispatchQueue.main.async { self.activeDownloads.append(task) }

                // ✅ Prepare destination file
                let safeName = sanitizeFileName(video.title)
                let ext = quality == .audio ? "mp3" : "mp4"
                let fileName = "\(safeName)_\(quality.rawValue)_\(Int(Date().timeIntervalSince1970)).\(ext)"
                let destURL = getDownloadsDirectory().appendingPathComponent(fileName)

                // Create empty file
                FileManager.default.createFile(atPath: destURL.path, contents: nil, attributes: nil)
                guard let fileHandle = try? FileHandle(forWritingTo: destURL) else {
                    DispatchQueue.main.async {
                        task.status = .failed(error: "Cannot create file")
                        self.activeDownloads.removeAll { $0.id == task.id }
                    }
                    return
                }

                var request = URLRequest(url: url)
                request.setValue("Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1", forHTTPHeaderField: "User-Agent")
                request.setValue("*/*", forHTTPHeaderField: "Accept")
                request.setValue("identity;q=1, *;q=0", forHTTPHeaderField: "Accept-Encoding")

                var allHeaders = video.headers
                for (k, v) in customHeaders { allHeaders[k] = v }
                for (key, value) in allHeaders {
                    request.setValue(value, forHTTPHeaderField: key)
                }

                if allHeaders["Referer"] == nil, let host = url.host {
                    request.setValue("https://\(host)/", forHTTPHeaderField: "Referer")
                }

                // ✅ Use dataTask for streaming download (more reliable)
                let dataTask = urlSession.dataTask(with: request)
                let taskId = dataTask.taskIdentifier
                fileHandles[taskId] = fileHandle
                destinationURLs[taskId] = destURL
                taskMap[taskId] = task
                task.urlSessionTask = nil  // We use dataTask instead

                dataTask.resume()
                DispatchQueue.main.async {
                    task.status = .downloading(progress: 0)
                }
            }

            func pauseDownload(_ task: DownloadTask) {
                // Find and cancel task
                if let taskId = taskMap.first(where: { $0.value.id == task.id })?.key {
                    urlSession.getAllTasks { tasks in
                        for t in tasks where t.taskIdentifier == taskId {
                            t.suspend()
                            DispatchQueue.main.async { task.status = .paused }
                        }
                    }
                }
            }

            func resumeDownload(_ task: DownloadTask) {
                if let taskId = taskMap.first(where: { $0.value.id == task.id })?.key {
                    urlSession.getAllTasks { tasks in
                        for t in tasks where t.taskIdentifier == taskId {
                            t.resume()
                            DispatchQueue.main.async { task.status = .downloading(progress: task.progress) }
                        }
                    }
                }
            }

            func cancelDownload(_ task: DownloadTask) {
                if let taskId = taskMap.first(where: { $0.value.id == task.id })?.key {
                    urlSession.getAllTasks { tasks in
                        for t in tasks where t.taskIdentifier == taskId {
                            t.cancel()
                        }
                    }
                    // Cleanup
                    if let handle = fileHandles[taskId] {
                        try? handle.close()
                        fileHandles.removeValue(forKey: taskId)
                    }
                    if let destURL = destinationURLs[taskId] {
                        try? FileManager.default.removeItem(at: destURL)
                        destinationURLs.removeValue(forKey: taskId)
                    }
                    taskMap.removeValue(forKey: taskId)
                }
                DispatchQueue.main.async { self.activeDownloads.removeAll { $0.id == task.id } }
            }

            func deleteVideo(_ task: DownloadTask) {
                if let url = task.savedURL { try? FileManager.default.removeItem(at: url) }
                DispatchQueue.main.async { self.completedVideos.removeAll { $0.id == task.id } }
            }

            private func getDownloadsDirectory() -> URL {
                let paths = FileManager.default.urls(for: .documentDirectory, in: .userDomainMask)
                return paths[0].appendingPathComponent("VideoFlow", isDirectory: true)
            }

            private func sanitizeFileName(_ name: String) -> String {
                let invalidChars = CharacterSet(charactersIn: "/\\:*?\"<>|")
                var cleaned = name.components(separatedBy: invalidChars).joined(separator: "_")
                cleaned = cleaned.replacingOccurrences(of: " ", with: "_")
                cleaned = cleaned.replacingOccurrences(of: "\n", with: "")
                cleaned = cleaned.replacingOccurrences(of: "\r", with: "")
                if cleaned.count > 50 { cleaned = String(cleaned.prefix(50)) }
                return cleaned.isEmpty ? "video_\(Int(Date().timeIntervalSince1970))" : cleaned
            }

            private func loadSavedVideos() {
                let dir = getDownloadsDirectory()
                guard let files = try? FileManager.default.contentsOfDirectory(
                    at: dir, includingPropertiesForKeys: [.fileSizeKey]
                ) else { return }
                let ext = ["mp4","m4v","mov","mkv","avi","mp3","m4a","webm"]
                let videoFiles = files.filter { ext.contains($0.pathExtension.lowercased()) }
                DispatchQueue.main.async {
                    self.completedVideos = videoFiles.map { url in
                        let video = VideoItem(
                            id: url.lastPathComponent,
                            title: url.deletingPathExtension().lastPathComponent,
                            url: url.absoluteString,
                            thumbnailURL: nil, duration: nil, estimatedSize: nil,
                            availableQualities: [.p720], sourceType: .direct
                        )
                        let task = DownloadTask(video: video, quality: .p720)
                        task.savedURL = url
                        task.status = .completed
                        return task
                    }
                }
            }

            private func sendNotification(for task: DownloadTask) {
                let content = UNMutableNotificationContent()
                content.title = "Download Complete"
                content.body = "\(task.video.title) - \(task.quality.rawValue)"
                content.sound = .default
                let req = UNNotificationRequest(identifier: task.id, content: content, trigger: nil)
                UNUserNotificationCenter.current().add(req, withCompletionHandler: nil)
            }
        }

        // MARK: - URLSessionDataDelegate (Stream download to file)
        extension DownloadManager: URLSessionDataDelegate {

            func urlSession(_ session: URLSession, dataTask: URLSessionDataTask,
                            didReceive response: URLResponse,
                            completionHandler: @escaping (URLSession.ResponseDisposition) -> Void) {
                let taskId = dataTask.taskIdentifier
                if let task = taskMap[taskId] {
                    let totalBytes = response.expectedContentLength
                    DispatchQueue.main.async {
                        task.totalBytes = totalBytes
                    }
                }
                completionHandler(.allow)
            }

            func urlSession(_ session: URLSession, dataTask: URLSessionDataTask, didReceive data: Data) {
                let taskId = dataTask.taskIdentifier
                guard let task = taskMap[taskId],
                      let fileHandle = fileHandles[taskId] else { return }

                // Write chunk to file
                do {
                    try fileHandle.write(contentsOf: data)
                    let currentBytes = task.downloadedBytes + Int64(data.count)
                    DispatchQueue.main.async {
                        task.updateProgress(bytesWritten: currentBytes, totalBytes: task.totalBytes)
                    }
                } catch {
                    print("❌ Write error: \(error)")
                }
            }

            func urlSession(_ session: URLSession, task: URLSessionTask, didCompleteWithError error: Error?) {
                let taskId = task.taskIdentifier
                guard let dlTask = taskMap[taskId] else { return }

                // Close file handle
                if let handle = fileHandles[taskId] {
                    try? handle.close()
                    fileHandles.removeValue(forKey: taskId)
                }

                let destURL = destinationURLs[taskId]
                destinationURLs.removeValue(forKey: taskId)
                taskMap.removeValue(forKey: taskId)

                if let error = error {
                    // Failed - remove partial file
                    if let url = destURL {
                        try? FileManager.default.removeItem(at: url)
                    }
                    if (error as NSError).code != NSURLErrorCancelled {
                        DispatchQueue.main.async {
                            dlTask.status = .failed(error: error.localizedDescription)
                        }
                    }
                } else {
                    // ✅ Success!
                    DispatchQueue.main.async {
                        if let url = destURL {
                            dlTask.savedURL = url
                        }
                        dlTask.status = .completed
                        dlTask.progress = 1.0
                        self.activeDownloads.removeAll { $0.id == dlTask.id }
                        self.completedVideos.insert(dlTask, at: 0)
                        self.sendNotification(for: dlTask)
                    }
                }
            }
        }
        SWIFTEOF
        # ============================================================
        # FILE 6: PlayerManager.swift
        # ============================================================
        cat > VideoFlow/Services/PlayerManager.swift << 'SWIFTEOF'
        import Foundation
        import AVFoundation
        import Combine

        class PlayerManager: ObservableObject {
            static let shared = PlayerManager()

            @Published var currentVideo: DownloadTask?
            @Published var isPlaying = false
            @Published var isFullScreen = false
            @Published var isMinimized = false
            @Published var currentTime: Double = 0
            @Published var duration: Double = 0
            @Published var volume: Float = 1.0
            @Published var playbackSpeed: Float = 1.0
            @Published var isMuted = false
            @Published var isLoading = false

            var player: AVPlayer?
            private var timeObserver: Any?
            private var cancellables = Set<AnyCancellable>()

            func playVideo(_ task: DownloadTask) {
                currentVideo = task
                let url: URL?
                if let saved = task.savedURL { url = saved }
                else { url = URL(string: task.video.url) }
                guard let videoURL = url else { return }

                isLoading = true
                player?.pause()
                player = AVPlayer(url: videoURL)
                player?.volume = volume

                player?.currentItem?.publisher(for: \.duration)
                    .receive(on: DispatchQueue.main)
                    .sink { [weak self] dur in
                        let secs = dur.seconds
                        self?.duration = secs.isNaN || secs.isInfinite ? 0 : secs
                        self?.isLoading = false
                    }.store(in: &cancellables)

                let interval = CMTime(seconds: 0.5, preferredTimescale: 600)
                timeObserver = player?.addPeriodicTimeObserver(forInterval: interval, queue: .main) {
                    [weak self] time in
                    self?.currentTime = time.seconds
                }

                player?.play()
                isPlaying = true
                isFullScreen = true
                isMinimized = false
            }

            func togglePlayPause() {
                isPlaying ? player?.pause() : player?.play()
                isPlaying.toggle()
            }

            func seek(to time: Double) {
                let t = CMTime(seconds: time, preferredTimescale: 600)
                player?.seek(to: t, toleranceBefore: .zero, toleranceAfter: .zero)
            }

            func skipForward(_ s: Double = 10) { seek(to: min(currentTime + s, duration)) }
            func skipBackward(_ s: Double = 10) { seek(to: max(currentTime - s, 0)) }

            func setSpeed(_ speed: Float) {
                playbackSpeed = speed
                if isPlaying { player?.rate = speed }
            }

            func setVolume(_ vol: Float) { volume = vol; player?.volume = vol }
            func minimize() { isFullScreen = false; isMinimized = true }

            func close() {
                if let obs = timeObserver { player?.removeTimeObserver(obs); timeObserver = nil }
                player?.pause(); player = nil
                isPlaying = false; isFullScreen = false; isMinimized = false
                currentVideo = nil; currentTime = 0; duration = 0
            }

            var progress: Double { duration > 0 ? currentTime / duration : 0 }

            func formattedTime(_ t: Double) -> String {
                guard !t.isNaN && !t.isInfinite else { return "0:00" }
                let s = Int(t); let h = s/3600; let m = (s%3600)/60; let sec = s%60
                return h > 0 ? String(format: "%d:%02d:%02d", h,m,sec) : String(format: "%d:%02d", m,sec)
            }
        }
        SWIFTEOF

        # ============================================================
        # FILE 7: UltimateExtractor.swift (MEGA EXTRACTION SYSTEM)
        # ============================================================
        cat > VideoFlow/Extractors/UltimateExtractor.swift << 'SWIFTEOF'
        import Foundation

        // MARK: - Extraction Result
        struct ExtractedStream {
            let url: String
            let quality: VideoQuality
            let headers: [String: String]
            let filename: String?
            let hasAudio: Bool
        }

        struct ExtractedVideo {
            let title: String
            let streams: [ExtractedStream]
            let thumbnail: String?
            let sourceType: VideoSourceType
        }

        enum ExtractorError: LocalizedError {
            case allBackendsFailed(String)
            case invalidURL
            case noStreamsFound
            case networkError(String)

            var errorDescription: String? {
                switch self {
                case .allBackendsFailed(let msg): return "All servers failed: \(msg)"
                case .invalidURL: return "Invalid URL"
                case .noStreamsFound: return "No downloadable video found"
                case .networkError(let msg): return "Network: \(msg)"
                }
            }
        }

        // MARK: - Ultimate Multi-Layer Extractor
        class UltimateExtractor {
            static let shared = UltimateExtractor()

            // 15+ Cobalt Backend Mirrors (verified working 2024-2025)
            private let cobaltBackends: [String] = [
                "https://api.cobalt.tools",
                "https://co.wuk.sh",
                "https://cobalt-api.kwiatekmiki.com",
                "https://cobalt-backend.canine.tools",
                "https://dl01.yt-dl.click",
                "https://cobalt.synzr.space",
                "https://api.dl.sauw.ca",
                "https://capi.oak.li",
                "https://cobalt-api.ayo.tf",
                "https://api.cobalt.tools/api/json"
            ]

            // MARK: - Main Extract with Multi-Layer Fallback
            func extract(from pageURL: String,
                         quality: VideoQuality = .p1080,
                         audioOnly: Bool = false,
                         completion: @escaping (Result<ExtractedVideo, Error>) -> Void) {

                print("🎯 Extracting: \(pageURL)")
                let siteType = detectSite(url: pageURL)
                print("📍 Site type: \(siteType)")

                // Try site-specific extractor FIRST (fastest & most reliable)
                trySiteSpecific(url: pageURL, siteType: siteType, quality: quality) { result in
                    switch result {
                    case .success(let video):
                        print("✅ Site-specific extractor worked")
                        completion(.success(video))
                    case .failure:
                        print("⚠️ Site-specific failed, trying Cobalt...")
                        // Fallback to Cobalt with all mirrors
                        self.tryCobaltChain(url: pageURL,
                                            quality: quality,
                                            audioOnly: audioOnly,
                                            index: 0,
                                            completion: completion)
                    }
                }
            }

            // MARK: - Site Detection
            func detectSite(url: String) -> VideoSourceType {
                let lower = url.lowercased()
                if lower.contains("youtube.com") || lower.contains("youtu.be") { return .youtube }
                if lower.contains("tiktok.com") { return .tiktok }
                if lower.contains("instagram.com") { return .instagram }
                if lower.contains("facebook.com") || lower.contains("fb.watch") || lower.contains("fb.com") { return .facebook }
                if lower.contains("twitter.com") || lower.contains("x.com") { return .twitter }
                if lower.contains("reddit.com") { return .reddit }
                if lower.contains("vimeo.com") { return .vimeo }
                if lower.contains("twitch.tv") { return .twitch }
                if lower.contains("soundcloud.com") { return .soundcloud }
                if lower.contains("pinterest.com") { return .pinterest }
                if lower.contains("tumblr.com") { return .tumblr }
                if lower.contains("bilibili.com") { return .bilibili }
                if lower.contains("dailymotion.com") { return .dailymotion }
                if lower.contains("snapchat.com") { return .snapchat }
                if lower.contains("linkedin.com") { return .linkedin }
                if lower.contains(".m3u8") { return .hls }
                if lower.contains(".mp4") || lower.contains(".webm") { return .direct }
                return .direct
            }

            // MARK: - Site-Specific Extractors
            private func trySiteSpecific(url: String,
                                         siteType: VideoSourceType,
                                         quality: VideoQuality,
                                         completion: @escaping (Result<ExtractedVideo, Error>) -> Void) {
                switch siteType {
                case .tiktok:
                    TikTokAPIExtractor.extract(url: url, completion: completion)
                case .instagram:
                    InstagramExtractor.extract(url: url, completion: completion)
                case .facebook:
                    FacebookExtractor.extract(url: url, completion: completion)
                case .twitter:
                    TwitterExtractor.extract(url: url, completion: completion)
                case .reddit:
                    RedditExtractor.extract(url: url, completion: completion)
                case .direct, .hls:
                    let stream = ExtractedStream(url: url, quality: quality, headers: [:], filename: nil, hasAudio: true)
                    completion(.success(ExtractedVideo(
                        title: URL(string: url)?.lastPathComponent ?? "Video",
                        streams: [stream], thumbnail: nil,
                        sourceType: siteType
                    )))
                default:
                    completion(.failure(ExtractorError.noStreamsFound))
                }
            }

            // MARK: - Cobalt Chain (tries all mirrors)
            private func tryCobaltChain(url: String,
                                        quality: VideoQuality,
                                        audioOnly: Bool,
                                        index: Int,
                                        completion: @escaping (Result<ExtractedVideo, Error>) -> Void) {
                guard index < cobaltBackends.count else {
                    print("⚠️ All Cobalt mirrors failed, trying HTML scrape...")
                    HTMLScraper.extract(url: url, completion: completion)
                    return
                }

                let backend = cobaltBackends[index]
                print("🔄 Cobalt attempt \(index + 1)/\(cobaltBackends.count): \(backend)")

                CobaltAPI.request(backend: backend,
                                  videoURL: url,
                                  quality: quality.cobaltValue,
                                  audioOnly: audioOnly) { result in
                    switch result {
                    case .success(let extracted):
                        completion(.success(extracted))
                    case .failure:
                        // Try next backend
                        self.tryCobaltChain(url: url,
                                            quality: quality,
                                            audioOnly: audioOnly,
                                            index: index + 1,
                                            completion: completion)
                    }
                }
            }
        }

        // MARK: - Cobalt API Client
        class CobaltAPI {
            static func request(backend: String,
                                videoURL: String,
                                quality: String,
                                audioOnly: Bool,
                                completion: @escaping (Result<ExtractedVideo, Error>) -> Void) {
                guard let apiURL = URL(string: backend) else {
                    completion(.failure(ExtractorError.invalidURL))
                    return
                }

                var request = URLRequest(url: apiURL)
                request.httpMethod = "POST"
                request.setValue("application/json", forHTTPHeaderField: "Content-Type")
                request.setValue("application/json", forHTTPHeaderField: "Accept")
                request.setValue("VideoFlow/3.0", forHTTPHeaderField: "User-Agent")
                request.timeoutInterval = 25

                let payload: [String: Any] = [
                    "url": videoURL,
                    "videoQuality": quality,
                    "audioFormat": "mp3",
                    "audioBitrate": "320",
                    "filenameStyle": "pretty",
                    "downloadMode": audioOnly ? "audio" : "auto",
                    "youtubeVideoCodec": "h264",
                    "youtubeDubLang": "en",
                    "alwaysProxy": false,
                    "disableMetadata": false,
                    "tiktokFullAudio": true,
                    "tiktokH265": false,
                    "twitterGif": true
                ]

                request.httpBody = try? JSONSerialization.data(withJSONObject: payload)

                URLSession.shared.dataTask(with: request) { data, response, error in
                    if let error = error {
                        completion(.failure(ExtractorError.networkError(error.localizedDescription)))
                        return
                    }
                    guard let data = data,
                          let json = try? JSONSerialization.jsonObject(with: data) as? [String: Any] else {
                        completion(.failure(ExtractorError.noStreamsFound))
                        return
                    }

                    if let status = json["status"] as? String {
                        switch status {
                        case "tunnel", "redirect", "stream":
                            self.parseStream(json: json, sourceURL: videoURL, completion: completion)
                        case "picker":
                            self.parsePicker(json: json, sourceURL: videoURL, completion: completion)
                        case "error":
                            let msg = ((json["error"] as? [String: Any])?["code"] as? String) ?? "unknown"
                            completion(.failure(ExtractorError.networkError(msg)))
                        default:
                            completion(.failure(ExtractorError.noStreamsFound))
                        }
                    } else if let url = json["url"] as? String {
                        let filename = json["filename"] as? String ?? "Video"
                        let stream = ExtractedStream(url: url, quality: .p1080, headers: [:], filename: filename, hasAudio: true)
                        completion(.success(ExtractedVideo(
                            title: filename.replacingOccurrences(of: ".mp4", with: ""),
                            streams: [stream], thumbnail: nil,
                            sourceType: UltimateExtractor.shared.detectSite(url: videoURL)
                        )))
                    } else {
                        completion(.failure(ExtractorError.noStreamsFound))
                    }
                }.resume()
            }

            private static func parseStream(json: [String: Any], sourceURL: String,
                                            completion: @escaping (Result<ExtractedVideo, Error>) -> Void) {
                guard let url = json["url"] as? String else {
                    completion(.failure(ExtractorError.noStreamsFound))
                    return
                }
                let filename = json["filename"] as? String ?? "Video"
                let title = filename.replacingOccurrences(of: ".mp4", with: "").replacingOccurrences(of: ".mp3", with: "")
                let stream = ExtractedStream(url: url, quality: .p1080, headers: [:], filename: filename, hasAudio: true)
                completion(.success(ExtractedVideo(
                    title: title, streams: [stream], thumbnail: nil,
                    sourceType: UltimateExtractor.shared.detectSite(url: sourceURL)
                )))
            }

            private static func parsePicker(json: [String: Any], sourceURL: String,
                                            completion: @escaping (Result<ExtractedVideo, Error>) -> Void) {
                guard let picker = json["picker"] as? [[String: Any]] else {
                    completion(.failure(ExtractorError.noStreamsFound))
                    return
                }
                var streams: [ExtractedStream] = []
                for item in picker {
                    if let url = item["url"] as? String {
                        streams.append(ExtractedStream(url: url, quality: .p720, headers: [:], filename: nil, hasAudio: true))
                    }
                }
                if streams.isEmpty {
                    completion(.failure(ExtractorError.noStreamsFound))
                } else {
                    completion(.success(ExtractedVideo(
                        title: "Media (\(streams.count) items)",
                        streams: streams, thumbnail: nil,
                        sourceType: UltimateExtractor.shared.detectSite(url: sourceURL)
                    )))
                }
            }
        }

        // MARK: - TikTok Extractor (using TikWM API - unlimited)
        class TikTokAPIExtractor {
            static func extract(url: String, completion: @escaping (Result<ExtractedVideo, Error>) -> Void) {
                let apiURL = "https://tikwm.com/api/"
                guard let requestURL = URL(string: apiURL) else {
                    completion(.failure(ExtractorError.invalidURL))
                    return
                }
                var request = URLRequest(url: requestURL)
                request.httpMethod = "POST"
                request.setValue("application/x-www-form-urlencoded", forHTTPHeaderField: "Content-Type")
                request.setValue("Mozilla/5.0", forHTTPHeaderField: "User-Agent")
                let body = "url=\(url.addingPercentEncoding(withAllowedCharacters: .urlQueryAllowed) ?? url)&hd=1"
                request.httpBody = body.data(using: .utf8)

                URLSession.shared.dataTask(with: request) { data, _, error in
                    guard let data = data,
                          let json = try? JSONSerialization.jsonObject(with: data) as? [String: Any],
                          let dataDict = json["data"] as? [String: Any] else {
                        completion(.failure(ExtractorError.noStreamsFound))
                        return
                    }

                    var streams: [ExtractedStream] = []
                    let title = dataDict["title"] as? String ?? "TikTok Video"
                    let cover = dataDict["cover"] as? String

                    if let hdplay = dataDict["hdplay"] as? String {
                        streams.append(ExtractedStream(url: hdplay, quality: .p1080, headers: [:], filename: nil, hasAudio: true))
                    }
                    if let play = dataDict["play"] as? String {
                        streams.append(ExtractedStream(url: play, quality: .p720, headers: [:], filename: nil, hasAudio: true))
                    }
                    if let wmplay = dataDict["wmplay"] as? String {
                        streams.append(ExtractedStream(url: wmplay, quality: .p480, headers: [:], filename: "watermarked", hasAudio: true))
                    }
                    if let music = dataDict["music"] as? String {
                        streams.append(ExtractedStream(url: music, quality: .audio, headers: [:], filename: "audio", hasAudio: true))
                    }

                    if streams.isEmpty {
                        completion(.failure(ExtractorError.noStreamsFound))
                    } else {
                        completion(.success(ExtractedVideo(
                            title: title, streams: streams, thumbnail: cover, sourceType: .tiktok
                        )))
                    }
                }.resume()
            }
        }

        // MARK: - Instagram Extractor
        class InstagramExtractor {
            static func extract(url: String, completion: @escaping (Result<ExtractedVideo, Error>) -> Void) {
                guard let pageURL = URL(string: url) else {
                    completion(.failure(ExtractorError.invalidURL))
                    return
                }
                var request = URLRequest(url: pageURL)
                request.setValue("Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15", forHTTPHeaderField: "User-Agent")
                request.setValue("*/*", forHTTPHeaderField: "Accept")

                URLSession.shared.dataTask(with: request) { data, _, _ in
                    guard let data = data, let html = String(data: data, encoding: .utf8) else {
                        completion(.failure(ExtractorError.noStreamsFound))
                        return
                    }

                    let patterns = [
                        "\"video_url\":\"([^\"]+)\"",
                        "\"contentUrl\":\"([^\"]+\\.mp4[^\"]*)\"",
                        "property=\"og:video\" content=\"([^\"]+)\""
                    ]

                    for pattern in patterns {
                        if let regex = try? NSRegularExpression(pattern: pattern),
                           let match = regex.firstMatch(in: html, range: NSRange(html.startIndex..., in: html)),
                           let range = Range(match.range(at: 1), in: html) {
                            var videoURL = String(html[range])
                            videoURL = videoURL.replacingOccurrences(of: "\\u0026", with: "&")
                            videoURL = videoURL.replacingOccurrences(of: "\\/", with: "/")

                            let headers = ["Referer": "https://www.instagram.com/"]
                            let stream = ExtractedStream(url: videoURL, quality: .p720, headers: headers, filename: nil, hasAudio: true)
                            completion(.success(ExtractedVideo(
                                title: "Instagram Video",
                                streams: [stream], thumbnail: nil, sourceType: .instagram
                            )))
                            return
                        }
                    }
                    completion(.failure(ExtractorError.noStreamsFound))
                }.resume()
            }
        }

        // MARK: - Facebook Extractor
        class FacebookExtractor {
            static func extract(url: String, completion: @escaping (Result<ExtractedVideo, Error>) -> Void) {
                let mobileURL = url.replacingOccurrences(of: "www.facebook.com", with: "m.facebook.com")
                                   .replacingOccurrences(of: "web.facebook.com", with: "m.facebook.com")
                guard let pageURL = URL(string: mobileURL) else {
                    completion(.failure(ExtractorError.invalidURL))
                    return
                }
                var request = URLRequest(url: pageURL)
                request.setValue("Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15", forHTTPHeaderField: "User-Agent")

                URLSession.shared.dataTask(with: request) { data, _, _ in
                    guard let data = data, let html = String(data: data, encoding: .utf8) else {
                        completion(.failure(ExtractorError.noStreamsFound))
                        return
                    }
                    var streams: [ExtractedStream] = []
                    let headers = ["Referer": "https://www.facebook.com/"]

                    let patterns = [
                        ("hd_src\":\"([^\"]+)\"", VideoQuality.p1080),
                        ("sd_src\":\"([^\"]+)\"", VideoQuality.p480),
                        ("browser_native_hd_url\":\"([^\"]+)\"", VideoQuality.p720),
                        ("browser_native_sd_url\":\"([^\"]+)\"", VideoQuality.p480)
                    ]

                    for (pattern, quality) in patterns {
                        if let regex = try? NSRegularExpression(pattern: pattern),
                           let match = regex.firstMatch(in: html, range: NSRange(html.startIndex..., in: html)),
                           let range = Range(match.range(at: 1), in: html) {
                            var vURL = String(html[range])
                            vURL = vURL.replacingOccurrences(of: "\\/", with: "/")
                            vURL = vURL.replacingOccurrences(of: "\\u0025", with: "%")
                            vURL = vURL.replacingOccurrences(of: "\\u0026", with: "&")
                            if !streams.contains(where: { $0.quality == quality }) {
                                streams.append(ExtractedStream(url: vURL, quality: quality, headers: headers, filename: nil, hasAudio: true))
                            }
                        }
                    }

                    if streams.isEmpty {
                        completion(.failure(ExtractorError.noStreamsFound))
                    } else {
                        completion(.success(ExtractedVideo(
                            title: "Facebook Video", streams: streams,
                            thumbnail: nil, sourceType: .facebook
                        )))
                    }
                }.resume()
            }
        }

        // MARK: - Twitter/X Extractor
        class TwitterExtractor {
            static func extract(url: String, completion: @escaping (Result<ExtractedVideo, Error>) -> Void) {
                // Convert x.com to twitter.com and use fxtwitter (free API mirror)
                var apiURL = url.replacingOccurrences(of: "x.com", with: "api.fxtwitter.com")
                apiURL = apiURL.replacingOccurrences(of: "twitter.com", with: "api.fxtwitter.com")

                guard let requestURL = URL(string: apiURL) else {
                    completion(.failure(ExtractorError.invalidURL))
                    return
                }

                URLSession.shared.dataTask(with: requestURL) { data, _, _ in
                    guard let data = data,
                          let json = try? JSONSerialization.jsonObject(with: data) as? [String: Any],
                          let tweet = json["tweet"] as? [String: Any] else {
                        completion(.failure(ExtractorError.noStreamsFound))
                        return
                    }

                    let title = tweet["text"] as? String ?? "Twitter Video"
                    var streams: [ExtractedStream] = []

                    if let media = tweet["media"] as? [String: Any],
                       let videos = media["videos"] as? [[String: Any]] {
                        for video in videos {
                            if let vurl = video["url"] as? String {
                                streams.append(ExtractedStream(url: vurl, quality: .p720, headers: [:], filename: nil, hasAudio: true))
                            }
                        }
                    }

                    if streams.isEmpty {
                        completion(.failure(ExtractorError.noStreamsFound))
                    } else {
                        completion(.success(ExtractedVideo(
                            title: String(title.prefix(60)), streams: streams,
                            thumbnail: nil, sourceType: .twitter
                        )))
                    }
                }.resume()
            }
        }

        // MARK: - Reddit Extractor
        class RedditExtractor {
            static func extract(url: String, completion: @escaping (Result<ExtractedVideo, Error>) -> Void) {
                // Add .json to Reddit URL for API access
                var jsonURL = url
                if !jsonURL.hasSuffix(".json") {
                    if jsonURL.hasSuffix("/") { jsonURL += ".json" }
                    else { jsonURL += ".json" }
                }

                guard let requestURL = URL(string: jsonURL) else {
                    completion(.failure(ExtractorError.invalidURL))
                    return
                }

                var request = URLRequest(url: requestURL)
                request.setValue("VideoFlow/3.0", forHTTPHeaderField: "User-Agent")

                URLSession.shared.dataTask(with: request) { data, _, _ in
                    guard let data = data,
                          let jsonArray = try? JSONSerialization.jsonObject(with: data) as? [Any],
                          let firstPost = jsonArray.first as? [String: Any],
                          let postData = firstPost["data"] as? [String: Any],
                          let children = postData["children"] as? [[String: Any]],
                          let post = children.first?["data"] as? [String: Any] else {
                        completion(.failure(ExtractorError.noStreamsFound))
                        return
                    }

                    let title = post["title"] as? String ?? "Reddit Video"

                    if let media = post["media"] as? [String: Any],
                       let redditVideo = media["reddit_video"] as? [String: Any],
                       let fallbackURL = redditVideo["fallback_url"] as? String {
                        let stream = ExtractedStream(url: fallbackURL, quality: .p720, headers: [:], filename: nil, hasAudio: true)
                        completion(.success(ExtractedVideo(
                            title: title, streams: [stream], thumbnail: nil, sourceType: .reddit
                        )))
                        return
                    }
                    completion(.failure(ExtractorError.noStreamsFound))
                }.resume()
            }
        }

        // MARK: - HTML Scraper (Last Resort)
        class HTMLScraper {
            static func extract(url: String, completion: @escaping (Result<ExtractedVideo, Error>) -> Void) {
                guard let pageURL = URL(string: url) else {
                    completion(.failure(ExtractorError.invalidURL))
                    return
                }
                var request = URLRequest(url: pageURL)
                request.setValue("Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15", forHTTPHeaderField: "User-Agent")

                URLSession.shared.dataTask(with: request) { data, _, _ in
                    guard let data = data, let html = String(data: data, encoding: .utf8) else {
                        completion(.failure(ExtractorError.allBackendsFailed("HTML fetch failed")))
                        return
                    }
                    var streams: [ExtractedStream] = []
                    var seen = Set<String>()

                    let patterns = [
                        "https?://[^\\s\"'<>\\\\]+\\.mp4[^\\s\"'<>\\\\]*",
                        "https?://[^\\s\"'<>\\\\]+\\.m3u8[^\\s\"'<>\\\\]*",
                        "https?://[^\\s\"'<>\\\\]+\\.webm[^\\s\"'<>\\\\]*",
                        "\"contentUrl\"\\s*:\\s*\"([^\"]+)\"",
                        "\"videoUrl\"\\s*:\\s*\"([^\"]+)\"",
                        "property=\"og:video\"\\s+content=\"([^\"]+)\"",
                        "property=\"og:video:url\"\\s+content=\"([^\"]+)\""
                    ]

                    for pattern in patterns {
                        if let regex = try? NSRegularExpression(pattern: pattern) {
                            let matches = regex.matches(in: html, range: NSRange(html.startIndex..., in: html))
                            for match in matches.prefix(5) {
                                let matchRange = match.numberOfRanges > 1 ? match.range(at: 1) : match.range
                                if let range = Range(matchRange, in: html) {
                                    var vURL = String(html[range])
                                    vURL = vURL.replacingOccurrences(of: "\\/", with: "/")
                                    vURL = vURL.replacingOccurrences(of: "\\u0026", with: "&")
                                    if !seen.contains(vURL) && vURL.hasPrefix("http") {
                                        seen.insert(vURL)
                                        streams.append(ExtractedStream(url: vURL, quality: .p720, headers: [:], filename: nil, hasAudio: true))
                                    }
                                }
                            }
                        }
                    }

                    // Try to extract title
                    var title = "Video"
                    if let regex = try? NSRegularExpression(pattern: "<title>([^<]+)</title>"),
                       let match = regex.firstMatch(in: html, range: NSRange(html.startIndex..., in: html)),
                       let range = Range(match.range(at: 1), in: html) {
                        title = String(html[range])
                    }

                    if streams.isEmpty {
                        completion(.failure(ExtractorError.allBackendsFailed("No videos in HTML")))
                    } else {
                        completion(.success(ExtractedVideo(
                            title: title, streams: streams,
                            thumbnail: nil, sourceType: .direct
                        )))
                    }
                }.resume()
            }
        }
