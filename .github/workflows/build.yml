              /// فحص إن الرابط بيقدّم وسائط فعلاً (بيدعم نفس الرابط بدون redirect)
              private static func probeStream(_ u: URL, completion: @escaping (Bool) -> Void) {
                  var req = URLRequest(url: u, timeoutInterval: 15)
                  req.setValue(mobileUA, forHTTPHeaderField: "User-Agent")
                  req.setValue("bytes=0-1023", forHTTPHeaderField: "Range")
                  URLSession.shared.dataTask(with: req) { data, resp, err in
                      guard err == nil,
                            let http = resp as? HTTPURLResponse,
                            http.statusCode == 200 || http.statusCode == 206 else {
                          completion(false)
                          return
                      }
                      let ct = (http.mimeType ?? "").lowercased()
                      if ct.contains("video") || ct.contains("audio") || ct.contains("octet-stream") {
                          completion(true)
                          return
                      }
                      if let d = data, MediaValidator.looksLikeMedia(d) {
                          completion(true)
                          return
                      }
                      completion(false)
                  }.resume()
              }

              // MARK: - تنظيف العناوين

              private static func cleanTitle(_ raw: String) -> String {
                  var s = raw
                  let patterns = [
                      "\\(Official[^)]*\\)", "\\(Lyrics?[^)]*\\)", "\\[Official[^\\]]*\\]",
                      "- Topic", "\\s*\\|.*$", "Official Video", "Official Audio", "Official Music Video"
                  ]
                  for p in patterns {
                      s = s.replacingOccurrences(of: p, with: "", options: [.regularExpression, .caseInsensitive])
                  }
                  s = s.replacingOccurrences(of: "\\s+", with: " ", options: .regularExpression)
                  s = s.trimmingCharacters(in: .whitespacesAndNewlines)
                  return s.isEmpty ? raw : s
              }
          }
