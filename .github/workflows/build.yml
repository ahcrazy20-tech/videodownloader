          import Foundation
          import SwiftUI
          import AVFoundation

          class WhisperManager: ObservableObject {
              @Published var isModelReady = false
              @Published var isDownloading = false
              @Published var downloadProgress: Float = 0.0

              private var modelURL: URL?
              private let modelFileName = "ggml-base.bin"
              private let modelRemoteURL = "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.bin"
              private var downloadTask: URLSessionDownloadTask?
              // مهم: لو ما حفظناش الـ observation في property هيلغى فوراً ولن يصلك التقدم
              private var progressObservation: NSKeyValueObservation?

              init() {
                  let documentsURL = FileManager.default.urls(for: .documentDirectory, in: .userDomainMask).first!
                  modelURL = documentsURL.appendingPathComponent(modelFileName)
                  checkModelAvailability()
              }

              func checkModelAvailability() {
                  if let modelURL = modelURL, FileManager.default.fileExists(atPath: modelURL.path) {
                      isModelReady = true
                  } else {
                      isModelReady = false
                  }
              }

              func downloadModelIfNeeded() {
                  guard !isDownloading else { return }
                  guard let modelURL = modelURL else { return }

                  if FileManager.default.fileExists(atPath: modelURL.path) {
                      isModelReady = true
                      return
                  }

                  isDownloading = true
                  downloadProgress = 0.0

                  guard let url = URL(string: modelRemoteURL) else {
                      isDownloading = false
                      return
                  }

                  let session = URLSession(configuration: .default, delegate: nil, delegateQueue: .main)
                  downloadTask = session.downloadTask(with: url) { [weak self] location, response, error in
                      guard let self = self else { return }
                      self.isDownloading = false

                      if let location = location {
                          do {
                              try FileManager.default.moveItem(at: location, to: modelURL)
                              self.checkModelAvailability()
                              print("✅ تم تحميل نموذج Whisper بنجاح")
                          } catch {
                              print("❌ فشل حفظ النموذج: \(error)")
                          }
                      } else {
                          print("❌ فشل التحميل: \(error?.localizedDescription ?? "خطأ غير معروف")")
                      }
                  }

                  progressObservation = downloadTask?.progress.observe(\.fractionCompleted) { [weak self] progress, _ in
                      DispatchQueue.main.async {
                          self?.downloadProgress = Float(progress.fractionCompleted)
                      }
                  }
                  downloadTask?.resume()
              }

              // MARK: - الترجمة الصوتية الفعلية باستخدام Whisper
              func transcribe(audioURL: URL, completion: @escaping (String?) -> Void) {
                  guard isModelReady, let modelPath = modelURL?.path else {
                      completion(nil)
                      return
                  }

                  convertAudioToPCM(audioURL: audioURL) { pcmData in
                      guard let pcmData = pcmData else {
                          completion(nil)
                          return
                      }
                      self.transcribeWithWhisper(pcmData: pcmData, modelPath: modelPath, completion: completion)
                  }
              }

              private func convertAudioToPCM(audioURL: URL, completion: @escaping (Data?) -> Void) {
                  let asset = AVAsset(url: audioURL)
                  Task {
                      let tracks = (try? await asset.loadTracks(withMediaType: .audio)) ?? []
                      guard let audioTrack = tracks.first else {
                          completion(nil)
                          return
                      }

                      let outputSettings: [String: Any] = [
                          AVFormatIDKey: kAudioFormatLinearPCM,
                          AVSampleRateKey: 16000.0,
                          AVNumberOfChannelsKey: 1,
                          AVLinearPCMBitDepthKey: 16,
                          AVLinearPCMIsFloatKey: false,
                          AVLinearPCMIsBigEndianKey: false
                      ]

                      guard let reader = try? AVAssetReader(asset: asset) else {
                          completion(nil)
                          return
                      }
                      let output = AVAssetReaderTrackOutput(track: audioTrack, outputSettings: outputSettings)
                      reader.add(output)

                      var pcmData = Data()
                      reader.startReading()
                      while let sampleBuffer = output.copyNextSampleBuffer() {
                          if let blockBuffer = CMSampleBufferGetDataBuffer(sampleBuffer) {
                              // قراءة كل الأجزاء المتجاورة في البلوك (قد يكون مقسماً لأكثر من جزء)
                              let totalLength = CMBlockBufferGetDataLength(blockBuffer)
                              var offset = 0
                              while offset < totalLength {
                                  var chunkLength = 0
                                  var dataPointer: UnsafeMutablePointer<Int8>?
                                  let status = CMBlockBufferGetDataPointer(
                                      blockBuffer,
                                      atOffset: offset,
                                      lengthAtOffsetOut: &chunkLength,
                                      totalLengthOut: nil,
                                      dataPointerOut: &dataPointer
                                  )
                                  guard status == kCMBlockBufferNoErr, let pointer = dataPointer, chunkLength > 0 else { break }
                                  pcmData.append(contentsOf: UnsafeRawBufferPointer(start: pointer, count: chunkLength))
                                  offset += chunkLength
                              }
                          }
                      }
                      completion(pcmData.isEmpty ? nil : pcmData)
                  }
              }

              private func transcribeWithWhisper(pcmData: Data, modelPath: String, completion: @escaping (String?) -> Void) {
                  // هنا يتم دمج SwiftWhisper (https://github.com/exPHAT/SwiftWhisper) أو whisper.cpp
                  // لاحظ: whisper.cpp يتوقع Float32 بمدى [-1, 1] عند 16kHz — حوّل Int16 بالقسمة على 32768
                  print("🔊 جاري الترجمة الصوتية باستخدام Whisper...")
                  print("📁 مسار النموذج: \(modelPath)")
                  print("📊 حجم بيانات PCM: \(pcmData.count) بايت")

                  // محاكاة (استبدلها بالكود الحقيقي من SwiftWhisper — انظر REVIEW.md)
                  DispatchQueue.global().asyncAfter(deadline: .now() + 2) {
                      completion("هذا نص تجريبي من Whisper. قم بدمج مكتبة SwiftWhisper للحصول على ترجمة صوتية حقيقية.")
                  }
              }
          }
          EOF

