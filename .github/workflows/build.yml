        # ============================================================
        # FILE 4: DownloadTask.swift
        # ============================================================
        cat > VideoFlow/Models/DownloadTask.swift << 'SWIFTEOF'
        import Foundation

        enum DownloadStatus: Equatable {
            case waiting
            case downloading(progress: Double)
            case paused
            case completed
            case failed(error: String)

            var displayText: String {
                switch self {
                case .waiting:              return "Waiting..."
                case .downloading(let p):  return "\(Int(p * 100))%"
                case .paused:              return "Paused"
                case .completed:           return "Completed"
                case .failed(let e):       return "Failed: \(e)"
                }
            }
        }

        class DownloadTask: ObservableObject, Identifiable {
            let id: String
            let video: VideoItem
            let quality: VideoQuality

            @Published var status: DownloadStatus = .waiting
            @Published var progress: Double = 0
            @Published var downloadedBytes: Int64 = 0
            @Published var totalBytes: Int64 = 0
            @Published var speed: String = ""
            @Published var savedURL: URL?

            var urlSessionTask: URLSessionDownloadTask?
            private var lastBytes: Int64 = 0
            private var lastTime: Date?

            init(id: String = UUID().uuidString, video: VideoItem, quality: VideoQuality) {
                self.id = id
                self.video = video
                self.quality = quality
            }

            func updateProgress(bytesWritten: Int64, totalBytes: Int64) {
                let now = Date()
                self.downloadedBytes = bytesWritten
                self.totalBytes = totalBytes
                if totalBytes > 0 { self.progress = Double(bytesWritten) / Double(totalBytes) }
                if let lastTime = lastTime {
                    let elapsed = now.timeIntervalSince(lastTime)
                    if elapsed > 0.5 {
                        let bps = Double(bytesWritten - lastBytes) / elapsed
                        self.speed = formatSpeed(bps)
                        self.lastBytes = bytesWritten
                        self.lastTime = now
                    }
                } else { self.lastTime = now }
                self.status = .downloading(progress: self.progress)
            }

            private func formatSpeed(_ bps: Double) -> String {
                if bps < 1024 { return "\(Int(bps)) B/s" }
                if bps < 1024*1024 { return String(format: "%.1f KB/s", bps/1024) }
                return String(format: "%.1f MB/s", bps/(1024*1024))
            }

            var sizeText: String {
                if totalBytes > 0 { return "\(formatBytes(downloadedBytes)) / \(formatBytes(totalBytes))" }
                return formatBytes(downloadedBytes)
            }

            private func formatBytes(_ bytes: Int64) -> String {
                let f = ByteCountFormatter()
                f.allowedUnits = [.useMB, .useGB]
                f.countStyle = .file
                return f.string(fromByteCount: bytes)
            }
        }
        SWIFTEOF

        # ============================================================
        # FILE 5: DownloadManager.swift (UPGRADED)
        # ============================================================
        cat > VideoFlow/Services/DownloadManager.swift << 'SWIFTEOF'
        import Foundation
        import UserNotifications

        class DownloadManager: NSObject, ObservableObject {
            static let shared = DownloadManager()

            @Published var activeDownloads: [DownloadTask] = []
            @Published var completedVideos: [DownloadTask] = []

            var backgroundCompletionHandler: (() -> Void)?
            private var urlSession: URLSession!
            private var taskMap: [URLSessionTask: DownloadTask] = [:]

            override init() {
                super.init()
                let config = URLSessionConfiguration.background(withIdentifier: "com.videoflow.download.v2")
                config.isDiscretionary = false
                config.sessionSendsLaunchEvents = true
                config.allowsCellularAccess = true
                config.httpMaximumConnectionsPerHost = 6
                config.timeoutIntervalForRequest = 60
                config.timeoutIntervalForResource = 3600
                urlSession = URLSession(configuration: config, delegate: self, delegateQueue: nil)
                ensureDownloadsDirectoryExists()
                loadSavedVideos()
            }

            private func ensureDownloadsDirectoryExists() {
                let dir = getDownloadsDirectory()
                if !FileManager.default.fileExists(atPath: dir.path) {
                    do {
                        try FileManager.default.createDirectory(
                            at: dir,
                            withIntermediateDirectories: true,
                            attributes: [.posixPermissions: 0o755]
                        )
                        print("Downloads directory created: \(dir.path)")
                    } catch {
                        print("Failed to create directory: \(error)")
                    }
                }
            }

            func startDownload(video: VideoItem, quality: VideoQuality, customURL: String? = nil, customHeaders: [String: String] = [:]) {
                let downloadURL = customURL ?? video.url
                guard let url = URL(string: downloadURL) else {
                    print("Invalid URL: \(downloadURL)")
                    return
                }

                let task = DownloadTask(video: video, quality: quality)
                DispatchQueue.main.async { self.activeDownloads.append(task) }

                var request = URLRequest(url: url)
                request.setValue("Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1", forHTTPHeaderField: "User-Agent")
                request.setValue("*/*", forHTTPHeaderField: "Accept")
                request.setValue("identity;q=1, *;q=0", forHTTPHeaderField: "Accept-Encoding")
                request.setValue("en-US,en;q=0.9,ar;q=0.8", forHTTPHeaderField: "Accept-Language")

                // Merge headers
                var allHeaders = video.headers
                for (k, v) in customHeaders { allHeaders[k] = v }
                for (key, value) in allHeaders {
                    request.setValue(value, forHTTPHeaderField: key)
                }

                // Auto Referer/Origin
                if allHeaders["Referer"] == nil, let host = url.host {
                    request.setValue("https://\(host)/", forHTTPHeaderField: "Referer")
                }
                if allHeaders["Origin"] == nil, let host = url.host {
                    request.setValue("https://\(host)", forHTTPHeaderField: "Origin")
                }

                let dlTask = urlSession.downloadTask(with: request)
                task.urlSessionTask = dlTask
                taskMap[dlTask] = task
                dlTask.resume()
                task.status = .downloading(progress: 0)
            }

            func pauseDownload(_ task: DownloadTask) {
                task.urlSessionTask?.cancel(byProducingResumeData: { _ in
                    DispatchQueue.main.async { task.status = .paused }
                })
            }

            func resumeDownload(_ task: DownloadTask) {
                task.status = .downloading(progress: task.progress)
                task.urlSessionTask?.resume()
            }

            func cancelDownload(_ task: DownloadTask) {
                task.urlSessionTask?.cancel()
                DispatchQueue.main.async { self.activeDownloads.removeAll { $0.id == task.id } }
            }

            func deleteVideo(_ task: DownloadTask) {
                if let url = task.savedURL { try? FileManager.default.removeItem(at: url) }
                DispatchQueue.main.async { self.completedVideos.removeAll { $0.id == task.id } }
            }

            private func getDownloadsDirectory() -> URL {
                let paths = FileManager.default.urls(for: .documentDirectory, in: .userDomainMask)
                return paths[0].appendingPathComponent("VideoFlow", isDirectory: true)
            }

            private func moveDownloadedFile(from location: URL, to destination: URL) throws {
                let fm = FileManager.default
                if fm.fileExists(atPath: destination.path) {
                    try fm.removeItem(at: destination)
                }
                let parentDir = destination.deletingLastPathComponent()
                if !fm.fileExists(atPath: parentDir.path) {
                    try fm.createDirectory(at: parentDir, withIntermediateDirectories: true)
                }
                do {
                    try fm.moveItem(at: location, to: destination)
                } catch {
                    try fm.copyItem(at: location, to: destination)
                    try? fm.removeItem(at: location)
                }
                try? fm.setAttributes([.posixPermissions: 0o644], ofItemAtPath: destination.path)
            }

            private func sanitizeFileName(_ name: String) -> String {
                let invalidChars = CharacterSet(charactersIn: "/\\:*?\"<>|")
                var cleaned = name.components(separatedBy: invalidChars).joined(separator: "_")
                cleaned = cleaned.replacingOccurrences(of: " ", with: "_")
                cleaned = cleaned.replacingOccurrences(of: "|", with: "_")
                if cleaned.count > 50 {
                    cleaned = String(cleaned.prefix(50))
                }
                return cleaned.isEmpty ? "video_\(Int(Date().timeIntervalSince1970))" : cleaned
            }

            private func loadSavedVideos() {
                let dir = getDownloadsDirectory()
                guard let files = try? FileManager.default.contentsOfDirectory(
                    at: dir, includingPropertiesForKeys: [.fileSizeKey]
                ) else { return }
                let ext = ["mp4","m4v","mov","mkv","avi","mp3","m4a"]
                let videoFiles = files.filter { ext.contains($0.pathExtension.lowercased()) }
                DispatchQueue.main.async {
                    self.completedVideos = videoFiles.map { url in
                        let video = VideoItem(
                            id: url.lastPathComponent,
                            title: url.deletingPathExtension().lastPathComponent,
                            url: url.absoluteString,
                            thumbnailURL: nil, duration: nil, estimatedSize: nil,
                            availableQualities: [.p720], sourceType: .direct
                        )
                        let task = DownloadTask(video: video, quality: .p720)
                        task.savedURL = url
                        task.status = .completed
                        return task
                    }
                }
            }
        }

        extension DownloadManager: URLSessionDownloadDelegate {
            func urlSession(_ session: URLSession, downloadTask: URLSessionDownloadTask,
                            didFinishDownloadingTo location: URL) {
                guard let task = taskMap[downloadTask] else { return }
                let safeName = sanitizeFileName(task.video.title)
                let ext = task.quality == .audio ? "mp3" : "mp4"
                let fileName = "\(safeName)_\(task.quality.rawValue).\(ext)"
                let destURL = getDownloadsDirectory().appendingPathComponent(fileName)
                do {
                    try moveDownloadedFile(from: location, to: destURL)
                    DispatchQueue.main.async {
                        task.savedURL = destURL
                        task.status = .completed
                        task.progress = 1.0
                        self.activeDownloads.removeAll { $0.id == task.id }
                        self.completedVideos.insert(task, at: 0)
                        self.taskMap.removeValue(forKey: downloadTask)
                        self.sendNotification(for: task)
                    }
                } catch {
                    DispatchQueue.main.async {
                        task.status = .failed(error: "Save failed: \(error.localizedDescription)")
                        self.taskMap.removeValue(forKey: downloadTask)
                    }
                }
            }

            func urlSession(_ session: URLSession, downloadTask: URLSessionDownloadTask,
                            didWriteData bytesWritten: Int64, totalBytesWritten: Int64,
                            totalBytesExpectedToWrite: Int64) {
                guard let task = taskMap[downloadTask] else { return }
                DispatchQueue.main.async {
                    task.updateProgress(bytesWritten: totalBytesWritten, totalBytes: totalBytesExpectedToWrite)
                }
            }

            func urlSession(_ session: URLSession, task: URLSessionTask, didCompleteWithError error: Error?) {
                guard let dlTask = task as? URLSessionDownloadTask,
                      let t = taskMap[dlTask], let error = error else { return }
                if (error as NSError).code != NSURLErrorCancelled {
                    DispatchQueue.main.async { t.status = .failed(error: error.localizedDescription) }
                }
            }

            func urlSessionDidFinishEvents(forBackgroundURLSession session: URLSession) {
                DispatchQueue.main.async {
                    self.backgroundCompletionHandler?()
                    self.backgroundCompletionHandler = nil
                }
            }

            private func sendNotification(for task: DownloadTask) {
                let content = UNMutableNotificationContent()
                content.title = "Download Complete"
                content.body = "\(task.video.title) - \(task.quality.rawValue)"
                content.sound = .default
                let req = UNNotificationRequest(identifier: task.id, content: content, trigger: nil)
                UNUserNotificationCenter.current().add(req, withCompletionHandler: nil)
            }
        }
        SWIFTEOF

        # ============================================================
        # FILE 6: PlayerManager.swift
        # ============================================================
        cat > VideoFlow/Services/PlayerManager.swift << 'SWIFTEOF'
        import Foundation
        import AVFoundation
        import Combine

        class PlayerManager: ObservableObject {
            static let shared = PlayerManager()

            @Published var currentVideo: DownloadTask?
            @Published var isPlaying = false
            @Published var isFullScreen = false
            @Published var isMinimized = false
            @Published var currentTime: Double = 0
            @Published var duration: Double = 0
            @Published var volume: Float = 1.0
            @Published var playbackSpeed: Float = 1.0
            @Published var isMuted = false
            @Published var isLoading = false

            var player: AVPlayer?
            private var timeObserver: Any?
            private var cancellables = Set<AnyCancellable>()

            func playVideo(_ task: DownloadTask) {
                currentVideo = task
                let url: URL?
                if let saved = task.savedURL { url = saved }
                else { url = URL(string: task.video.url) }
                guard let videoURL = url else { return }

                isLoading = true
                player?.pause()
                player = AVPlayer(url: videoURL)
                player?.volume = volume

                player?.currentItem?.publisher(for: \.duration)
                    .receive(on: DispatchQueue.main)
                    .sink { [weak self] dur in
                        let secs = dur.seconds
                        self?.duration = secs.isNaN || secs.isInfinite ? 0 : secs
                        self?.isLoading = false
                    }.store(in: &cancellables)

                let interval = CMTime(seconds: 0.5, preferredTimescale: 600)
                timeObserver = player?.addPeriodicTimeObserver(forInterval: interval, queue: .main) {
                    [weak self] time in
                    self?.currentTime = time.seconds
                }

                player?.play()
                isPlaying = true
                isFullScreen = true
                isMinimized = false
            }

            func togglePlayPause() {
                isPlaying ? player?.pause() : player?.play()
                isPlaying.toggle()
            }

            func seek(to time: Double) {
                let t = CMTime(seconds: time, preferredTimescale: 600)
                player?.seek(to: t, toleranceBefore: .zero, toleranceAfter: .zero)
            }

            func skipForward(_ s: Double = 10) { seek(to: min(currentTime + s, duration)) }
            func skipBackward(_ s: Double = 10) { seek(to: max(currentTime - s, 0)) }

            func setSpeed(_ speed: Float) {
                playbackSpeed = speed
                if isPlaying { player?.rate = speed }
            }

            func setVolume(_ vol: Float) { volume = vol; player?.volume = vol }

            func minimize() { isFullScreen = false; isMinimized = true }

            func close() {
                if let obs = timeObserver { player?.removeTimeObserver(obs); timeObserver = nil }
                player?.pause(); player = nil
                isPlaying = false; isFullScreen = false; isMinimized = false
                currentVideo = nil; currentTime = 0; duration = 0
            }

            var progress: Double { duration > 0 ? currentTime / duration : 0 }

            func formattedTime(_ t: Double) -> String {
                guard !t.isNaN && !t.isInfinite else { return "0:00" }
                let s = Int(t); let h = s/3600; let m = (s%3600)/60; let sec = s%60
                return h > 0 ? String(format: "%d:%02d:%02d", h,m,sec) : String(format: "%d:%02d", m,sec)
            }
        }
        SWIFTEOF

        # ============================================================
        # FILE 7: YouTubeExtractor.swift (NEW)
        # ============================================================
        cat > VideoFlow/Extractors/YouTubeExtractor.swift << 'SWIFTEOF'
        import Foundation

        class YouTubeExtractor {
            static let shared = YouTubeExtractor()

            struct YouTubeStream {
                let url: String
                let quality: VideoQuality
                let mimeType: String
                let headers: [String: String]
                let hasAudio: Bool
            }

            func extractVideoID(from url: String) -> String? {
                let patterns = [
                    "(?:youtube\\.com/watch\\?v=|youtu\\.be/|youtube\\.com/embed/|youtube\\.com/shorts/)([a-zA-Z0-9_-]{11})",
                    "youtube\\.com/v/([a-zA-Z0-9_-]{11})"
                ]
                for pattern in patterns {
                    if let regex = try? NSRegularExpression(pattern: pattern),
                       let match = regex.firstMatch(in: url, range: NSRange(url.startIndex..., in: url)),
                       let range = Range(match.range(at: 1), in: url) {
                        return String(url[range])
                    }
                }
                return nil
            }

            func extractStreams(videoID: String, completion: @escaping (Result<[YouTubeStream], Error>) -> Void) {
                guard let url = URL(string: "https://www.youtube.com/youtubei/v1/player?key=AIzaSyAO_FJ2SlqU8Q4STEHLGCilw_Y9_11qcW8") else {
                    completion(.failure(NSError(domain: "YouTube", code: -100)))
                    return
                }
                var request = URLRequest(url: url)
                request.httpMethod = "POST"
                request.setValue("application/json", forHTTPHeaderField: "Content-Type")
                request.setValue("com.google.ios.youtube/19.29.1 (iPhone16,2; U; CPU iOS 17_5_1 like Mac OS X;)", forHTTPHeaderField: "User-Agent")
                request.setValue("https://www.youtube.com", forHTTPHeaderField: "Origin")

                let payload: [String: Any] = [
                    "context": [
                        "client": [
                            "clientName": "IOS",
                            "clientVersion": "19.29.1",
                            "deviceMake": "Apple",
                            "deviceModel": "iPhone16,2",
                            "osName": "iOS",
                            "osVersion": "17.5.1.21F90",
                            "hl": "en",
                            "gl": "US"
                        ]
                    ],
                    "videoId": videoID,
                    "playbackContext": [
                        "contentPlaybackContext": [
                            "html5Preference": "HTML5_PREF_WANTS"
                        ]
                    ],
                    "contentCheckOk": true,
                    "racyCheckOk": true
                ]
                request.httpBody = try? JSONSerialization.data(withJSONObject: payload)

                URLSession.shared.dataTask(with: request) { data, _, error in
                    if let error = error {
                        completion(.failure(error))
                        return
                    }
                    guard let data = data,
                          let json = try? JSONSerialization.jsonObject(with: data) as? [String: Any] else {
                        completion(.failure(NSError(domain: "YouTube", code: -1, userInfo: [NSLocalizedDescriptionKey: "Invalid response"])))
                        return
                    }

                    var streams: [YouTubeStream] = []
                    let headers = [
                        "User-Agent": "com.google.ios.youtube/19.29.1 (iPhone16,2; U; CPU iOS 17_5_1 like Mac OS X;)",
                        "Origin": "https://www.youtube.com",
                        "Referer": "https://www.youtube.com/"
                    ]

                    if let streamingData = json["streamingData"] as? [String: Any] {
                        // Progressive (video+audio combined)
                        if let formats = streamingData["formats"] as? [[String: Any]] {
                            for format in formats {
                                if let urlStr = format["url"] as? String,
                                   let height = format["height"] as? Int {
                                    let quality = self.qualityFromHeight(height)
                                    streams.append(YouTubeStream(
                                        url: urlStr,
                                        quality: quality,
                                        mimeType: format["mimeType"] as? String ?? "video/mp4",
                                        headers: headers,
                                        hasAudio: true
                                    ))
                                }
                            }
                        }

                        // Adaptive (higher quality but video only)
                        if let adaptiveFormats = streamingData["adaptiveFormats"] as? [[String: Any]] {
                            for format in adaptiveFormats {
                                if let urlStr = format["url"] as? String,
                                   let mimeType = format["mimeType"] as? String,
                                   mimeType.contains("video/mp4"),
                                   let height = format["height"] as? Int, height >= 720 {
                                    let quality = self.qualityFromHeight(height)
                                    if !streams.contains(where: { $0.quality == quality && $0.hasAudio }) {
                                        streams.append(YouTubeStream(
                                            url: urlStr,
                                            quality: quality,
                                            mimeType: mimeType,
                                            headers: headers,
                                            hasAudio: false
                                        ))
                                    }
                                }
                            }
                            // Audio only
                            for format in adaptiveFormats {
                                if let urlStr = format["url"] as? String,
                                   let mimeType = format["mimeType"] as? String,
                                   mimeType.contains("audio/mp4") {
                                    streams.append(YouTubeStream(
                                        url: urlStr,
                                        quality: .audio,
                                        mimeType: mimeType,
                                        headers: headers,
                                        hasAudio: true
                                    ))
                                    break
                                }
                            }
                        }
                    }

                    if streams.isEmpty {
                        completion(.failure(NSError(domain: "YouTube", code: -2, userInfo: [NSLocalizedDescriptionKey: "No streams found"])))
                    } else {
                        completion(.success(streams))
                    }
                }.resume()
            }

            func extractVideoInfo(videoID: String, completion: @escaping (String) -> Void) {
                guard let url = URL(string: "https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=\(videoID)&format=json") else {
                    completion("YouTube Video")
                    return
                }
                URLSession.shared.dataTask(with: url) { data, _, _ in
                    guard let data = data,
                          let json = try? JSONSerialization.jsonObject(with: data) as? [String: Any],
                          let title = json["title"] as? String else {
                        completion("YouTube Video")
                        return
                    }
                    completion(title)
                }.resume()
            }

            private func qualityFromHeight(_ height: Int) -> VideoQuality {
                switch height {
                case 2160...: return .p2160
                case 1440..<2160: return .p1440
                case 1080..<1440: return .p1080
                case 720..<1080: return .p720
                case 480..<720: return .p480
                case 360..<480: return .p360
                default: return .p240
                }
            }
        }
