              private static func pipedTry(_ mirrors: [String], index: Int, vid: String, completion: @escaping (Result<ResolvedVideo, Error>) -> Void) {
                  guard index < mirrors.count else {
                      completion(.failure(NSError(domain: "VideoResolver", code: 40)))
                      return
                  }
                  guard let url = URL(string: mirrors[index] + "/streams/" + vid) else {
                      pipedTry(mirrors, index: index + 1, vid: vid, completion: completion)
                      return
                  }
                  var req = URLRequest(url: url, timeoutInterval: 12)
                  req.setValue(mobileUA, forHTTPHeaderField: "User-Agent")

                  URLSession.shared.dataTask(with: req) { data, _, err in
                      guard let data = data, err == nil,
                            let j = (try? JSONSerialization.jsonObject(with: data)) as? [String: Any] else {
                          pipedTry(mirrors, index: index + 1, vid: vid, completion: completion)
                          return
                      }
                      let title = cleanTitle(j["title"] as? String ?? "YouTube \\(vid)")

                      var bestURL: URL? = nil
                      var isVideo = false
                      if let vs = j["videoStreams"] as? [[String: Any]] {
                          let mp4s = vs.filter { (($0["mimeType"] as? String) ?? "").contains("mp4") }
                          let combined = mp4s.filter { (($0["videoOnly"] as? Bool) ?? false) == false }
                          let pool = combined.isEmpty ? mp4s : combined
                          let chosen = pool.max { (($0["bitrate"] as? Int) ?? 0) < (($1["bitrate"] as? Int) ?? 0) }
                          if let u = chosen?["url"] as? String, let uu = URL(string: u) {
                              bestURL = uu
                              isVideo = true
                          }
                      }
                      if bestURL == nil, let aus = j["audioStreams"] as? [[String: Any]] {
                          let m4as = aus.filter { (($0["mimeType"] as? String) ?? "").contains("mp4") }
                          if let u = (m4as.first ?? aus.first)?["url"] as? String, let uu = URL(string: u) {
                              bestURL = uu
                          }
                      }
                      guard let final = bestURL else {
                          pipedTry(mirrors, index: index + 1, vid: vid, completion: completion)
                          return
                      }
                      completion(.success(ResolvedVideo(url: final, filename: title + (isVideo ? ".mp4" : ".m4a"), sourceLabel: "Piped", referer: "")))
                  }.resume()
              }

