name: Build iOS IPA

on:
  workflow_dispatch:  # فقط عند التشغيل اليدوي
  release:
    types: [published]  # أو عند إنشاء release

jobs:
  build:
    runs-on: macos-14  # جرب macos-14 بدلاً من macos-13
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Select Xcode
      run: sudo xcode-select -s /Applications/Xcode_15.0.app
      
    - name: Install dependencies
      run: |
        brew install ldid
        
    - name: Download yt-dlp
      run: |
        mkdir -p Resources
        curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o Resources/yt-dlp
        chmod +x Resources/yt-dlp
        
    - name: Create Xcode Project Structure
      run: |
        mkdir -p MegaDownloader.xcodeproj
        cat > MegaDownloader.xcodeproj/project.pbxproj << 'PBXEOF'
// {
//   objects = {
//     /* Begin PBXBuildFile section */
//     /* End PBXBuildFile section */
//     /* Begin PBXFileReference section */
//     /* End PBXFileReference section */
//     /* Begin PBXGroup section */
//     /* End PBXGroup section */
//     /* Begin PBXNativeTarget section */
//     /* End PBXNativeTarget section */
//     /* Begin PBXProject section */
//     /* End PBXProject section */
//     /* Begin XCBuildConfiguration section */
//     /* End XCBuildConfiguration section */
//     /* Begin XCConfigurationList section */
//     /* End XCConfigurationList section */
//   };
//   rootObject = ;
// }
PBXEOF

    - name: Build with Swift Package Manager
      run: |
        # استخدام SPM بدلاً من xcodebuild
        swift build -c release
        
    - name: Create IPA
      run: |
        mkdir -p Payload/MegaDownloader.app
        # نسخ الـ binary
        cp .build/release/MegaDownloader Payload/MegaDownloader.app/
        # نسخ الموارد
        cp Resources/yt-dlp Payload/MegaDownloader.app/
        cp Info.plist Payload/MegaDownloader.app/
        chmod +x Payload/MegaDownloader.app/yt-dlp
        # توقيع
        ldid -STrollStore.entitlements Payload/MegaDownloader.app/MegaDownloader
        # إنشاء IPA
        zip -r MegaDownloader.ipa Payload
        
    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: MegaDownloader-iOS
        path: MegaDownloader.ipa
