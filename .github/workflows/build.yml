        import SwiftUI

        struct DownloadsView: View {
            @EnvironmentObject var dm: DownloadManager
            @EnvironmentObject var pm: PlayerManager
            @State private var tab = 0
            var body: some View {
                NavigationView {
                    VStack(spacing: 0) {
                        Picker("", selection: $tab) {
                            Text("Active (\(dm.activeDownloads.count))").tag(0)
                            Text("Done (\(dm.completedVideos.count))").tag(1)
                        }.pickerStyle(.segmented).padding()
                        if tab == 0 {
                            if dm.activeDownloads.isEmpty { EmptyV(icon: "arrow.down.circle", t: "No Downloads", s: "Tap Download in browser") }
                            else { 
                                List(dm.activeDownloads) { t in 
                                    ActiveRow(task: t, 
                                        onP: { dm.pauseDownload(t) }, 
                                        onR: { dm.resumeDownload(t) }, 
                                        onC: { dm.cancelDownload(t) },
                                        onRetry: { dm.retryDownload(t) })
                                }.listStyle(.plain) 
                            }
                        } else {
                            if dm.completedVideos.isEmpty { EmptyV(icon: "checkmark.circle", t: "No Videos", s: "Downloads appear here") }
                            else { List(dm.completedVideos) { t in DoneRow(task: t, onPlay: { pm.playVideo(t) }, onDel: { dm.deleteVideo(t) }) }.listStyle(.plain) }
                        }
                    }.navigationTitle("Downloads")
                }
            }
        }

        struct ActiveRow: View {
            @ObservedObject var task: DownloadTask
            let onP: () -> Void
            let onR: () -> Void
            let onC: () -> Void
            let onRetry: () -> Void
            
            var isFailed: Bool {
                if case .failed = task.status { return true }
                return false
            }
            
            var body: some View {
                VStack(alignment: .leading, spacing: 8) {
                    HStack {
                        VStack(alignment: .leading, spacing: 4) {
                            Text(task.video.title).font(.system(size: 14, weight: .medium)).lineLimit(2)
                            HStack(spacing: 6) {
                                Text(task.quality.rawValue).font(.caption).foregroundColor(.white).padding(.horizontal, 6).padding(.vertical, 2).background(task.quality.color).cornerRadius(4)
                                Text(task.status.displayText).font(.caption).foregroundColor(isFailed ? .red : .secondary).lineLimit(2)
                                if !task.speed.isEmpty && !isFailed { Text(task.speed).font(.caption).foregroundColor(.blue) }
                            }
                            if !isFailed { Text(task.sizeText).font(.caption2).foregroundColor(.secondary) }
                        }
                        Spacer()
                        HStack(spacing: 8) {
                            if isFailed {
                                Button(action: onRetry) { 
                                    Image(systemName: "arrow.clockwise.circle.fill").font(.system(size: 28)).foregroundColor(.blue) 
                                }
                            } else if case .paused = task.status { 
                                Button(action: onR) { Image(systemName: "play.circle.fill").font(.system(size: 28)).foregroundColor(.green) } 
                            } else { 
                                Button(action: onP) { Image(systemName: "pause.circle.fill").font(.system(size: 28)).foregroundColor(.orange) } 
                            }
                            Button(action: onC) { Image(systemName: "xmark.circle.fill").font(.system(size: 28)).foregroundColor(.red) }
                        }
                    }
                    if !isFailed {
                        GeometryReader { g in
                            ZStack(alignment: .leading) {
                                RoundedRectangle(cornerRadius: 3).fill(Color(.systemGray5)).frame(height: 5)
                                RoundedRectangle(cornerRadius: 3).fill(Color.blue).frame(width: g.size.width * task.progress, height: 5).animation(.linear(duration: 0.3), value: task.progress)
                            }
                        }.frame(height: 5)
                    }
                }.padding(.vertical, 6)
            }
        }

