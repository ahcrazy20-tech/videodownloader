        cat > VideoFlow/Views/DownloadsView.swift << 'SWIFTEOF'
        import SwiftUI

        struct DownloadsView: View {
            @EnvironmentObject var dm: DownloadManager
            @EnvironmentObject var pm: PlayerManager
            @State private var tab = 0
            var body: some View {
                NavigationView {
                    VStack(spacing: 0) {
                        Picker("", selection: $tab) {
                            Text("Active (\(dm.activeDownloads.count))").tag(0)
                            Text("Done (\(dm.completedVideos.count))").tag(1)
                        }.pickerStyle(.segmented).padding()
                        if tab == 0 {
                            if dm.activeDownloads.isEmpty { EmptyV(icon: "arrow.down.circle", t: "No Downloads", s: "Tap Download in browser") }
                            else { List(dm.activeDownloads) { t in ActiveRow(task: t, onP: { dm.pauseDownload(t) }, onR: { dm.resumeDownload(t) }, onC: { dm.cancelDownload(t) }) }.listStyle(.plain) }
                        } else {
                            if dm.completedVideos.isEmpty { EmptyV(icon: "checkmark.circle", t: "No Videos", s: "Downloads appear here") }
                            else { List(dm.completedVideos) { t in DoneRow(task: t, onPlay: { pm.playVideo(t) }, onDel: { dm.deleteVideo(t) }) }.listStyle(.plain) }
                        }
                    }.navigationTitle("Downloads")
                }
            }
        }

        struct ActiveRow: View {
            @ObservedObject var task: DownloadTask; let onP: () -> Void; let onR: () -> Void; let onC: () -> Void
            var body: some View {
                VStack(alignment: .leading, spacing: 8) {
                    HStack {
                        VStack(alignment: .leading, spacing: 4) {
                            Text(task.video.title).font(.system(size: 14, weight: .medium)).lineLimit(2)
                            HStack(spacing: 6) {
                                Text(task.quality.rawValue).font(.caption).foregroundColor(.white).padding(.horizontal, 6).padding(.vertical, 2).background(task.quality.color).cornerRadius(4)
                                Text(task.status.displayText).font(.caption).foregroundColor(.secondary)
                                if !task.speed.isEmpty { Text(task.speed).font(.caption).foregroundColor(.blue) }
                            }
                            Text(task.sizeText).font(.caption2).foregroundColor(.secondary)
                        }
                        Spacer()
                        HStack(spacing: 8) {
                            if case .paused = task.status { Button(action: onR) { Image(systemName: "play.circle.fill").font(.system(size: 28)).foregroundColor(.green) } }
                            else { Button(action: onP) { Image(systemName: "pause.circle.fill").font(.system(size: 28)).foregroundColor(.orange) } }
                            Button(action: onC) { Image(systemName: "xmark.circle.fill").font(.system(size: 28)).foregroundColor(.red) }
                        }
                    }
                    GeometryReader { g in
                        ZStack(alignment: .leading) {
                            RoundedRectangle(cornerRadius: 3).fill(Color(.systemGray5)).frame(height: 5)
                            RoundedRectangle(cornerRadius: 3).fill(Color.blue).frame(width: g.size.width * task.progress, height: 5).animation(.linear(duration: 0.3), value: task.progress)
                        }
                    }.frame(height: 5)
                }.padding(.vertical, 6)
            }
        }

        struct DoneRow: View {
            let task: DownloadTask; let onPlay: () -> Void; let onDel: () -> Void
            var body: some View {
                HStack(spacing: 12) {
                    Button(action: onPlay) { ZStack { RoundedRectangle(cornerRadius: 8).fill(Color.blue.opacity(0.2)).frame(width: 75, height: 48); Image(systemName: "play.circle.fill").foregroundColor(.blue).font(.system(size: 26)) } }
                    VStack(alignment: .leading, spacing: 4) {
                        Text(task.video.title).font(.system(size: 14, weight: .medium)).lineLimit(2)
                        Text(task.quality.rawValue).font(.caption).foregroundColor(.white).padding(.horizontal, 6).padding(.vertical, 2).background(task.quality.color).cornerRadius(4)
                    }
                    Spacer()
                    VStack(spacing: 8) {
                        if let u = task.savedURL { ShareLink(item: u) { Image(systemName: "square.and.arrow.up").foregroundColor(.blue) } }
                        Button(action: onDel) { Image(systemName: "trash.fill").foregroundColor(.red) }
                    }
                }.padding(.vertical, 4)
            }
        }

        struct EmptyV: View {
            let icon, t, s: String
            var body: some View {
                VStack(spacing: 14) { Image(systemName: icon).font(.system(size: 50)).foregroundColor(.gray.opacity(0.5)); Text(t).font(.title3).fontWeight(.semibold); Text(s).font(.subheadline).foregroundColor(.secondary) }.frame(maxWidth: .infinity, maxHeight: .infinity)
            }
        }
