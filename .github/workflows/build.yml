name: Build VideoFlow v6 ULTIMATE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 120

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Select Xcode 15
      run: sudo xcode-select -s /Applications/Xcode_15.2.app

    - name: Create Project Structure
      run: |
        mkdir -p VideoFlow/App
        mkdir -p VideoFlow/Views
        mkdir -p VideoFlow/Models
        mkdir -p VideoFlow/Services
        mkdir -p VideoFlow/Extractors
        mkdir -p VideoFlow/Resources/Assets.xcassets/AppIcon.appiconset
        mkdir -p VideoFlow/Resources/Assets.xcassets/AccentColor.colorset
        mkdir -p VideoFlow.xcodeproj

    - name: Create Source Files
      run: |
        # VideoFlowApp.swift
        cat > VideoFlow/App/VideoFlowApp.swift << 'SWIFTEOF'
        import SwiftUI

        @main
        struct VideoFlowApp: App {
            @UIApplicationDelegateAdaptor(AppDelegate.self) var appDelegate
            @StateObject private var downloadManager = DownloadManager.shared
            @StateObject private var playerManager = PlayerManager.shared

            var body: some Scene {
                WindowGroup {
                    ContentView()
                        .environmentObject(downloadManager)
                        .environmentObject(playerManager)
                        .preferredColorScheme(.dark)
                }
            }
        }
        SWIFTEOF

        # AppDelegate.swift
        cat > VideoFlow/App/AppDelegate.swift << 'SWIFTEOF'
        import UIKit
        import AVFoundation
        import UserNotifications

        class AppDelegate: NSObject, UIApplicationDelegate {
            func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
                do {
                    try AVAudioSession.sharedInstance().setCategory(.playback, mode: .moviePlayback, options: [.allowAirPlay, .allowBluetooth])
                    try AVAudioSession.sharedInstance().setActive(true)
                } catch { print("Audio: \(error)") }
                UNUserNotificationCenter.current().requestAuthorization(options: [.alert, .sound, .badge]) { _, _ in }
                return true
            }
        }
        SWIFTEOF

        # VideoItem.swift
        cat > VideoFlow/Models/VideoItem.swift << 'SWIFTEOF'
        import SwiftUI

        enum VideoQuality: String, CaseIterable, Hashable {
            case p2160 = "4K"
            case p1440 = "1440p"
            case p1080 = "1080p"
            case p720  = "720p"
            case p480  = "480p"
            case p360  = "360p"
            case p240  = "240p"
            case audio = "Audio"

            var displayName: String {
                switch self {
                case .p2160: return "4K Ultra HD"
                case .p1440: return "2K QHD"
                case .p1080: return "Full HD 1080p"
                case .p720:  return "HD 720p"
                case .p480:  return "SD 480p"
                case .p360:  return "Low 360p"
                case .p240:  return "Min 240p"
                case .audio: return "Audio Only MP3"
                }
            }

            var color: Color {
                switch self {
                case .p2160: return .purple
                case .p1440: return .indigo
                case .p1080: return .red
                case .p720:  return .orange
                case .p480:  return .green
                case .p360:  return .blue
                case .p240:  return .gray
                case .audio: return .pink
                }
            }

            var cobaltValue: String {
                switch self {
                case .p2160: return "2160"
                case .p1440: return "1440"
                case .p1080: return "1080"
                case .p720:  return "720"
                case .p480:  return "480"
                case .p360:  return "360"
                case .p240:  return "240"
                case .audio: return "audio"
                }
            }
        }

        enum VideoSourceType: String {
            case direct = "Direct MP4"
            case hls = "HLS Stream"
            case youtube = "YouTube"
            case tiktok = "TikTok"
            case instagram = "Instagram"
            case facebook = "Facebook"
            case twitter = "Twitter/X"
            case reddit = "Reddit"
            case vimeo = "Vimeo"
            case other = "Web"
        }

        struct VideoItem: Identifiable, Equatable, Hashable {
            let id: String
            var title: String
            let url: String
            var thumbnailURL: String?
            var duration: String?
            var estimatedSize: String?
            var availableQualities: [VideoQuality]
            var sourceType: VideoSourceType
            var headers: [String: String] = [:]
            var isHLS: Bool { url.lowercased().contains(".m3u8") }
            func hash(into hasher: inout Hasher) { hasher.combine(id) }
            static func == (lhs: VideoItem, rhs: VideoItem) -> Bool { lhs.id == rhs.id }
        }
        SWIFTEOF

        # DownloadTask.swift
        cat > VideoFlow/Models/DownloadTask.swift << 'SWIFTEOF'
        import Foundation

        enum DownloadStatus: Equatable {
            case waiting
            case downloading(progress: Double)
            case converting
            case paused
            case completed
            case failed(error: String)
            var displayText: String {
                switch self {
                case .waiting: return "Waiting..."
                case .downloading(let p): return "\(Int(p * 100))%"
                case .converting: return "Converting HLS..."
                case .paused: return "Paused"
                case .completed: return "Completed"
                case .failed(let e): return "Failed: \(e)"
                }
            }
        }

        class DownloadTask: ObservableObject, Identifiable {
            let id: String
            let video: VideoItem
            let quality: VideoQuality
            @Published var status: DownloadStatus = .waiting
            @Published var progress: Double = 0
            @Published var downloadedBytes: Int64 = 0
            @Published var totalBytes: Int64 = 0
            @Published var speed: String = ""
            @Published var savedURL: URL?
            var sessionTaskId: Int?
            private var lastBytes: Int64 = 0
            private var lastTime: Date?

            init(id: String = UUID().uuidString, video: VideoItem, quality: VideoQuality) {
                self.id = id; self.video = video; self.quality = quality
            }

            func updateProgress(bytesWritten: Int64, totalExpected: Int64) {
                let now = Date()
                self.downloadedBytes = bytesWritten
                self.totalBytes = totalExpected
                if totalExpected > 0 { self.progress = Double(bytesWritten) / Double(totalExpected) }
                if let lt = lastTime {
                    let elapsed = now.timeIntervalSince(lt)
                    if elapsed >= 0.5 {
                        let bps = Double(bytesWritten - lastBytes) / elapsed
                        self.speed = bps < 1024 ? "\(Int(bps)) B/s" : bps < 1048576 ? String(format: "%.1f KB/s", bps/1024) : String(format: "%.1f MB/s", bps/1048576)
                        self.lastBytes = bytesWritten; self.lastTime = now
                    }
                } else { self.lastTime = now; self.lastBytes = bytesWritten }
                self.status = .downloading(progress: self.progress)
            }

            var sizeText: String {
                let fmt = ByteCountFormatter(); fmt.allowedUnits = [.useMB, .useGB]; fmt.countStyle = .file
                if totalBytes > 0 { return "\(fmt.string(fromByteCount: downloadedBytes)) / \(fmt.string(fromByteCount: totalBytes))" }
                return fmt.string(fromByteCount: downloadedBytes)
            }
        }
        SWIFTEOF

        # ============================================================
        # NEW FILE: HLSDownloader.swift (HLS → MP4 using AVFoundation)
        # ============================================================
        cat > VideoFlow/Services/HLSDownloader.swift << 'SWIFTEOF'
        import Foundation
        import AVFoundation

        class HLSDownloader: NSObject {
            static let shared = HLSDownloader()

            typealias ProgressHandler = (Double) -> Void
            typealias CompletionHandler = (Result<URL, Error>) -> Void

            private var activeSessions: [String: AVAssetDownloadURLSession] = [:]

            enum HLSError: LocalizedError {
                case invalidURL
                case downloadFailed(String)
                case exportFailed(String)
                case unsupportedFormat

                var errorDescription: String? {
                    switch self {
                    case .invalidURL: return "Invalid HLS URL"
                    case .downloadFailed(let m): return "Download failed: \(m)"
                    case .exportFailed(let m): return "Convert failed: \(m)"
                    case .unsupportedFormat: return "Unsupported HLS format"
                    }
                }
            }

            // Download HLS and export to MP4
            func downloadHLS(url: String, headers: [String: String], destination: URL,
                             progress: @escaping ProgressHandler,
                             completion: @escaping CompletionHandler) {
                guard let hlsURL = URL(string: url) else {
                    completion(.failure(HLSError.invalidURL))
                    return
                }

                print("🎬 HLS Download starting: \(url)")

                // Configure asset with headers
                var options: [String: Any] = [:]
                if !headers.isEmpty {
                    options["AVURLAssetHTTPHeaderFieldsKey"] = headers
                }
                let asset = AVURLAsset(url: hlsURL, options: options)

                // Check if asset is playable
                asset.loadValuesAsynchronously(forKeys: ["playable", "duration", "tracks"]) {
                    var error: NSError?
                    let status = asset.statusOfValue(forKey: "playable", error: &error)

                    if status != .loaded {
                        completion(.failure(HLSError.downloadFailed(error?.localizedDescription ?? "Not playable")))
                        return
                    }

                    // Method 1: Try AVAssetExportSession (works for accessible HLS)
                    self.exportWithSession(asset: asset, destination: destination,
                                           progress: progress, completion: completion)
                }
            }

            private func exportWithSession(asset: AVURLAsset, destination: URL,
                                           progress: @escaping ProgressHandler,
                                           completion: @escaping CompletionHandler) {
                // Remove existing file
                try? FileManager.default.removeItem(at: destination)

                // Try multiple presets from best to worst
                let presets = [
                    AVAssetExportPresetHighestQuality,
                    AVAssetExportPreset1920x1080,
                    AVAssetExportPreset1280x720,
                    AVAssetExportPreset960x540,
                    AVAssetExportPresetMediumQuality,
                    AVAssetExportPresetLowQuality
                ]

                var exportSession: AVAssetExportSession?
                for preset in presets {
                    if let session = AVAssetExportSession(asset: asset, presetName: preset) {
                        if session.supportedFileTypes.contains(.mp4) {
                            exportSession = session
                            print("✅ Using preset: \(preset)")
                            break
                        }
                    }
                }

                guard let export = exportSession else {
                    completion(.failure(HLSError.exportFailed("No compatible export preset")))
                    return
                }

                export.outputURL = destination
                export.outputFileType = .mp4
                export.shouldOptimizeForNetworkUse = true

                // Progress monitoring
                let timer = Timer.scheduledTimer(withTimeInterval: 0.5, repeats: true) { t in
                    let p = Double(export.progress)
                    progress(p)
                    if export.status == .completed || export.status == .failed || export.status == .cancelled {
                        t.invalidate()
                    }
                }

                export.exportAsynchronously {
                    timer.invalidate()
                    switch export.status {
                    case .completed:
                        print("✅ HLS export completed")
                        completion(.success(destination))
                    case .failed:
                        print("❌ HLS export failed: \(export.error?.localizedDescription ?? "unknown")")
                        // Try alternative method
                        self.downloadHLSAlternative(url: asset.url.absoluteString, headers: [:],
                                                    destination: destination,
                                                    progress: progress, completion: completion)
                    case .cancelled:
                        completion(.failure(HLSError.exportFailed("Cancelled")))
                    default:
                        completion(.failure(HLSError.exportFailed("Unknown status")))
                    }
                }
            }

            // Alternative: Download segments manually and concat
            private func downloadHLSAlternative(url: String, headers: [String: String],
                                                destination: URL,
                                                progress: @escaping ProgressHandler,
                                                completion: @escaping CompletionHandler) {
                print("🔄 Trying manual HLS download...")

                guard let manifestURL = URL(string: url) else {
                    completion(.failure(HLSError.invalidURL))
                    return
                }

                var req = URLRequest(url: manifestURL)
                for (k, v) in headers { req.setValue(v, forHTTPHeaderField: k) }
                req.setValue("Mozilla/5.0", forHTTPHeaderField: "User-Agent")

                URLSession.shared.dataTask(with: req) { data, _, error in
                    guard let data = data, let manifest = String(data: data, encoding: .utf8) else {
                        completion(.failure(HLSError.downloadFailed("Cannot fetch manifest")))
                        return
                    }

                    let baseURL = manifestURL.deletingLastPathComponent()
                    let segments = self.parseM3U8(manifest: manifest, baseURL: baseURL)

                    if segments.isEmpty {
                        completion(.failure(HLSError.unsupportedFormat))
                        return
                    }

                    print("📦 Found \(segments.count) segments")

                    // Check if it's a master playlist (contains other m3u8)
                    if let firstSeg = segments.first, firstSeg.absoluteString.contains(".m3u8") {
                        print("📋 Master playlist - using first variant")
                        self.downloadHLSAlternative(url: firstSeg.absoluteString, headers: headers,
                                                    destination: destination,
                                                    progress: progress, completion: completion)
                        return
                    }

                    // Download all segments and concat
                    self.downloadAndConcatSegments(segments: segments, headers: headers,
                                                   destination: destination,
                                                   progress: progress, completion: completion)
                }.resume()
            }

            private func parseM3U8(manifest: String, baseURL: URL) -> [URL] {
                var urls: [URL] = []
                let lines = manifest.components(separatedBy: .newlines)
                for line in lines {
                    let trimmed = line.trimmingCharacters(in: .whitespaces)
                    if trimmed.isEmpty || trimmed.hasPrefix("#") { continue }
                    if trimmed.hasPrefix("http") {
                        if let u = URL(string: trimmed) { urls.append(u) }
                    } else {
                        let u = baseURL.appendingPathComponent(trimmed)
                        urls.append(u)
                    }
                }
                return urls
            }

            private func downloadAndConcatSegments(segments: [URL], headers: [String: String],
                                                   destination: URL,
                                                   progress: @escaping ProgressHandler,
                                                   completion: @escaping CompletionHandler) {
                // Create output file
                try? FileManager.default.removeItem(at: destination)
                FileManager.default.createFile(atPath: destination.path, contents: nil)

                guard let fileHandle = try? FileHandle(forWritingTo: destination) else {
                    completion(.failure(HLSError.downloadFailed("Cannot create output file")))
                    return
                }

                let group = DispatchGroup()
                let queue = DispatchQueue(label: "hls.download", attributes: .concurrent)
                var completedCount = 0
                var hasError = false
                var segmentData: [Int: Data] = [:]
                let lock = NSLock()

                for (index, segURL) in segments.enumerated() {
                    group.enter()
                    queue.async {
                        var req = URLRequest(url: segURL)
                        for (k, v) in headers { req.setValue(v, forHTTPHeaderField: k) }
                        req.setValue("Mozilla/5.0", forHTTPHeaderField: "User-Agent")

                        let sem = DispatchSemaphore(value: 0)
                        URLSession.shared.dataTask(with: req) { data, _, err in
                            defer {
                                sem.signal()
                                group.leave()
                            }
                            if let data = data {
                                lock.lock()
                                segmentData[index] = data
                                completedCount += 1
                                let p = Double(completedCount) / Double(segments.count)
                                lock.unlock()
                                progress(p * 0.9) // 90% for download
                            } else {
                                hasError = true
                            }
                        }.resume()
                        sem.wait()
                    }
                }

                group.notify(queue: .main) {
                    if hasError && segmentData.isEmpty {
                        try? fileHandle.close()
                        try? FileManager.default.removeItem(at: destination)
                        completion(.failure(HLSError.downloadFailed("Segment download failed")))
                        return
                    }

                    // Write segments in order
                    print("💾 Writing \(segmentData.count) segments to file...")
                    for i in 0..<segments.count {
                        if let data = segmentData[i] {
                            try? fileHandle.write(contentsOf: data)
                        }
                    }
                    try? fileHandle.close()

                    // Convert .ts to .mp4 if needed
                    let ext = destination.pathExtension.lowercased()
                    if ext == "mp4" {
                        // Try to remux with AVAssetExportSession
                        self.remuxToMP4(source: destination, progress: progress, completion: completion)
                    } else {
                        progress(1.0)
                        completion(.success(destination))
                    }
                }
            }

            private func remuxToMP4(source: URL, progress: @escaping ProgressHandler,
                                    completion: @escaping CompletionHandler) {
                let asset = AVURLAsset(url: source)
                let tempOutput = source.deletingLastPathComponent()
                    .appendingPathComponent("temp_\(UUID().uuidString).mp4")

                guard let export = AVAssetExportSession(asset: asset, presetName: AVAssetExportPresetPassthrough) else {
                    // Just rename if remux fails
                    progress(1.0)
                    completion(.success(source))
                    return
                }

                export.outputURL = tempOutput
                export.outputFileType = .mp4
                export.shouldOptimizeForNetworkUse = true

                export.exportAsynchronously {
                    switch export.status {
                    case .completed:
                        try? FileManager.default.removeItem(at: source)
                        try? FileManager.default.moveItem(at: tempOutput, to: source)
                        progress(1.0)
                        completion(.success(source))
                    default:
                        // If remux fails, keep the concatenated file
                        try? FileManager.default.removeItem(at: tempOutput)
                        progress(1.0)
                        completion(.success(source))
                    }
                }
            }
        }
        SWIFTEOF

        # ============================================================
        # DownloadManager.swift (WITH HLS SUPPORT)
        # ============================================================
        cat > VideoFlow/Services/DownloadManager.swift << 'SWIFTEOF'
        import Foundation
        import UserNotifications

        class DownloadManager: NSObject, ObservableObject {
            static let shared = DownloadManager()
            @Published var activeDownloads: [DownloadTask] = []
            @Published var completedVideos: [DownloadTask] = []
            var backgroundCompletionHandler: (() -> Void)?

            private var session: URLSession!
            private var tasks: [Int: DownloadTask] = [:]
            private var handles: [Int: FileHandle] = [:]
            private var destURLs: [Int: URL] = [:]
            private var receivedBytes: [Int: Int64] = [:]

            override init() {
                super.init()
                let c = URLSessionConfiguration.default
                c.allowsCellularAccess = true
                c.timeoutIntervalForRequest = 60
                c.timeoutIntervalForResource = 7200
                c.httpMaximumConnectionsPerHost = 6
                c.waitsForConnectivity = true
                c.requestCachePolicy = .reloadIgnoringLocalCacheData
                session = URLSession(configuration: c, delegate: self, delegateQueue: nil)
                setupDir()
                loadSaved()
            }

            private func setupDir() {
                let d = downloadsDir()
                if !FileManager.default.fileExists(atPath: d.path) {
                    try? FileManager.default.createDirectory(at: d, withIntermediateDirectories: true)
                }
            }

            func downloadsDir() -> URL {
                FileManager.default.urls(for: .documentDirectory, in: .userDomainMask)[0]
                    .appendingPathComponent("Downloads", isDirectory: true)
            }

            func startDownload(video: VideoItem, quality: VideoQuality) {
                print("🎯 START DOWNLOAD: \(video.url)")

                let task = DownloadTask(video: video, quality: quality)
                DispatchQueue.main.async { self.activeDownloads.append(task) }

                let safe = sanitize(video.title)
                let ext = quality == .audio ? "mp3" : "mp4"
                let name = "\(safe)_\(quality.rawValue)_\(Int(Date().timeIntervalSince1970)).\(ext)"
                let dest = downloadsDir().appendingPathComponent(name)

                // Check if HLS
                if video.isHLS {
                    print("🎬 HLS detected, using HLSDownloader")
                    DispatchQueue.main.async { task.status = .converting }

                    HLSDownloader.shared.downloadHLS(
                        url: video.url,
                        headers: video.headers,
                        destination: dest,
                        progress: { p in
                            DispatchQueue.main.async {
                                task.progress = p
                                task.status = .downloading(progress: p)
                            }
                        },
                        completion: { result in
                            DispatchQueue.main.async {
                                switch result {
                                case .success(let url):
                                    task.savedURL = url
                                    task.status = .completed
                                    task.progress = 1.0
                                    self.activeDownloads.removeAll { $0.id == task.id }
                                    self.completedVideos.insert(task, at: 0)
                                    self.notify(task)
                                case .failure(let e):
                                    task.status = .failed(error: e.localizedDescription)
                                    try? FileManager.default.removeItem(at: dest)
                                }
                            }
                        }
                    )
                    return
                }

                // Regular MP4 download
                guard let url = URL(string: video.url) else {
                    DispatchQueue.main.async {
                        task.status = .failed(error: "Invalid URL")
                        self.activeDownloads.removeAll { $0.id == task.id }
                    }
                    return
                }

                FileManager.default.createFile(atPath: dest.path, contents: nil)
                guard let fh = try? FileHandle(forWritingTo: dest) else {
                    DispatchQueue.main.async {
                        task.status = .failed(error: "Cannot create file")
                        self.activeDownloads.removeAll { $0.id == task.id }
                    }
                    return
                }

                var req = URLRequest(url: url)
                req.setValue("Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1", forHTTPHeaderField: "User-Agent")
                req.setValue("*/*", forHTTPHeaderField: "Accept")
                req.setValue("identity;q=1, *;q=0", forHTTPHeaderField: "Accept-Encoding")

                for (k, v) in video.headers { req.setValue(v, forHTTPHeaderField: k) }

                if video.headers["Referer"] == nil, let h = url.host {
                    req.setValue("https://\(h)/", forHTTPHeaderField: "Referer")
                }

                let dt = session.dataTask(with: req)
                let tid = dt.taskIdentifier
                task.sessionTaskId = tid
                handles[tid] = fh
                destURLs[tid] = dest
                tasks[tid] = task
                receivedBytes[tid] = 0

                dt.resume()
                DispatchQueue.main.async { task.status = .downloading(progress: 0) }
            }

            func pauseDownload(_ t: DownloadTask) {
                guard let tid = t.sessionTaskId else { return }
                session.getAllTasks { all in
                    all.first { $0.taskIdentifier == tid }?.suspend()
                    DispatchQueue.main.async { t.status = .paused }
                }
            }

            func resumeDownload(_ t: DownloadTask) {
                guard let tid = t.sessionTaskId else { return }
                session.getAllTasks { all in
                    all.first { $0.taskIdentifier == tid }?.resume()
                    DispatchQueue.main.async { t.status = .downloading(progress: t.progress) }
                }
            }

            func cancelDownload(_ t: DownloadTask) {
                if let tid = t.sessionTaskId {
                    session.getAllTasks { all in all.first { $0.taskIdentifier == tid }?.cancel() }
                    cleanup(tid)
                }
                DispatchQueue.main.async { self.activeDownloads.removeAll { $0.id == t.id } }
            }

            func deleteVideo(_ t: DownloadTask) {
                if let u = t.savedURL { try? FileManager.default.removeItem(at: u) }
                DispatchQueue.main.async { self.completedVideos.removeAll { $0.id == t.id } }
            }

            func retryDownload(_ t: DownloadTask) {
                DispatchQueue.main.async { self.activeDownloads.removeAll { $0.id == t.id } }
                startDownload(video: t.video, quality: t.quality)
            }

            private func cleanup(_ tid: Int) {
                try? handles[tid]?.close()
                handles.removeValue(forKey: tid)
                if let u = destURLs[tid] { try? FileManager.default.removeItem(at: u) }
                destURLs.removeValue(forKey: tid)
                tasks.removeValue(forKey: tid)
                receivedBytes.removeValue(forKey: tid)
            }

            private func sanitize(_ name: String) -> String {
                var s = name.components(separatedBy: CharacterSet(charactersIn: "/\\:*?\"<>|\n\r")).joined(separator: "_")
                s = s.replacingOccurrences(of: " ", with: "_")
                if s.count > 50 { s = String(s.prefix(50)) }
                return s.isEmpty ? "video" : s
            }

            private func loadSaved() {
                let d = downloadsDir()
                guard let files = try? FileManager.default.contentsOfDirectory(at: d, includingPropertiesForKeys: [.fileSizeKey]) else { return }
                let exts = Set(["mp4","m4v","mov","mkv","avi","mp3","m4a","webm"])
                DispatchQueue.main.async {
                    self.completedVideos = files.filter {
                        exts.contains($0.pathExtension.lowercased())
                    }.compactMap { u in
                        if let attrs = try? FileManager.default.attributesOfItem(atPath: u.path),
                           let size = attrs[.size] as? Int64, size > 100_000 {
                            let v = VideoItem(id: u.lastPathComponent, title: u.deletingPathExtension().lastPathComponent, url: u.absoluteString, availableQualities: [.p720], sourceType: .direct)
                            let t = DownloadTask(video: v, quality: .p720); t.savedURL = u; t.status = .completed; return t
                        }
                        return nil
                    }
                }
            }

            private func notify(_ t: DownloadTask) {
                let c = UNMutableNotificationContent()
                c.title = "Download Complete"; c.body = t.video.title; c.sound = .default
                UNUserNotificationCenter.current().add(UNNotificationRequest(identifier: t.id, content: c, trigger: nil))
            }
        }

        extension DownloadManager: URLSessionDataDelegate {
            func urlSession(_ s: URLSession, dataTask: URLSessionDataTask, didReceive response: URLResponse, completionHandler: @escaping (URLSession.ResponseDisposition) -> Void) {
                let tid = dataTask.taskIdentifier

                if let http = response as? HTTPURLResponse {
                    if http.statusCode >= 400 {
                        if let t = tasks[tid] {
                            DispatchQueue.main.async {
                                t.status = .failed(error: "HTTP \(http.statusCode)")
                            }
                        }
                        completionHandler(.cancel)
                        return
                    }

                    let mime = http.mimeType?.lowercased() ?? ""
                    if mime.contains("text/html") {
                        if let t = tasks[tid] {
                            DispatchQueue.main.async {
                                t.status = .failed(error: "URL expired - returned HTML")
                            }
                        }
                        completionHandler(.cancel)
                        return
                    }
                }

                if let t = tasks[tid] {
                    let total = response.expectedContentLength
                    DispatchQueue.main.async { t.totalBytes = total > 0 ? total : 0 }
                }
                completionHandler(.allow)
            }

            func urlSession(_ s: URLSession, dataTask: URLSessionDataTask, didReceive data: Data) {
                let tid = dataTask.taskIdentifier
                guard let t = tasks[tid], let fh = handles[tid] else { return }
                do {
                    try fh.write(contentsOf: data)
                    let cur = (receivedBytes[tid] ?? 0) + Int64(data.count)
                    receivedBytes[tid] = cur
                    DispatchQueue.main.async { t.updateProgress(bytesWritten: cur, totalExpected: t.totalBytes) }
                } catch {
                    DispatchQueue.main.async { t.status = .failed(error: "Write: \(error.localizedDescription)") }
                }
            }

            func urlSession(_ s: URLSession, task st: URLSessionTask, didCompleteWithError error: Error?) {
                let tid = st.taskIdentifier
                guard let t = tasks[tid] else { return }
                try? handles[tid]?.close()
                handles.removeValue(forKey: tid)
                let dest = destURLs.removeValue(forKey: tid)
                tasks.removeValue(forKey: tid)
                let bytes = receivedBytes.removeValue(forKey: tid) ?? 0

                if let error = error {
                    if let d = dest { try? FileManager.default.removeItem(at: d) }
                    if (error as NSError).code != NSURLErrorCancelled {
                        DispatchQueue.main.async { t.status = .failed(error: error.localizedDescription) }
                    }
                } else {
                    if bytes < 10000 {
                        if let d = dest { try? FileManager.default.removeItem(at: d) }
                        DispatchQueue.main.async {
                            t.status = .failed(error: "File too small (\(bytes) bytes)")
                        }
                        return
                    }

                    if let d = dest, let fh = try? FileHandle(forReadingFrom: d) {
                        let header = fh.readData(ofLength: 12)
                        try? fh.close()
                        if !isValidVideoFile(header: header) {
                            try? FileManager.default.removeItem(at: d)
                            DispatchQueue.main.async {
                                t.status = .failed(error: "Invalid video file")
                            }
                            return
                        }
                    }

                    DispatchQueue.main.async {
                        t.savedURL = dest; t.status = .completed; t.progress = 1.0
                        self.activeDownloads.removeAll { $0.id == t.id }
                        self.completedVideos.insert(t, at: 0)
                        self.notify(t)
                    }
                }
            }

            private func isValidVideoFile(header: Data) -> Bool {
                guard header.count >= 8 else { return false }
                let bytes = [UInt8](header)
                if bytes.count >= 8 && bytes[4] == 0x66 && bytes[5] == 0x74 && bytes[6] == 0x79 && bytes[7] == 0x70 { return true }
                if bytes[0] == 0x1A && bytes[1] == 0x45 && bytes[2] == 0xDF && bytes[3] == 0xA3 { return true }
                if bytes[0] == 0x49 && bytes[1] == 0x44 && bytes[2] == 0x33 { return true }
                if bytes[0] == 0xFF && (bytes[1] & 0xE0) == 0xE0 { return true }
                if bytes.count >= 8 {
                    let str = String(bytes: bytes[4..<8], encoding: .ascii) ?? ""
                    if ["moov", "mdat", "wide", "free", "skip"].contains(str) { return true }
                }
                if bytes[0] == 0x46 && bytes[1] == 0x4C && bytes[2] == 0x56 { return true }
                if bytes[0] == 0x52 && bytes[1] == 0x49 && bytes[2] == 0x46 && bytes[3] == 0x46 { return true }
                return false
            }
        }
