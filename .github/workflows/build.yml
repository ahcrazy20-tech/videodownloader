        struct PlayerView: View {
            let video: DownloadTask
            @EnvironmentObject var playerManager: PlayerManager
            @State private var showControls = true
            @State private var timer: Timer?
            @State private var showSpeed = false
            @State private var brightness = UIScreen.main.brightness

            var body: some View {
                ZStack {
                    Color.black.ignoresSafeArea()
                    if let p = playerManager.player {
                        VideoPlayerLayer(player: p)
                            .ignoresSafeArea()
                            .onTapGesture { toggleControls() }
                    }
                    if playerManager.isLoading {
                        ProgressView().tint(.white).scaleEffect(2)
                    }
                    HStack(spacing:0) {
                        Color.clear.contentShape(Rectangle())
                            .onTapGesture(count:2) { playerManager.skipBackward(10); resetTimer() }
                        Color.clear.contentShape(Rectangle())
                            .onTapGesture { toggleControls() }
                        Color.clear.contentShape(Rectangle())
                            .onTapGesture(count:2) { playerManager.skipForward(10); resetTimer() }
                    }
                    if showControls { controls }
                }
                .onAppear { playerManager.playVideo(video); startTimer() }
                .gesture(DragGesture().onChanged { val in
                    let x = val.startLocation.x
                    let w = UIScreen.main.bounds.width
                    let delta = val.translation.height / 500
                    if x < w/2 {
                        brightness = max(0,min(1,brightness - delta))
                        UIScreen.main.brightness = brightness
                    } else {
                        playerManager.setVolume(max(0,min(1, playerManager.volume - Float(delta))))
                    }
                })
                .sheet(isPresented:$showSpeed) {
                    SpeedPicker().environmentObject(playerManager).presentationDetents([.height(320)])
                }
            }

            var controls: some View {
                VStack {
                    HStack {
                        Button { playerManager.close() } label: {
                            Image(systemName:"xmark").font(.system(size:17,weight:.bold))
                                .foregroundColor(.white).padding(10)
                                .background(Color.black.opacity(0.5)).clipShape(Circle())
                        }
                        Spacer()
                        Text(playerManager.currentVideo?.video.title ?? "")
                            .foregroundColor(.white).font(.system(size:13,weight:.medium))
                            .lineLimit(1).frame(maxWidth:200)
                        Spacer()
                        HStack(spacing:10) {
                            Button { showSpeed = true } label: {
                                Text(String(format:"%.1fx",playerManager.playbackSpeed))
                                    .foregroundColor(.white).font(.system(size:13,weight:.bold))
                                    .padding(.horizontal,8).padding(.vertical,4)
                                    .background(Color.black.opacity(0.5)).cornerRadius(6)
                            }
                            Button { playerManager.minimize() } label: {
                                Image(systemName:"pip.enter").font(.system(size:17))
                                    .foregroundColor(.white).padding(10)
                                    .background(Color.black.opacity(0.5)).clipShape(Circle())
                            }
                        }
                    }.padding(.horizontal,20).padding(.top,20)

                    Spacer()

                    HStack(spacing:32) {
                        Button { playerManager.skipBackward(30) } label: {
                            Image(systemName:"gobackward.30").font(.system(size:28)).foregroundColor(.white)
                        }
                        Button { playerManager.skipBackward(10) } label: {
                            Image(systemName:"gobackward.10").font(.system(size:34)).foregroundColor(.white)
                        }
                        Button { playerManager.togglePlayPause() } label: {
                            Image(systemName: playerManager.isPlaying ? "pause.circle.fill" : "play.circle.fill")
                                .font(.system(size:65)).foregroundColor(.white)
                                .shadow(color:.black.opacity(0.5),radius:5)
                        }
                        Button { playerManager.skipForward(10) } label: {
                            Image(systemName:"goforward.10").font(.system(size:34)).foregroundColor(.white)
                        }
                        Button { playerManager.skipForward(30) } label: {
                            Image(systemName:"goforward.30").font(.system(size:28)).foregroundColor(.white)
                        }
                    }

                    Spacer()

                    VStack(spacing:10) {
                        VStack(spacing:4) {
                            Slider(
                                value: Binding(get:{ playerManager.currentTime },
                                               set:{ playerManager.seek(to:$0) }),
                                in: 0...max(playerManager.duration,1)
                            ).accentColor(.white)
                            HStack {
                                Text(playerManager.formattedTime(playerManager.currentTime))
                                    .font(.caption).foregroundColor(.white.opacity(0.8))
                                Spacer()
                                Text(playerManager.formattedTime(playerManager.duration))
                                    .font(.caption).foregroundColor(.white.opacity(0.8))
                            }
                        }
                        HStack(spacing:10) {
                            Button {
                                playerManager.isMuted.toggle()
                                playerManager.player?.isMuted = playerManager.isMuted
                            } label: {
                                Image(systemName: playerManager.isMuted ? "speaker.slash.fill" : "speaker.fill")
                                    .foregroundColor(.white)
                            }
                            Slider(
                                value: Binding(get:{ Double(playerManager.volume) },
                                               set:{ playerManager.setVolume(Float($0)) }),
                                in: 0...1
                            ).accentColor(.white)
                            Image(systemName:"speaker.wave.3.fill").foregroundColor(.white)
                        }
                    }.padding(.horizontal,20).padding(.bottom,30)
                }
                .background(
                    LinearGradient(
                        colors:[.black.opacity(0.75),.clear,.clear,.black.opacity(0.75)],
                        startPoint:.top, endPoint:.bottom)
                )
                .transition(.opacity)
                .animation(.easeInOut(duration:0.25), value: showControls)
            }

            func toggleControls() {
                withAnimation { showControls.toggle() }
                if showControls { startTimer() } else { timer?.invalidate() }
            }

            func startTimer() {
                timer?.invalidate()
                timer = Timer.scheduledTimer(withTimeInterval:4,repeats:false) { _ in
                    withAnimation { showControls = false }
                }
            }

            func resetTimer() { if showControls { startTimer() } }
        }

