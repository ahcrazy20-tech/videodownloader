          cat > unpack_swift_files.py << 'PY_EOF'
          import base64
          import json
          import os
          
          with open("payload.b64", "r", encoding="utf-8") as f:
              raw_b64 = f.read().replace("\n", "").replace(" ", "").strip()
          
          files_b64 = json.loads(base64.b64decode(raw_b64.encode("utf-8")).decode("utf-8"))
          
          for path, data_b64 in files_b64.items():
              os.makedirs(os.path.dirname(path), exist_ok=True)
              with open(path, "wb") as f:
                  f.write(base64.b64decode(data_b64))
          
          print(f"Successfully unpacked {len(files_b64)} Swift files!")
          PY_EOF
          python3 unpack_swift_files.py

      # 3. Create Info.plist
      - name: 📝 Write Info.plist
        run: |
          cat > VideoDownloader/Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>NSAppTransportSecurity</key>
              <dict><key>NSAllowsArbitraryLoads</key><true/></dict>
              <key>UIFileSharingEnabled</key><true/>
              <key>LSSupportsOpeningDocumentsInPlace</key><true/>
              <key>NSPhotoLibraryAddUsageDescription</key>
              <string>يحتاج التطبيق لإذن حفظ الفيديوهات المكتملة في استوديو الصور الخاص بك.</string>
              <key>NSPhotoLibraryUsageDescription</key>
              <string>يحتاج التطبيق للوصول للصور لحفظ الفيديوهات المحملة.</string>
              <key>UIBackgroundModes</key>
              <array><string>audio</string><string>fetch</string></array>
          </dict>
          </plist>
          EOF

      # 4. Create ExportOptions.plist
      - name: 📝 Write ExportOptions.plist
        run: |
          cat > ExportOptions.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>development</string>
              <key>teamID</key>
              <string>XXXXXXXXXX</string>
              <key>signingStyle</key>
              <string>manual</string>
          </dict>
          </plist>
          EOF

      # 5. Create project.yml
      - name: 📝 Write project.yml
        run: |
          cat > project.yml << 'EOF'
          name: VideoDownloader
          options:
            bundleIdPrefix: com.example
            deploymentTarget:
              iOS: "16.4"
          targets:
            VideoDownloader:
              type: application
              platform: iOS
              sources: [VideoDownloader]
              info:
                path: VideoDownloader/Info.plist
                properties:
                  CFBundleDisplayName: VideoDownloader
                  CFBundleIdentifier: com.example.VideoDownloader
                  UILaunchScreen: {}
                  NSAppTransportSecurity:
                    NSAllowsArbitraryLoads: true
                  UIFileSharingEnabled: true
                  LSSupportsOpeningDocumentsInPlace: true
                  NSPhotoLibraryAddUsageDescription: يحتاج التطبيق لإذن حفظ الفيديوهات في استوديو الصور.
                  NSPhotoLibraryUsageDescription: يحتاج التطبيق للوصول للصور لحفظ الفيديوهات المحملة.
                  UIBackgroundModes: [audio, fetch]
          EOF

      # 6. Install XcodeGen
      - name: 🛠 Install XcodeGen
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen

      # 7. Generate Xcode project
      - name: 🏗 Generate Xcode project
        run: xcodegen generate

      # 8. Build app (unsigned)
      - name: 🏗 Build .app (unsigned)
        run: |
          xcodebuild -project VideoDownloader.xcodeproj \
            -scheme VideoDownloader \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ./DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      # 9. Package IPA
      - name: 📦 Package IPA
        run: |
          APP_PATH=$(find ./DerivedData -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then echo "❌ .app not found"; exit 1; fi
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r VideoDownloader.ipa Payload/

      # 10. Upload IPA artifact
      - name: ⬆️ Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: VideoDownloader-MultiEngine
          path: VideoDownloader.ipa
