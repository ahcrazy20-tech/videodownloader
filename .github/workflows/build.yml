                <div className="flex flex-col items-center justify-center min-h-[70vh] px-6">
                  <div className="w-24 h-24 rounded-3xl bg-slate-800/50 flex items-center justify-center mb-4"><FolderOpen size={40} className="text-slate-600" /></div>
                  <h2 className="text-xl font-bold text-white mb-2">المكتبة فارغة</h2>
                  <p className="text-slate-500 text-sm text-center mb-6">حمّل فيديوهات من المتصفح لتظهر هنا</p>
                  <button onClick={() => setActiveTab('browser')} className="bg-gradient-to-r from-cyan-500 to-blue-500 text-white font-bold px-6 py-3 rounded-xl shadow-lg">ابدأ التصفح</button>
                </div>
              );
            }

            return (
              <div className="px-4 py-4 safe-area-top">
                <div className="flex items-center justify-between mb-4 pt-2">
                  <div><h1 className="text-xl font-bold text-white">المكتبة</h1><p className="text-slate-500 text-xs">{library.length} فيديو • {filtered.length} ظاهر</p></div>
                  <div className="flex items-center gap-2">
                    <button onClick={() => setSortBy(s => s === 'date' ? 'name' : 'date')} className="text-slate-400 p-2 bg-slate-800 rounded-xl hover:text-white"><SortAsc size={16} /></button>
                    <button onClick={() => setViewMode(v => v === 'grid' ? 'list' : 'grid')} className="text-slate-400 p-2 bg-slate-800 rounded-xl hover:text-white">{viewMode === 'grid' ? <List size={16} /> : <Grid3X3 size={16} />}</button>
                  </div>
                </div>
                <div className="relative mb-4">
                  <Search size={14} className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-500" />
                  <input type="text" value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} placeholder="ابحث في المكتبة..." className="w-full bg-slate-800/50 text-white text-sm rounded-xl py-2.5 pl-9 pr-4 border border-slate-700/50 focus:border-cyan-500/50 focus:outline-none placeholder-slate-500" dir="auto" />
                </div>
                <div className="flex items-center gap-3 mb-4 overflow-x-auto">
                  <div className="flex-shrink-0 bg-slate-800/50 rounded-xl px-3 py-2 border border-slate-700/30 flex items-center gap-2"><Film size={12} className="text-cyan-400" /><span className="text-xs text-slate-400">{library.length} فيديو</span></div>
                  <div className="flex-shrink-0 bg-slate-800/50 rounded-xl px-3 py-2 border border-slate-700/30 flex items-center gap-2"><HardDrive size={12} className="text-purple-400" /><span className="text-xs text-slate-400">{library.reduce((acc, v) => { const num = parseFloat(v.size); return acc + (isNaN(num) ? 0 : num); }, 0).toFixed(1)} MB</span></div>
                  <div className="flex-shrink-0 bg-slate-800/50 rounded-xl px-3 py-2 border border-slate-700/30 flex items-center gap-2"><Clock size={12} className="text-green-400" /><span className="text-xs text-slate-400">{sortBy === 'date' ? 'الأحدث' : 'الاسم'}</span></div>
                </div>
                {viewMode === 'grid' ? (
                  <div className="grid grid-cols-2 gap-3 pb-24">
                    {filtered.map(video => (
                      <div key={video.id} className="bg-slate-800/50 rounded-2xl border border-slate-700/30 overflow-hidden group">
                        <div className="relative aspect-video bg-slate-700 cursor-pointer" onClick={() => playVideo(video)}>
                          {video.thumbnail ? <img src={video.thumbnail} alt="" className="w-full h-full object-cover" /> : <div className="w-full h-full flex items-center justify-center text-4xl bg-gradient-to-br from-slate-700 to-slate-800">🎬</div>}
                          <div className="absolute inset-0 bg-black/0 group-hover:bg-black/40 transition-all flex items-center justify-center"><div className="w-12 h-12 rounded-full bg-white/20 backdrop-blur flex items-center justify-center opacity-0 group-hover:opacity-100 transition-all"><Play size={24} className="text-white ml-1" fill="white" /></div></div>
                          {video.duration && <span className="absolute bottom-1 right-1 bg-black/80 text-white text-[9px] px-1.5 py-0.5 rounded">{video.duration}</span>}
                          <span className={`absolute top-1 left-1 text-white text-[8px] font-bold px-1.5 py-0.5 rounded ${video.quality.includes('4K') ? 'bg-purple-500' : video.quality.includes('1080') ? 'bg-cyan-500' : video.quality.includes('720') ? 'bg-green-500' : 'bg-orange-500'}`}>{video.quality.includes('4K') ? '4K' : video.quality.includes('1080') ? 'FHD' : video.quality.includes('720') ? 'HD' : 'SD'}</span>
                        </div>
                        <div className="p-2.5">
                          <p className="text-white text-xs font-medium line-clamp-2 mb-1">{video.title}</p>
                          <div className="flex items-center justify-between">
                            <span className="text-slate-500 text-[10px]">{video.size}</span>
                            {showDeleteConfirm === video.id ? (
                              <div className="flex items-center gap-1">
                                <button onClick={() => { removeFromLibrary(video.id); setShowDeleteConfirm(null); }} className="text-[10px] text-red-400 bg-red-400/10 px-2 py-0.5 rounded">حذف</button>
                                <button onClick={() => setShowDeleteConfirm(null)} className="text-[10px] text-slate-400 bg-slate-700/50 px-2 py-0.5 rounded">إلغاء</button>
                              </div>
                            ) : (<button onClick={() => setShowDeleteConfirm(video.id)} className="text-slate-500 p-1 rounded hover:text-red-400"><Trash2 size={12} /></button>)}
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                ) : (
                  <div className="space-y-2 pb-24">
                    {filtered.map(video => (
                      <div key={video.id} className="bg-slate-800/50 rounded-xl border border-slate-700/30 p-3 flex items-center gap-3">
                        <div className="w-20 h-14 rounded-lg bg-slate-700 flex-shrink-0 overflow-hidden relative cursor-pointer" onClick={() => playVideo(video)}>
                          {video.thumbnail ? <img src={video.thumbnail} alt="" className="w-full h-full object-cover" /> : <div className="w-full h-full flex items-center justify-center text-2xl">🎬</div>}
                          <div className="absolute inset-0 flex items-center justify-center bg-black/30"><Play size={16} className="text-white" fill="white" /></div>
                        </div>
                        <div className="flex-1 min-w-0" onClick={() => playVideo(video)}><p className="text-white text-sm font-medium truncate">{video.title}</p><p className="text-slate-500 text-xs mt-0.5">{video.quality} • {video.size} • {video.duration}</p></div>
                        <button onClick={() => removeFromLibrary(video.id)} className="text-slate-500 p-2 rounded-lg hover:text-red-400 hover:bg-red-500/10 flex-shrink-0"><Trash2 size={16} /></button>
                      </div>
                    ))}
                  </div>
                )}
                {library.length > 0 && (<div className="fixed bottom-20 left-0 right-0 flex justify-center pb-2"><button onClick={clearLibrary} className="bg-red-500/10 text-red-400 text-xs font-medium px-4 py-2 rounded-full border border-red-500/20 backdrop-blur-xl">مسح الكل</button></div>)}
              </div>
            );
          }
          LIBRARY_EOF

      - name: Create VideoPlayer Component
        run: |
          cd vidbox-app

          cat > src/components/VideoPlayer.tsx << 'PLAYER_EOF'
          import { useState, useRef, useEffect, useCallback } from 'react';
          import { Play, Pause, SkipForward, SkipBack, Volume2, VolumeX, Maximize, Minimize, RotateCcw, RotateCw, Settings, ChevronLeft, Sun, Moon, Gauge, Lock, Unlock, PictureInPicture2, Repeat, ListVideo } from 'lucide-react';
          import useStore from '../store/useStore';

          export default function VideoPlayer() {
            const { currentlyPlaying, setCurrentlyPlaying, playbackSpeed, setPlaybackSpeed, library, setActiveTab } = useStore();
            const videoRef = useRef<HTMLVideoElement>(null);
            const progressRef = useRef<HTMLDivElement>(null);
            const [isPlaying, setIsPlaying] = useState(false);
            const [currentTime, setCurrentTime] = useState(0);
            const [duration, setDuration] = useState(0);
            const [volume, setVolume] = useState(1);
            const [isMuted, setIsMuted] = useState(false);
            const [isFullscreen, setIsFullscreen] = useState(false);
            const [showControls, setShowControls] = useState(true);
            const [brightness, setBrightness] = useState(100);
            const [showSettings, setShowSettings] = useState(false);
            const [isLocked, setIsLocked] = useState(false);
            const [showPlaylist, setShowPlaylist] = useState(false);
            const [loopMode, setLoopMode] = useState<'none' | 'one' | 'all'>('none');
            const [buffered, setBuffered] = useState(0);
            const controlTimeoutRef = useRef<ReturnType<typeof setTimeout>>(undefined);
            const speeds = [0.25, 0.5, 0.75, 1, 1.25, 1.5, 1.75, 2, 3];

            useEffect(() => { if (videoRef.current && currentlyPlaying) { videoRef.current.src = currentlyPlaying.url; videoRef.current.playbackRate = playbackSpeed; videoRef.current.play().then(() => setIsPlaying(true)).catch(() => {}); } }, [currentlyPlaying]);
            useEffect(() => { if (videoRef.current) videoRef.current.playbackRate = playbackSpeed; }, [playbackSpeed]);

            const resetControlsTimeout = useCallback(() => {
              if (controlTimeoutRef.current) clearTimeout(controlTimeoutRef.current);
              setShowControls(true);
              if (isPlaying && !showSettings && !showPlaylist) controlTimeoutRef.current = setTimeout(() => setShowControls(false), 4000);
            }, [isPlaying, showSettings, showPlaylist]);

            const togglePlay = () => { if (!videoRef.current) return; if (isPlaying) videoRef.current.pause(); else videoRef.current.play(); setIsPlaying(!isPlaying); resetControlsTimeout(); };
            const handleTimeUpdate = () => { if (!videoRef.current) return; setCurrentTime(videoRef.current.currentTime); if (videoRef.current.buffered.length > 0) setBuffered(videoRef.current.buffered.end(videoRef.current.buffered.length - 1)); };
            const handleLoadedMetadata = () => { if (videoRef.current) setDuration(videoRef.current.duration); };
            const currentIdx = library.findIndex(v => v.id === currentlyPlaying?.id);
            const playNext = () => { if (currentIdx < library.length - 1) setCurrentlyPlaying(library[currentIdx + 1]); else if (loopMode === 'all' && library.length > 0) setCurrentlyPlaying(library[0]); };
            const playPrev = () => { if (currentTime > 3 && videoRef.current) videoRef.current.currentTime = 0; else if (currentIdx > 0) setCurrentlyPlaying(library[currentIdx - 1]); };
            const handleEnded = () => { if (loopMode === 'one' && videoRef.current) { videoRef.current.currentTime = 0; videoRef.current.play(); } else if (loopMode === 'all' && library.length > 0) playNext(); else setIsPlaying(false); };
            const seek = (time: number) => { if (videoRef.current) { videoRef.current.currentTime = Math.max(0, Math.min(time, duration)); resetControlsTimeout(); } };
            const handleProgressClick = (e: React.MouseEvent<HTMLDivElement>) => { if (!progressRef.current || !duration) return; const rect = progressRef.current.getBoundingClientRect(); seek((e.clientX - rect.left) / rect.width * duration); };
            const skip = (seconds: number) => { if (videoRef.current) seek(videoRef.current.currentTime + seconds); };
            const toggleMute = () => { if (videoRef.current) { videoRef.current.muted = !isMuted; setIsMuted(!isMuted); } };
            const handleVolumeChange = (val: number) => { if (videoRef.current) { videoRef.current.volume = val; setVolume(val); setIsMuted(val === 0); } };
            const toggleFullscreen = () => setIsFullscreen(!isFullscreen);
            const togglePiP = async () => { if (videoRef.current) { try { if (document.pictureInPictureElement) await document.exitPictureInPicture(); else await videoRef.current.requestPictureInPicture(); } catch (e) { console.log('PiP not supported'); } } };
            const formatTime = (time: number) => { if (!isFinite(time)) return '0:00'; const hours = Math.floor(time / 3600); const mins = Math.floor((time % 3600) / 60); const secs = Math.floor(time % 60); if (hours > 0) return `${hours}:${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`; return `${mins}:${secs.toString().padStart(2, '0')}`; };

            if (!currentlyPlaying) {
              return (
                <div className="flex flex-col items-center justify-center min-h-[70vh] px-6">
                  <div className="w-24 h-24 rounded-3xl bg-slate-800/50 flex items-center justify-center mb-4"><Play size={40} className="text-slate-600 ml-1" /></div>
                  <h2 className="text-xl font-bold text-white mb-2">المشغّل</h2>
                  <p className="text-slate-500 text-sm text-center mb-6">اختر فيديو من المكتبة لتشغيله</p>
                  <button onClick={() => setActiveTab('library')} className="bg-gradient-to-r from-cyan-500 to-blue-500 text-white font-bold px-6 py-3 rounded-xl shadow-lg">افتح المكتبة</button>
                </div>
              );
            }

            return (
              <div className={`flex flex-col bg-black ${isFullscreen ? 'fixed inset-0 z-[60]' : 'h-full'}`}>
                <div className={`relative bg-black ${isFullscreen ? 'flex-1' : 'aspect-video'} w-full`} onClick={() => { if (isLocked) return; resetControlsTimeout(); }} onDoubleClick={togglePlay} style={{ filter: `brightness(${brightness}%)` }}>
                  <video ref={videoRef} className="w-full h-full object-contain" onTimeUpdate={handleTimeUpdate} onLoadedMetadata={handleLoadedMetadata} onEnded={handleEnded} onPlay={() => setIsPlaying(true)} onPause={() => setIsPlaying(false)} playsInline />
                  {showControls && !isLocked && (
                    <div className="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-black/40 flex flex-col justify-between">
                      <div className="flex items-center justify-between px-4 pt-3">
                        <button onClick={() => { if (isFullscreen) toggleFullscreen(); }} className="text-white/80 p-1">{isFullscreen && <ChevronLeft size={22} />}</button>
                        <p className="text-white text-sm font-medium truncate flex-1 text-center mx-2">{currentlyPlaying.title}</p>
                        <div className="flex items-center gap-1">
                          <button onClick={togglePiP} className="text-white/80 p-1.5 rounded-lg hover:bg-white/10"><PictureInPicture2 size={18} /></button>
                          <button onClick={() => setShowSettings(!showSettings)} className="text-white/80 p-1.5 rounded-lg hover:bg-white/10"><Settings size={18} /></button>
                        </div>
                      </div>
                      <div className="flex items-center justify-center gap-8">
                        <button onClick={() => skip(-10)} className="text-white/80 p-2 active:scale-90 relative"><RotateCcw size={28} /><span className="text-[9px] absolute -bottom-1 left-1/2 -translate-x-1/2">10</span></button>
                        <button onClick={playPrev} className="text-white/80 p-2 active:scale-90"><SkipBack size={28} fill="white" /></button>
                        <button onClick={togglePlay} className="w-16 h-16 rounded-full bg-white/20 backdrop-blur flex items-center justify-center active:scale-90 transition-transform">{isPlaying ? <Pause size={32} className="text-white" fill="white" /> : <Play size={32} className="text-white ml-1" fill="white" />}</button>
                        <button onClick={playNext} className="text-white/80 p-2 active:scale-90"><SkipForward size={28} fill="white" /></button>
                        <button onClick={() => skip(10)} className="text-white/80 p-2 active:scale-90 relative"><RotateCw size={28} /><span className="text-[9px] absolute -bottom-1 left-1/2 -translate-x-1/2">10</span></button>
                      </div>
                      <div className="px-4 pb-3">
                        <div ref={progressRef} className="relative h-6 flex items-center cursor-pointer group mb-1" onClick={handleProgressClick}>
                          <div className="w-full h-1 bg-white/20 rounded-full overflow-hidden group-hover:h-1.5 transition-all">
                            <div className="h-full bg-white/30 rounded-full absolute top-1/2 -translate-y-1/2 left-0" style={{ width: `${(buffered / duration) * 100}%` }} />
                            <div className="h-full bg-cyan-400 rounded-full relative" style={{ width: `${(currentTime / duration) * 100}%` }}><div className="absolute right-0 top-1/2 -translate-y-1/2 w-3 h-3 bg-cyan-400 rounded-full shadow-lg opacity-0 group-hover:opacity-100 transition-opacity" /></div>
                          </div>
                        </div>
                        <div className="flex items-center justify-between">
                          <span className="text-white/70 text-xs font-mono">{formatTime(currentTime)} / {formatTime(duration)}</span>
                          <div className="flex items-center gap-2">
                            <button onClick={toggleMute} className="text-white/80 p-1">{isMuted || volume === 0 ? <VolumeX size={18} /> : <Volume2 size={18} />}</button>
                            <button onClick={() => { const idx = speeds.indexOf(playbackSpeed); setPlaybackSpeed(speeds[(idx + 1) % speeds.length]); }} className="text-white/80 text-xs font-bold bg-white/10 px-2 py-0.5 rounded">{playbackSpeed}x</button>
                            <button onClick={() => setLoopMode(l => l === 'none' ? 'one' : l === 'one' ? 'all' : 'none')} className={`p-1 ${loopMode !== 'none' ? 'text-cyan-400' : 'text-white/60'}`}><Repeat size={16} /></button>
                            <button onClick={toggleFullscreen} className="text-white/80 p-1">{isFullscreen ? <Minimize size={18} /> : <Maximize size={18} />}</button>
                          </div>
                        </div>
                      </div>
                    </div>
                  )}
                  <button onClick={() => setIsLocked(!isLocked)} className="absolute top-1/2 left-2 -translate-y-1/2 text-white/60 p-2 bg-black/30 rounded-full z-10">{isLocked ? <Lock size={16} /> : <Unlock size={16} />}</button>
                  {showSettings && (
                    <div className="absolute bottom-16 right-4 bg-slate-900/95 backdrop-blur-xl rounded-2xl border border-slate-700/50 p-4 w-64 z-20">
                      <h3 className="text-white text-sm font-bold mb-3">الإعدادات</h3>
                      <div className="mb-4"><div className="flex items-center gap-2 mb-2"><Gauge size={14} className="text-cyan-400" /><span className="text-slate-400 text-xs">السرعة: {playbackSpeed}x</span></div><div className="flex flex-wrap gap-1">{speeds.map(s => (<button key={s} onClick={() => setPlaybackSpeed(s)} className={`text-[10px] px-2 py-1 rounded-lg font-medium ${playbackSpeed === s ? 'bg-cyan-500 text-white' : 'bg-slate-800 text-slate-400 hover:text-white'}`}>{s}x</button>))}</div></div>
                      <div className="mb-4"><div className="flex items-center gap-2 mb-2">{brightness > 50 ? <Sun size={14} className="text-yellow-400" /> : <Moon size={14} className="text-blue-400" />}<span className="text-slate-400 text-xs">السطوع: {brightness}%</span></div><input type="range" min="20" max="150" value={brightness} onChange={(e) => setBrightness(Number(e.target.value))} className="w-full accent-cyan-500" /></div>
                      <div className="mb-3"><div className="flex items-center gap-2 mb-2"><Volume2 size={14} className="text-green-400" /><span className="text-slate-400 text-xs">الصوت: {Math.round(volume * 100)}%</span></div><input type="range" min="0" max="1" step="0.05" value={volume} onChange={(e) => handleVolumeChange(Number(e.target.value))} className="w-full accent-cyan-500" /></div>
                      <button onClick={() => setShowSettings(false)} className="w-full bg-slate-800 text-slate-400 text-xs py-2 rounded-lg mt-1">إغلاق</button>
                    </div>
                  )}
                </div>
                <div className={`${isFullscreen ? 'hidden' : 'flex-1'} bg-slate-950 overflow-y-auto`}>
                  <div className="px-4 py-4 border-b border-slate-800/50"><h2 className="text-white font-bold text-base mb-1">{currentlyPlaying.title}</h2><div className="flex items-center gap-3 text-slate-500 text-xs"><span>{currentlyPlaying.quality}</span><span>•</span><span>{currentlyPlaying.size}</span><span>•</span><span>{currentlyPlaying.duration}</span></div></div>
                  <div className="flex items-center gap-2 px-4 py-3 border-b border-slate-800/50 overflow-x-auto">
                    <button onClick={() => setShowPlaylist(!showPlaylist)} className={`flex items-center gap-1.5 text-xs px-3 py-2 rounded-full border flex-shrink-0 ${showPlaylist ? 'bg-cyan-500/10 border-cyan-500/30 text-cyan-400' : 'bg-slate-800 border-slate-700 text-slate-400'}`}><ListVideo size={14} />قائمة ({library.length})</button>
                    <button onClick={() => setLoopMode(l => l === 'none' ? 'one' : l === 'one' ? 'all' : 'none')} className={`flex items-center gap-1.5 text-xs px-3 py-2 rounded-full border flex-shrink-0 ${loopMode !== 'none' ? 'bg-cyan-500/10 border-cyan-500/30 text-cyan-400' : 'bg-slate-800 border-slate-700 text-slate-400'}`}><Repeat size={14} />{loopMode === 'none' ? 'تكرار' : loopMode === 'one' ? 'تكرار واحد' : 'تكرار الكل'}</button>
                    <button onClick={() => { const idx = speeds.indexOf(playbackSpeed); setPlaybackSpeed(speeds[(idx + 1) % speeds.length]); }} className="flex items-center gap-1.5 text-xs px-3 py-2 rounded-full border bg-slate-800 border-slate-700 text-slate-400 flex-shrink-0"><Gauge size={14} />{playbackSpeed}x</button>
                  </div>
                  {showPlaylist && (
                    <div className="px-4 py-3"><h3 className="text-sm font-semibold text-white mb-3">قائمة التشغيل</h3><div className="space-y-2 pb-20">{library.map((video, idx) => { const isActive = video.id === currentlyPlaying.id; return (<button key={video.id} onClick={() => setCurrentlyPlaying(video)} className={`w-full flex items-center gap-3 p-2 rounded-xl transition-all ${isActive ? 'bg-cyan-500/10 border border-cyan-500/30' : 'hover:bg-slate-800/50'}`}><span className={`text-xs w-5 text-center ${isActive ? 'text-cyan-400' : 'text-slate-600'}`}>{isActive ? '▶' : idx + 1}</span><div className="w-16 h-10 rounded-lg bg-slate-700 flex-shrink-0 overflow-hidden">{video.thumbnail ? <img src={video.thumbnail} alt="" className="w-full h-full object-cover" /> : <div className="w-full h-full flex items-center justify-center text-lg">🎬</div>}</div><div className="flex-1 min-w-0 text-right"><p className={`text-sm truncate ${isActive ? 'text-cyan-400 font-medium' : 'text-white'}`}>{video.title}</p><p className="text-slate-500 text-[10px]">{video.duration} • {video.quality}</p></div></button>); })}</div></div>
                  )}
                  {!showPlaylist && currentIdx < library.length - 1 && (
                    <div className="px-4 py-3 pb-24"><h3 className="text-sm font-semibold text-slate-400 mb-3 flex items-center gap-2"><ChevronLeft size={14} />التالي</h3><button onClick={() => setCurrentlyPlaying(library[currentIdx + 1])} className="w-full flex items-center gap-3 p-3 bg-slate-800/30 rounded-xl hover:bg-slate-800/50"><div className="w-20 h-14 rounded-lg bg-slate-700 flex-shrink-0 overflow-hidden">{library[currentIdx + 1].thumbnail ? <img src={library[currentIdx + 1].thumbnail} alt="" className="w-full h-full object-cover" /> : <div className="w-full h-full flex items-center justify-center text-2xl">🎬</div>}</div><div className="flex-1 min-w-0 text-right"><p className="text-white text-sm font-medium truncate">{library[currentIdx + 1].title}</p><p className="text-slate-500 text-xs">{library[currentIdx + 1].duration}</p></div><Play size={18} className="text-cyan-400" /></button></div>
                  )}
                </div>
              </div>
            );
          }
          PLAYER_EOF

      - name: Install Dependencies
        run: |
          cd vidbox-app
          npm install

      - name: Build Web App
        run: |
          cd vidbox-app
          npm run build

      - name: Initialize Capacitor
        run: |
          cd vidbox-app
          npx cap init VidBox com.vidbox.app --web-dir dist
          npx cap add ios

      - name: Configure iOS Project for TrollStore
        run: |
          cd vidbox-app/ios/App
          
          # Update Info.plist for TrollStore compatibility
          /usr/libexec/PlistBuddy -c "Add :UIFileSharingEnabled bool true" App/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :LSSupportsOpeningDocumentsInPlace bool true" App/Info.plist || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName VidBox" App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleName VidBox" App/Info.plist
          
          # Set minimum iOS version to 16.0
          /usr/libexec/PlistBuddy -c "Set :MinimumOSVersion 16.0" App/Info.plist || true

      - name: Build iOS App (Unsigned for TrollStore)
        run: |
          cd vidbox-app/ios/App
          
          # Build for device without signing (TrollStore compatible)
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/VidBox.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            PRODUCT_BUNDLE_IDENTIFIER="com.vidbox.app"

      - name: Create IPA for TrollStore
        run: |
          cd vidbox-app/ios/App
          
          # Create Payload directory
          mkdir -p Payload
          cp -r build/VidBox.xcarchive/Products/Applications/App.app Payload/
          
          # Rename app if needed
          mv Payload/App.app Payload/VidBox.app || true
          
          # Create IPA
          zip -r VidBox-TrollStore.ipa Payload
          
          # Also create a .tipa file (TrollStore IPA format)
          cp VidBox-TrollStore.ipa VidBox.tipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VidBox-iOS-TrollStore
          path: |
            vidbox-app/ios/App/VidBox-TrollStore.ipa
            vidbox-app/ios/App/VidBox.tipa
          retention-days: 30

      - name: Create Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v2.0.0-${{ github.run_number }}
          name: VidBox v2.0.0 Build ${{ github.run_number }}
          body: |
            ## 📥 VidBox - متصفح ومحمّل فيديوهات
            
            ### المميزات:
            - 🌐 متصفح مدمج مع اكتشاف تلقائي للفيديوهات
            - 📊 اختيار الجودة (4K, 1080p, 720p, 480p)
            - ⬇️ مدير تحميلات مع شريط تقدم
            - 🎬 مشغّل فيديو احترافي
            - 📁 مكتبة لحفظ الفيديوهات
            
            ### التثبيت:
            1. حمّل ملف `VidBox.tipa` أو `VidBox-TrollStore.ipa`
            2. افتح TrollStore على جهازك
            3. اضغط على + واختر الملف
            4. اضغط Install
            
            ### متطلبات:
            - iOS 16.0 أو أحدث
            - TrollStore مثبت على الجهاز
          files: |
            vidbox-app/ios/App/VidBox-TrollStore.ipa
            vidbox-app/ios/App/VidBox.tipa
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
