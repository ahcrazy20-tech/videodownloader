              private static func parseInstanceList(_ json: Any) -> [String] {
                  var out: [String] = []
                  func scan(_ value: Any, depth: Int) {
                      guard depth < 6 else { return }
                      if let dict = value as? [String: Any] {
                          for key in ["apiUrl", "api_url", "apiURL", "api", "url", "instance", "host"] {
                              if let s = dict[key] as? String, s.hasPrefix("https://") {
                                  out.append(s.hasSuffix("/") ? s : s + "/")
                                  return
                              }
                          }
                          for v in dict.values { scan(v, depth: depth + 1) }
                      } else if let arr = value as? [Any] {
                          for v in arr { scan(v, depth: depth + 1) }
                      }
                  }
                  scan(json, depth: 0)
                  var seen = Set<String>()
                  return out.filter { seen.insert($0).inserted }
              }

