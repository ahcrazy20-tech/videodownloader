                            }
                            showVideoSheet = true
                        case .failure(let error):
                            if vm.detectedVideos.isEmpty {
                                extractError = error.localizedDescription
                                showError = true
                            } else {
                                showVideoSheet = true
                            }
                        }
                    }
                }
            }
        }

