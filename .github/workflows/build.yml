          import Foundation

          /// محرك الاستخراج الذكي — سباق متوازٍ بين:
          /// 1) سيرفرات cobalt (فيديو كامل لمعظم المنصات)
          /// 2) سيرفرات يوتيوب الأصلية من تطبيق الموسيقى (y2jar / cnvmp3 / mp3juice workers)
          ///    اللي بتتخطى حظر يوتيوب لأن بتجيب الستريم الأصلي مباشرة
          class VideoResolver {
              struct ResolvedVideo {
                  let url: URL
                  let filename: String
                  let sourceLabel: String
                  let referer: String
              }

              private static let defaultsKey = "customResolverEndpoints"

              static let defaultEndpoints: [String] = [
                  "https://cobalt-api.meowing.de/",
                  "https://cobalt-backend.canine.tools/",
                  "https://capi.3kh0.net/",
                  "https://kityune.imput.net/"
              ]

              static var resolverEndpoints: [String] {
                  let custom = UserDefaults.standard.stringArray(forKey: defaultsKey) ?? []
                  return custom + defaultEndpoints
              }

              static func addCustomEndpoint(_ endpoint: String) {
                  var trimmed = endpoint.trimmingCharacters(in: .whitespacesAndNewlines)
                  guard !trimmed.isEmpty else { return }
                  if !trimmed.hasPrefix("http") { trimmed = "https://" + trimmed }
                  if !trimmed.hasSuffix("/") { trimmed += "/" }
                  var custom = UserDefaults.standard.stringArray(forKey: defaultsKey) ?? []
                  if !custom.contains(trimmed) {
                      custom.insert(trimmed, at: 0)
                      UserDefaults.standard.set(custom, forKey: defaultsKey)
                  }
              }

              static let mobileUA = MediaValidator.mobileUA

              // سيرفرات يوتيوب (نفس اللي في تطبيق الموسيقى بالظبط)
              private static let y2jarInfoURL = "https://v2.y2jar.cc/i/"
              private static let y2jarStreamTokenURL = "https://capi.y2jar.cc/st/a/"
              private static let y2jarDownloadURL = "https://capi.y2jar.cc/s/"
              private static let cnvmp3GetInfoURL = "https://cnvmp3.com/get_video_data.php"
              private static let cnvmp3ConvertURL = "https://cnvmp3.com/download_video_ucep.php"
              private static let workerURLs = ["https://fancy-sea-5d3d.holy-breeze-fec5.workers.dev/?m=i"]

              static func isDirectMediaURL(_ urlString: String) -> Bool {
                  guard let url = URL(string: urlString),
                        let scheme = url.scheme?.lowercased(),
                        scheme.hasPrefix("http") else { return false }
                  let lower = urlString.lowercased()
                  let extensions = [".mp4", ".m4v", ".mov", ".webm", ".mkv", ".avi", ".m4a", ".mp3", ".aac", ".flv", ".ts"]
                  return extensions.contains { lower.contains($0) }
              }

              static func extractYouTubeID(_ s: String) -> String? {
                  let patterns = [
                      "(?:youtu\\.be/)([a-zA-Z0-9-_]{11})",
                      "(?:youtube\\.com/(?:embed/|live/|shorts/|v/|watch/))([a-zA-Z0-9-_]{11})",
                      "[?&]v=([a-zA-Z0-9-_]{11})"
                  ]
                  for p in patterns {
                      if let r = s.range(of: p, options: .regularExpression),
                         let m = s[r].range(of: "[a-zA-Z0-9-_]{11}", options: .regularExpression) {
                          return String(s[r][m])
                      }
                  }
                  return nil
              }

              /// ⚡ السباق المتوازٍ الكبير: كل السيرفرات مع بعض — أول نجاح يفوز
              static func resolve(pageURL: String, completion: @escaping (Result<ResolvedVideo, Error>) -> Void) {
                  let lock = NSLock()
                  var resolved = false
                  var failedCount = 0
                  var totalContenders = 0

                  func register(_ contender: (@escaping (Result<ResolvedVideo, Error>) -> Void) -> Void) {
                      totalContenders += 1
                      contender { result in
                          lock.lock()
                          let already = resolved
                          if case .success = result { resolved = true }
                          if case .failure = result { failedCount += 1 }
                          let allFailed = failedCount >= totalContenders
                          lock.unlock()
                          if already { return }
                          switch result {
                          case .success: completion(result)
                          case .failure:
                              if allFailed {
                                  completion(.failure(NSError(domain: "VideoResolver", code: -2, userInfo: [NSLocalizedDescriptionKey: "فشلت جميع سيرفرات الاستخراج"])))
                              }
                          }
                      }
                  }

                  // 1) سيرفرات cobalt (فيديو كامل للمنصات عامة)
                  for endpoint in resolverEndpoints {
                      register { done in requestCobalt(endpoint, pageURL: pageURL, completion: done) }
                  }

                  // 2) سيرفرات يوتيوب الأصلية من تطبيق الموسيقى + Piped بروابط googlevideo مباشرة
                  if let vid = extractYouTubeID(pageURL) {
                      register { done in y2jarContender(vid: vid, completion: done) }
                      register { done in cnvmp3Contender(vid: vid, completion: done) }
                      register { done in workerContender(vid: vid, completion: done) }
                      register { done in pipedContender(vid: vid, completion: done) }
                      register { done in invidiousContender(vid: vid, completion: done) }
                      register { done in ytDownloadAPIContender(vid: vid, completion: done) }
                  }

                  // 3) اكتشاف سيرفرات cobalt الشغّالة تلقائياً وقت التشغيل (cobalt.directory)
                  register { done in discoverAndRaceCobalt(pageURL: pageURL, completion: done) }

                  guard totalContenders > 0 else {
                      completion(.failure(NSError(domain: "VideoResolver", code: -1, userInfo: [NSLocalizedDescriptionKey: "لا توجد سيرفرات استخراج"])))
                      return
                  }
              }

              // MARK: - cobalt

              private static func shortLabel(for endpoint: String) -> String {
                  if let host = URL(string: endpoint)?.host {
                      return host.replacingOccurrences(of: "www.", with: "")
                  }
                  return endpoint
              }

              private static func requestCobalt(_ endpoint: String, pageURL: String, completion: @escaping (Result<ResolvedVideo, Error>) -> Void) {
                  guard let url = URL(string: endpoint) else {
                      completion(.failure(NSError(domain: "VideoResolver", code: 1)))
                      return
                  }
                  var request = URLRequest(url: url)
                  request.httpMethod = "POST"
                  request.timeoutInterval = 25
                  request.setValue("application/json", forHTTPHeaderField: "Content-Type")
                  request.setValue("application/json", forHTTPHeaderField: "Accept")

                  let body: [String: Any] = [
                      "url": pageURL,
                      "downloadMode": "auto",
                      "videoQuality": "1080",
                      "filenameStyle": "basic"
                  ]
                  request.httpBody = try? JSONSerialization.data(withJSONObject: body)

                  let label = shortLabel(for: endpoint)
                  URLSession.shared.dataTask(with: request) { data, response, _ in
                      guard let data = data,
                            let http = response as? HTTPURLResponse,
                            http.statusCode == 200,
                            let json = (try? JSONSerialization.jsonObject(with: data)) as? [String: Any] else {
                          completion(.failure(NSError(domain: "VideoResolver", code: 2)))
                          return
                      }
                      let status = json["status"] as? String ?? ""
                      let filename = json["filename"] as? String ?? ""

                      if ["tunnel", "redirect", "stream", "success"].contains(status),
                         let urlString = json["url"] as? String,
                         let direct = URL(string: urlString) {
                          completion(.success(ResolvedVideo(url: direct, filename: filename, sourceLabel: label, referer: "")))
                          return
                      }
                      if status == "picker", let picker = json["picker"] as? [[String: Any]] {
                          let videoItem = picker.first(where: { ($0["type"] as? String) == "video" }) ?? picker.first
                          if let urlString = videoItem?["url"] as? String, let direct = URL(string: urlString) {
                              completion(.success(ResolvedVideo(url: direct, filename: filename, sourceLabel: label, referer: "")))
                              return
                          }
                      }
                      completion(.failure(NSError(domain: "VideoResolver", code: 3)))
                  }.resume()
              }

              // MARK: - y2jar (الأسرع: يرجع ستريم يوتيوب الأصلي M4A بدون تحويل)

              private static func y2jarContender(vid: String, completion: @escaping (Result<ResolvedVideo, Error>) -> Void) {
                  guard let infoURL = URL(string: y2jarInfoURL + vid) else {
                      completion(.failure(NSError(domain: "VideoResolver", code: 10)))
                      return
                  }
                  var req = URLRequest(url: infoURL, timeoutInterval: 12)
                  req.setValue(mobileUA, forHTTPHeaderField: "User-Agent")
                  req.setValue("application/json", forHTTPHeaderField: "Accept")
                  req.setValue("https://v2.y2jar.cc/", forHTTPHeaderField: "Referer")

                  URLSession.shared.dataTask(with: req) { data, _, err in
                      guard let data = data, err == nil,
                            let info = (try? JSONSerialization.jsonObject(with: data)) as? [String: Any],
                            let title = info["title"] as? String else {
                          completion(.failure(NSError(domain: "VideoResolver", code: 10)))
                          return
                      }
                      guard let tokenURL = URL(string: y2jarStreamTokenURL + vid + "?a=") else {
                          completion(.failure(NSError(domain: "VideoResolver", code: 10)))
                          return
                      }
                      var tr = URLRequest(url: tokenURL, timeoutInterval: 12)
                      tr.setValue(mobileUA, forHTTPHeaderField: "User-Agent")
                      tr.setValue("application/json", forHTTPHeaderField: "Accept")
                      tr.setValue("https://v2.y2jar.cc/", forHTTPHeaderField: "Referer")
                      tr.setValue("https://v2.y2jar.cc", forHTTPHeaderField: "Origin")

                      URLSession.shared.dataTask(with: tr) { tdata, _, terr in
                          guard let tdata = tdata, terr == nil,
                                let tj = (try? JSONSerialization.jsonObject(with: tdata)) as? [String: Any],
                                let token = tj["token"] as? String, token.count > 10,
                                let enc = token.addingPercentEncoding(withAllowedCharacters: .urlQueryAllowed),
                                let dlURL = URL(string: y2jarDownloadURL + vid + "?token=" + enc) else {
                              completion(.failure(NSError(domain: "VideoResolver", code: 11)))
                              return
                          }
                          let name = cleanTitle(title)
                          completion(.success(ResolvedVideo(url: dlURL, filename: name + ".m4a", sourceLabel: "Y2JAR⚡", referer: "https://v2.y2jar.cc/")))
                      }.resume()
                  }.resume()
              }

              // MARK: - cnvmp3 (تحويل MP3 سريع)

              private static func cnvmp3Contender(vid: String, completion: @escaping (Result<ResolvedVideo, Error>) -> Void) {
                  let ytURL = "https://www.youtube.com/watch?v=\(vid)"
                  guard let infoURL = URL(string: cnvmp3GetInfoURL), let convURL = URL(string: cnvmp3ConvertURL) else {
                      completion(.failure(NSError(domain: "VideoResolver", code: 20)))
                      return
                  }
                  var infoReq = URLRequest(url: infoURL, timeoutInterval: 15)
                  infoReq.httpMethod = "POST"
                  infoReq.setValue(mobileUA, forHTTPHeaderField: "User-Agent")
                  infoReq.setValue("application/json", forHTTPHeaderField: "Accept")
                  infoReq.setValue("application/json", forHTTPHeaderField: "Content-Type")
                  infoReq.setValue("https://cnvmp3.com/v55", forHTTPHeaderField: "Referer")
                  infoReq.setValue("https://cnvmp3.com", forHTTPHeaderField: "Origin")
                  infoReq.httpBody = try? JSONSerialization.data(withJSONObject: ["url": ytURL, "token": "1234"])

                  URLSession.shared.dataTask(with: infoReq) { data, _, err in
                      var resolvedTitle = ""
                      if let data = data, err == nil,
                         let j = (try? JSONSerialization.jsonObject(with: data)) as? [String: Any],
                         let t = j["title"] as? String, !t.isEmpty {
                          resolvedTitle = t
                      }

                      var convReq = URLRequest(url: convURL, timeoutInterval: 120)
                      convReq.httpMethod = "POST"
                      convReq.setValue(mobileUA, forHTTPHeaderField: "User-Agent")
                      convReq.setValue("application/json", forHTTPHeaderField: "Accept")
                      convReq.setValue("application/json", forHTTPHeaderField: "Content-Type")
                      convReq.setValue("https://cnvmp3.com/v55", forHTTPHeaderField: "Referer")
                      convReq.setValue("https://cnvmp3.com", forHTTPHeaderField: "Origin")
                      let convBody: [String: Any] = ["url": ytURL, "quality": 4, "title": resolvedTitle, "formatValue": 1]
                      convReq.httpBody = try? JSONSerialization.data(withJSONObject: convBody)

                      URLSession.shared.dataTask(with: convReq) { cdata, _, cerr in
                          guard let cdata = cdata, cerr == nil,
                                let cj = (try? JSONSerialization.jsonObject(with: cdata)) as? [String: Any],
                                (cj["success"] as? Bool) != false,
                                let dl = cj["download_link"] as? String, !dl.isEmpty,
                                let dlURL = URL(string: dl) else {
                              completion(.failure(NSError(domain: "VideoResolver", code: 21)))
                              return
                          }
                          let name = resolvedTitle.isEmpty ? cleanTitle("YouTube \(vid)") : cleanTitle(resolvedTitle)
                          completion(.success(ResolvedVideo(url: dlURL, filename: name + ".mp3", sourceLabel: "cnvmp3", referer: "https://cnvmp3.com/v55")))
                      }.resume()
                  }.resume()
              }

              // MARK: - mp3juice workers (مع polling للتحويلات الطويلة)

              private static func workerContender(vid: String, completion: @escaping (Result<ResolvedVideo, Error>) -> Void) {
                  guard let base = workerURLs.first else {
                      completion(.failure(NSError(domain: "VideoResolver", code: 30)))
                      return
                  }
                  let ts = Int(Date().timeIntervalSince1970 * 1000)
                  guard let u = URL(string: "\(base)&v=\(vid)&f=mp3&_=\(ts)") else {
                      completion(.failure(NSError(domain: "VideoResolver", code: 30)))
                      return
                  }
                  var req = URLRequest(url: u, timeoutInterval: 15)
                  req.setValue(mobileUA, forHTTPHeaderField: "User-Agent")
                  req.setValue("https://mp3juice.sc/", forHTTPHeaderField: "Referer")
                  req.setValue("https://mp3juice.sc", forHTTPHeaderField: "Origin")
                  req.setValue("application/json,*/*", forHTTPHeaderField: "Accept")

                  URLSession.shared.dataTask(with: req) { data, _, _ in
                      guard let data = data,
                            let d = (try? JSONSerialization.jsonObject(with: data)) as? [String: Any],
                            (d["error"] as? Int ?? 0) == 0 else {
                          completion(.failure(NSError(domain: "VideoResolver", code: 30)))
                          return
                      }
                      if let dl = d["downloadURL"] as? String, !dl.isEmpty,
                         let du = URL(string: decodeWorkerURL(dl)) {
                          completion(.success(ResolvedVideo(url: du, filename: "", sourceLabel: "Mp3Juice", referer: "https://mp3juice.sc/")))
                          return
                      }
                      if let purl = d["progressURL"] as? String, !purl.isEmpty {
                          workerPoll(vid: vid, progURL: purl, ticks: 0, completion: completion)
                          return
                      }
                      completion(.failure(NSError(domain: "VideoResolver", code: 30)))
                  }.resume()
              }

              private static func workerPoll(vid: String, progURL: String, ticks: Int, completion: @escaping (Result<ResolvedVideo, Error>) -> Void) {
                  if ticks > 90 {
                      completion(.failure(NSError(domain: "VideoResolver", code: 31)))
                      return
                  }
                  DispatchQueue.global().asyncAfter(deadline: .now() + 2.0) {
                      guard let u = URL(string: progURL) else {
                          completion(.failure(NSError(domain: "VideoResolver", code: 31)))
                          return
                      }
                      var req = URLRequest(url: u, timeoutInterval: 10)
                      req.setValue(mobileUA, forHTTPHeaderField: "User-Agent")
                      req.setValue("https://mp3juice.sc/", forHTTPHeaderField: "Referer")
                      URLSession.shared.dataTask(with: req) { data, _, _ in
                          guard let data = data,
                                let d = (try? JSONSerialization.jsonObject(with: data)) as? [String: Any] else {
                              workerPoll(vid: vid, progURL: progURL, ticks: ticks + 1, completion: completion)
                              return
                          }
                          let status = d["status"] as? String ?? ""
                          if status == "download", let dl = d["downloadURL"] as? String,
                             let du = URL(string: decodeWorkerURL(dl)) {
                              completion(.success(ResolvedVideo(url: du, filename: "", sourceLabel: "Mp3Juice", referer: "https://mp3juice.sc/")))
                              return
                          }
                          workerPoll(vid: vid, progURL: progURL, ticks: ticks + 1, completion: completion)
                      }.resume()
                  }
              }

              private static func decodeWorkerURL(_ s: String) -> String {
                  if s.contains("m=d&u=") || s.contains("m=p&u=") {
                      guard let comps = URLComponents(string: s),
                            let u = comps.queryItems?.first(where: { $0.name == "u" })?.value else { return s }
                      let pad = u + String(repeating: "=", count: (4 - u.count % 4) % 4)
                      if let data = Data(base64Encoded: pad), let dec = String(data: data, encoding: .utf8) { return dec }
                  }
                  return s
              }

              // MARK: - Piped (روابط يوتيوب المباشرة من googlevideo)

              private static let pipedMirrors = [
                  "https://pipedapi.kavin.rocks",
                  "https://pipedapi.adminforge.de",
                  "https://pipedapi.leptons.xyz",
