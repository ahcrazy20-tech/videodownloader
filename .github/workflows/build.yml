        import SwiftUI
        import WebKit

        class BrowserVM: ObservableObject {
            @Published var urlText = ""
            @Published var isLoading = false
            @Published var canGoBack = false
            @Published var canGoForward = false
            @Published var isSecure = true
            @Published var capturedURLs: [String] = []
            var networkCaptures = Set<String>()
            weak var webView: WKWebView?

            init() { navigate(to: "https://www.google.com") }

            func navigate(to raw: String) {
                var s = raw.trimmingCharacters(in: .whitespaces)
                if !s.hasPrefix("http://") && !s.hasPrefix("https://") {
                    if s.contains(".") && !s.contains(" ") { s = "https://\(s)" }
                    else { s = "https://www.google.com/search?q=\(s.addingPercentEncoding(withAllowedCharacters: .urlQueryAllowed) ?? s)" }
                }
                guard let url = URL(string: s) else { return }
                webView?.load(URLRequest(url: url)); urlText = s
            }

            func goBack() { webView?.goBack() }
            func goForward() { webView?.goForward() }
            func reload() { webView?.reload() }
            func stop() { webView?.stopLoading() }

            func addCapture(_ url: String) {
                guard !networkCaptures.contains(url) else { return }
                networkCaptures.insert(url)
                DispatchQueue.main.async { self.capturedURLs.append(url) }
            }
        }

        // MARK: - Smart WebView with Network Interception
        struct SmartWebView: UIViewRepresentable {
            @ObservedObject var vm: BrowserVM

            func makeUIView(context: Context) -> WKWebView {
                let cfg = WKWebViewConfiguration()
                cfg.allowsInlineMediaPlayback = true
                cfg.mediaTypesRequiringUserActionForPlayback = []

                // Inject intelligent video detection script
                let js = WKUserScript(source: Self.smartDetectionJS, injectionTime: .atDocumentEnd, forMainFrameOnly: false)
                cfg.userContentController.addUserScript(js)
                cfg.userContentController.add(context.coordinator, name: "videoCapture")

                // URL scheme handler for network sniffing
                let wv = WKWebView(frame: .zero, configuration: cfg)
                wv.navigationDelegate = context.coordinator
                wv.uiDelegate = context.coordinator
                wv.allowsBackForwardNavigationGestures = true
                wv.customUserAgent = "Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1"
                vm.webView = wv
                return wv
            }

            func updateUIView(_ wv: WKWebView, context: Context) {}
            func makeCoordinator() -> Coordinator { Coordinator(vm: vm) }

            // MARK: - Ultra Smart JS (detects videos everywhere)
            static var smartDetectionJS: String { """
            (function(){
              var found=new Set();
              function report(url,src){
                if(url && !found.has(url) && (url.includes('.mp4')||url.includes('.m3u8')||url.includes('.webm')||url.includes('.mov')||url.includes('video')||url.includes('googlevideo')||url.includes('fbcdn.net')||url.includes('cdninstagram')||url.includes('tiktokcdn'))){
                  found.add(url);
                  window.webkit.messageHandlers.videoCapture.postMessage({url:url,source:src});
                }
              }

              // 1. Scan <video> tags
              function scanVideos(){
                document.querySelectorAll('video').forEach(function(v){
                  if(v.src) report(v.src,'video-tag');
                  if(v.currentSrc) report(v.currentSrc,'video-currentSrc');
                  v.querySelectorAll('source').forEach(function(s){ if(s.src) report(s.src,'source-tag'); });
                  // Check blob URLs
                  if(v.src && v.src.startsWith('blob:')){ try { report(v.src,'blob'); } catch(e){} }
                });
                // Scan iframes
                try { document.querySelectorAll('iframe').forEach(function(f){ try { f.contentDocument.querySelectorAll('video').forEach(function(v){ if(v.src) report(v.src,'iframe-video'); }); } catch(e){} }); } catch(e){}
              }

              // 2. Intercept fetch
              var oFetch=window.fetch;
              window.fetch=function(){
                var url=typeof arguments[0]==='string'?arguments[0]:(arguments[0]&&arguments[0].url?arguments[0].url:'');
                report(url,'fetch');
                return oFetch.apply(this,arguments);
              };

              // 3. Intercept XMLHttpRequest
              var oXHR=XMLHttpRequest.prototype.open;
              XMLHttpRequest.prototype.open=function(m,url){
                report(url,'xhr');
                return oXHR.apply(this,arguments);
              };

              // 4. Intercept createElement (catches dynamic video creation)
              var oCE=document.createElement;
              document.createElement=function(tag){
                var el=oCE.apply(this,arguments);
                if(tag.toLowerCase()==='video'||tag.toLowerCase()==='source'){
                  var oSS=Object.getOwnPropertyDescriptor(HTMLMediaElement.prototype,'src');
                  if(oSS&&oSS.set){
                    var origSet=oSS.set;
                    Object.defineProperty(el,'src',{set:function(v){report(v,'dynamic-'+tag);origSet.call(this,v);},get:oSS.get});
                  }
                }
                return el;
              };

              // 5. MutationObserver for dynamic content
              var obs=new MutationObserver(function(){ scanVideos(); });
              if(document.body) obs.observe(document.body,{childList:true,subtree:true});

              // 6. Intercept MediaSource
              if(window.MediaSource){
                var oAB=MediaSource.prototype.addSourceBuffer;
                MediaSource.prototype.addSourceBuffer=function(m){
                  window.webkit.messageHandlers.videoCapture.postMessage({url:'mediasource://'+m,source:'mediasource'});
                  return oAB.apply(this,arguments);
                };
              }

              // 7. Periodic scan
              window._vfScan=scanVideos;
              setInterval(scanVideos,3000);
              setTimeout(scanVideos,1500);
              setTimeout(scanVideos,5000);
            })();
            """ }

            class Coordinator: NSObject, WKNavigationDelegate, WKUIDelegate, WKScriptMessageHandler {
                let vm: BrowserVM
                init(vm: BrowserVM) { self.vm = vm }

                func userContentController(_ c: WKUserContentController, didReceive msg: WKScriptMessage) {
                    if let body = msg.body as? [String: Any], let url = body["url"] as? String {
                        vm.addCapture(url)
                    }
                }

                func webView(_ wv: WKWebView, didStartProvisionalNavigation _: WKNavigation!) {
                    vm.isLoading = true; vm.capturedURLs = []; vm.networkCaptures = []
                }

                func webView(_ wv: WKWebView, didFinish _: WKNavigation!) {
                    vm.isLoading = false; vm.canGoBack = wv.canGoBack; vm.canGoForward = wv.canGoForward
                    vm.urlText = wv.url?.absoluteString ?? ""; vm.isSecure = wv.url?.scheme == "https"
                }

                func webView(_ wv: WKWebView, didFail _: WKNavigation!, withError _: Error) { vm.isLoading = false }

                // Intercept ALL navigation requests to catch video URLs
                func webView(_ wv: WKWebView, decidePolicyFor action: WKNavigationAction, decisionHandler: @escaping (WKNavigationActionPolicy) -> Void) {
                    if let url = action.request.url?.absoluteString {
                        let lower = url.lowercased()
                        if lower.contains(".mp4") || lower.contains(".m3u8") || lower.contains(".webm") || lower.contains("googlevideo") || lower.contains("videoplayback") {
                            vm.addCapture(url)
                        }
                    }
                    decisionHandler(.allow)
                }

                // Intercept response to detect video content types
                func webView(_ wv: WKWebView, decidePolicyFor response: WKNavigationResponse, decisionHandler: @escaping (WKNavigationResponsePolicy) -> Void) {
                    if let mime = response.response.mimeType?.lowercased(),
                       (mime.contains("video") || mime.contains("mpegurl") || mime.contains("mp2t")) {
                        if let url = response.response.url?.absoluteString { vm.addCapture(url) }
                    }
                    decisionHandler(.allow)
                }

                func webView(_ wv: WKWebView, createWebViewWith _: WKWebViewConfiguration, for action: WKNavigationAction, windowFeatures: WKWindowFeatures) -> WKWebView? {
                    if action.targetFrame == nil { wv.load(action.request) }; return nil
                }
            }
        }

