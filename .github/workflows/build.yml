              /// يجيب ستريمات MP4 المدموجة بالصوت من Invidious API
              private static func fetchInvidiousVideo(_ uri: String, vid: String, completion: @escaping (URL?) -> Void) {
                  guard let u = URL(string: uri + "/api/v1/videos/" + vid) else {
