                        Image(systemName:"play.fill").foregroundColor(.blue).font(.system(size:14))
                    }
                    VStack(alignment:.leading,spacing:4) {
                        Text(playerManager.currentVideo?.video.title ?? "")
                            .font(.system(size:13,weight:.medium)).foregroundColor(.white).lineLimit(1)
                        GeometryReader { g in
                            ZStack(alignment:.leading) {
                                Capsule().fill(Color.white.opacity(0.25)).frame(height:2)
                                Capsule().fill(Color.blue).frame(width:g.size.width*playerManager.progress,height:2)
                            }
                        }.frame(height:2)
                    }
                    Spacer()
                    Button { playerManager.togglePlayPause() } label: {
                        Image(systemName: playerManager.isPlaying ? "pause.fill" : "play.fill")
                            .foregroundColor(.white).font(.system(size:18))
                    }
                    Button { playerManager.close() } label: {
                        Image(systemName:"xmark").foregroundColor(.white).font(.system(size:16))
                    }
                }
                .padding(.horizontal,16).padding(.vertical,10)
                .background(RoundedRectangle(cornerRadius:16).fill(Color(.systemGray6).opacity(0.95))
                    .shadow(color:.black.opacity(0.3),radius:10))
                .padding(.horizontal,12)
                .onTapGesture { playerManager.isFullScreen = true; playerManager.isMinimized = false }
            }
        }
