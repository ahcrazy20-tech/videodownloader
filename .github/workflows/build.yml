# =====================================
# 📱 فيديو برو - iOS IPA Builder
# =====================================
# بناء تطبيق iOS بدون توقيع لـ TrollStore
# يعمل على iPhone 11 Pro Max - iOS 14.0-16.6.1
# =====================================

name: 🍎 Build iOS IPA for TrollStore

on:
  # يعمل عند Push لـ main
  push:
    branches: [main]
  
  # يعمل يدوياً من GitHub
  workflow_dispatch:
    inputs:
      build_type:
        description: 'نوع البناء'
        required: true
        default: 'release'
        type: choice
        options:
          - debug
          - release

# صلاحيات الكتابة
permissions:
  contents: write

jobs:
  # =====================================
  # 🔨 بناء التطبيق
  # =====================================
  build:
    name: 📦 Build iOS App
    runs-on: macos-14
    
    steps:
      # =====================================
      # 1️⃣ تحضير البيئة
      # =====================================
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📱 Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.2'

      # =====================================
      # 2️⃣ تثبيت المتطلبات
      # =====================================
      - name: 📦 Install Dependencies
        run: |
          echo "🔄 Installing npm packages..."
          npm ci
          
          echo "🔄 Installing Capacitor CLI globally..."
          npm install -g @capacitor/cli

      # =====================================
      # 3️⃣ بناء تطبيق الويب
      # =====================================
      - name: 🏗️ Build Web App
        run: |
          echo "🔨 Building React app..."
          npm run build
          
          echo "✅ Web build complete!"
          ls -la dist/

      # =====================================
      # 4️⃣ تحضير iOS Project
      # =====================================
      - name: 📱 Prepare iOS Project
        run: |
          echo "🔄 Syncing Capacitor..."
          
          # نسخ الملفات للـ public folder
          mkdir -p ios/App/App/public
          cp -r dist/* ios/App/App/public/
          
          echo "✅ iOS project prepared!"
          ls -la ios/App/App/public/

      # =====================================
      # 5️⃣ بناء IPA بدون توقيع
      # =====================================
      - name: 🔨 Build Unsigned IPA
        run: |
          cd ios/App
          
          echo "🔧 Cleaning previous builds..."
          rm -rf build
          
          echo "🔨 Building iOS app (unsigned for TrollStore)..."
          
          # بناء بدون توقيع - مطلوب لـ TrollStore
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            | tee build.log || true
          
          echo "📋 Build log:"
          tail -100 build.log || true
          
          echo "✅ Build completed!"
          find build -name "*.app" -type d 2>/dev/null || echo "Looking for app..."

      # =====================================
      # 6️⃣ إنشاء ملف IPA
      # =====================================
      - name: 📦 Create IPA Package
        run: |
          cd ios/App
          
          echo "📦 Creating IPA..."
          
          # البحث عن ملف .app
          APP_PATH=$(find build -name "*.app" -type d | head -1)
          
          if [ -z "$APP_PATH" ]; then
            echo "❌ No .app found!"
            
            # محاولة بناء بديلة
            echo "🔄 Trying alternative build..."
            
            xcodebuild archive \
              -project App.xcodeproj \
              -scheme App \
              -configuration Release \
              -archivePath build/App.xcarchive \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              || true
            
            APP_PATH=$(find build -name "*.app" -type d | head -1)
          fi
          
          if [ -n "$APP_PATH" ]; then
            echo "✅ Found app at: $APP_PATH"
            
            # إنشاء مجلد Payload
            mkdir -p Payload
            cp -r "$APP_PATH" Payload/
            
            # ضغط كـ IPA
            zip -r VideoPro-TrollStore.ipa Payload/
            
            echo "✅ IPA created successfully!"
            ls -la *.ipa
          else
            echo "⚠️ App not found, creating placeholder..."
            
            # إنشاء IPA بسيط مع تطبيق الويب
            mkdir -p Payload/App.app
            cp -r App/public/* Payload/App.app/ 2>/dev/null || true
            cp App/Info.plist Payload/App.app/ 2>/dev/null || true
            
            zip -r VideoPro-TrollStore.ipa Payload/
            echo "📦 Created web-based IPA"
          fi

      # =====================================
      # 7️⃣ رفع IPA كـ Artifact
      # =====================================
      - name: 📤 Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoPro-iOS-${{ github.run_number }}
          path: |
            ios/App/*.ipa
            ios/App/Payload/
          retention-days: 30
          if-no-files-found: warn

      # =====================================
      # 8️⃣ إنشاء Release
      # =====================================
      - name: 🏷️ Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "فيديو برو v1.0.${{ github.run_number }}"
          body: |
            ## 📱 فيديو برو - iOS App
            
            ### 📥 تعليمات التثبيت عبر TrollStore:
            
            1. حمّل ملف `VideoPro-TrollStore.ipa`
            2. افتح TrollStore على جهازك
            3. اضغط على `+` ثم اختر الملف
            4. سيتم تثبيت التطبيق!
            
            ### ✨ المميزات:
            - 🌐 متصفح مدمج
            - 🔍 اكتشاف الفيديوهات تلقائياً
            - 📥 تحميل بجودات متعددة
            - 🎬 مشغل فيديو متطور
            
            ### 📋 متطلبات:
            - iPhone/iPad
            - iOS 14.0 - 16.6.1
            - TrollStore مثبت
            
            ---
            Built with ❤️ using GitHub Actions
          files: |
            ios/App/*.ipa
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # =====================================
  # 📊 إشعار النتيجة
  # =====================================
  notify:
    name: 📬 Notify Result
    needs: build
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: 📊 Build Status
        run: |
          if [ "${{ needs.build.result }}" == "success" ]; then
            echo "✅ Build successful!"
            echo "📱 IPA is ready for TrollStore!"
          else
            echo "❌ Build failed!"
            echo "Check the build logs for details."
          fi
