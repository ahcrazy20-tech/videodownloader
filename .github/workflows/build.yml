name: Build iOS IPA

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Select Xcode
      run: sudo xcode-select -s /Applications/Xcode_15.0.app

    - name: Install dependencies
      run: brew install ldid

    - name: Download yt-dlp
      run: |
        mkdir -p Resources
        curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o Resources/yt-dlp
        chmod +x Resources/yt-dlp

    - name: Create Package.swift
      run: |
        cat > Package.swift << 'EOF'
        // swift-tools-version: 5.9
        import PackageDescription

        let package = Package(
            name: "MegaDownloader",
            platforms: [.iOS(.v16)],
            products: [
                .executable(name: "MegaDownloader", targets: ["MegaDownloader"])
            ],
            targets: [
                .executableTarget(
                    name: "MegaDownloader",
                    path: "Sources"
                )
            ]
        )
        EOF

    - name: Organize source files
      run: |
        mkdir -p Sources
        mv *.swift Sources/ 2>/dev/null || true
        mv Info.plist Sources/ 2>/dev/null || true

    - name: Build with SPM
      run: swift build -c release --sdk $(xcrun --sdk iphoneos --show-sdk-path) --target MegaDownloader

    - name: Create app bundle
      run: |
        mkdir -p Payload/MegaDownloader.app
        cp .build/release/MegaDownloader Payload/MegaDownloader.app/
        cp Resources/yt-dlp Payload/MegaDownloader.app/
        cp Sources/Info.plist Payload/MegaDownloader.app/
        chmod +x Payload/MegaDownloader.app/yt-dlp
        ldid -STrollStore.entitlements Payload/MegaDownloader.app/MegaDownloader

    - name: Create IPA
      run: zip -r MegaDownloader.ipa Payload

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: MegaDownloader-iOS
        path: MegaDownloader.ipa
