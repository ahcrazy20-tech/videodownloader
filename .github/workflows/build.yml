                                      .progressViewStyle(CircularProgressViewStyle())
                                      .padding()
                              } else {
                                  Label("ترجمة الفيديو", systemImage: "play.circle")
                                      .font(.title3)
                                      .padding()
                                      .frame(maxWidth: .infinity)
                                      .background(Color.blue)
                                      .foregroundColor(.white)
                                      .cornerRadius(10)
                              }
                          }
                          .disabled(translator.isTranslating)
                          .padding(.horizontal)

                          // عرض نتيجة الترجمة
                          if !translator.translatedText.isEmpty {
                              ScrollView {
                                  Text(translator.translatedText)
                                      .padding()
                                      .frame(maxWidth: .infinity, alignment: .leading)
                                      .background(Color(.systemGray6))
                                      .cornerRadius(8)
                              }
                              .frame(maxHeight: 200)
                              .padding(.horizontal)

                              // زر نسخ
                              Button {
                                  UIPasteboard.general.string = translator.translatedText
                              } label: {
                                  Label("نسخ النص", systemImage: "doc.on.doc")
                              }
                          }

                          Spacer()
                      }
                      .padding(.top)
                      .navigationTitle("ترجمة الفيديو")
                      .navigationBarTitleDisplayMode(.inline)
                      .toolbar {
                          Button("إغلاق") { dismiss() }
                      }
                  }
              }
          }
          EOF

          # ========== Views/WebView.swift (مطور: شريط تقدم + تنقل + تحميل تلقائي للوسائط) ==========
          cat > VideoDownloader/Views/WebView.swift << 'EOF'
          import SwiftUI
          import WebKit

          /// حالة الـ WebView (تحميل، تقدم، رجوع/تقدم) كـ ObservableObject لتظهر في SwiftUI
          class WebViewState: ObservableObject {
              @Published var isLoading = false
              @Published var progress: Double = 0.0
              @Published var canGoBack = false
              @Published var canGoForward = false
              weak var webView: WKWebView?

              func goBack() { webView?.goBack() }
              func goForward() { webView?.goForward() }
              func reload() { webView?.reload() }
              func stop() { webView?.stopLoading() }
          }

          struct WebView: UIViewRepresentable {
              @Binding var urlString: String
              @Binding var loadTrigger: Int
              @ObservedObject var state: WebViewState
              var downloadManager: DownloadManager?

              func makeUIView(context: Context) -> WKWebView {
                  let config = WKWebViewConfiguration()
                  config.allowsInlineMediaPlayback = true
                  config.mediaTypesRequiringUserActionForPlayback = []

                  let contentController = WKUserContentController()
                  contentController.addUserScript(AdBlocker.injectScript())
                  config.userContentController = contentController

                  let webView = WKWebView(frame: .zero, configuration: config)
                  webView.navigationDelegate = context.coordinator
                  webView.allowsBackForwardNavigationGestures = true
                  context.coordinator.attach(to: webView)
                  state.webView = webView

                  if let url = URL(string: urlString) {
                      webView.load(URLRequest(url: url))
                  }
                  return webView
              }

              func updateUIView(_ webView: WKWebView, context: Context) {
                  context.coordinator.parent = self
                  // التحميل يحدث فقط عند تغيّر loadTrigger (زر "ذهاب") — يمنع حلقة إعادة التحميل
                  if context.coordinator.lastLoadTrigger != loadTrigger {
                      context.coordinator.lastLoadTrigger = loadTrigger
                      if let url = URL(string: urlString) {
                          webView.load(URLRequest(url: url))
                      }
                  }
              }

              func makeCoordinator() -> Coordinator {
                  Coordinator(self)
              }

              class Coordinator: NSObject, WKNavigationDelegate {
                  var parent: WebView
                  weak var webView: WKWebView?
                  var lastLoadTrigger = 0
                  private var observations: [NSKeyValueObservation] = []

                  init(_ parent: WebView) {
                      self.parent = parent
                      super.init()
                      NotificationCenter.default.addObserver(
                          self,
                          selector: #selector(extractVideos),
                          name: .extractVideos,
                          object: nil
                      )
                  }

                  deinit {
                      NotificationCenter.default.removeObserver(self)
                  }

                  /// ربط حالة الـ WebView بواجهة SwiftUI عبر KVO (تقدم، تحميل، رجوع/تقدم)
                  func attach(to webView: WKWebView) {
                      self.webView = webView
                      let state = parent.state
                      observations = [
                          webView.observe(\.estimatedProgress, options: [.new]) { wv, _ in
                              let value = wv.estimatedProgress
                              DispatchQueue.main.async { state.progress = value }
                          },
                          webView.observe(\.isLoading, options: [.new]) { wv, _ in
                              let value = wv.isLoading
                              DispatchQueue.main.async { state.isLoading = value }
                          },
                          webView.observe(\.canGoBack, options: [.new]) { wv, _ in
                              let value = wv.canGoBack
                              DispatchQueue.main.async { state.canGoBack = value }
                          },
                          webView.observe(\.canGoForward, options: [.new]) { wv, _ in
                              let value = wv.canGoForward
                              DispatchQueue.main.async { state.canGoForward = value }
                          }
                      ]
                  }

                  // أي لينك ملف وسائط مباشر يتحول لتحميل تلقائي بدلاً من فتحه في المتصفح
                  func webView(_ webView: WKWebView, decidePolicyFor navigationAction: WKNavigationAction, decisionHandler: @escaping (WKNavigationActionPolicy) -> Void) {
                      if navigationAction.navigationType == .linkActivated,
                         let url = navigationAction.request.url,
                         VideoResolver.isDirectMediaURL(url.absoluteString) {
                          DispatchQueue.main.async {
                              NotificationCenter.default.post(name: .videoURLFound, object: url.absoluteString)
                          }
                          decisionHandler(.cancel)
                          return
                      }
                      decisionHandler(.allow)
                  }

                  @objc func extractVideos() {
                      guard let webView = webView else { return }
                      let jsCode = """
                      (function() {
                          var urls = [];
                          var videos = document.getElementsByTagName('video');
                          for (var i = 0; i < videos.length; i++) {
                              var src = videos[i].src || videos[i].currentSrc;
                              if (src && src.startsWith('http')) urls.push(src);
                              var sources = videos[i].getElementsByTagName('source');
                              for (var j = 0; j < sources.length; j++) {
                                  if (sources[j].src && sources[j].src.startsWith('http')) urls.push(sources[j].src);
                              }
                          }
                          return urls;
                      })();
                      """
                      webView.evaluateJavaScript(jsCode) { result, _ in
                          if let urls = result as? [String], !urls.isEmpty {
                              for url in urls {
                                  DispatchQueue.main.async {
                                      NotificationCenter.default.post(name: .videoURLFound, object: url)
                                  }
                              }
                          }
                      }
                  }

                  func webView(_ webView: WKWebView, didFinish navigation: WKNavigation!) {
                      if let url = webView.url?.absoluteString {
                          DispatchQueue.main.async {
                              if self.parent.urlString != url {
                                  self.parent.urlString = url
                              }
                          }
                      }
                  }

                  func webView(_ webView: WKWebView, didFail navigation: WKNavigation!, withError error: Error) {
                      DispatchQueue.main.async { self.parent.state.isLoading = false }
                  }

                  func webView(_ webView: WKWebView, didFailProvisionalNavigation navigation: WKNavigation!, withError error: Error) {
                      DispatchQueue.main.async { self.parent.state.isLoading = false }
                  }
              }
          }
