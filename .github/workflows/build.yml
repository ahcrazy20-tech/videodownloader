' > MegaDownloader.xcodeproj/project.pbxproj

    - name: Move Swift files to MegaDownloader folder
      run: |
        mkdir -p MegaDownloader
        mv ContentView.swift MegaDownloader/ 2>/dev/null || true
        mv DownloadManager.swift MegaDownloader/ 2>/dev/null || true
        mv HistoryManager.swift MegaDownloader/ 2>/dev/null || true
        mv SettingsManager.swift MegaDownloader/ 2>/dev/null || true
        mv MegaDownloaderApp.swift MegaDownloader/ 2>/dev/null || true
        mv Info.plist MegaDownloader/ 2>/dev/null || true

    - name: Build with xcodebuild
      run: |
        xcodebuild -project MegaDownloader.xcodeproj \
          -scheme MegaDownloader \
          -sdk iphoneos \
          -configuration Release \
          -derivedDataPath build \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          PRODUCT_BUNDLE_IDENTIFIER="com.megadownloader.app" \
          build

    - name: Create IPA
      run: |
        mkdir -p Payload
        cp -r build/Build/Products/Release-iphoneos/MegaDownloader.app Payload/
        cp Resources/yt-dlp Payload/MegaDownloader.app/
        chmod +x Payload/MegaDownloader.app/yt-dlp
        ldid -STrollStore.entitlements Payload/MegaDownloader.app/MegaDownloader
        zip -r MegaDownloader.ipa Payload

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: MegaDownloader-iOS
        path: MegaDownloader.ipa
