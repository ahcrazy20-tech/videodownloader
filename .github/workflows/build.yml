        import SwiftUI

        struct DownloadsView: View {
            @EnvironmentObject var downloadManager: DownloadManager
            @EnvironmentObject var playerManager: PlayerManager
            @State private var tab = 0

            var body: some View {
                NavigationView {
                    VStack(spacing:0) {
                        Picker("", selection:$tab) {
                            Text("Active (\(downloadManager.activeDownloads.count))").tag(0)
                            Text("Done (\(downloadManager.completedVideos.count))").tag(1)
                        }.pickerStyle(.segmented).padding()

                        if tab == 0 {
                            if downloadManager.activeDownloads.isEmpty {
                                EmptyState(icon:"arrow.down.circle", title:"No Active Downloads",
                                           sub:"Browse and tap Smart Extract")
                            } else {
                                List(downloadManager.activeDownloads) { task in
                                    ActiveRow(task:task,
                                        onPause: { downloadManager.pauseDownload(task) },
                                        onResume: { downloadManager.resumeDownload(task) },
                                        onCancel: { downloadManager.cancelDownload(task) })
                                }.listStyle(.plain)
                            }
                        } else {
                            if downloadManager.completedVideos.isEmpty {
                                EmptyState(icon:"checkmark.circle", title:"No Completed Videos",
                                           sub:"Downloads will appear here")
                            } else {
                                List(downloadManager.completedVideos) { task in
                                    DoneRow(task:task,
                                        onPlay: { playerManager.playVideo(task) },
                                        onDelete: { downloadManager.deleteVideo(task) })
                                }.listStyle(.plain)
                            }
                        }
                    }
                    .navigationTitle("Downloads")
                }
            }
        }

