          import SwiftUI
          import AVFoundation

          class VideoTranslator: ObservableObject {
              @Published var translatedText: String = ""
              @Published var isTranslating = false
              @Published var availableEngines: [String] = ["DeepLX", "LibreTranslate", "Whisper (محلي)"]

              private var currentEngineName: String = "DeepLX"
              private let whisperManager = WhisperManager()
              private let deepLX = DeepLTranslator()
              private let libre = LibreTranslator()

              func switchToEngine(named engineName: String) {
                  currentEngineName = engineName
                  print("🔄 تم التبديل إلى: \(engineName)")
              }

              func translateVideo(videoURL: URL) {
                  if currentEngineName == "Whisper (محلي)" && !whisperManager.isModelReady {
                      DispatchQueue.main.async {
                          self.translatedText = "⚠️ يرجى تحميل نموذج Whisper أولاً من إعدادات التطبيق"
                      }
                      return
                  }

                  isTranslating = true
                  translatedText = ""

                  extractAudio(from: videoURL) { audioURL in
                      guard let audioURL = audioURL else {
                          DispatchQueue.main.async {
                              self.translatedText = "❌ فشل استخراج الصوت"
                              self.isTranslating = false
                          }
                          return
                      }

                      // 1. التعرف على الصوت (ASR)
                      self.performASR(audioURL: audioURL) { transcribedText in
                          guard let text = transcribedText, !text.isEmpty else {
                              DispatchQueue.main.async {
                                  self.translatedText = "❌ فشل التعرف على الصوت"
                                  self.isTranslating = false
                              }
                              return
                          }

                          // 2. ترجمة النص
                          self.performTranslation(text: text) { translation in
                              DispatchQueue.main.async {
                                  self.translatedText = translation ?? "❌ فشلت الترجمة"
                                  self.isTranslating = false
                              }
                          }
                      }
                  }
              }

              private func performASR(audioURL: URL, completion: @escaping (String?) -> Void) {
                  // للمحركات السحابية نستخدم Whisper كـ ASR أساسي (يمكن استبداله بـ SFSpeechRecognizer)
                  whisperManager.transcribe(audioURL: audioURL, completion: completion)
              }

              private func performTranslation(text: String, completion: @escaping (String?) -> Void) {
                  switch currentEngineName {
                  case "LibreTranslate":
                      libre.translate(text: text, completion: completion)
                  default:
                      // DeepLX + Whisper (الترجمة النصية عبر DeepLX)
                      deepLX.translate(text: text, completion: completion)
                  }
              }

              private func extractAudio(from videoURL: URL, completion: @escaping (URL?) -> Void) {
                  let asset = AVAsset(url: videoURL)
                  Task {
                      let tracks = (try? await asset.loadTracks(withMediaType: .audio)) ?? []
                      guard let audioTrack = tracks.first, audioTrack.trackID != kCMPersistentTrackID_Invalid else {
                          completion(nil)
                          return
                      }

                      let outputURL = FileManager.default.temporaryDirectory
                          .appendingPathComponent(UUID().uuidString)
                          .appendingPathExtension("m4a")
                      try? FileManager.default.removeItem(at: outputURL)

                      let exportSession = AVAssetExportSession(asset: asset, presetName: AVAssetExportPresetAppleM4A)
                      exportSession?.outputFileType = .m4a
                      exportSession?.outputURL = outputURL
                      exportSession?.exportAsynchronously {
                          completion(exportSession?.status == .completed ? outputURL : nil)
                      }
                  }
              }
          }
