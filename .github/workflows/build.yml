        import Foundation
        import UserNotifications

        class DownloadManager: ObservableObject {
            static let shared = DownloadManager()
            @Published var activeDownloads: [DownloadTask] = []
            @Published var completedVideos: [DownloadTask] = []
            var backgroundCompletionHandler: (() -> Void)?

            init() {
                setupDir()
                loadSaved()
            }

            private func setupDir() {
                let d = downloadsDir()
                if !FileManager.default.fileExists(atPath: d.path) {
                    try? FileManager.default.createDirectory(at: d, withIntermediateDirectories: true)
                }
            }

            func downloadsDir() -> URL {
                FileManager.default.urls(for: .documentDirectory, in: .userDomainMask)[0]
                    .appendingPathComponent("Downloads", isDirectory: true)
            }

            func startDownload(video: VideoItem, quality: VideoQuality) {
                print("🎯 START: \(video.url)")
                let task = DownloadTask(video: video, quality: quality)
                DispatchQueue.main.async { self.activeDownloads.append(task) }

                let safe = sanitize(video.title)
                let ext = quality == .audio ? "mp3" : "mp4"
                let name = "\(safe)_\(quality.rawValue)_\(Int(Date().timeIntervalSince1970)).\(ext)"
                let dest = downloadsDir().appendingPathComponent(name)

                // HLS uses different downloader
                if video.isHLS {
                    DispatchQueue.main.async { task.status = .converting }
                    HLSDownloader.shared.downloadHLS(
                        url: video.url, headers: video.headers, destination: dest,
                        progress: { p in
                            DispatchQueue.main.async {
                                task.progress = p
                                task.status = .downloading(progress: p)
                                task.activeThreads = 6
                            }
                        },
                        completion: { result in
                            DispatchQueue.main.async {
                                switch result {
                                case .success(let url):
                                    task.savedURL = url
                                    task.status = .completed
                                    task.progress = 1.0
                                    task.activeThreads = 0
                                    self.activeDownloads.removeAll { $0.id == task.id }
                                    self.completedVideos.insert(task, at: 0)
                                    self.notify(task)
                                case .failure(let e):
                                    task.status = .failed(error: e.localizedDescription)
                                    try? FileManager.default.removeItem(at: dest)
                                }
                            }
                        }
                    )
                    return
                }

                // Regular download - USE IDM ENGINE
                IDMDownloader.shared.download(
                    url: video.url,
                    headers: video.headers,
                    destination: dest,
                    progress: { p, speed, threads in
                        DispatchQueue.main.async {
                            task.progress = p
                            task.speed = speed
                            task.activeThreads = threads
                            task.status = .downloading(progress: p)
                        }
                    },
                    completion: { result in
                        DispatchQueue.main.async {
                            switch result {
                            case .success(let url):
                                // Validate file
                                if let attrs = try? FileManager.default.attributesOfItem(atPath: url.path),
                                   let size = attrs[.size] as? Int64, size > 10000 {
                                    if let fh = try? FileHandle(forReadingFrom: url) {
                                        let header = fh.readData(ofLength: 12)
                                        try? fh.close()
                                        if !self.isValidVideoFile(header: header) {
                                            task.status = .failed(error: "Invalid file format")
                                            try? FileManager.default.removeItem(at: url)
                                            return
                                        }
                                    }
                                    task.savedURL = url
                                    task.status = .completed
                                    task.progress = 1.0
                                    task.activeThreads = 0
                                    self.activeDownloads.removeAll { $0.id == task.id }
                                    self.completedVideos.insert(task, at: 0)
                                    self.notify(task)
                                } else {
                                    task.status = .failed(error: "File too small")
                                    try? FileManager.default.removeItem(at: url)
                                }
                            case .failure(let e):
                                task.status = .failed(error: e.localizedDescription)
                                try? FileManager.default.removeItem(at: dest)
                            }
                        }
                    }
                )
            }

            func pauseDownload(_ t: DownloadTask) {
                DispatchQueue.main.async { t.status = .paused }
            }

            func resumeDownload(_ t: DownloadTask) {
                startDownload(video: t.video, quality: t.quality)
                DispatchQueue.main.async { self.activeDownloads.removeAll { $0.id == t.id } }
            }

            func cancelDownload(_ t: DownloadTask) {
                DispatchQueue.main.async { self.activeDownloads.removeAll { $0.id == t.id } }
            }

            func deleteVideo(_ t: DownloadTask) {
                if let u = t.savedURL { try? FileManager.default.removeItem(at: u) }
                DispatchQueue.main.async { self.completedVideos.removeAll { $0.id == t.id } }
            }

            func retryDownload(_ t: DownloadTask) {
                DispatchQueue.main.async { self.activeDownloads.removeAll { $0.id == t.id } }
                startDownload(video: t.video, quality: t.quality)
            }

            private func sanitize(_ name: String) -> String {
                var s = name.components(separatedBy: CharacterSet(charactersIn: "/\\:*?\"<>|\n\r")).joined(separator: "_")
                s = s.replacingOccurrences(of: " ", with: "_")
                if s.count > 50 { s = String(s.prefix(50)) }
                return s.isEmpty ? "video" : s
            }

            private func loadSaved() {
                let d = downloadsDir()
                guard let files = try? FileManager.default.contentsOfDirectory(at: d, includingPropertiesForKeys: [.fileSizeKey]) else { return }
                let exts = Set(["mp4","m4v","mov","mkv","avi","mp3","m4a","webm","ts"])
                DispatchQueue.main.async {
                    self.completedVideos = files.filter { exts.contains($0.pathExtension.lowercased()) }.compactMap { u in
                        if let attrs = try? FileManager.default.attributesOfItem(atPath: u.path),
                           let size = attrs[.size] as? Int64, size > 100_000 {
                            let v = VideoItem(id: u.lastPathComponent, title: u.deletingPathExtension().lastPathComponent, url: u.absoluteString, availableQualities: [.p720], sourceType: .direct)
                            let t = DownloadTask(video: v, quality: .p720)
                            t.savedURL = u; t.status = .completed
                            return t
                        }
                        return nil
                    }
                }
            }

            private func notify(_ t: DownloadTask) {
                let c = UNMutableNotificationContent()
                c.title = "Download Complete"; c.body = t.video.title; c.sound = .default
                UNUserNotificationCenter.current().add(UNNotificationRequest(identifier: t.id, content: c, trigger: nil))
            }

            private func isValidVideoFile(header: Data) -> Bool {
                guard header.count >= 8 else { return false }
                let bytes = [UInt8](header)
                if bytes[4] == 0x66 && bytes[5] == 0x74 && bytes[6] == 0x79 && bytes[7] == 0x70 { return true }
                if bytes[0] == 0x1A && bytes[1] == 0x45 && bytes[2] == 0xDF && bytes[3] == 0xA3 { return true }
                if bytes[0] == 0x49 && bytes[1] == 0x44 && bytes[2] == 0x33 { return true }
                if bytes[0] == 0xFF && (bytes[1] & 0xE0) == 0xE0 { return true }
                if bytes[0] == 0x47 { return true }
                let str = String(bytes: bytes[4..<8], encoding: .ascii) ?? ""
                if ["moov", "mdat", "wide", "free", "skip"].contains(str) { return true }
                return false
            }
        }
