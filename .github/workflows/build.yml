                    Button("Full HD 1080p") { doExtract(.p1080) }
                    Button("HD 720p") { doExtract(.p720) }
                    Button("SD 480p") { doExtract(.p480) }
                    Button("Low 360p") { doExtract(.p360) }
                    Button("🎵 Audio Only MP3") { doExtract(.audio, audio: true) }
                    Button("Cancel", role: .cancel) {}
                }
                .alert("VideoFlow", isPresented: $showMsg) {
                    Button("OK") {}
                } message: {
                    Text(msg ?? "")
                }
                .sheet(isPresented: $showCaptured) {
                    CapturedSheet(captured: vm.captured, dm: dm)
                }
                .sheet(isPresented: $showStreams) {
                    if let r = extractResult {
                        StreamsSheet(video: r) { s, q in downloadStream(s, q, r) }
                    }
                }
            }

            var addressBar: some View {
                HStack(spacing: 8) {
                    HStack(spacing: 6) {
                        Image(systemName: vm.isSecure ? "lock.fill" : "lock.open.fill")
                            .foregroundColor(vm.isSecure ? .green : .orange)
                            .font(.system(size: 12))
                        TextField("Search or URL...", text: $vm.urlText)
                            .foregroundColor(.white)
                            .font(.system(size: 14))
                            .keyboardType(.URL)
                            .autocapitalization(.none)
                            .disableAutocorrection(true)
                            .onSubmit { vm.navigate(to: vm.urlText) }
                        if !vm.urlText.isEmpty {
                            Button { vm.urlText = "" } label: {
                                Image(systemName: "xmark.circle.fill").foregroundColor(.gray).font(.system(size: 14))
                            }
                        }
                    }
                    .padding(.horizontal, 10).padding(.vertical, 8)
                    .background(Color.white.opacity(0.1)).cornerRadius(10)
                    Button { vm.navigate(to: vm.urlText) } label: {
                        Text("Go").foregroundColor(.blue).font(.system(size: 14, weight: .semibold))
                    }
                }
                .padding(.horizontal, 12).padding(.vertical, 8)
            }

            var bottomBar: some View {
                HStack(spacing: 4) {
                    bBtn("chevron.left", on: vm.canGoBack) { vm.goBack() }
                    bBtn("chevron.right", on: vm.canGoForward) { vm.goForward() }
                    bBtn(vm.isLoading ? "xmark" : "arrow.clockwise", on: true) {
                        vm.isLoading ? vm.stop() : vm.reload()
                    }
                    Spacer()
                    // Captured badge
                    if !vm.captured.isEmpty {
                        Button { showCaptured = true } label: {
                            HStack(spacing: 3) {
                                Image(systemName: "antenna.radiowaves.left.and.right").font(.system(size: 12))
                                Text("\(vm.captured.count)").font(.system(size: 11, weight: .bold))
                            }
                            .foregroundColor(.white).padding(.horizontal, 8).padding(.vertical, 6)
                            .background(Color.green).cornerRadius(14)
                        }
                    }
                    Button { showQuality = true } label: {
                        HStack(spacing: 4) {
                            Image(systemName: "arrow.down.circle.fill").font(.system(size: 15))
                            Text("Download").font(.system(size: 12, weight: .bold))
                        }
                        .foregroundColor(.white).padding(.horizontal, 12).padding(.vertical, 8)
                        .background(LinearGradient(colors: [.red, .orange], startPoint: .leading, endPoint: .trailing))
                        .cornerRadius(18)
                    }
                    .disabled(isExtracting)
                    Spacer()
                    bBtn("house.fill", on: true) { vm.navigate(to: "https://www.google.com") }
                    bBtn("square.and.arrow.up", on: true) { shareURL() }
                }
                .padding(.horizontal, 12).padding(.vertical, 8)
                .background(Color.white.opacity(0.05))
            }

            var extractingOverlay: some View {
                Color.black.opacity(0.7).ignoresSafeArea().overlay(
                    VStack(spacing: 14) {
                        ProgressView().tint(.white).scaleEffect(1.8)
                        Text("Extracting Video...").foregroundColor(.white).font(.headline)
                        Text("Trying multiple servers").foregroundColor(.gray).font(.caption)
                    }
                    .padding(30)
                    .background(RoundedRectangle(cornerRadius: 18).fill(Color(.systemGray6).opacity(0.95)))
                )
            }

            func bBtn(_ icon: String, on: Bool, action: @escaping () -> Void) -> some View {
                Button(action: action) {
                    Image(systemName: icon).font(.system(size: 18))
                        .foregroundColor(on ? .white : .gray.opacity(0.3))
                        .frame(width: 38, height: 38)
                }
                .disabled(!on)
            }

            func doExtract(_ q: VideoQuality, audio: Bool = false) {
                guard let url = vm.webView?.url?.absoluteString else {
                    msg = "No URL to extract"
                    showMsg = true
                    return
                }
                isExtracting = true
                UltimateExtractor.shared.extract(from: url, quality: q, audioOnly: audio) { r in
                    DispatchQueue.main.async {
                        isExtracting = false
                        switch r {
                        case .success(let v):
                            if v.streams.count == 1 {
                                downloadStream(v.streams[0], q, v)
                                msg = "✅ Download started!\n\n\(v.title)\n\nCheck Downloads tab"
                                showMsg = true
                            } else {
                                extractResult = v
                                showStreams = true
                            }
                        case .failure(let e):
                            let hasDirectCaptured = vm.captured.contains(where: { $0.isDirect })
                            if hasDirectCaptured {
                                msg = "❌ Auto-extraction failed.\n\n💡 Try the GREEN badge - there are \(vm.captured.filter { $0.isDirect }.count) direct video(s) captured from browser."
                            } else if !vm.captured.isEmpty {
                                msg = "❌ Extraction failed.\n\n⚠️ Captured \(vm.captured.count) URLs but they need conversion (HLS/segments).\n\nTip: Play video, then try Download again."
                            } else {
                                msg = "❌ \(e.localizedDescription)\n\nTips:\n• Play video first\n• Wait for video to load\n• Try 'Best Quality'\n• Some sites are not supported"
                            }
                            showMsg = true
                        }
                    }
                }
            }

            func downloadStream(_ s: ExtractedStream, _ q: VideoQuality, _ v: ExtractedVideo) {
                let video = VideoItem(
                    id: UUID().uuidString,
                    title: v.title,
                    url: s.url,
                    thumbnailURL: v.thumbnail,
                    availableQualities: [q],
                    sourceType: v.sourceType,
                    headers: s.headers
                )
                dm.startDownload(video: video, quality: q)
            }

            func shareURL() {
                guard let url = vm.webView?.url else { return }
                let vc = UIActivityViewController(activityItems: [url], applicationActivities: nil)
                if let sc = UIApplication.shared.connectedScenes.first as? UIWindowScene,
                   let root = sc.windows.first?.rootViewController {
                    root.present(vc, animated: true)
                }
            }
        }

