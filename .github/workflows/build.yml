                Button(action: action) {
                    Image(systemName:icon).font(.system(size:18))
                        .foregroundColor(enabled ? .white : .gray.opacity(0.3))
                        .frame(width:40,height:40)
                }.disabled(!enabled)
            }

            private func extractAndDownload(_ quality: VideoQuality, audioOnly: Bool = false) {
                guard let currentURL = vm.webView?.url?.absoluteString else {
                    statusMessage = "No URL to extract"
                    showStatus = true
                    return
                }
                isExtracting = true

                UltimateExtractor.shared.extract(
                    from: currentURL, quality: quality, audioOnly: audioOnly
                ) { result in
                    DispatchQueue.main.async {
                        isExtracting = false
                        switch result {
                        case .success(let extracted):
                            if extracted.streams.count == 1 {
                                // Single stream - download directly
                                let stream = extracted.streams[0]
                                downloadStream(stream: stream, quality: quality,
                                               title: extracted.title, sourceType: extracted.sourceType)
                                statusMessage = "✅ Download started!\n\(extracted.title)"
                                showStatus = true
                            } else {
                                // Multiple streams - show picker
                                extractedVideo = extracted
                                showVideoSheet = true
                            }
                        case .failure(let error):
                            statusMessage = "❌ Failed: \(error.localizedDescription)\n\nTry:\n• Different quality\n• Copy video URL directly\n• Wait and retry"
                            showStatus = true
                        }
                    }
                }
            }

            private func downloadStream(stream: ExtractedStream, quality: VideoQuality,
                                        title: String, sourceType: VideoSourceType) {
                let video = VideoItem(
                    id: UUID().uuidString,
                    title: title,
                    url: stream.url,
                    thumbnailURL: nil,
                    duration: nil,
                    estimatedSize: nil,
                    availableQualities: [quality],
                    sourceType: sourceType,
                    headers: stream.headers
                )
                downloadManager.startDownload(video: video, quality: quality)
            }
        }

