    };
    1DEB928908733DD80010E9CD = {
      isa = XCConfigurationList;
      buildConfigurations = (1DEB928B08733DD80010E9CD, 1DEB928C08733DD80010E9CD);
      defaultConfigurationIsVisible = 0;
      defaultConfigurationName = Release;
    };
    1DEB928A08733DD80010E9CD = {
      isa = XCConfigurationList;
      buildConfigurations = (1DEB928D08733DD80010E9CD, 1DEB928E08733DD80010E9CD);
      defaultConfigurationIsVisible = 0;
