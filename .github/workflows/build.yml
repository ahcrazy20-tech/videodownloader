        		H03 = {isa=XCBuildConfiguration;buildSettings={ASSETCATALOG_COMPILER_APPICON_NAME=AppIcon;ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME=AccentColor;CODE_SIGNING_ALLOWED=NO;CODE_SIGN_IDENTITY="";CODE_SIGN_STYLE=Manual;CURRENT_PROJECT_VERSION=4;GENERATE_INFOPLIST_FILE=NO;INFOPLIST_FILE=VideoFlow/Resources/Info.plist;IPHONEOS_DEPLOYMENT_TARGET=16.0;LD_RUNPATH_SEARCH_PATHS="$(inherited) @executable_path/Frameworks";MARKETING_VERSION=4.0;PRODUCT_BUNDLE_IDENTIFIER=com.videoflow.app;PRODUCT_NAME=VideoFlow;PROVISIONING_PROFILE_SPECIFIER="";SWIFT_EMIT_LOC_STRINGS=YES;SWIFT_VERSION=5.0;TARGETED_DEVICE_FAMILY="1,2";};name=Debug;};
        		H04 = {isa=XCBuildConfiguration;buildSettings={ASSETCATALOG_COMPILER_APPICON_NAME=AppIcon;ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME=AccentColor;CODE_SIGNING_ALLOWED=NO;CODE_SIGN_IDENTITY="";CODE_SIGN_STYLE=Manual;CURRENT_PROJECT_VERSION=4;GENERATE_INFOPLIST_FILE=NO;INFOPLIST_FILE=VideoFlow/Resources/Info.plist;IPHONEOS_DEPLOYMENT_TARGET=16.0;LD_RUNPATH_SEARCH_PATHS="$(inherited) @executable_path/Frameworks";MARKETING_VERSION=4.0;PRODUCT_BUNDLE_IDENTIFIER=com.videoflow.app;PRODUCT_NAME=VideoFlow;PROVISIONING_PROFILE_SPECIFIER="";SWIFT_EMIT_LOC_STRINGS=YES;SWIFT_VERSION=5.0;TARGETED_DEVICE_FAMILY="1,2";};name=Release;};
        		G00 = {isa=XCConfigurationList;buildConfigurations=(H01,H02);defaultConfigurationIsVisible=0;defaultConfigurationName=Release;};
        		G01 = {isa=XCConfigurationList;buildConfigurations=(H03,H04);defaultConfigurationIsVisible=0;defaultConfigurationName=Release;};
        	};
        	rootObject=F00;
        }
        PBXEOF
        echo "project.pbxproj created!"

    - name: Fix Swift Indentation
      run: |
        for f in $(find VideoFlow -name "*.swift"); do
          sed -i '' 's/^        //' "$f" 2>/dev/null || true
        done
        echo "Indentation fixed"

    - name: Verify Files
      run: |
        echo "=== Project Structure ==="
        find VideoFlow -type f | sort
        echo ""
        echo "=== Swift Files ==="
        find VideoFlow -name "*.swift" | while read f; do
          echo "--- $f ($(wc -l < "$f") lines) ---"
        done

    - name: Build App
      run: |
        xcodebuild \
          -project VideoFlow.xcodeproj \
          -scheme VideoFlow \
          -configuration Release \
          -sdk iphoneos \
          -arch arm64 \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          ONLY_ACTIVE_ARCH=NO \
          BUILD_DIR=$PWD/build \
          clean build \
          2>&1 | tee build.log | grep -E "(error:|warning:|Build succeeded|FAILED|Compiling)" || true

    - name: Check Build
      run: |
        if grep -q "BUILD SUCCEEDED" build.log; then
          echo "BUILD SUCCEEDED"
        else
          echo "BUILD FAILED"
          tail -100 build.log
          exit 1
        fi

    - name: Package IPA
      run: |
        APP=$(find build -name "VideoFlow.app" -type d | head -1)
        echo "App: $APP"
        mkdir -p Payload
        cp -r "$APP" Payload/VideoFlow.app
        zip -r VideoFlow-v4.ipa Payload/
        rm -rf Payload/
        ls -lh VideoFlow-v4.ipa

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: VideoFlow-ULTIMATE-v4
        path: VideoFlow-v4.ipa
        retention-days: 30

    - name: Upload Log on Failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log
        retention-days: 7
