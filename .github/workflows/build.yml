          import WebKit

          class AdBlocker {
              static func injectScript() -> WKUserScript {
                  let source = """
                  (function() {
                      const adDomains = ['doubleclick.net','googleadservices.com','googlesyndication.com','facebook.com/tr','amazon-adsystem.com','scorecardresearch.com'];
                      const originalFetch = window.fetch;
                      window.fetch = function(url, options) {
                          if (typeof url === 'string' && adDomains.some(d => url.includes(d))) {
                              return Promise.reject(new Error('Ad blocked'));
                          }
                          return originalFetch.call(this, url, options);
                      };
                      const selectors = ['.ad','.ads','.ad-container','.ad-banner','iframe[src*="doubleclick"]','iframe[src*="googlead"]'];
                      function hideAds() {
                          selectors.forEach(s => document.querySelectorAll(s).forEach(el => el.style.display = 'none'));
                      }
                      hideAds();
                      new MutationObserver(hideAds).observe(document.body, { childList: true, subtree: true });
                  })();
                  """
                  return WKUserScript(source: source, injectionTime: .atDocumentStart, forMainFrameOnly: false)
              }
          }
